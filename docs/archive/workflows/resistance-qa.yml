name: 抵抗制完整驗收
on:
  pull_request:
    branches: [main]
    paths: [index.html, "tools/resistance*", ".github/workflows/resistance-qa.yml"]
permissions:
  contents: read
jobs:
  resistance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 verify_release.py
      - run: node --test tools/resistance.test.cjs tools/enemy-attack.test.cjs tools/qte-unified.test.cjs tools/gun-shot.test.cjs
      - run: NODE_PATH=$(npm root -g) bash tests/run_all.sh
      - name: 手機兩尺寸抵抗與QTE
        run: |
          python3 -m http.server 8768 >/tmp/resistance-http.log 2>&1 &
          NODE_PATH=$(npm root -g) node tools/resistance-browser.cjs
          NODE_PATH=$(npm root -g) node tools/qte-unified-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resistance-v0.50.0-qa
          path: qa-output/
