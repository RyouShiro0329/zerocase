<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鈍擊命中預覽</title>
<link rel="preload" href="../../fonts/tw-kai-game.woff2?v=cae406c9" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../../fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"ZC Kai";src:url("../../fonts/tw-kai-game.woff2?v=cae406c9") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"ZC Latin";src:url("../../fonts/source-serif-4-latin.woff2") format("woff2");font-weight:200 900;font-style:normal;font-display:swap;unicode-range:U+0020-024F,U+2000-206F,U+2212}
:root{
  --bg:#060605;--ink:#d9d5ca;--muted:#89877f;--line:#4c4a43;--gold:#c8ad70;--redhi:#c86a63;
  --serif:"ZC Latin","ZC Kai","BiauKai","DFKai-SB",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 30% 18%,#14130f 0%,#060605 70%);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5}
body{display:flex;flex-direction:column;height:100%;overflow:hidden;padding:10px 16px 8px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;min-height:28px;flex:none}
header h1{margin:0;font-size:1.05rem;font-weight:900;color:var(--gold);letter-spacing:.06em}
header p{margin:0;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoomnote{margin:0;flex-basis:100%;color:#6f6c64;font-size:.72rem}
@media (max-height:480px){.zoomnote{display:none}}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cbar{display:flex;gap:6px;align-items:stretch}
.cap{margin:0;max-width:640px;text-align:center;color:#d9c38f;font-size:.92rem}
.cap small{display:block;color:var(--muted);font-size:.75rem}
.foe{--fw:206px;--fh:86px;--pw:50px;position:relative;flex:0 0 var(--fw);width:var(--fw);min-height:var(--fh);display:grid;grid-template-columns:var(--pw) minmax(0,1fr);overflow:hidden;background:linear-gradient(145deg,rgba(60,22,22,.55),rgba(14,8,8,.92));border:1px solid #5a3632;border-radius:5px;box-shadow:inset 0 0 14px #000,0 2px 8px #000}
.foe.bp-react{transform:translate(var(--bx,0px),var(--by,0px)) rotate(var(--br,0deg))}
.foe .fpic{position:relative;background:#120a09;border-right:1px solid #3d2624;overflow:hidden}
.foe .fpic img{position:absolute;left:50%;top:-2px;height:calc(var(--pw) * 2.05);width:auto;max-width:none;transform:translateX(-50%);pointer-events:none}
.fin{min-width:0;padding:4px 7px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.fh b{color:var(--redhi);font-size:.86rem;font-weight:700}
.fhp{display:flex;align-items:center;gap:6px}
.hpb{position:relative;flex:1;height:8px;background:#1b1514;border:1px solid #4a2e2b;border-radius:6px;overflow:hidden}
.hpb u{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8a3a36,#c86a63);text-decoration:none}
.fhp span{font:600 10.5px/1 var(--serif);color:#e2c9c3;font-variant-numeric:tabular-nums}
.fk{font:10px/1.25 var(--serif);color:#bfb69c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fk em{font-style:normal;color:#e6ddc8}
.bp-fx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.tools{flex:none;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chips button,.tog button{font:inherit;color:var(--ink);background:linear-gradient(180deg,#292a26,#111210);border:1px solid #5a574e;border-radius:3px;padding:4px 8px;cursor:pointer}
.chips button.on{border-color:var(--gold);color:var(--gold)}
.tog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tog button{font-size:.78rem;color:#c9c2a8}
@media (min-height:481px){
  .foe{--fw:412px;--fh:168px;--pw:100px}
  .fh b{font-size:1.7rem}
  .fhp span{font-size:21px}
  .fk{font-size:20px}
  .hpb{height:16px}
}
@media (max-height:480px){
  body{padding:4px 10px 4px}
  header h1{font-size:.86rem}
  header p{font-size:.68rem}
  .foe{--fw:168px;--fh:72px;--pw:38px}
  .fh b{font-size:.78rem}
  .fhp span,.fk{font-size:9px}
  .hpb{height:6px}
  .cap{font-size:.75rem}
  .cap small{font-size:.66rem}
  .chips{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .chips button,.tog button{padding:3px 7px;font-size:.72rem;white-space:nowrap}
  .tools{gap:3px}
}
@media (prefers-reduced-motion:reduce){
  .foe.bp-react{transform:none}
}
/* 手繪草稿用遊戲裡的卡片大小，不放大。桌面 206px，高度不超過 480 時跟 #stage.short 一樣 168px。 */
body.gamecard .foe{--fw:206px;--fh:86px;--pw:50px}
body.gamecard .fh b{font-size:.86rem}
body.gamecard .fhp span{font-size:10.5px}
body.gamecard .fk{font-size:10px}
body.gamecard .hpb{height:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px}
.slotlab{font-style:normal;color:var(--gold);font-size:.72rem;letter-spacing:.04em}
@media (max-height:480px){
  body.gamecard .foe{--fw:168px;--fh:72px;--pw:38px}
  body.gamecard .fh b{font-size:.78rem}
  body.gamecard .fhp span,body.gamecard .fk{font-size:9px}
  body.gamecard .hpb{height:6px}
  .slotlab{font-size:.62rem}
}
</style>

<body>

  <h1>鈍擊命中預覽</h1>
  <p id="sub">預覽頁，不進遊戲。不改傷害、存檔或 index.html。</p>
  <p class="zoomnote">桌面這張卡畫成兩倍大，方便看形狀。手機橫向用的是遊戲裡的尺寸。</p>
</header>
<div class="stage">
  <div class="cbar" id="cbar"></div>

</div>
<div class="tools">
  <div class="chips" id="chips"></div>
  <div class="tog">
    <button type="button" id="bReplay">再看一次</button>

<script>

   note:'角色技能，近戰鈍擊。低橫帶，卡微微側一下。',

   beats:[{card:0, sprite:'shock', impact:220, len:640}]},
  {id:'sp-shock-low', name:'震波・少紅', group:'手繪草稿', sound:'fist', vol:.9, hp:'6/10', bar:'60%', sprite:1,
   text:'同一張震波，把大部分紅收成白光，只留一點噴濺。',
   note:'AI 草稿，尚未核定。鈍擊要和斬擊分得開：白光、震波、碎屑為主。',
   beats:[{card:0, sprite:'shock-low', impact:220, len:640}]},
  {id:'sp-smash', name:'重砸・原圖', group:'手繪草稿', sound:'fist', vol:.9, hp:'4/10', bar:'40%', sprite:1,
   text:'AI 生成草稿，尚未核定。白光從上打下，接觸處往兩側爆開。',
   note:'試鐵鎚、大鐵鎚、粉碎。這張紅還偏多，接近斬擊的血。',
   beats:[{card:0, sprite:'smash', impact:220, len:640}]},
  {id:'sp-smash-low', name:'重砸・少紅', group:'手繪草稿', sound:'fist', vol:.9, hp:'4/10', bar:'40%', sprite:1,
   text:'同一張重砸，紅只留在接觸處的一點噴濺。',
   note:'AI 草稿，尚未核定。直擊的白光還在，紅色比原圖少。',
   beats:[{card:0, sprite:'smash-low', impact:220, len:640}]},
  {id:'sp-compare', name:'並排對照', group:'手繪草稿', sound:'fist', vol:.9, hp:'6/10', bar:'60%', sprite:1, sync:1, cards:3,
   labels:['斬擊・現有主格','震波・少紅','重砸・少紅'],
   text:'同一張敵人卡、同一種放置。左邊是現有斬擊的主格。',
   note:'AI 草稿尚未核定。斬擊的峰值在遊戲裡是 335ms；這裡為了並排，三張都在 220ms 到最亮，再停 70ms。',
   beats:[
     {card:0, sprite:'slash', impact:220, len:640},
     {card:1, sprite:'shock-low', impact:220, len:640},
     {card:2, sprite:'smash-low', impact:220, len:640}
   ]}
];
const byId = Object.fromEntries(FX.map(s=>[s.id,s]));
const q = new URLSearchParams(location.search);
let reduce = q.get('motion')==='reduce' ? true : q.get('motion')==='full' ? false : matchMedia('(prefers-reduced-motion: reduce)').matches;
let soundOn = q.get('sound')!=='0';
let current = q.get('fx') && byId[q.get('fx')] ? q.get('fx') : 'sp-compare';
const ASSETS={
  shock:loadSpr('drafts/ai-shockwave.png'),
  'shock-low':loadSpr('drafts/ai-shockwave-lowred.png'),
  smash:loadSpr('drafts/ai-smash.png'),
  'smash-low':loadSpr('drafts/ai-smash-lowred.png'),
  slash:loadSpr('../../fx/slash-12.webp')
};
function loadSpr(src){
  const img=new Image();
  const p=new Promise(res=>{img.onload=()=>res(img);img.onerror=()=>res(null)});
  img.src=src; return {img,p};
}
let raf = 0;
let audioStop = null;

function clamp01(v){return Math.max(0,Math.min(1,v))}
function beatAt(spec,t){
  let acc=0;
  for(const b of spec.beats){
    if(t<acc+b.len) return {b, local:t-acc, start:acc};
    acc+=b.len;
  }
  const b=spec.beats[spec.beats.length-1];
  return {b, local:b.len, start:spec.beats.reduce((s,x)=>s+x.len,0)-b.len, done:true};
}
function totalOf(spec){return spec.sync?Math.max(...spec.beats.map(b=>b.len)):spec.beats.reduce((s,b)=>s+b.len,0)}
function cardCount(spec){return spec.cards||1}

function makeCard(i, label){
  const el=document.createElement('div');
  el.className='foe';
  el.dataset.card=String(i);
  el.innerHTML=`<div class="fpic"><img src="../../img/inf_${i%2?'f':'m'}.webp" alt=""></div>
    <div class="fin"><div class="fh"><b>感染者</b></div>
    <div class="fhp"><div class="hpb"><u></u></div><span>10/10</span></div>
    <div class="fk"><em>防禦 10</em>　弱：鈍擊</div></div>
    <canvas class="bp-fx" aria-hidden="true"></canvas>`;
  if(!label) return el;
  const wrap=document.createElement('div');
  wrap.className='slot';
  wrap.appendChild(el);
  const em=document.createElement('em');
  em.className='slotlab';
  em.textContent=label;
  wrap.appendChild(em);
  return wrap;
}
let mountedId='';
function mount(spec){
  if(mountedId===spec.id && document.querySelectorAll('#cbar .foe').length===cardCount(spec)) return;
  mountedId=spec.id;
  const bar=document.querySelector('#cbar');
  bar.replaceChildren();
  for(let i=0;i<cardCount(spec);i++) bar.appendChild(makeCard(i, spec.labels?spec.labels[i]:''));
}
function dropped(spec,card,t){
  if(!spec.hp) return false;
  if(spec.sync){const b=spec.beats.find(x=>x.card===card);return !!(b&&t>=b.impact)}
  let acc=0;
  for(const b of spec.beats){
    if(b.card===card && t>=acc+b.impact) return true;
    acc+=b.len;
  }
  return false;
}
function syncHp(spec,t){
  [...document.querySelectorAll('.foe')].forEach((card,i)=>{
    const on=dropped(spec,i,t);
    const u=card.querySelector('u'), s=card.querySelector('.fhp span');
    u.style.transition = q.has('t') ? 'none' : 'width .28s ease-out';
    u.style.width = on ? spec.bar : '100%';
    s.textContent = on ? spec.hp : '10/10';
  });
}
function clearMotion(){
  document.querySelectorAll('.foe').forEach(card=>{
    card.classList.remove('bp-react');
    card.style.removeProperty('--bx');
    card.style.removeProperty('--by');
    card.style.removeProperty('--br');
  });
}
function setShake(card, x, y, r){
  if(reduce || (Math.abs(x)<.05 && Math.abs(y)<.05 && Math.abs(r)<.02)){card.classList.remove('bp-react');return}
  card.classList.add('bp-react');
  card.style.setProperty('--bx', x.toFixed(2)+'px');
  card.style.setProperty('--by', y.toFixed(2)+'px');
  card.style.setProperty('--br', r.toFixed(2)+'deg');
}
function recoil(hit, amp){
  if(hit<0) return {x:0,y:0,r:0};
  const fall = hit<300 ? Math.exp(-hit/80) : 0;
  const x = amp*Math.cos(hit*0.09)*fall;
  const y = -amp*0.4*Math.sin(hit*0.07)*fall;
  return {x, y, r:x*0.16};
}

function ring(ctx,x,y,r,alpha,lw){
  if(alpha<=0.01||r<=0.4) return;
  ctx.beginPath();
  const seg=12;
  for(let i=0;i<=seg;i++){
    const a=i/seg*Math.PI*2;
    const wob=1+Math.sin(a*3+r)*0.035;
    const px=x+Math.cos(a)*r*wob, py=y+Math.sin(a)*r*wob;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  strokeInk(ctx, alpha, lw);
}
function strokeInk(ctx, alpha, lw){
  if(alpha<=0.02) return;
  ctx.strokeStyle=`rgba(8,5,4,${Math.min(0.92, alpha)})`;
  ctx.lineWidth=lw+1.6;
  ctx.stroke();
  ctx.strokeStyle=`rgba(236,224,206,${Math.min(1, alpha)})`;
  ctx.lineWidth=Math.max(1, lw);
  ctx.stroke();
}
function dent(ctx,x,y,rx,ry,alpha){
  if(alpha<=0.01) return;
  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fillStyle=`rgba(10,6,5,${alpha*0.55})`;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x,y,rx*0.72,ry*0.72,0,0,Math.PI*2);
  ctx.fillStyle=`rgba(248,220,193,${alpha})`;
  ctx.fill();
}
function dust(ctx,x,y,age,n,spread,u,seed){
  if(age<0) return;
  for(let i=0;i<n;i++){
    const a=((seed+i*17)%100)/100;
    const b=((seed+i*29)%100)/100;
    const life=160+a*140;
    if(age>life) continue;
    const k=age/life;
    const ang=-Math.PI*0.5+(b-0.5)*1.5;
    const sp=(6+a*spread)*u;
    const px=x+Math.cos(ang)*sp*k;
    const py=y+Math.sin(ang)*sp*k+k*k*12*u;
    ctx.fillStyle=`rgba(203,184,162,${(1-k)*0.7})`;
    ctx.fillRect(px,py,Math.max(1,u),Math.max(1,u));
  }
}
function cracks(ctx,x,y,age,u,power){
  const grow=clamp01(age/50);
  const fade=1-clamp01((age-80)/420);
  if(grow<=0||fade<=0) return;
  const angs=[-1.05,-0.35,0.28,0.95,1.7,2.45,3.3];
  angs.forEach((ang,i)=>{
    const len=(12+ (i%3)*4)*u*grow*(power?1.18:1);
    ctx.beginPath();
    ctx.moveTo(x,y);
    for(let s=1;s<=4;s++){
      const f=s/4;
      const j=((i*5+s*3)%5-2)*0.7*u;
      ctx.lineTo(x+Math.cos(ang)*len*f+Math.cos(ang+1.6)*j, y+Math.sin(ang)*len*f+Math.sin(ang+1.6)*j);
    }
    strokeInk(ctx, 0.9*fade, Math.max(1,u*(i%2?1.25:0.85)));

}
function band(ctx,x,y,w,h,alpha,trail){
  if(alpha<=0.01||w<=0) return;
  const g=ctx.createLinearGradient(x,y,x+w,y);
  if(trail){
    g.addColorStop(0,'rgba(216,196,170,0)');
    g.addColorStop(0.55,`rgba(216,196,170,${alpha})`);
    g.addColorStop(1,`rgba(248,220,193,${alpha})`);
  }else{
    g.addColorStop(0,'rgba(216,196,170,0)');
    g.addColorStop(0.25,`rgba(216,196,170,${alpha})`);
    g.addColorStop(0.75,`rgba(216,196,170,${alpha})`);
    g.addColorStop(1,'rgba(216,196,170,0)');
  }
  ctx.fillStyle=`rgba(8,5,4,${Math.min(0.8, alpha+0.25)})`;
  ctx.fillRect(x,y-0.7,w,h+1.4);
  ctx.fillStyle=g;
  ctx.fillRect(x,y,w,h);
}

function paintKind(ctx, kind, local, impact, pw, h, u, crit, shot){
  const cx=pw*0.5, cy=h*0.46;
  const hit=local-impact;
  const approach=clamp01(local/Math.max(1,impact));
  if(reduce){
    const a=local<impact ? approach*0.9 : (1-clamp01(hit/260))*0.9;
    drawPose(ctx, kind, cx, cy, pw, h, u, a, crit, shot, true);
    return {x:0,y:0,r:0};
  }
  drawPose(ctx, kind, cx, cy, pw, h, u, 1, crit, shot, false, hit, approach);
  if(kind==='shove'){
    const out=hit<0 ? approach : 1-clamp01(hit/200);
    return {x:5.5*u*out, y:0, r:0};
  }
  if(kind==='down'){
    const dip=hit<0?0:(hit<90? (hit/90)*3.2*u : 3.2*u*(1-clamp01((hit-90)/220)));
    return {x:0, y:dip, r:0};
  }
  if(kind==='legsweep'){
    const tilt=hit<0? approach*0.6 : 0.8*(1-clamp01(hit/240));
    return {x:0.4*u*tilt, y:0.6*u*tilt, r:tilt};
  }
  const amp=(kind==='pry'?0.6:kind==='sling'?0.35:kind==='bash'?1.3:kind==='crush'?2.4:1.6)*(crit?1.45:1)*u;
  return recoil(hit, amp);
}
function drawPose(ctx, kind, cx, cy, pw, h, u, a, crit, shot, still, hit, approach){

  if(kind==='hit'){
    dent(ctx,cx,cy,7*u,9*u, flash*0.24);

    dent(ctx, cx+ox+4.2*u, y+2.2*u, 3*u, 3.8*u, flash*0.26);
    if(hot) ring(ctx, cx+ox, y, (still?10:4.5+age*0.11)*u, (still?a*0.75:vis*0.7), Math.max(1,u));

    const y=h*0.28;
    const reach=still?1:clamp01(hot?1:approach);

    ctx.moveTo(cx, 2*u);
    ctx.lineTo(cx, 2*u+(y-2*u)*reach);
    strokeInk(ctx, still?a*0.95:(hot?0.9:0.55*approach), Math.max(1.2,1.3*u));
    dent(ctx,cx,y,2.6*u,2.6*u, flash*0.5);
    if(hot) ring(ctx,cx,y,(still?8:3+age*0.09)*u, (still?a*0.55:vis*0.5), Math.max(1,u));

      ctx.moveTo(cx-len,y);
      ctx.lineTo(cx-len*0.35,y+1.4*u);

    ctx.lineTo(cx+1.5*u, cy-9*u*open);

    ctx.beginPath();
    ctx.ellipse(x,y,1.8*u,2.1*u,0,0,Math.PI*2);

  }
  if(kind==='shove'){
    const alpha=still?a*0.4:(hot?0.28*(1-clamp01(age/220)):0.1*approach);

    return;
  }
  if(kind==='case'){

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

const SLASH_PRE=[100,80,65,50,40], SLASH_POST=[30,40,55,65,75,85];
function slashFrameAt(t){
  if(reduce) return 5;
  if(t<220){
    let x=t/(220/335), acc=0;
    for(let i=0;i<SLASH_PRE.length;i++){acc+=SLASH_PRE[i]; if(x<acc) return i}
    return 5;
  }
  if(t<290) return 5;
  let x=t-290, acc=0;
  for(let i=0;i<SLASH_POST.length;i++){acc+=SLASH_POST[i]; if(x<acc) return i+6}
  return -1;
}
function spritePose(t, impact, len){
  const holdEnd=impact+70;
  if(reduce){
    const a=t<impact? t/Math.max(1,impact) : 1-(t-impact)/Math.max(1,len-impact);
    return {op:Math.max(0,Math.min(.92,a)), scale:1, blur:0};
  }
  if(t<impact){
    const e=1-Math.pow(1-t/Math.max(1,impact),3);
    return {op:e, scale:.78+.22*e, blur:(1-e)*2.2};
  }
  if(t<holdEnd) return {op:1, scale:1, blur:0};
  const e=Math.min(1,(t-holdEnd)/Math.max(1,len-holdEnd));
  return {op:1-e*e, scale:1+.06*e*e, blur:e*e*1.6};
}
function drawSlashLike(ctx, img, sx, sy, sw, sh, w, h, pose){
  if(!img||pose.op<=0.01) return;
  const dw=Math.min(w*.73, h*2.15)*pose.scale;
  const dh=dw*(sh/sw);
  ctx.save();
  ctx.globalAlpha=pose.op;
  ctx.filter=pose.blur>0.15?`blur(${pose.blur}px)`:'none';
  ctx.drawImage(img, sx, sy, sw, sh, -2, (h-dh)/2, dw, dh);
  ctx.restore();
}
function paintSprite(card, spec, t){
  const canvas=card.querySelector('canvas');
  const w=card.clientWidth, h=card.clientHeight;
  if(!w||!h) return;
  const d=Math.min(window.devicePixelRatio||1, 2);
  if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){
    canvas.width=Math.round(w*d); canvas.height=Math.round(h*d);
  }
  const ctx=canvas.getContext('2d');
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,w,h);
  const idx=Number(card.dataset.card);
  const beat=spec.sync? spec.beats.find(x=>x.card===idx) : beatAt(spec,t).b;
  const local=spec.sync? Math.min(t, beat?beat.len:0) : beatAt(spec,t).local;
  const done=!spec.sync && beatAt(spec,t).done;
  if(!beat||done){setShake(card,0,0,0);return}
  const pose=spritePose(local, beat.impact, beat.len);
  const asset=ASSETS[beat.sprite];
  const img=asset&&asset.img;
  if(beat.sprite==='slash'){
    const f=slashFrameAt(local);
    if(f>=0) drawSlashLike(ctx, img, f%4*432, Math.floor(f/4)*282, 432, 282, w, h, pose);
  }else if(img&&img.naturalWidth){
    drawSlashLike(ctx, img, 0, 0, img.naturalWidth, img.naturalHeight, w, h, pose);
  }
  const hit=local-beat.impact;
  if(!reduce && hit>70 && hit<320){
    const fall=Math.exp(-(hit-70)/90);
    setShake(card, Math.cos(hit*0.08)*1.5*fall, -Math.sin(hit*0.06)*0.5*fall, 0);
  }else setShake(card,0,0,0);
}
function paintCard(card, spec, t){
  if(spec.sprite){paintSprite(card, spec, t);return}
  const canvas=card.querySelector('canvas');
  const pw=card.querySelector('.fpic').clientWidth||50;
  const w=card.clientWidth, h=card.clientHeight;
  if(!w||!h) return;
  const d=Math.min(window.devicePixelRatio||1, 2);
  if(canvas.width!==Math.round(w*d) || canvas.height!==Math.round(h*d)){
    canvas.width=Math.round(w*d); canvas.height=Math.round(h*d);
  }
  const ctx=canvas.getContext('2d');
  ctx.setTransform(d,0,0,d,0,0);
  ctx.clearRect(0,0,w,h);
  const beat=beatAt(spec,t);
  if(beat.b.card!==Number(card.dataset.card) || beat.done && beat.local>=beat.b.len){
    setShake(card,0,0,0);
    return;
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,pw,h);
  ctx.clip();
  const shake=paintKind(ctx, beat.b.kind, beat.local, beat.b.impact, pw, h, pw/50, beat.b.crit, beat.b.shot||0);
  ctx.restore();
  setShake(card, shake.x, shake.y, shake.r);
}

function stopAudio(){ if(audioStop){ audioStop(); audioStop=null } }
function playFist(vol){
  stopAudio();
  const a=new Audio('../../sfx/fist.mp3');
  a.volume=vol;
  const p=a.play(); if(p&&p.catch) p.catch(()=>{});
  audioStop=()=>{a.pause(); a.src=''};
}
function playWhoosh(){
  stopAudio();
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  const ac=new AC();
  const dur=0.22, buf=ac.createBuffer(1, Math.floor(ac.sampleRate*dur), ac.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,1.4);
  const src=ac.createBufferSource(); src.buffer=buf;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=0.7;
  const g=ac.createGain(); g.gain.value=0.2;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
  audioStop=()=>{try{src.stop()}catch(e){} ac.close()};
}
function play(id){
  cancelAnimationFrame(raf);
  stopAudio();
  const spec=byId[id]||byId.hit;
  const t0=performance.now();
  let heard=-1;
  const step=now=>{
    const t=now-t0;
    const beat=beatAt(spec,t);
    const idx=spec.beats.indexOf(beat.b);
    if(soundOn && idx!==heard && beat.local<30){
      heard=idx;
      if(spec.sound==='fist') playFist(spec.vol);
      else if(spec.sound==='whoosh') playWhoosh();
    }
    show(spec.id, Math.min(t, totalOf(spec)));
    if(t<totalOf(spec)) raf=requestAnimationFrame(step);
    else finish(spec);
  };
  raf=requestAnimationFrame(step);
}
function finish(spec){
  clearMotion();
  document.querySelectorAll('.bp-fx').forEach(c=>{
    const ctx=c.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,c.width,c.height);
  });
  syncHp(spec, totalOf(spec));
}

window.BLUNT_PREVIEW={

  still: id=>{
    const spec=byId[id];
    const b=spec.beats[0];
    return b.impact+48;
  },
  show: (id,t)=>show(id,t),
  ready: Promise.all(Object.values(ASSETS).map(a=>a.p)),
  setReduce: v=>{ reduce=!!v },
  ink(){
    let best=0;
    document.querySelectorAll('.bp-fx').forEach(c=>{
      if(!c.width) return;
      const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
      let n=0;
      for(let i=3;i<d.length;i+=4) if(d[i]>12) n++;
      if(n>best) best=n;
    });
    return best;
  }
};
function boot(){
  const t=freeze!=null && !Number.isNaN(freeze) ? freeze : 0;
  show(current, t);
  BLUNT_PREVIEW.ready.then(()=>show(current, Number(document.documentElement.dataset.t)||t));
}
if(document.readyState==='complete') boot();
else window.addEventListener('load', boot);
</script>
</body>
