  {l:'躲起來，等他們過去',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你縮在一台燒過的車底下，看著他們的靴子一雙一雙走過去。有一雙在你面前停了很久，然後走開了。`,p:{fear:8}},ng:{t:`你踩到一片碎玻璃。整排人同時停下來，紅色的鏡片一起轉向你藏身的地方。`,p:{fear:8},go:'ZA'}},
  {l:'往回退，繞遠路',t:'l',ok:{t:`你們退回剛才的巷子，繞了一大圈。等你們繞過去的時候，那條街已經在燒了。`,p:{fear:4}}}]},
 {id:'acru2',ch:2,d0:8,need:'acru',t:`一台漆著市衛生局標誌的廣播車停在路中間，喇叭朝著每一棟公寓：「這裡是市衛生局緊急醫療隊。請所有民眾到路口集合，接受檢查。配合的人會被送到安全的地方。」\n\n路口真的有人在排隊。排在前面的人被帶上一台沒有窗戶的卡車。押車的人穿的不是醫護人員的衣服，是黑色的制服。`,c:[
  {l:'不要過去',ok:{t:`你看著那台卡車關上門開走。沒有人從裡面出來過。`,p:{fear:8}}},
  {l:'看看他們把人帶去哪',k:'PER',d:14,ok:{t:`卡車往旅館的方向開。你想起旅館地下那扇白色的門。`,r:{flag:'acrutruck'},p:{fear:10}},ng:{t:`卡車轉過街角就不見了。`,p:{fear:4}}}]}
);
/* ================= v0.10.0 新地點：消防局、醫院、配電站 =================
   都從街區中樞 Z0 前往。消防局拿防毒面具、濾罐、液壓破拆工具；破拆工具可以撐開路口的公車抄近路到醫院、撬開配電站的鐵門。
   醫院地下機房有高壓保險絲；停電之後配電站出現，修好就恢復街區供電（streetpower），代價是夜裡路燈會把人照出來。 */
Object.assign(LV,{
 T:{n:'消防局',sub:'第 9 分隊',en:'FIRE STATION 9',rule:'紅色的車庫門，還有人在裡面。',fx:{},ch:2,indoor:1},
 O:{n:'醫院',sub:'聖瑪莉醫院',en:'ST. MARY’S HOSPITAL',rule:'最早出事的地方。',fx:{},ch:2,indoor:1},
 W:{n:'配電站',sub:'高壓危險',en:'SUBSTATION',rule:'鐵絲網後面，整片變壓器都安靜了。',fx:{},ch:2}
});
Object.assign(LV_POOL,{T:['infected'],O:['infected','incubator'],W:['infected']});
N.Z0.c.splice(1,0,
 {l:'去消防局',s:'第 9 分隊的車庫門還開著一半',ok:{t:`你們沿著大馬路往北邊走，那扇紅色的車庫門越來越近。`,go:'T0'}},
 {l:'去醫院',s:'路口被一台翻倒的公車堵住，只能繞遠路',ok:{t:`你們繞過那台翻倒的公車，從後面的小路往醫院走。`,go:'O0'}},
 {l:'抄近路到醫院',req:'spreader',t:'q',s:'用破拆工具撐開壓在路口的那台公車',ok:{t:`你把油壓擴張器塞進公車和路燈之間的縫，一下一下壓。鐵皮慢慢彎開，剛好讓一個人鑽過去。`,p:{alarm:1},go:'O0'}},
 {l:'去配電站',need:'blackout',s:'停電之後，那片鐵絲網後面就沒有聲音了',ok:{t:`你們往街區東邊走，越走越暗。`,go:'W0'}});
Object.assign(N,{
/* ---------- 消防局 ---------- */
T0:{L:'T',n:'消防局・車庫',rest:1,
 onEnter(){if(G.flags.evacgone)G.flags.fdopen=1},
 tx:()=>G.flags.acru?'車庫門被人從外面用鐵鍊鎖上，又被剪開了。裡面翻得亂七八糟，牆上的值班表被撕掉，地上有一排很整齊的靴印。':G.flags.evacgone?'人都走了。白板上寫著一行字：「全員隨撤離車隊護送。對不起。——歐文」雲梯車還在，鑰匙插在上面，油箱是空的。':'車庫裡有十幾個人，有消防員，也有穿著睡衣跑出來的居民。一個滿臉菸灰的中年消防員看了你們一眼，胸前的名牌寫著「歐文」。「會用斧頭嗎？」他問，「會的話，就留下來幫忙。」',
 t:`第 9 分隊的消防局。紅色的車庫門關了一半，門上用噴漆寫著「這裡有人　沒被咬的才能進來」。車庫裡停著一台雲梯車，另一個車位空著，地上只剩一攤油漬。`,
 c:[
  {l:'跟歐文談',hide:'fdopen',k:'CHA',d:12,s:'魅力檢定',stay:1,once:1,ok:{t:`你說了你們從哪裡來、路上看到了什麼。他聽完，從裝備架上拿下一副防毒面具丟給你。\n\n「有些地方的空氣已經不能吸了。」他指了指後面的裝備室，「需要什麼自己拿，別拿太多。」`,r:{items:{gasmask:1,filter:1},flag:'fdopen'}},ng:{t:`「我們自己的人都不夠用了。」他轉身回去整理水帶，沒有再看你。`}},
  {l:'跟他們出去救人',hide:'fdopen',once:1,t:'m',s:'兩條街外有一棟公寓在冒煙',ok:{t:`歐文把一副防毒面具塞進你手裡：「戴著，別走散。」\n\n你們跟著雲梯車衝到兩條街外那棟冒煙的公寓。樓梯間裡全是煙，煙裡有東西在動。`,r:{items:{gasmask:1,filter:1},flag:'fdopen',karma:1},fight:{n:2,mode:'normal'},go:'T0'}},
  {l:'趁沒人注意，溜進裝備室',hide:'fdopen',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你等歐文轉身去接無線電，貼著雲梯車的車身溜到後面。`,r:{karma:-1},go:'T1'},ng:{t:`「喂！」歐文一把抓住你的領子，把你推出車庫門。「我們這裡不歡迎小偷。」`,p:{fear:6},go:'Z0'}},
  {l:'去裝備室',need:'fdopen',ok:{t:`你們穿過車庫，推開後面那扇寫著「裝備室」的門。`,go:'T1'}},
  {l:'上屋頂的瞭望台',ok:{t:`你們爬上消防局的鐵梯，推開屋頂的門。`,go:'T2'}},
  {...restC('在消防員宿舍歇一下',6,3),need:'fdopen',hide:'acru'},
  {...sleepC('在消防員宿舍過夜',`宿舍裡一排上下舖，被子都沒有疊。你挑了一張靠門的床躺下，車庫那邊的無線電一整晚都在沙沙地響，偶爾有人說話，聽不清楚在說什麼。\n\n天亮的時候，無線電安靜了。`),need:'fdopen',hide:'acru'},
  {l:'回街區',ok:{t:`你們走出車庫，回到大馬路上。`,go:'Z0'}}]},
T1:{L:'T',n:'消防局・裝備室',
 t:`一整面牆的置物櫃，每一格都貼著名字。掛鉤上吊著消防衣和空氣呼吸器，鋼瓶全是空的。角落的工具架上放著一台黃色的油壓擴張器，旁邊是兩把消防斧。`,
 c:[
  {l:'拿液壓破拆工具',once:1,stay:1,s:'很重，但卡死的鐵門和壓扁的車殼都撐得開',ok:{t:`油壓擴張器比你想的重得多，背在背上像背了一個人。`,r:{items:{spreader:1}}}},
  {l:'拿一把消防斧',once:1,stay:1,ok:{t:`斧柄上纏著膠帶，刃口磨得很亮。`,r:{gear:'fireaxe'}}},
  {l:'翻置物櫃',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`大部分的櫃子都是空的。最下面一格塞著一個紙箱，裡面是兩個還沒拆封的濾毒罐和一包消毒繃帶。`,r:{items:{filter:2,sbandage:1}}},ng:{t:`你翻了一排又一排，只找到別人的家庭照片和幾雙襪子。`}},
  {l:'拿一副備用的防毒面具',once:1,stay:1,s:'牆上只剩最後一副',ok:{t:`面罩的鏡片有一道刮痕，但扣環還是好的。裡面已經裝著一個濾罐。`,r:{items:{gasmask:1,filter:1}}}},
  {l:'回車庫',ok:{t:`你們把裝備室的門帶上。`,go:'T0'}}]},
T2:{L:'T',n:'消防局・瞭望台',
 tx:()=>G.flags.streetpower?'東邊的配電站有燈，街區的路燈亮了一半。':G.flags.blackout?'整座城市都是黑的。只有醫院那邊還有幾扇窗戶亮著，大概是備用發電機。東邊那片鐵絲網圍起來的地方，就是配電站。':'',
 t:`從這裡看得到整個街區。北口的鐵絲網、購物中心那個熄了一半的招牌、西邊警察局的屋頂。東南邊那棟白色的大樓是聖瑪莉醫院，救護車道上停滿了車，一台都沒有在動。`,
 c:[{l:'回車庫',ok:{t:`你們順著鐵梯爬下去。`,go:'T0'}}]},
/* ---------- 醫院 ---------- */
O0:{L:'O',n:'聖瑪莉醫院・急診入口',
 tx:()=>G.flags.acru?'救護車道上停滿了沒有標示的黑色車輛，醫院的燈全亮著，用的是他們自己的發電車。門口站著兩個穿全套防護衣的人，背對著你們，在看平板。':G.flags.shadow?'救護車道上多了一排沒有標示的黑色廂型車，引擎都沒熄。':G.flags.streetpower?'醫院的燈亮了一半，急診室的自動門一開一關。':'',
 t:`救護車一台接一台停在急診入口，後車門全開著，擔架床歪在地上。自動門的玻璃碎了，門框上還卡著一隻乳膠手套。急診室裡面的燈閃個不停。`,
 c:[
  {l:'進急診室',ok:{t:`你們踩著玻璃碎片走進去。`,go:'O1'}},
  {l:'搭電梯上四樓',need:'streetpower',t:'q',s:'有電了，電梯會動',ok:{t:`電梯門關上的時候，你們聽到上面某一層有人在拍電梯門。`,go:'O2'}},
  {l:'走樓梯上四樓',hide:'streetpower',k:'PER',d:12,s:'樓梯間沒有燈',t:'m',ok:{t:`你們摸著扶手一層一層往上爬。三樓的防火門開著，裡面有東西在拖著腳走，但沒有過來。`,go:'O2'},ng:{t:`二樓的轉角，你踩到一隻手。手的主人坐了起來。`,fight:{n:2,mode:'ambush'},go:'O2'}},
  {l:'下地下室',s:'指標寫著「機房・備用發電機」',ok:{t:`你們推開往地下室的防火門，裡面的空氣又冷又悶。`,go:'O3'}},
  {l:'回街區',ok:{t:`你們退出救護車道。`,go:'Z0'}}]},
O1:{L:'O',n:'急診室',
 t:`檢傷分類的桌子翻倒在地上，一張張病床用布簾隔開，大部分的簾子都拉著。護理站的電腦螢幕還亮著，滑鼠垂在桌邊晃。`,
 c:[
  {l:'翻藥櫃',once:1,stay:1,k:'PER',d:12,s:'感知檢定',ok:{t:`藥櫃的玻璃被打破了，常用的藥都被拿光，但最上層還塞著幾樣沒人看到的東西。`,r:{items:{sbandage:2,antibiotic:1,iodine:1}}},ng:{t:`你伸手去搆最上層，身後的簾子被拉開了。`,fight:{n:1,mode:'ambush',names:['簾子後面的病人']}}},
  {l:'看看護理站的電腦',once:1,stay:1,k:'INT',d:11,s:'智力檢定',ok:{t:`掛號紀錄停在三天前。那一天急診收了四十幾個病人，備註欄寫的都是同一行字：「ARC 合作門診・第二期回診」。最後一筆的時間是 23:41。`,r:{flag:'erlog'},p:{fear:4}},ng:{t:`螢幕跳出登入畫面，要員工證才能進去。`}},
  {l:'回急診入口',ok:{t:`你們退回救護車道。`,go:'O0'}}]},
O2:{L:'O',n:'四樓・臨床合作病房',
 tx:()=>G.flags.shadow?'病房被清空了。病床上的床墊被翻過來，抽屜全被拉出來，冰箱的門開著，裡面一格一格都是空的。':'',
 t:`走廊盡頭的玻璃門上貼著「ARC 臨床合作病房　4 West」，讀卡機被人用東西砸爛了，門半開著。病房裡的病床一張挨著一張，每張床尾都掛著一塊寫著編號的牌子，沒有名字。`,
 c:[
  {l:'翻病歷',hide:'shadow',once:1,stay:1,k:'INT',d:12,s:'智力檢定',ok:{t:`病歷夾裡寫的都是編號：「第二期受試者　B-117」「B-118」……每一份的「回診後安置地點」都填著同一個地址。你認得那個地址。是那間旅館。`,r:{flag:'arcfile'},p:{fear:8}},ng:{t:`滿頁的縮寫和數字，你看不懂。只看懂一件事：每一份都蓋著同一個紅色的章，「保密」。`,p:{fear:4}}},
  {l:'翻那些被拉開的抽屜',need:'shadow',once:1,stay:1,k:'PER',d:13,s:'感知檢定',ok:{t:`他們搬得很徹底，只漏了一張夾在抽屜縫裡的轉送單：「轉送地點：S-」，後面整行被黑筆塗掉了。`,r:{flag:'arcfile'},p:{fear:6}},ng:{t:`什麼都沒有。連一張紙都沒有留下。`,p:{fear:4}}},
  {l:'搜病房',once:1,stay:1,t:'m',k:'PER',d:12,s:'感知檢定',ok:{t:`護理車的下層有一個沒拆封的手術包，旁邊還有一盒鎮定劑。`,r:{items:{surgkit:1,sedative:1}}},ng:{t:`你彎腰去拉護理車的時候，旁邊兩張床上的病人同時坐了起來。`,fight:{n:2,mode:'normal',names:['病床上的病人','病床上的病人']}}},
  {l:'看看那台電梯',once:1,stay:1,s:'走廊另一頭有一台員工專用電梯',ok:{t:`電梯面板最下面有一顆沒有數字的按鈕，旁邊是讀卡機。你按了，什麼都沒有發生。`,p:{fear:2}}},
  {l:'回樓下',ok:{t:`你們往樓下走。`,go:'O0'}}]},
O3:{L:'O',n:'地下室・機房',
 tx:()=>G.flags.streetpower?'天花板上的日光燈亮了，照得整條走廊發白。':'沒有燈。走廊的盡頭有一扇鐵門開著，裡面是發電機房。',
 t:`地下室的走廊又長又窄，牆上全是管線，滴著水。空氣裡有柴油和霉的味道。`,
 c:[
  {l:'找備用發電機的備品',hide:'gotfuse',t:'m',k:'PER',d:12,s:'感知檢定',ok:{t:`保險絲架上還剩一根高壓保險絲，旁邊的維修櫃裡有一個沒拆封的濾毒罐。`,r:{items:{fuse:1,filter:1},flag:'gotfuse'},stay:1},ng:{t:`你摸黑走進機房，撞上一台推車。黑暗裡有東西被吵醒了。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['機房裡的維修工']},go:'O3'}},
  {l:'看看發電機',once:1,stay:1,ok:{t:`柴油發電機的外殼還有一點溫度。油箱是空的，有人把最後一點油抽走了。`}},
  {l:'回樓上',ok:{t:`你們爬回一樓。`,go:'O0'}}]},
/* ---------- 配電站 ---------- */
W0:{L:'W',n:'配電站・鐵門',
 t:`一大片鐵絲網圍起來的空地，裡面是一排排灰色的變壓器。鐵門上掛著「高壓危險　非工作人員禁止進入」的牌子，門被一條鐵鍊鎖著。以前這裡一天到晚都在嗡嗡響，現在一點聲音都沒有。`,
 c:[
  {l:'用工具撬開鐵門',req:['g:crowbar','g:fireaxe','spreader'],reqAny:1,hide:'wopen',t:'q',s:'需要鐵撬、消防斧或破拆工具',ok:{t:`鐵鍊斷掉的聲音在空地上傳得很遠。`,r:{flag:'wopen'},p:{alarm:1},go:'W1'}},
  {l:'把鐵門扳開',hide:'wopen',k:'STR',d:13,s:'力量檢定',ok:{t:`你抓著鐵門用力往外扳，門框終於彎出一個縫。`,r:{flag:'wopen'},go:'W1'},ng:{t:`鐵門紋風不動，你的手倒是先磨破了。`,p:{hp:-1},stay:1}},
  {l:'翻過鐵絲網',hide:'wopen',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你踩著鐵絲網的格子翻過去，落地的時候只擦破了一點皮。`,go:'W1'},ng:{t:`鐵絲網頂端的刺絲勾住了你的手臂。你還是翻過去了，但血滴了一路。`,p:{hp:-2,bleed:1},go:'W1'}},
  {l:'從撬開的鐵門進去',need:'wopen',ok:{t:`鐵門還開著，跟你們上次離開的時候一樣。`,go:'W1'}},
  {l:'回街區',ok:{t:`你們往回走。`,go:'Z0'}}]},
W1:{L:'W',n:'配電站・變電場',
 tx:()=>G.flags.powerfix?'變壓器在嗡嗡地響。這是你們修好的。':G.flags.acru?'有人來過了。一台漆成黑色的發電車接在配電盤上，粗粗的電纜沿著人行道一路往城北拉。':'',
 t:`變電場中間有一間水泥砌的控制小屋，門開著。配電盤上的保險絲座燒得焦黑，其中一根保險絲已經碎了，陶瓷碎片散了一地。`,
 c:[
  {l:'換上保險絲，重新送電',req:'fuse',hide:'streetpower',k:'INT',d:12,s:'智力檢定',ok:{t:`你照著配電盤門內貼的接線圖，把燒掉的那根拔出來，換上新的，然後拉下總開關。`,r:{use:'fuse'},go:'W2'},ng:{t:`你拉下開關的瞬間，配電箱裡噴出一串火花，你整個人被彈開。保險絲還好好的，只是你接錯了。`,p:{hp:-3,fear:4},stay:1}},
  {l:'不用保險絲，直接拉旁路',hide:'streetpower',k:'INT',d:15,s:'智力檢定：很危險',ok:{t:`你剝開兩條電纜，用鉗子把它們繞過燒掉的保險絲座接在一起，手一直在抖。`,go:'W2'},ng:{t:`電纜碰在一起的那一刻，一道白光把你整個人打飛出去。你躺在地上好一陣子，耳朵裡全是嗡嗡聲。`,p:{hp:-4,fear:8},stay:1}},
  {l:'搜控制小屋',once:1,stay:1,t:'m',ok:{t:`小屋裡有一張值班表、一捲膠帶和兩顆電池。值班表上最後一個簽名的日期是三天前。`,r:{items:{tape:1,battery:2}}}},
  {l:'回街區',ok:{t:`你們從鐵門出去。`,go:'Z0'}}]},
W2:{L:'W',n:'配電站・送電',
 onEnter(){G.flags.powerfix=1;G.flags.streetpower=1},
 t:`一開始什麼都沒有發生。然後腳底下傳來一陣很低的震動，變壓器一台接一台響了起來。\n\n街區那邊，路燈一盞一盞亮起來，有幾棟公寓的窗戶也亮了。遠處傳來一聲歡呼，又很快被別的聲音蓋過去——警報器、狗叫，還有某種很多東西同時動起來的聲音。\n\n<b>街區恢復供電</b>：街區、消防局、醫院不再停電；醫院的電梯能用了。夜裡路燈會把你們照得一清二楚。`,
 c:[{l:'回街區',ok:{t:`你們踩著路燈的光往回走。`,go:'Z0'}}]}
});

/* ---------- 警察局 ---------- */
L0:{L:'L',n:'第 4 分局・門口',
 onEnter(){const F=G.flags;if(F.evacgone)F.pdok=1;F.l0lock=(!F.evacgone||F.acru)?1:0},
 tx:()=>G.flags.acru?'門口停著三台沒有標示的黑色車輛，大廳的燈全亮著。玻璃門後面有人穿著全套防護衣走來走去，在搬一箱一箱的資料。':G.flags.evacgone?'沙包後面沒有人了。玻璃門用一條鐵鍊從裡面鎖上，門上貼著一張紙：「本分局人員已隨撤離車隊撤離」。':'沙包後面有人朝你們舉槍。「站住！手舉起來！」',
 t:`第 4 分局的門口用沙包堆了半人高的一道牆，牆上架著兩支長槍。停車場裡的警車有一半被翻倒，一台的車頂上還閃著警示燈，沒有聲音。`,
 c:[
  {l:'舉起手走過去',hide:'evacgone',ok:{t:`你們舉著手慢慢走近。一個穿防彈背心的女警從沙包後面走出來，先看你們的手臂，再看脖子，最後才揮手要你們進去。她的名牌寫著「羅培茲」。`,go:'L1'}},
  {l:'用工具剪開鐵鍊',hide:'l0lock',req:['pliers','g:crowbar','g:fireaxe','spreader'],reqAny:1,t:'q',s:'需要鉗子、鐵撬、消防斧或破拆工具',ok:{t:`鐵鍊斷了，嘩啦一聲掉在地上。`,p:{alarm:1},go:'L1'}},
  {l:'從破掉的窗戶爬進去',need:'evacgone',hide:'acru',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你從一扇被打破的側窗翻進去，落在一張辦公桌上。`,go:'L1'},ng:{t:`窗框上的碎玻璃割開了你的手掌。`,p:{hp:-2,bleed:1},go:'L1'}},
  {l:'從後門溜進去',need:'acru',k:'AGI',d:13,s:'敏捷檢定：大廳裡都是穿黑色制服的人',ok:{t:`你們繞到後面的停車場，從沒人看守的後門溜進去，貼著走廊摸到紀錄室。`,go:'L2'},ng:{t:`「後門有人。」槍聲在走廊裡炸開。你們拚命往外跑，子彈打碎了停車場的每一片車窗。`,p:{hp:-4,fear:12,alarm:2},go:'Z0'}},
  {l:'走到醫院',t:'q',ok:{t:`你們穿過馬路，往醫院的救護車道走。`,go:'O0'}},
  {l:'回街區',ok:{t:`你們離開警察局。`,go:'Z0'}}]},
L1:{L:'L',n:'第 4 分局・大廳',
 tx:()=>G.flags.evacgone?'大廳空了。那幾張椅子上只剩被剪斷的手銬，白板上的字被人擦掉一半。':'大廳裡擠滿了人，有警察、有平民。角落有幾個人被銬在椅子上，一直在扭、一直在流口水，每隔一陣子就有人過去檢查他們的手銬。牆上的白板寫著：「國民兵聯絡中斷　第 14 小時」。',
 t:`值班台後面的無線電一直在沙沙作響。牆上掛著轄區地圖，上面用紅筆圈了好幾個地方：醫院、旅館、北口。`,
 c:[
  {l:'跟羅培茲警佐談',hide:'evacgone',once:1,stay:1,k:'CHA',d:12,s:'魅力檢定',ok:{t:`她聽你們說完，沉默了一下。「我們也聯絡不上任何人。」她從腰上解下一根伸縮警棍丟給你，「拿著。槍我不能給你。想休息的話，拘留室後面那間是空的。」`,r:{gear:'baton',flag:'pdok'}},ng:{t:`「我現在沒空聽故事。」她轉身去接無線電。`}},
  {l:'幫她把一個掙脫手銬的人押回去',hide:'evacgone',once:1,s:'角落那張椅子上的人把手銬扯斷了',ok:{t:`那個人撲向離他最近的警察。你們衝了過去。`,r:{flag:'pdok',karma:1},fight:{n:1,mode:'normal',names:['銬在椅子上的人']},go:'L1'}},
  {l:'去紀錄室',need:'pdok',ok:{t:`你們穿過辦公區，推開走廊盡頭那扇寫著「紀錄室」的門。`,go:'L2'}},
  {l:'趁亂溜進紀錄室',hide:'pdok',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你趁大家都在看角落那幾個人，貼著牆溜進走廊。`,r:{karma:-1},go:'L2'},ng:{t:`「你要去哪裡？」一個年輕警員擋在走廊口，手按在槍套上。你只好退回來。`,p:{fear:4},stay:1}},
  {l:'翻值班台',need:'evacgone',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`抽屜裡有一張掛著繩子的門禁卡，上面寫著「證物室」，還有兩顆電池。`,r:{flag:'pdcard',items:{battery:2}}},ng:{t:`抽屜裡只有一堆罰單和一個咬了一半的甜甜圈。`}},
  {l:'搜更衣室和軍械櫃',need:'evacgone',once:1,stay:1,t:'m',k:'PER',d:12,s:'感知檢定',ok:{t:`軍械櫃被搬空了，只剩最底層一盒霰彈。更衣室的置物櫃裡掛著一件防彈背心，背後印著「POLICE」。`,r:{items:{riotvest:1,shell:4}}},ng:{t:`更衣室裡有一個人背對著你們坐在長椅上，穿著警察制服。他慢慢轉過頭來。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['穿制服的警員']}}},
  {...restC('在拘留室後面歇一下',6,3),need:'pdok',hide:'acru'},
  {...sleepC('在拘留室後面過夜',`拘留室後面那間空房只有一張鐵床。你把門鎖上，聽著外面的無線電一直沙沙地響。半夜有人在拘留室那邊拍鐵欄杆，拍了很久。\n\n天亮的時候，聲音停了。`),need:'pdok',hide:'acru'},
  {l:'回門口',ok:{t:`你們走回沙包後面。`,go:'L0'}}]},
L2:{L:'L',n:'第 4 分局・紀錄室',

 c:[
  {l:'翻案件紀錄',once:1,stay:1,k:'INT',d:12,s:'智力檢定',ok:{t:`過去一個月的傷害案多得不正常。好幾份筆錄的嫌犯欄都寫著同一句話：「曾在聖瑪莉醫院 ARC 合作門診就診」。有一份的備註是：「嫌犯遭制伏後仍持續攻擊，對疼痛無反應。」`,r:{flag:'caselog'},p:{fear:6}},ng:{t:`報案紀錄一疊比一疊高，你翻了半天，只看出一件事：最近每天都有人被咬。`,p:{fear:4}}},
  {l:'翻商家登記',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`槍械商的登記表裡夾著一張調查報告：「卡特槍械　店主涉嫌非法改裝，店門鑰匙已扣押，存放於證物室」。上面有地址，就在兩條街外。`,r:{flag:'gunshop'}},ng:{t:`登記表按照字母排，你翻到一半就被走廊裡的聲音嚇了一跳，弄亂了順序。`}},
  {l:'刷門禁卡進證物室',need:'pwcard',ok:{t:`讀卡機嗶了一聲，亮起綠燈。`,go:'L3'}},
  {l:'用破拆工具撐開證物室的門',req:'spreader',t:'q',s:'很吵',ok:{t:`油壓擴張器一點一點把門框撐開，金屬發出很難聽的聲音，整條走廊都聽得到。`,p:{alarm:2},go:'L3'}},
  {l:'打開門禁面板的維修模式',job:'guard',need:'pw',t:'q',s:'夜班保全：你認得這一套門禁',ok:{t:`你掀開面板的蓋子，按住重設鍵，輸入這個牌子預設的維修碼。門鎖喀的一聲彈開了。`,go:'L3'}},
  {l:'回大廳',hide:'acru',ok:{t:`你們走回大廳。`,go:'L1'}},
  {l:'從後門出去',need:'acru',ok:{t:`你們從後門溜回停車場。`,go:'Z0'}}]},
L3:{L:'L',n:'第 4 分局・證物室',
 t:`一排排鐵架，架上是編了號的證物袋和紙箱。最裡面有一個上鎖的槍櫃，玻璃門已經被人敲破了。`,
 c:[
  {l:'翻槍櫃',once:1,stay:1,s:'玻璃門破了，裡面還剩一把',ok:{t:`架上只剩一把大得誇張的左輪，證物標籤寫著「.500 S&W　改裝」。旁邊的盒子裡還有幾發子彈。`,r:{gear:'model500',mag:5}}},
  {l:'找卡特槍械的鑰匙',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`證物袋上寫著「卡特槍械　店門鑰匙　2 支」。袋子裡只剩一支。`,r:{flag:'gunkey'}},ng:{t:`證物袋太多了，編號又亂。你找了很久，只找到一盒被扣押的止痛藥。`,r:{items:{painkiller:1}}}},
  {l:'翻其他證物',once:1,stay:1,t:'m',ok:{t:`大部分是毒品、刀和手機。有一個箱子裡是醫院的東西：沒拆封的鎮定劑，還有一份被撕掉抬頭的同意書。`,r:{items:{sedative:1}},p:{fear:2}}},
  {l:'回紀錄室',ok:{t:`你們退回紀錄室。`,go:'L2'}}]},
/* ---------- 購物中心 ---------- */
S0:{L:'S',n:'河景廣場・入口',
 onEnter(){const F=G.flags;F.pw=pwNow();F.min=(!F.raiders||F.acru||F.mpass||F.mclear)?1:0;F.mraid=F.min?0:1},
 tx:()=>G.flags.acru?'入口那道購物車牆被燒成一堆扭曲的鐵架。大門整個燒穿了，裡面還在冒煙。':G.flags.mclear?'入口沒有人守了。地上有幾灘乾掉的血，和一頂被踩扁的鴨舌帽。':G.flags.raiders?(G.flags.mpass?'哨兵認得你們，抬了抬下巴讓你們進去。':'購物車牆上多了一面用床單畫的旗子。牆後面站著兩個拿球棒的人，屋頂上還有一個拿霰彈槍的。「繳過路費，還是滾？」'):'牆後面有人在看。一個小孩的頭探出來又縮回去，接著是一個女人的聲音：「沒被咬的就進來，動作快。」',
 t:`購物中心的入口用購物車堆成了一道牆，只留一條側著身子才過得去的縫。大門上方的招牌「河景廣場」熄了一半。`,
 c:[
  {l:'從縫裡鑽進去',need:'min',hide:'acru',ok:{t:`你們側著身子鑽過購物車之間的縫。`,go:'S1'}},
  {l:'從燒穿的大門走進去',need:'acru',ok:{t:`你們踩著還在發燙的灰走進去。`,go:'S1'}},
  {l:'跟哨兵談',need:'mraid',k:'CHA',d:13,s:'魅力檢定',ok:{t:`你說你們只是來找藥，不搶他們的地盤，出去的時候還能告訴他們哪裡有東西。屋頂上那個人想了很久，揮了揮手。`,r:{flag:'mpass'},go:'S1'},ng:{t:`「說得好聽。」球棒朝你揮了過來。`,r:{flag:'mclear'},fight:{n:2,names:['劫匪','拿獵刀的劫匪']},go:'S1'}},
  {l:'繳過路費',need:'mraid',usd:15,s:'需要 $15',ok:{t:`錢遞過去，他們數了兩遍，讓開一條縫。`,r:{payUsd:15,flag:'mpass'},go:'S1'}},
  {l:'從後面的卸貨區溜進去',need:'mraid',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你們繞到購物中心後面，從一台卸貨卡車底下鑽進去。`,go:'S1'},ng:{t:`卸貨區的鐵門被你們碰得嘩啦一聲。三個人從裡面衝出來。`,r:{flag:'mclear'},fight:{n:2,mode:'ambush',names:['劫匪','拿霰彈槍的劫匪']},go:'S1'}},
  {l:'硬闖',need:'mraid',ok:{t:`你們沒有等他們說完。`,r:{flag:'mclear'},fight:{n:3,mode:'first',names:['劫匪','拿獵刀的劫匪','拿霰彈槍的劫匪']},go:'S1'}},
  {l:'從地下停車場的鐵捲門進去',need:'pw',hide:'acru',t:'q',s:'有電的話捲門能開，但會很吵',ok:{t:`你們按下停車場入口的開關，鐵捲門嘎啦嘎啦地往上捲，整個停車場都在回音。`,p:{alarm:2},go:'S3'}},
  {l:'走到消防局',t:'q',ok:{t:`你們穿過馬路，往那扇紅色的車庫門走。`,go:'T0'}},
  {l:'回街區',ok:{t:`你們離開購物中心。`,go:'Z0'}}]},
S1:{L:'S',n:'河景廣場・一樓中庭',

 t:`一樓的店一家挨著一家：藥妝店、運動用品店、服飾店。往下的指標寫著「維修區・員工專用」，手扶梯通往二樓的美食街。`,
 c:[
  {l:'搜藥妝店',once:1,stay:1,t:'m',k:'PER',d:12,s:'感知檢定',ok:{t:`架上的藥幾乎被拿光了，但收銀台後面的櫃子還鎖著。你撬開它，裡面是幾樣處方藥和一包繃帶。`,r:{items:{painkiller:1,iodine:1,alcohol:1,bandage:2}}},ng:{t:`你只找到一堆過期的維他命和一瓶洗髮精。`}},
  {l:'搜運動用品店',once:1,stay:1,t:'m',k:'PER',d:12,s:'感知檢定',ok:{t:`倉庫最裡面的架子上，有一把還裝在盒子裡的複合弓，旁邊是一打箭。`,r:{gear:'compbow',items:{arrow:6}}},ng:{t:`倉庫的門一推開，一個穿著店員背心的人從紙箱堆後面爬了出來。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['穿店員背心的人']}}},
  {l:'搜服飾店',once:1,stay:1,ok:{t:`衣架倒了一地。你從試衣間裡翻出一件皮外套，尺寸剛好，還有幾件能撕成布條的襯衫。`,r:{items:{jacket:1,cloth:3}}}},
  {l:'上二樓美食街',ok:{t:`你們踩著停住的手扶梯往上走。`,go:'S2'}},

S2:{L:'S',n:'河景廣場・二樓美食街',
 onEnter(){const F=G.flags;F.mrose=F.raiders?0:1;F.mboss=F.raiders&&!F.acru&&!F.mclear?1:0;F.mloot=F.raiders&&!F.acru&&F.mclear?1:0},
 tx:()=>G.flags.acru?'美食街燒得只剩骨架，桌椅熔成一團。牆上那面倖存者名單被燒掉了一半。':G.flags.mclear&&G.flags.raiders?'劫匪的據點沒人了。睡袋、空罐頭和彈殼散了一地，牆角還堆著他們沒來得及帶走的東西。':G.flags.raiders?'倖存者不見了。美食街變成劫匪的據點，桌子拼成一排，上面堆滿搶來的東西。帶頭的是一個光頭的男人，大家叫他德克。他看了你一眼：「要交易就快點。」':'',
 t:`美食街的桌子被拼成一張張床，幾十個人或坐或躺。一個繫著圍裙的中年女人在發罐頭，她是一家墨西哥餐廳的老闆，大家叫她蘿絲。牆上貼著一張手寫的名單，標題是「我們在這裡」。`,
 c:[
  {l:'跟蘿絲買東西',need:'mrose',stay:1,s:'只收美金現鈔',ok:{t:`蘿絲把幾個紙箱推到你面前。「我們也要活下去，所以要收錢。」`,r:{shop:'mall'}}},
  {l:'把抗生素給蘿絲',hide:'raiders',req:'antibiotic',once:1,stay:1,s:'她說有個孩子的傷口一直在發炎',ok:{t:`蘿絲接過抗生素，眼眶一下子紅了。她從櫃台下面拿出一副防毒面具塞給你。「之前一個消防員留下來的。地下室那邊的空氣不對勁，你們拿去用。」\n\n「以後想睡覺，這裡給你們留一張桌子。」`,r:{use:'antibiotic',items:{gasmask:1,filter:1},flag:'mallok',karma:1}}},
  {l:'問蘿絲外面的事',need:'mrose',once:1,stay:1,t:'q',ok:{t:`「警察局那邊還有人守著，可是不收人了。北口好像在搭什麼東西。」她壓低聲音，「還有，最近夜裡有幾台車在附近繞，車上的人會拿東西出來比對這裡的人。我不喜歡。」`}},
  {...restC('在美食街的角落歇一下',6,3),need:'mallok',hide:'raiders'},
  {...sleepC('在蘿絲留的桌子上過夜',`蘿絲把一張桌子推到柱子後面，給你們一條毯子。半夜有人在哭，有人在打呼，有人一直在小聲地數數。\n\n天亮的時候，蘿絲已經在發早餐了。`),need:'mallok',hide:'raiders'},
  {l:'跟德克交易',need:'mboss',stay:1,s:'劫匪的貨，價錢照他們的心情',ok:{t:`德克把桌上的東西往你這邊推了推。「付現金。別想耍花樣。」`,r:{shop:'raider'}}},
  {l:'偷劫匪的物資',need:'mboss',once:1,k:'AGI',d:14,s:'敏捷檢定：被抓到就得動手',ok:{t:`你趁德克在罵人，從桌子底下拖走一個背包，若無其事地走開。`,r:{items:{ammo9:6,water:2,bar:2},karma:-1},stay:1},ng:{t:`「小偷！」德克一腳踢翻桌子。`,r:{flag:'mclear',karma:-1},fight:{n:3,mode:'normal',names:['拿獵刀的劫匪','拿霰彈槍的劫匪','劫匪']},go:'S2'}},
  {l:'翻劫匪留下的東西',need:'mloot',once:1,stay:1,t:'m',ok:{t:`他們搶來的東西還剩不少。你挑了能帶走的：子彈、水、幾條能量棒，還有一卷捆好的美金。`,r:{items:{ammo9:8,shell:3,water:2,bar:2},usd:15}}},
  {l:'在燒過的美食街裡找找',need:'acru',once:1,stay:1,t:'m',ok:{t:`大部分的東西都燒掉了。你在一台被燻黑的冰箱裡找到兩瓶水。`,r:{items:{water:2}}}},
  {l:'回一樓',ok:{t:`你們順著手扶梯走下去。`,go:'S1'}}]},

  {l:'看看管線上那層東西',once:1,stay:1,t:'q',ok:{t:`那層灰白色的東西像黴，又像很細的根，沿著管線一路往停車場那邊長過去。你湊近一點，聞到一股甜甜的爛水果味。`,p:{fear:4}}},

  {l:'短路捲門的馬達',need:'pw',hide:'raiders',k:'INT',d:13,s:'智力檢定：後巷有捲門的控制箱',ok:{t:`你撬開後巷的控制箱，把兩條線碰在一起。鐵捲門抖了一下，嘎啦嘎啦地捲了上去。`,p:{alarm:1},go:'N1'},ng:{t:`控制箱裡噴出一串火花，你的手麻了好一陣子。`,p:{hp:-2},stay:1}},
  {l:'用破拆工具撐開捲門',req:'spreader',hide:'raiders',t:'q',s:'會很吵',ok:{t:`捲門被一點一點撐出一個洞，金屬撕開的聲音整條街都聽得到。`,p:{alarm:3},go:'N1'}},

  {l:'看看最底層的展示櫃',once:1,stay:1,k:'PER',d:13,s:'感知檢定',ok:{t:`最底層的櫃子有一塊活動的底板。底板下面藏著一把手弩和一捆弩箭。`,r:{gear:'handxbow',items:{bolt:6}}},ng:{t:`櫃子是空的。`}},

  {l:'看看椅子上的老人',need:'nok',once:1,stay:1,t:'q',ok:{t:`你走近一點，老人的頭突然抬了起來。他的眼睛是灰白的。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['穿格子襯衫的老人']}}},
  {l:'撬開槍架的鎖',hide:'mp5lock',req:['g:crowbar','g:fireaxe','spreader'],reqAny:1,t:'q',s:'需要鐵撬、消防斧或破拆工具',ok:{t:`大鎖崩開了。槍架上只剩一把黑色的衝鋒槍，彈匣插在上面，是滿的。`,r:{gear:'mp5',mag:30,flag:'gotmp5'},go:'N2'}},
  {l:'用工作台上的工具撥開槍架的鎖',hide:'mp5lock',k:'INT',d:13,s:'智力檢定',ok:{t:`你用工作台上的細鐵絲和起子撥了很久，鎖終於開了。槍架上只剩一把衝鋒槍，彈匣是滿的。`,r:{gear:'mp5',mag:30,flag:'gotmp5'},go:'N2'},ng:{t:`鐵絲斷在鎖孔裡。`,stay:1}},

  {l:'找工作台下面的暗格',job:'veteran',need:'nok',once:1,stay:1,s:'退伍軍人：這種店一定會藏一點',ok:{t:`你在工作台下面敲了敲，有一塊板子的聲音不一樣。撬開來，裡面是一盒霰彈和一盒 9mm。`,r:{items:{shell:4,ammo9:8}}}},

/* ================= v0.14.0 滅菌部隊營地與基地（主人 2026-11-13 定案） =================
   營地（城北的舊貨運場，LV CA，節點 CA0～CA5）：第 5 天影子期起才有，掛「ARC 醫療物流站」的牌子；第 6 天起公開營運。
     找到營地（campknown）：藥局的黑色廂型車、集合檢查的卡車、配電站的黑色發電車、警察局被搬剩的紙箱。
     通訊帳篷聽無線電 → 基地（baseknown）；指揮帳篷 → 隊長的門禁卡（acrucard）。
   基地（北郊的陸軍後備中心，LV BA，節點 BA0～BA5、BA1a）：潛入（門禁卡、制服＋防毒面具、躲補給車）或強攻（哨塔狙擊手可以先處理）都能走。
     指揮中心：作戰紀錄（opslog）、S 區門禁卡（labcard）。研究所入口照主人的規則：所有條件＋市電＋供水＋S 區門禁，回旅館那扇門（v1.0.0 再做）。
     停機坪：第 6 天起有直升機 → 結局 B「搶直升機逃出城」。
   G.flags.warn＝第 7 天 05:00 預警之後。 */
Object.assign(LV,{
 CA:{n:'舊貨運場',sub:'A.C.R.U. 前進營地',en:'FORWARD CAMP',rule:'鐵絲網、探照燈，還有一根一直在冒煙的煙囪。',fx:{},ch:2,fire:'camp'},
 BA:{n:'陸軍後備中心',sub:'北郊',en:'ARMY RESERVE CENTER',rule:'門口的國旗被換成了一面紅底的旗子。',fx:{},ch:2,fire:'base'}
});
Object.assign(LV_POOL,{CA:['infected'],BA:['infected']});

const gateFt=()=>G.flags.towerdown?{n:2,names:['A.C.R.U. 隊員','A.C.R.U. 隊員']}:{n:3,names:['A.C.R.U. 隊員','A.C.R.U. 隊員','哨塔上的狙擊手']};
{const i=N.Z0.c.findIndex(c=>c.l==='回旅館');N.Z0.c.splice(i,0,
 {l:'去城北的舊貨運場',s:'A.C.R.U. 的車都往那裡開',need:'campknown',ok:{t:`你們避開大路，沿著鐵軌往城北走。`,go:'CA0'}},
 {l:'去北郊的陸軍後備中心',s:'出了城區還有一段公路',need:'baseknown',t:'l',ok:{t:`你們沿著北郊公路的路肩走，一有車燈就趴進路邊的排水溝。`,go:'BA0'}})}
// 找到營地的線索
{const e=EVPOOL.find(x=>x.id==='shadow1');e.c.splice(1,0,{l:'跟著那台車',k:'AGI',d:13,s:'敏捷檢定：不能被看到',t:'m',ok:{t:`你隔著兩條街跟在後面。廂型車沒有開燈，一路往城北開，最後開進一片用新鐵絲網圍起來的空地——城北的舊貨運場。門口掛著一面牌子：「ARC 醫療物流站」。`,r:{flag:'campknown'},p:{fear:6}},ng:{t:`轉過第三個路口，車子就不見了。`,p:{fear:4}}})}
{const e=EVPOOL.find(x=>x.id==='acru2');const c=e.c.find(x=>x.l==='看看他們把人帶去哪');c.ok={t:`卡車先在旅館門口停了一下，下來兩個人，往地下室的方向走。然後卡車繼續往城北開，開進舊貨運場那片新拉的鐵絲網裡。那裡有一根煙囪在冒煙。`,r:{flag:['acrutruck','campknown']},p:{fear:10}}}

CA0:{L:'CA',n:'舊貨運場・營地外圍',
 onEnter(){G.flags.disg=acruDisg()},
 tx:()=>G.flags.warn?'營地在拆。帳篷一頂一頂倒下來，卡車排成一列往北開。門口沒有人在看了。':G.flags.acru?'煙囪整天都在冒煙。卡車一台接一台開進去，車斗的帆布放下來，看不到裡面。門口站著四個穿黑色制服的人，每一台車都要停下來查。牌子還是那面「ARC 醫療物流站」。':'門口掛著一面牌子：「ARC 醫療物流站　生物檢體處理中　非相關人員禁止進入」。只有兩個人在門口站崗，穿的是黑色制服，不是醫護人員的衣服。',
 t:`城北的舊貨運場。一整片空地用新拉的鐵絲網圍起來，四個角各有一座鷹架搭的哨塔，探照燈在空地上慢慢掃。鐵絲網裡面是一排一排灰色的帳篷，最裡面那一頭，立著一根臨時的煙囪。`,
 c:[
  {l:'剪開鐵絲網鑽進去',hide:'warn',req:['pliers','spreader'],reqAny:1,k:'AGI',d:12,s:'需要鉗子或破拆工具；探照燈掃過來之前要鑽過去',ok:{t:`你們等探照燈掃過去，剪開最下面的幾格，一個接一個鑽過去。`,p:{alarm:1},go:'CA1'},ng:{t:`探照燈停在你們身上。哨塔上有人在對講機裡說了一句話。`,get fight(){return campFt()},go:'CA1'}},
  {l:'等換哨的空檔溜進去',hide:'acru',k:'PER',d:13,s:'感知檢定：看準時間',t:'m',ok:{t:`你們趴在對面的貨櫃後面看了很久。他們每兩個小時換一次哨，交接的時候兩個人都背對著門。你們就是在那時候溜進去的。`,go:'CA1'},ng:{t:`你們算錯了時間。剛走到門口，換哨的人從帳篷後面轉出來。`,get fight(){return campFt()},go:'CA1'}},
  {l:'躲在卡車底下混進去',need:'acru',hide:'warn',k:'AGI',d:14,s:'敏捷檢定：卡車進門要停下來檢查',ok:{t:`你們趁卡車在路口減速時鑽到車底，抓著底盤上的橫桿。卡車在門口停了一下，有手電筒往車底照了一圈，照到你們旁邊的輪胎就移開了。`,go:'CA1'},ng:{t:`手電筒照到了你的鞋子。「車底有人。」`,get fight(){return campFt()},go:'CA1'}},
  {l:'穿著 A.C.R.U. 的制服走進去',need:'disg',hide:'warn',k:'CHA',d:12,s:'魅力檢定：走路要像他們',ok:{t:`你們排成一列走向門口，誰也沒有說話。門口的人看了你們一眼，揮手讓你們過去。紅色的鏡片後面，看不出他在想什麼。`,go:'CA1'},ng:{t:`門口的人伸手攔住你：「編號。」你答不出來。`,get fight(){return campFt()},go:'CA1'}},
  {l:'硬闖',hide:'warn',s:'他們不會問你是誰',ok:{t:`你們搶在探照燈掃過來之前衝向門口。`,get fight(){return Object.assign({mode:'first'},campFt())},go:'CA1'}},
  {l:'從開著的門走進去',need:'warn',ok:{t:`你們從一台正要開走的卡車旁邊走進去，沒有人回頭。`,go:'CA1'}},
  {l:'回街區',ok:{t:`你們沿著鐵軌往回走。`,go:'Z0'}}]},
CA1:{L:'CA',n:'營地・隔離區',
 tx:()=>G.flags.warn?'籠子的門都開著，裡面沒有人了。':G.flags.cfreed?'籠子的門被剪開了，裡面空了一半。':G.flags.acru?'籠子裡擠滿了人。有人在哭，有人一直用額頭撞鐵絲網，有人只是坐著，盯著煙囪。':'籠子裡只關了幾個人，都穿著醫院的病人服。',
 t:`帳篷之間用鐵絲網隔成一格一格的籠子。每一格前面插著一塊白板，用黑筆寫著：「陰性・觀察」「陽性・處置」「知情・轉送」。\n\n「陽性・處置」那一格是空的。地上有拖過的痕跡，一路拖向煙囪那邊。`,
 c:[
  {l:'跟籠子裡的人說話',hide:'warn',once:1,stay:1,ok:{get t(){return G.flags.acru?`一個穿睡衣的男人抓著鐵絲網：「他們說只是檢查。量完體溫就把人分開。」他指著那一格空掉的「陽性・處置」：「我太太被分到那一格。她只是發燒。」`:`一個穿病人服的女人靠到鐵絲網邊，手腕上戴著一圈塑膠手環，上面印著「B-」開頭的編號。「我只是去回診，」她小聲說，「回診完，他們就把我們送來這裡。」`},p:{fear:8}}},
  {l:'剪開籠子，放他們出去',hide:'cfreed',req:['pliers','spreader'],reqAny:1,s:'需要鉗子或破拆工具；會很吵',ok:{t:`鐵絲一根一根斷開。籠子裡的人愣了一下，接著全部往外擠，往鐵絲網的破口跑。哨塔上的探照燈轉了過來。`,r:{flag:'cfreed',karma:1},p:{alarm:3},stay:1}},
  {l:'撬開籠子的鎖',hide:'cfreed',k:'INT',d:13,s:'智力檢定',ok:{t:`掛鎖是便宜貨。你用一根鐵絲撥了幾下就開了。籠子裡的人一個接一個溜出去，誰也沒有出聲。`,r:{flag:'cfreed',karma:1},p:{alarm:1},stay:1},ng:{t:`鐵絲斷在鎖孔裡。`,stay:1}},
  {l:'去煙囪那邊',ok:{t:`你們順著地上拖過的痕跡走。`,go:'CA2'}},
  {l:'去掛紅十字的帳篷',ok:{t:`你們貼著帳篷的影子走過去。`,go:'CA3'}},
  {l:'去天線最多的帳篷',ok:{t:`無線電的沙沙聲從那頂帳篷裡傳出來。`,go:'CA4'}},
  {l:'去最大的那頂帳篷',ok:{t:`門口拉著兩道防水布。`,go:'CA5'}},
  {l:'從原路溜出去',ok:{t:`你們從進來的地方溜回鐵絲網外面。`,go:'Z0'}}]},
CA2:{L:'CA',n:'營地・焚化區',
 t:`煙囪底下是一台用拖車改裝的焚化爐，爐門關著，還在發燙。旁邊的棧板上堆著一排黑色的屍袋，每一個都綁著標籤。\n\n空氣裡全是燒焦的味道。`,
 c:[
  {l:'看屍袋上的標籤',once:1,stay:1,k:'CON',d:11,s:'體質檢定：靠近它們',ok:{get t(){return G.flags.arcfile?`標籤上寫著日期、時間和一行編號，沒有名字。其中一個寫著「B-118」。你在醫院的病歷裡看過這個號碼。`:`標籤上寫著日期、時間和一行編號，像是「B-118」「C-0042」。沒有名字。`},p:{fear:10}},ng:{t:`你走到一半就停下來了。腳不聽使喚。`,p:{fear:6}}},
  {l:'回隔離區',ok:{t:`你們離開那根煙囪。`,go:'CA1'}}]},
CA3:{L:'CA',n:'營地・軍醫帳篷',
 tx:()=>G.flags.warn?'大部分的藥品箱已經搬走了，地上只剩被拆開的紙盒。':'',
 t:`帳篷裡擺著兩張行軍床和一排鋁製的藥品箱，箱子上印著 A.C.R.U. 的徽章：紅底的生物危害標誌，正中央插著一把雙刃劍。角落的衣架上掛著幾套折好的黑色制服。`,
 c:[
  {l:'翻藥品箱',once:1,stay:1,t:'m',ok:{t:`軍用的東西，包裝都比醫院的厚。`,r:{items:{surgkit:1,antibiotic:1,sedative:1,sbandage:2}}}},
  {l:'拿幾包軍糧',once:1,stay:1,ok:{t:`行軍床底下有一整箱鋁箔袋裝的軍糧。`,r:{items:{mre:3}}}},
  {l:'拿走衣架上的制服',once:1,stay:1,ok:{t:`黑色的戰術服，右上臂縫著一圈紅底的徽章。穿上這個，再戴上防毒面具，遠遠看起來就跟他們一樣。`,r:{items:{acruuni:4}}}},
  {l:'回隔離區',ok:{t:`你們走出帳篷。`,go:'CA1'}}]},
CA4:{L:'CA',n:'營地・通訊帳篷',
 t:`折疊桌上擺著一台軍用無線電和一本攤開的值勤日誌，旁邊還有一壺冷掉的咖啡。無線電的喇叭一直在沙沙地響。`,
 c:[
  {l:'讀值勤日誌',hide:'opsnote',stay:1,k:'INT',d:12,s:'智力檢定',ok:{get t(){return G.flags.acru?`日誌裡寫的都是代號和數字，一行一行，沒有任何原因：\n\n「D+5　0540　藥局三處　回收　冷藏檢體 14」\n「D+7　0610　北區集合點　接收 212　陰性 31　陽性 168　知情 13」\n「D+7　1100　處置 168」\n「知情 13　轉送　牧杖」`:`日誌裡寫的都是代號和數字，一行一行，沒有任何原因：\n\n「D+4　2300　聖瑪莉醫院四樓　回收　病歷　全數」\n「D+5　0540　藥局三處　回收　冷藏檢體 14」\n「D+5　——　北區集合點　準備中」`},r:{flag:'opsnote'},p:{fear:10}},ng:{t:`代號太多了，你看不懂。`}},
  {l:'聽無線電',hide:'baseknown',stay:1,k:'PER',d:13,s:'感知檢定',t:'m',ok:{t:`雜訊裡夾著一段很短的對話：「前進營地呼叫牧杖，今晚的轉送車隊十八點出發，走北郊公路。」另一頭回答：「牧杖收到。後備中心的門會開著。」\n\n北郊公路上只有一個後備中心：陸軍後備中心。`,r:{flag:'baseknown'}},ng:{t:`只有雜訊。`}},
  {l:'回隔離區',ok:{t:`你們走出帳篷。`,go:'CA1'}}]},
CA5:{L:'CA',n:'營地・指揮帳篷',
 onEnter(){const F=G.flags;F.capin=F.acru&&!F.capdown&&!F.warn?1:0;F.capout=F.capin?0:1},
 tx:()=>G.flags.capin?'長桌旁邊站著一個戴紅色貝雷帽的人，正在地圖上畫線。門口的兩個隊員轉過頭來，紅色的鏡片對著你們。':G.flags.capdown?'帳篷裡只剩倒在地上的人，和那張畫滿線的地圖。':G.flags.warn?'長桌上的地圖被捲走了，只剩幾張忘了收的紙。':'帳篷裡沒有人。長桌上的檯燈還亮著。',
 t:`指揮帳篷比其他的大，門口拉著兩道防水布。裡面有一張鋪滿地圖的長桌、一張行軍床，床尾整整齊齊地放著一件長皮大衣。`,
 c:[
  {l:'動手',need:'capin',ok:{t:`你們搶在他們開口之前動手。`,fight:{n:3,names:['滅菌隊長','A.C.R.U. 隊員','A.C.R.U. 隊員']},win:{t:`隊長的胸前口袋裡有一張黑色的門禁卡。長桌上的地圖用紅筆圈著北郊公路的盡頭，旁邊寫著兩個字：「牧杖」。`,r:{flag:['capdown','acrucard','baseknown']}},go:'CA5'}},
  {l:'退出去',need:'capin',ok:{t:`你們退出帳篷。背後沒有腳步聲，只有對講機響了一下。`,p:{alarm:2},go:'CA1'}},
  {l:'翻長桌上的東西',need:'capout',hide:'acrucard',stay:1,k:'AGI',d:13,s:'敏捷檢定：動作要快，外面有人巡邏',ok:{t:`地圖用紅筆圈著北郊公路的盡頭，旁邊寫著兩個字：「牧杖」。行軍床的枕頭底下壓著一張黑色的門禁卡，背面印著一個編號。`,r:{flag:['acrucard','baseknown']}},ng:{t:`防水布被掀開了。「你們在這裡做什麼？」`,fight:{n:2,names:['A.C.R.U. 隊員','A.C.R.U. 隊員']}}},
  {l:'回隔離區',ok:{t:`你們走出帳篷。`,go:'CA1'}}]},
/* ---------- 基地 ---------- */
BA0:{L:'BA',n:'陸軍後備中心・大門',
 onEnter(){G.flags.disg=acruDisg()},
 tx:()=>(G.flags.warn?'直升機一架接一架從基地裡飛起來，往北邊去。閘門開著，卡車擠成一團，沒有人在查。':G.flags.acru?'補給卡車在閘門前排成一列，每一台都要刷卡、掀開車斗檢查。':'門口很安靜。偶爾有一台黑色廂型車開進去，閘門升起、放下。')+(G.flags.towerdown?'哨塔的窗口裡沒有人了。':''),
 t:`北郊公路的盡頭，一整片低矮的水泥建築，外面圍著兩層鐵絲網。門口的崗哨有一道升降閘門和讀卡機，旁邊是一座水泥哨塔，塔頂的窗口黑漆漆的。\n\n旗桿上掛著一面紅底的旗子：生物危害標誌，正中央插著一把雙刃劍。`,
 c:[
  {l:'刷隊長的門禁卡',need:'acrucard',hide:'warn',t:'q',ok:{t:`讀卡機亮起綠燈，閘門升了起來。崗哨裡的人低頭看著螢幕，沒有抬頭。`,go:'BA1'}},
  {l:'穿著制服，跟在補給車後面走進去',need:'disg',hide:'warn',k:'AGI',d:12,s:'敏捷檢定：跟緊一點',ok:{t:`你們貼著卡車的車尾走，閘門升起來的時候，跟著車一起過去。`,go:'BA1'},ng:{t:`閘門落得比你想的快。你們被攔在外面，崗哨裡的人站了起來。`,r:{flag:'bloud'},get fight(){return gateFt()},go:'BA1a'}},
  {l:'躲進補給車的車斗',need:'acru',hide:'warn',k:'AGI',d:14,s:'敏捷檢定：卡車在門口會被掀開檢查',ok:{t:`你們縮在幾個大木箱後面。帆布被掀開，手電筒的光從箱子上掃過去，帆布又放下了。`,go:'BA1'},ng:{t:`手電筒停在你的臉上。`,r:{flag:'bloud'},get fight(){return gateFt()},go:'BA1a'}},
  {l:'用步槍打掉哨塔上的人',hide:'towerdown',req:['g:r700','g:model70','g:fal'],reqAny:1,stay:1,k:'PER',d:14,s:'需要步槍；感知檢定',ok:{t:`你趴在公路對面的土堤上，等了很久。塔頂的窗口裡有一點紅光閃了一下。你扣下扳機，那點紅光就再也沒有亮過。`,r:{flag:'towerdown'},p:{alarm:2}},ng:{t:`子彈打在窗框上。下一秒，一發子彈從塔頂回敬過來，打碎了你旁邊的石頭，碎片劃開你的臉。`,p:{hp:-5,fear:10,alarm:2}}},
  {l:'摸上哨塔',hide:'towerdown',k:'AGI',d:14,s:'敏捷檢定',ok:{t:`你們繞到哨塔背後，順著水管爬上去。塔頂的人趴在步槍後面，一直盯著公路，到最後都沒有回頭。`,r:{flag:'towerdown'},stay:1},ng:{t:`爬到一半，水管的固定環斷了，整條水管撞在牆上。`,r:{flag:'bloud'},get fight(){return gateFt()},go:'BA1a'}},
  {l:'正面強攻',hide:'warn',s:'閘門、崗哨，還有那座哨塔',ok:{t:`你們從路邊的排水溝裡衝出去。`,r:{flag:'bloud'},get fight(){return Object.assign({mode:'first'},gateFt())},go:'BA1a'}},
  {l:'趁亂走進去',need:'warn',ok:{t:`你們混在擠成一團的卡車中間走進閘門，沒有人看你們一眼。`,go:'BA1'}},
  {l:'回街區',t:'l',ok:{t:`你們沿著北郊公路往回走。`,go:'Z0'}}]},
BA1a:{L:'BA',n:'基地・警報',
 t:`警報響了。營舍那邊的門被撞開，又有人衝出來，其中一個背著燃料罐。`,
 c:[
  {l:'找掩體，迎戰',ok:{t:`你們躲到崗哨的水泥牆後面。`,fight:{n:2,names:['A.C.R.U. 隊員','背燃料罐的 A.C.R.U.']},win:{t:`警報還在響，但車道上沒有人再跑出來了。`,r:{flag:'bclear'}},go:'BA1'}},
  {l:'退回公路上',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你們翻過路邊的護欄，滾進排水溝，一路爬到他們看不到的地方。`,go:'Z0'},ng:{t:`他們追出來了。`,fight:{n:2,names:['A.C.R.U. 隊員','背燃料罐的 A.C.R.U.']},win:{r:{flag:'bclear'}},go:'BA1'}}]},
BA1:{L:'BA',n:'基地・車道',
 onEnter(){const F=G.flags;F.bopen=F.acrucard||F.bclear||F.warn?1:0},
 tx:()=>G.flags.warn?'人都在往停機坪跑，沒有人管你們。':G.flags.bloud&&!G.flags.bclear?'警報還在響，遠處有腳步聲在找你們。':G.flags.acru?'停機坪那邊傳來旋翼的聲音。':'',
 t:`基地裡面比外面看起來大。一條水泥車道串起好幾棟建築：營舍、一棟掛著「軍械」牌子的倉庫、一棟屋頂插滿天線的指揮大樓，還有後面的一片停機坪。車道上每隔一段就有一支監視器。`,
 c:[
  {l:'進軍械庫',need:'bopen',ok:{t:`軍械庫的門開了。`,go:'BA2'}},
  {l:'用破拆工具撐開軍械庫的門',hide:'bopen',req:'spreader',t:'q',s:'會很吵',ok:{t:`鐵門被撐開了。金屬撕開的聲音在車道上迴盪，營舍那邊有人在喊。`,fight:{n:2,names:['A.C.R.U. 隊員','A.C.R.U. 隊員']},go:'BA2'}},
  {l:'進指揮大樓',need:'bopen',ok:{t:`你們推開指揮大樓的玻璃門，走上二樓。`,go:'BA3'}},
  {l:'破解指揮大樓的門禁',hide:'bopen',k:'INT',d:14,s:'智力檢定',ok:{t:`你撬開讀卡機的外殼，把兩條線接在一起。門鎖喀的一聲彈開了。`,go:'BA3'},ng:{t:`讀卡機發出一長串嗶聲。走廊盡頭的門開了。`,fight:{n:2,names:['A.C.R.U. 隊員','A.C.R.U. 隊員']},go:'BA1'}},
  {l:'去營舍後面的拘留區',ok:{t:`你們繞到營舍後面。`,go:'BA4'}},
  {l:'去停機坪',ok:{t:`你們貼著倉庫的牆往後面走。`,go:'BA5'}},
  {l:'離開基地',t:'l',ok:{t:`你們從進來的路出去，沿著北郊公路往回走。`,go:'Z0'}}]},
BA2:{L:'BA',n:'基地・軍械庫',

  {l:'回大門',ok:{t:`你們順著原路回到大門。`,go:'PP0'}}]},
PP2:{L:'PP',n:'南岸電廠・主控室',
 onEnter(){const F=G.flags;F.ppguard=F.acru&&!F.citypower&&!F.ppa2?1:0;F.ppnog=F.ppguard?0:1;F.ppeng=!F.acru&&!F.ppgrant?1:0;F.ppengno=F.ppeng?0:1;F.ppgo=F.ppgen&&!F.ppaux&&!F.ppguard?1:0;F.ppgg=F.ppgo&&F.ppgrant&&!F.acru?1:0;F.ppgb=F.ppgo&&!F.ppgg&&F.ppbook?1:0;F.ppgn=F.ppgo&&!F.ppgg&&!F.ppbook?1:0},
 tx:()=>G.flags.ppguard?'主控室裡有三個穿黑色制服的人，正在把電腦主機一台一台拆下來裝箱。其中一個戴著紅色的貝雷帽。':G.flags.acru?'主控室的地上有一灘乾掉的血，椅背上掛著一件工程師的外套。人不在了。':G.flags.ppgrant?'葛蘭特坐在控制台前，一直盯著那些不會亮的儀表。':'控制台底下傳來很輕的呼吸聲。有人躲在那裡。',
 t:`主控室整面牆都是儀表板和燈號，現在全是黑的。只有緊急照明在天花板上亮著一圈慘白的光。牆上的書架擺著一排厚厚的資料夾。`,
 c:[
  {l:'動手',need:'ppguard',s:'三個人，其中一個是隊長',ok:{t:`你們趁他們彎腰裝箱的時候衝了進去。`,fight:{n:3,mode:'first',names:['滅菌隊長','A.C.R.U. 隊員','A.C.R.U. 隊員']},win:{r:{flag:'ppa2'},t:'主控室安靜下來了。那幾箱拆下來的主機，你們沒有時間去管。'},stay:1}},
  {l:'跟躲在控制台底下的人說話',need:'ppeng',k:'CHA',d:11,s:'魅力檢定',ok:{t:`「我們不是來搶東西的。」過了很久，一個穿工程師外套的中年男人慢慢爬出來，眼鏡缺了一角。\n\n「葛蘭特，值班工程師。」他說，「停電那天，整座電網垮了，保護電驛跳脫，全廠停機。我一個人沒辦法重新開機，要有人去把柴油發電機發動，還要有人守著。」他看著你們手上的武器，「你們……看起來守得住。」`,r:{flag:'ppgrant'},go:'PP2'},ng:{t:`「走開！」控制台底下的人拿一根扳手對著你們，「我看過外面那些人，我不會開門的！」`,stay:1}},
  {l:'把水從控制台底下推過去',hide:'ppengno',req:'water',s:'需要礦泉水',ok:{t:`你把一瓶水放在地上，輕輕推過去。一隻手伸出來把它拿走了。過了一會兒，一個穿工程師外套的中年男人爬了出來，一口氣喝掉半瓶。\n\n「葛蘭特，值班工程師。」他說，「你們想讓電廠重新轉起來？那要先把柴油發電機發動。我一個人做不到。」`,r:{use:'water',flag:'ppgrant',karma:1},go:'PP2'}},
  {l:'拿書架上的操作程序書',need:'ppnog',hide:'ppbook',t:'m',ok:{t:`你翻了好幾本，終於找到一本封面寫著「黑啟動操作程序」的資料夾。裡面一步一步寫著：柴油發電機啟動、廠用電恢復、給水泵、送風機、點火、升溫升壓、併聯。每一頁的邊緣都是手寫的筆記。`,r:{flag:'ppbook'},go:'PP2'}},
  {l:'讓葛蘭特照程序送廠用電',need:'ppgg',hide:'ppaux',ok:{t:`葛蘭特一個一個扳動開關，嘴裡唸著程序書上的步驟。天花板的燈管閃了兩下，亮了。控制台上的燈號一排一排亮起來，有紅的，有綠的。\n\n「給水泵、送風機都有電了。」他轉過頭來，臉色很難看，「接下來要點火。升溫升壓要好幾個小時，燈一亮、機器一響，方圓幾條街的東西都會往這裡來。你們要守得住才行。」\n\n他看著你們：「點火之前，先去把該補的補好。」`,r:{flag:'ppaux'},stay:1}},
  {l:'照著程序書送廠用電',need:'ppgb',hide:'ppaux',k:'INT',d:12,s:'智力檢定',ok:{t:`你照著程序書一頁一頁做。最後一個開關扳下去的時候，天花板的燈管閃了兩下，亮了。控制台上的燈號一排一排亮起來。\n\n程序書的下一頁，有人用紅筆寫著：「點火後升溫升壓約 4～6 小時。期間廠區照明全開，注意安全。」旁邊又補了一行很潦草的字：「守不住就不要點。」`,r:{flag:'ppaux'},stay:1},ng:{t:`你扳錯了一個開關。控制台後面爆出一串火花，整排燈號又熄了。`,p:{hp:-2,fear:4,alarm:2},stay:1}},
  {l:'憑感覺試著送廠用電',need:'ppgn',hide:'ppaux',k:'INT',d:16,s:'智力檢定：沒有程序書，很難',ok:{t:`你看著控制台上的標示，一個一個推敲。最後一個開關扳下去的時候，天花板的燈管閃了兩下，亮了。\n\n你不知道接下來要等多久，只知道燈一亮，外面的東西就看得到了。`,r:{flag:'ppaux'},stay:1},ng:{t:`控制台後面爆出一串火花，你被電得整條手臂發麻。`,p:{hp:-3,fear:6,alarm:2},stay:1}},
  {l:'回汽機廠房',ok:{t:`你們爬下鐵梯。`,go:'PP1'}}]},
PP3:{L:'PP',n:'南岸電廠・柴油發電機房',
 onEnter(){const F=G.flags;F.pprdblk=F.raiders&&!F.acru&&!F.pprd?1:0;F.ppfuelok=!F.ppgen&&!F.pprdblk?1:0;F.ppfuelno=F.ppfuelok?0:1},
 tx:()=>G.flags.ppgen?'柴油發電機在轟轟地響，整個房間都在震。':G.flags.pprdblk?'輸油管一路接到外面的主油槽。窗外看得到，油槽旁邊停著三台油罐車，有人拿著槍在車頂上站崗。不先跟他們打交道，油是送不過來的。':'',
 t:`一台貨櫃那麼大的柴油發電機佔了整個房間，側面印著「黑啟動用　禁止移作他用」。旁邊的日用油槽是空的，油位計的指針貼在最底下。\n\n輸油泵的控制箱開著，裡面的保險絲燒得焦黑。`,
 c:[
  {l:'換上保險絲，接通輸油泵',req:'fuse',hide:'ppfuelno',k:'INT',d:12,s:'智力檢定',ok:{t:`你換上保險絲，按下輸油泵的啟動鈕。管子裡傳來咕嚕咕嚕的聲音，日用油槽的指針慢慢爬上來。\n\n你拉下發電機的啟動桿。機器咳了兩聲，然後轟地一聲轉了起來，整個房間都在震。這個聲音，整座廠區都聽得到。`,r:{use:'fuse',flag:'ppgen'},p:{alarm:3},get fight(){return ppFt(2)},stay:1},ng:{t:`保險絲裝上去的瞬間，控制箱裡噴出一串火花。你接錯了相位。`,p:{hp:-2,fear:4},stay:1}},
  {l:'用手搖泵一桶一桶打',need:'ppfuelok',k:'STR',d:12,t:'l',s:'力量檢定：要很久',ok:{t:`你們輪流搖那支手搖泵，一桶一桶把柴油從主油槽打過來，手臂酸得抬不起來。日用油槽終於滿了。\n\n你拉下發電機的啟動桿。機器咳了兩聲，然後轟地一聲轉了起來。這個聲音，整座廠區都聽得到。`,r:{flag:'ppgen'},p:{alarm:3},get fight(){return ppFt(2)},stay:1},ng:{t:`搖到一半，手搖泵的握柄斷了。你們得另外想辦法。`,p:{hp:-1},stay:1}},
  {l:'從日用油槽放一桶柴油',need:'ppgen',once:1,stay:1,t:'m',s:'淨水廠的備用發電機用得到',ok:{t:`你們找到一個空的鐵桶，從日用油槽的洩油閥放了滿滿一桶柴油。很重，要兩隻手提。`,r:{items:{diesel:1}}}},
  {l:'去油槽看看',need:'pprdblk',ok:{t:`你們從後門出去，往油槽走。`,go:'PP6'}},
  {l:'回汽機廠房',ok:{t:`你們回到汽機廠房。`,go:'PP1'}}]},
PP4:{L:'PP',n:'南岸電廠・鍋爐間',
 tx:()=>G.flags.ppbar?'廠房大門已經用堆高機和鐵板堵住了。':'',
 t:`鍋爐有十幾層樓高，裡面燒的是整座煤場的煤。控制台的燈號都亮了，就差點火。\n\n<b>點火之後要等好幾個小時</b>，燈一亮、機器一響，附近的東西都會往這裡來。這會是一場硬仗：點火之前，先把傷治好、把彈藥和吃的補好。`,
 c:[
  {l:'先把廠房大門堵起來',hide:'ppbar',k:'STR',d:12,t:'m',s:'力量檢定：用堆高機和鐵板',ok:{t:`你們把一台堆高機開到大門後面，又拖了幾塊鐵板卡在門縫裡。至少不會一次全部擠進來。`,r:{flag:'ppbar'},stay:1},ng:{t:`鐵板太重了，你們只堵住了一半。`,p:{hp:-1},stay:1}},
  {l:'點火，開始升溫升壓',hide:'ppboil',t:'l',s:'準備好再點：要很久，而且一定會有東西找上門',ok:{t:`你按下點火鈕。爐膛深處傳來一聲悶響，接著是火焰被吸進去的呼嘯聲。廠區的照明一盞一盞全亮了，整座電廠像一座燈塔一樣立在黑暗的河岸上。\n\n然後，外面開始有聲音了。`,r:{flag:'ppfire'},go:'PP4a'}},
  {l:'先回去整備',ok:{t:`你們離開鍋爐間。`,go:'PP1'}}]},
PP4a:{L:'PP',n:'南岸電廠・第一波',
 onEnter(){G.flags.ppw1=0;G.flags.ppw2=0},
 t:`第一批是從煤場那邊來的。牠們踩著煤堆衝下來，撞上廠房的鐵皮牆，一下、兩下，然後找到了門。`,
 tx:()=>G.flags.acru?'不對。來的不只是感染者。閘門那邊亮起一排手電筒，穿黑色制服的人也來了。':'',
 c:[{l:'守住',ok:{t:`你們退到鍋爐控制台前面，背靠著背。`,get fight(){return G.flags.acru?{n:2,mode:'normal',names:['A.C.R.U. 隊員','A.C.R.U. 隊員']}:{n:3,mode:'normal',names:['穿工作服的感染者','煤場來的感染者','煤場來的感染者']}},win:{r:{flag:'ppw1'}},go:'PP4b'}}]},
PP4b:{L:'PP',n:'南岸電廠・第二波',
 onEnter(){G.flags.ppfail=G.flags.ppw1?0:1},
 tx:()=>G.flags.ppfail?'你們躲進了旁邊的儲藏室，等到外面安靜下來才敢出來。鍋爐沒人看著，火已經熄了。':'',
 t:`壓力錶的指針爬到一半。廠房外面又是一陣騷動，這一次的腳步聲很重。`,
 c:[
  {l:'守住',hide:'ppfail',ok:{t:'大門那邊傳來一聲巨響，有東西正在把門撞開。',get fight(){return G.flags.acru?{n:3,mode:'normal',names:['A.C.R.U. 隊員','背燃料罐的 A.C.R.U.','A.C.R.U. 隊員']}:G.flags.ppbar?{n:1,mode:'normal',names:['穿防護衣的大個子']}:{n:3,mode:'ambush',names:['穿防護衣的大個子','煤場來的感染者','煤場來的感染者']}},win:{r:{flag:'ppw2'}},go:'PP4c'}},
  {l:'回去重新點火',need:'ppfail',ok:{t:`你們回到鍋爐控制台前。一切都要重來。`,go:'PP4'}}]},
PP4c:{L:'PP',n:'南岸電廠・升壓',
 onEnter(){const F=G.flags;if(F.ppw2)F.ppboil=1;F.ppfail=F.ppw2?0:1},
 tx:()=>G.flags.ppfail?'你們退開了。等你們回來的時候，鍋爐的火已經熄了。':'',
 t:`天窗外的天色變了好幾次。壓力錶的指針終於爬到了綠色的區域，汽輪機開始慢慢轉起來，越轉越快，最後變成一種很低的、穩定的嗡嗡聲。\n\n只差最後一步：去開關場，把電送出去。`,
 c:[
  {l:'去開關場',hide:'ppfail',ok:{t:`你們推開廠房側門。`,go:'PP5'}},
  {l:'回去重新點火',need:'ppfail',ok:{t:`一切都要重來。`,go:'PP4'}}]},
PP5:{L:'PP',n:'南岸電廠・開關場',
 tx:()=>G.flags.citypower?(G.flags.eastpower?'北區和東區的燈都亮著。':'北區的燈亮著。控制箱上還有一條東區的饋線，接的是淨水廠。'):G.flags.ppgrant&&!G.flags.acru?'葛蘭特在對講機裡說：「一台機組撐不起整座城市。一區一區送，先送北區。全部一起送，負載一下子太大，機組會跳脫，就要全部重來。」':'',
 t:`開關場是一大片碎石地，一排排高壓斷路器和隔離開關立在鐵架上，絕緣子像一串一串白色的念珠。控制箱上貼著饋線的名牌：北區（旅館、醫院、第 4 分局）、東區、河景、南岸工業區。\n\n空氣裡有一種很細的嗡嗡聲。有東西帶電了。`,
 c:[
  {l:'戴上絕緣手套，合上北區的斷路器',req:'gloves',hide:'citypower',ok:{t:`你戴上手套，握住操作桿，用力往下一推。鐵架上傳來一聲沉重的金屬撞擊聲。`,go:'PP5w'}},
  {l:'徒手合上北區的斷路器',hide:'citypower',s:'很危險',ok:{t:`你深吸一口氣，握住操作桿。`,qte:{t:'操作桿往下推到一半，旁邊的隔離開關「啪」地爆出一道電弧——',w:['放手','往後跳','趴下','滾開'],ok:{t:'你在電弧打過來之前鬆手往後一跳。操作桿自己落了下去，卡進了定位。'},ng:{t:'電弧擦過你的手臂。你整個人被彈出去，摔在碎石地上，手臂一片焦黑。',p:{hp:-5,fear:10}}},go:'PP5w'}},
  {l:'合上東區（淨水廠）的斷路器',need:'citypower',hide:'eastpower',k:'INT',d:13,s:'智力檢定：機組已經帶著北區，再加一區',ok:{t:`你盯著控制箱上的負載表，等指針穩下來，才把東區的操作桿推下去。汽輪機的聲音沉了一下，又慢慢回到原來的音調。\n\n河的東岸，淨水廠那一片也亮了。`,r:{flag:'eastpower'},stay:1},ng:{t:`你推得太快了。負載表的指針一下子打到底。`,go:'PP5t'}},
  {l:'全部一起送',hide:'citypower',k:'INT',d:13,s:'智力檢定',ok:{t:`你的手停在總開關上。一台機組，四條饋線，整座城市的冷氣、冰箱、路燈、醫院的機器全部一起接上來——你想起控制室那些燈號的上限，把手收了回來。\n\n一區一區送才對。`,stay:1},ng:{t:`你把四條饋線一起合上。一瞬間，整座城市的燈都亮了。`,go:'PP5t'}},
  {l:'回汽機廠房',ok:{t:`你們回到廠房。`,go:'PP1'}}]},
PP5t:{L:'PP',n:'南岸電廠・跳脫',
 onEnter(){const F=G.flags;F.ppboil=0;F.ppw1=0;F.ppw2=0;F.citypower=0;F.eastpower=0;F.streetpower=F.powerfix?1:0},
 t:`然後全部熄了。\n\n廠房裡的嗡嗡聲變成一聲很長的、往下掉的哀鳴，汽輪機慢慢停了下來。控制箱上的燈號一個接一個變紅：「負載過大　機組跳脫」。\n\n鍋爐的火也熄了。一切都要重來。`,
 c:[{l:'回廠房',ok:{t:`你們拖著腳步回到廠房。`,go:'PP1'}}]},
PP5w:{L:'PP',n:'南岸電廠・送電',
 onEnter(){G.flags.citypower=1;G.flags.streetpower=1;G.flags.wpknown=1},
 t:`一開始什麼都沒有發生。\n\n然後，河的對岸，一條街的路燈亮了起來。接著是另一條，再另一條，一路往北延伸。醫院的窗戶一層一層亮起來，警察局門口的燈亮了，旅館的招牌閃了兩下，也亮了。\n\n整座城市的北半邊，在黑暗裡亮了起來。\n\n<b>北區恢復市電</b>：醫院、警察局、購物中心、旅館都有電了。代價是，夜裡整片街區都照得清清楚楚，城市裡所有的東西都看得到——包括那些不想讓電回來的人。`,
 c:[{l:'回廠房',ok:{t:`汽輪機在你們身後穩穩地轉著。`,go:'PP1'}},{l:'回街區',t:'l',ok:{t:`你們沿著河岸往北走，路燈一盞一盞從頭頂掠過。`,go:'Z0'}}]},
PP6:{L:'PP',n:'南岸電廠・油槽',
 tx:()=>G.flags.pprd?'油罐車已經開走了，地上只剩幾灘油漬。':'',
 t:`帶頭的是一個四十多歲的女人，頭髮剪得很短，手上握著一把霰彈槍，槍口朝下。她身後的油罐車車身漆著一家貨運公司的名字，車窗裡有小孩在看。\n\n「我叫瑪拉，」她說，「以前開這種車的。」她朝油槽抬了抬下巴，「北口的撤離車不載我們這種外地來的，我們二十幾個人，有一半是小孩。南橋還沒封死，只要有油，我們就衝得出去。」\n\n「所以，」她說，「你們是來跟我們搶油的嗎？」`,
 c:[
  {l:'跟她談，油分一半',hide:'pprd',k:'CHA',d:13,s:'魅力檢定：發電機用不了多少',ok:{t:`你跟她說，你們只要把發電機旁邊那個小油槽灌滿，剩下的都是她的。電廠的電如果送得出去，對留在城裡的人都有好處。\n\n瑪拉看了你很久，然後點點頭：「一半。我讓人幫你們接管子。」她轉身之前又說了一句：「南橋那邊，最近有穿黑衣服的人在架東西。你們如果也想走那條路，動作要快。」`,r:{flag:'pprd'},go:'PP3'},ng:{t:`「說得真好聽。」瑪拉身後的人把槍舉了起來，「油我們全要。你們要的話，拿東西來換。」`,stay:1}},

  {l:'跟杜克談恢復供水',need:'wpdealok',k:'CHA',d:15,s:'魅力檢定：水送出去，他就沒生意做了',ok:{t:`你跟他說：再過幾天，城裡的人渴死了，他的水也賣不出去；撤離車走了，外面的路被封了，他和他的人也一樣出不去。水送出去，至少大家都活得久一點。\n\n杜克盯著清水池看了很久。「清水池那一池歸我們，」他終於說，「其他的，你們愛怎麼送就怎麼送。」他割開了艾琳手上的膠帶。`,r:{flag:'wpdeal',karma:1},go:'WP4'},ng:{t:`「你送你的水，我賣我的水？」杜克笑了一聲，把霰彈槍上了膛，「你敢碰那些水泵，我就讓你們泡在池子裡。」`,stay:1}},
  {l:'把柴油倒進備用發電機',req:'diesel',hide:'wppow',t:'m',s:'需要一桶柴油',ok:{t:`你們把柴油倒進管理大樓後面那台備用發電機，拉了三次啟動繩。機器轟地一聲轉了起來，控制台的燈一排一排亮了。`,r:{use:'diesel',flag:'wpgen'},p:{alarm:2},go:'WP4'}},
  {l:'讓艾琳啟動送水泵',need:'wpgoE',s:'加氯室沒處理的話，送出去的是沒消毒的河水',ok:{t:`艾琳的手指在控制台上飛快地按了一串鍵，抬頭看著流程圖上的燈一格一格變綠。「泵一轉起來，整個東岸都聽得到。」她說，「我開了。你們下去守著。」`,go:'WP5'}},
  {l:'照程序啟動送水泵',need:'wpgoS',k:'INT',d:13,s:'智力檢定；加氯室沒處理的話，送出去的是沒消毒的河水',ok:{t:`你照著牆上的流程圖，一個一個開閥門、按啟動鈕。樓下傳來一聲很重的金屬撞擊聲，送水泵開始轉了。`,go:'WP5'},ng:{t:`你按錯了順序，送水泵空轉了幾秒，自己跳停了。`,p:{alarm:2},stay:1}},

/* ================= v0.19.0 地下研究所（上）：S1 除汙閘門、S2 研究層、S3 收容層 =================
   主人 2026-11-14 的決定（細節見 PROPOSAL_LAB.md、HANDOFF.md）：入口在旅館地下那扇門；四個條件（S 區門禁卡 labcard、市電 citypower、市水 citywater、知道入口 knowlab）。
   真相五塊：醫院病歷 arcfile、營地／基地紀錄 opsnote 或 opslog、研究所名冊 trRoster、第二期報告 trReport、零號病例的病歷 trZ0（v0.20.0）。拿到四塊才算了解真相。
   零號病例＝雷摩斯・凱德中士，了白在部隊時的中士；了白叫他「中士」。核心（S4）與列車月台（S5）、boss、結局在 v0.20.0。 */
const truthN=()=>{const F=G.flags;return (F.arcfile?1:0)+(F.opsnote||F.opslog?1:0)+(F.trRoster?1:0)+(F.trReport?1:0)+(F.trZ0?1:0)};

 SA:{n:'地下研究所',sub:'S1・除汙閘門',en:'S-WING · LEVEL 1',rule:'白色的牆、白色的燈，乾淨得不像這座城市的一部分。',fx:{},ch:1,indoor:1,fire:'lab'},
 SB:{n:'地下研究所',sub:'S2・研究層',en:'S-WING · LEVEL 2',rule:'每一扇門上都有編號，每一份文件上都蓋著「保密」。',fx:{},ch:1,indoor:1,fire:'lab'},
 SC:{n:'地下研究所',sub:'S3・收容層',en:'S-WING · LEVEL 3',rule:'牆後面有東西在呼吸。',fx:{},ch:1,indoor:1,fire:'lab'}
});
Object.assign(LV_POOL,{SA:['infected'],SB:['infected','incubator'],SC:['infected','incubator','devourer']});
// 旅館大廳：知道入口之後可以下到地下室那扇門
{const y=N.Y0;const o=y.onEnter;y.onEnter=function(){if(o)o.call(this);const F=G.flags;F.knowlab=F.opslog||F.labhint?1:0};

Object.assign(N,{
Y2:{L:'Y',n:'旅館・地下室鐵門',
 onEnter(){const F=G.flags;F.labguard=F.acru&&!F.ylabclr?1:0;F.labopen=F.labcard&&F.citypower&&F.citywater&&!F.labguard?1:0},
 tx:()=>{const F=G.flags;if(F.labguard)return '兩個穿黑色制服的人守在鐵門前，槍口朝下，一直沒有離開。';
  if(!F.citypower)return '讀卡機的小螢幕一閃一閃：「維生系統供電不足　請洽設施管理」。地下室發電機的電，撐不起門後面的東西。';
  if(!F.citywater)return '讀卡機的小螢幕亮著：「維生系統供水壓力不足　閘門鎖定」。';
  if(!F.labcard)return '讀卡機的小螢幕亮著：「S 區　請感應授權卡」。';
  return '讀卡機的小螢幕亮著綠色的字：「S 區　維生系統正常　請感應授權卡」。'},
 t:`地下設備層的盡頭，那扇厚重的鐵門還在。門框上的標記沒有被刮掉：一根杖，杖上纏著一條蛇，杖頭被畫成了針頭的形狀。\n\n強化玻璃窗後面，是一道往下的白色樓梯。`,
 c:[
  {l:'對付守在門口的人',need:'labguard',s:'兩名隊員',ok:{t:`你們從管線後面衝出去。`,fight:{n:2,mode:'first',names:['A.C.R.U. 隊員','A.C.R.U. 隊員']},win:{r:{flag:'ylabclr'}},go:'Y2'}},
  {l:'感應 S 區門禁卡',need:'labopen',t:'q',s:'基地保險櫃裡的那張卡',ok:{t:`讀卡機「嗶」了一聲。鐵門裡傳來一連串沉重的機械聲，像是好幾道鎖同時退開。門往內滑開，一股冰冷、乾淨、帶著消毒水味道的空氣湧了出來。\n\n樓梯底下，一盞一盞白色的燈依序亮起來。\n\n你突然想到：這些燈、這些空氣、門後面維生系統裡的每一滴水，都是你們親手讓它重新運轉的。`,go:'SA0'}},
  {l:'回大廳',ok:{t:`你們順著員工樓梯往上爬。`,go:'Y0'}}]},
/* ---------- S1 除汙閘門 ---------- */
SA0:{L:'SA',n:'S1・除汙閘門',
 t:`樓梯底下是一道氣閘。兩扇玻璃門之間的小空間裡，天花板和牆上全是噴頭。牆上的螢幕亮著：「進入 S 區前，請完成除汙程序」。\n\n喇叭裡傳來一個很平靜的女聲，像是錄音：「第二期受試者，請在房內等候。第二期受試者，請在房內等候。」`,
 c:[
  {l:'照指示除汙',t:'m',s:'噴頭有水了',ok:{t:`你們站進氣閘。噴頭先是噴出霧狀的藥水，接著是熱水，最後是一陣很強的風。皮膚刺刺的，喉嚨裡一直黏著的那股甜味，好像淡了一點。`,go:'SA0d'}},
  {l:'不除汙，直接推開另一扇門',s:'警報會響',ok:{t:`你們用力推開內側的玻璃門。整條走廊的燈變成紅色，警報響了三聲，又停了。`,p:{alarm:3},go:'SA1'}},
  {l:'回旅館地下室',ok:{t:`你們爬上白色的樓梯。`,go:'Y2'}}]},
SA0d:{L:'SA',n:'S1・除汙閘門',
 onEnter(){for(const p of able()){const b=p.inf;addInf(p,-10);if(p.inf<b)out(`${MP()?nm(p)+'：':''}感染 −${b-p.inf}。`,'good',true)}},
 t:`內側的玻璃門滑開了。`,
 c:[{l:'走進去',ok:{t:`你們踩著白色的地板往前走。`,go:'SA1'}}]},
SA1:{L:'SA',n:'S1・警衛室',
 tx:()=>G.flags.trRoster?'':'警衛室的監視螢幕還亮著，一格一格切換著下面幾層的畫面。收容層的某一格裡，有東西一直在撞玻璃。',
 t:`走廊旁邊是一間玻璃隔間的警衛室。桌上攤著一本登記簿，牆上貼著排班表，一張椅子倒在地上，椅背上掛著一件保全的外套。\n\n走廊的另一頭是貨梯，按鈕旁邊寫著「S2　研究層」「S3　收容層」「S4　核心（需二級授權）」。`,
 c:[
  {l:'看受試者名冊',hide:'trRoster',t:'m',s:'登記簿',ok:{t:`登記簿的第一頁寫著「第二期　持續共生計畫　受試者名冊」。\n\nB-117、B-118、B-121……每一個編號旁邊都有一個名字、一個「安置地點」，和一個「回診接送時間」。安置地點全是同一個地址：那間旅館，303、305、306。接送時間全是 23:41。\n\n名冊的最後一頁只有一行，用紅筆框起來：\n\n「Z-0　雷摩斯・凱德中士　陸軍　第二期首例　狀態：核心收容　（禁止接觸）」\n\n<b>你又拼上了一塊真相。</b>`,r:{flag:'trRoster'},p:{fear:6},stay:1}},
  {l:'看名冊最後一頁',job:'liao',need:'trRoster',once:1,stay:1,ok:{t:`雷摩斯・凱德中士。\n\n你在部隊裡叫了他三年的「中士」。那次在海外，直升機把他抬走的時候，他的一條手臂已經不見了，臉上全是燒傷。後來部隊說他轉到國內的醫院，再後來，所有紀錄上都沒有這個人了。\n\n你一個人查了這麼久，最後查到的是這一行紅字。\n\n「核心收容。」`,p:{fear:10}}},
  {l:'看接送排班表',job:'maggie',once:1,stay:1,ok:{t:`排班表上，每一班 23:41 的接送都登記成「回診」，旁邊附著一張受試者簽過名的同意書影本。\n\n你看得出問題在哪裡。同意書上寫的是「定期回診追蹤」，可是排班表上的目的地欄寫的是「S3」。那不是回診，那是收容。\n\n這不是醫療疏失。這是有人明知道，還一路簽了下去。你把排班表摺好，收進外套內側。`,r:{flag:'mgDoc'}}},
  {l:'翻警衛的置物櫃',once:1,stay:1,t:'m',ok:{t:`置物櫃裡有一盒子彈、一包急救敷料包，還有一張全家福，背面寫著「下班記得買牛奶」。`,r:{items:{ammo9:8,med:1,sbandage:1}}}},
  {l:'搭貨梯下研究層',ok:{t:`貨梯的門關上，往下降了很久。`,go:'SB0'}},
  {l:'回除汙閘門',ok:{t:`你們往回走。`,go:'SA0'}}]},

  {l:'從另一側的實驗室穿過去',hide:'sbok',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你們從一間沒鎖的實驗室穿過去，再從另一扇門出來，已經在他們身後了。`,r:{flag:['sbclr','sbok']},stay:1},ng:{t:`你的手肘碰倒了一個玻璃瓶。兩個白袍同時轉過頭來。`,fight:{n:2,mode:'ambush',names:['穿白袍的感染者','穿白袍的感染者']},win:{r:{flag:'sbclr'}},go:'SB0'}},
  {l:'進實驗室',need:'sbok',ok:{t:`你們推開實驗室的玻璃門。`,go:'SB1'}},
  {l:'進主任辦公室',need:'sbok',ok:{t:`主任辦公室在走廊盡頭，門上的名牌被人撬走了。`,go:'SB2'}},

  {l:'搭貨梯回 S1',ok:{t:`貨梯慢慢往上升。`,go:'SA1'}}]},
SB1:{L:'SB',n:'S2・實驗室',
 t:`實驗室中間有一個玻璃罩，罩子裡是一株植物：灰綠色的葉子，莖上長著一圈一圈的節，切口的地方像是在癒合。牌子上寫著「原始宿主　EDEN 共生株」。\n\n牆邊排著一列培養槽，大部分是空的。最後一個裡面泡著一團東西，形狀像人的手臂，表面長滿細細的纖維。`,
 c:[
  {l:'看那些培養槽',once:1,stay:1,k:'PER',d:12,s:'感知檢定',ok:{t:`最後一個培養槽的標籤寫著「Z-0　左上肢　組織再生觀察　第 214 日」。手臂的手指還在慢慢地一張一合。\n\n培養槽底下的冷藏櫃裡有幾盒藥，標籤是英文縮寫，其中兩盒你認得：抗生素。`,r:{items:{antibiotic:2,sedative:1}},p:{fear:8}},ng:{t:`你湊近玻璃的時候，培養槽裡的東西撞了上來。玻璃裂了。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['培養槽裡的東西']}}},
  {l:'看那株植物',once:1,stay:1,ok:{t:`你看了很久。它看起來就只是一株植物。安靜、普通，在恆溫的玻璃罩裡慢慢地長。\n\n整座城市的事，都是從這裡開始的。`,p:{fear:4}}},
  {l:'回走廊',ok:{t:`你們退回走廊。`,go:'SB0'}}]},
SB2:{L:'SB',n:'S2・主任辦公室',
 t:`主任辦公室很整齊，整齊到不像是出事的地方。書架上的資料夾一本本排好，桌上有一台還亮著的電腦，螢幕停在一個影像紀錄的播放視窗。牆上掛著一張照片：一排穿軍服的人，站在一架直升機前面。`,
 c:[
  {l:'讀第二期報告',hide:'trReport',t:'m',k:'INT',d:11,s:'智力檢定：很厚的一份',ok:{t:`報告的標題是「持續共生計畫　第二期總結（內部）」。\n\n第一期的療法是真的：重度燒傷、肌肉缺損、原本要截肢的人，都被救回來了。第二期想做的是讓 EDEN 留在人體裡，受傷的時候自己修。最大的問題是人體會把它清掉，所以他們一次一次修改它，讓免疫系統認不出它。\n\n他們成功了。Z-0 的傷，在三個月內幾乎全部長了回來。\n\n報告的最後一頁，有人用原子筆在空白處寫了一行字，筆跡很用力：\n\n「它不知道什麼時候該停。」\n\n<b>你又拼上了一塊真相。</b>`,r:{flag:'trReport'},p:{fear:8},stay:1},ng:{t:`滿頁的術語和圖表。你看了很久，只看懂一件事：每一頁的頁尾，都印著「國防合作計畫」。`,stay:1}},
  {l:'看電腦上的影像紀錄',once:1,stay:1,ok:{t:`影片裡是一個穿白袍的中年女人，坐在這張桌子前面，看起來很累。\n\n「第 214 日。Z-0 的組織重塑沒有停止的跡象。他昨天問我，什麼時候可以回家。」她停了很久，「我不知道該怎麼回答他。」\n\n影片跳到下一段。日期是封城前一週。她的眼睛紅紅的。\n\n「水平傳播已經確認。我們把他接上了全套維生，降溫、斷食、讓他睡著。只要電和水不停，他就會一直睡。」她看著鏡頭，「如果你看到這段影片，代表電和水停過了。」`,p:{fear:10}}},
  {l:'看牆上的照片',job:'liao',once:1,stay:1,ok:{t:`是你們的小隊。\n\n直升機前面站著九個人，你站在最左邊，那時候還很年輕。中間那個咧著嘴笑、手臂搭在別人肩上的，是中士。\n\n照片的右下角，有人用麥克筆寫了一個編號：Z-0。`,p:{fear:8}}},
  {l:'翻抽屜裡的文件',job:'maggie',once:1,stay:1,ok:{t:`抽屜裡是一疊公文，往來的單位是 ARC、國防部，還有一個你沒聽過的「生物安全應變單位」。\n\n你一份一份看下去。風險評估報告上寫得清清楚楚：「水平傳播可能性：不可排除」。簽核欄上，每一個名字都簽了。\n\n這些人全都知道。你把最上面那幾份抽出來，和那張排班表收在一起。`,r:{flag:'mgDoc2'}}},

/* ================= 遊戲狀態 =================
   G 是整局的狀態。單人與房主在本機運算 G；隊友只接收房主送來的 G 與演出事件。 */
let G=null,LOG=[],ROLE='solo';
const MP=()=>G&&G.mode==='mp';
const P=pid=>G.players.find(p=>p.pid===pid);
const me=()=>G&&P(MYPID);
const live=()=>G.players.filter(p=>!p.dead&&!p.away);
const able=()=>G.players.filter(p=>!p.dead&&!p.down&&!p.away);
// 能自己操作的人（發瘋的人不能投票、不能被選去做檢定）
const ctl=()=>able().filter(p=>!p.mad);
const nm=p=>MP()?`<span class="nm" style="color:${p.col}">${esc(p.name)}</span>`:'你';
const tr=(p,t)=>p.traits.includes(t);
const hasI=(p,k)=>k==='gun'?p.gear.some(g=>WEAP[g.id].kind==='gun'):k.startsWith('g:')?p.gear.some(g=>g.id===k.slice(2)&&!g.drop):(p.items[k]||0)>0;
const tHas=k=>able().some(p=>hasI(p,k));
const owner=(k,pref)=>pref&&hasI(pref,k)?pref:able().find(p=>hasI(p,k));
const STACK=5;
function cap(p){return 8+Math.max(0,p.st.STR)+(tr(p,'scav')?2:0)}
function used(p){let n=0;for(const [k,q] of Object.entries(p.items))if(q>0)n+=Math.ceil(q/STACK);for(const g of p.gear)if(p.hand.R!==g.u&&p.hand.L!==g.u&&!g.drop)n+=WEAP[g.id].hands===2?2:1;return n}
function roomFor(p,k){const q=p.items[k]||0;const free=cap(p)-used(p);return (q%STACK?STACK-q%STACK:0)+Math.max(0,free)*STACK}
// 放進背包；放不下的留在地上，回傳放不下的數量
function addI(p,k,q){q=q||1;const fit=Math.min(q,roomFor(p,k));if(fit>0)p.items[k]=(p.items[k]||0)+fit;const left=q-fit;if(left>0)toGround({k,q:left});return left}
function addIForce(p,k,q){p.items[k]=(p.items[k]||0)+(q||1)}
function takeI(p,k,q){p.items[k]=Math.max(0,(p.items[k]||0)-(q||1));if(!p.items[k])delete p.items[k]}
function toGround(x){if(G)G.ground.push(x)}
function newGear(id,mag){const w=WEAP[id];const g={u:++G.uid,id};if(w.dur)g.dur=w.dur;if(w.kind==='gun'){g.mag=mag||0;g.jam=0}if(w.cock)g.cocked=1;return g}
function addGear(p,id,mag){const g=newGear(id,mag);p.gear.push(g);autoEquip(p,g);if(used(p)>cap(p)){rmGear(p,g.u);toGround({g});return null}return g}
const gearOf=(p,u)=>p.gear.find(g=>g.u===u);
function handW(p,h){const g=p.hand[h]!=null?gearOf(p,p.hand[h]):null;if(!g||g.drop)return {g:null,w:WEAP.fist};const w=WEAP[g.id];
  // 可以單手拿的雙手武器：只佔一隻手時用單手的傷害骰、命中 −1
  if(w.hands===2&&w.one&&g.one&&p.hand.R!==p.hand.L)return {g,w:Object.assign({},w,{hands:1,dd:w.one,hit:(w.hit||0)-1,n:w.n+'（單手）',sk:w.sk.filter(s=>s!=='sweep')})};
  return {g,w}}
function rmGear(p,u){p.gear=p.gear.filter(g=>g.u!==u);if(p.hand.R===u)p.hand.R=null;if(p.hand.L===u)p.hand.L=null}
function equip(p,u,h,one){const g=gearOf(p,u);if(!g)return;const w=WEAP[g.id];
  if(p.hand.R===u)p.hand.R=null;if(p.hand.L===u)p.hand.L=null;
  g.one=w.hands===2&&w.one&&one?1:0;
  if(w.hands===2&&!g.one){p.hand.R=u;p.hand.L=u;return}
  const o=h==='R'?'L':'R';const other=p.hand[o]!=null?gearOf(p,p.hand[o]):null;
  if(other&&WEAP[other.id].hands===2&&!other.one)p.hand[o]=null;
  p.hand[h]=u}
function autoEquip(p,g){const w=WEAP[g.id];const r=p.hand.R!=null?gearOf(p,p.hand.R):null;
  if(w.hands===2){if(!r)equip(p,g.u,'R');return}
  if(!r)equip(p,g.u,'R');else if(p.hand.L==null&&(WEAP[r.id].hands===1||r.one))equip(p,g.u,'L')}
const flagOk=f=>{if(!f)return true;const m=f.match(/^(.*)x(\d+)$/);return m?(G.flags[m[1]]||0)>=+m[2]:!!G.flags[f]};
// 舊版理智上限，只用來換算舊存檔
const msan=p=>10+Math.max(0,p.st.INT)+(tr(p,'calm')?2:0)-(tr(p,'immune')?1:0)+((p.lv||1)-1);
// 角色技能：有沒有這個技能、這場／這區還能不能用
const hasSk=(p,k)=>!!p&&p.skill===k;
const skLeft=(p,k)=>{if(!hasSk(p,k))return false;const C=CSKILL[k];if(C.per==='fight')return !(p.skUsed&&p.skUsed['c:'+k]);if(C.per==='area')return p.skArea!==k+'@'+G.levels;return true};
function skUse(p,k){const C=CSKILL[k];if(C.per==='fight'){p.skUsed=p.skUsed||{};p.skUsed['c:'+k]=1}else if(C.per==='area')p.skArea=k+'@'+G.levels}
// 防具：頭、身體、手臂、腿四格（右手、左手是武器），減傷加總
const EQS=['head','body','arm','leg'];const SLOTN={head:'頭',body:'身體',arm:'手臂',leg:'腿'};
function armorOf(p){let a=0;for(const s of EQS){const e=p.eq&&p.eq[s];if(e&&ITEMS[e.k])a+=ITEMS[e.k].armor||0}return a}
// 能力值（含狀態）
function statMod(p,st){
  let m=p.st[st]||0;
  if(st==='AGI'){if(p.frac&&!p.pk)m-=3;if(G.lv==='C')m-=2}
  if(st==='PER'&&G.lv==='E'&&!hasI(p,'flashlight')&&!tr(p,'nightowl'))m-=2;
  const fx=G.lv&&LV[G.lv]&&LV[G.lv].fx||{};
  if(st==='PER'){if(fx.per)m+=fx.per;if(fx.dark&&!hasI(p,'flashlight')&&!tr(p,'nightowl'))m-=2}
  if(st==='AGI'&&fx.agi)m+=fx.agi;
  if(p.hun<=0||p.thi<=0)m-=2;
  // 停電：室內更暗（街區第 6 天 A.C.R.U. 接了臨時電之後恢復）
  if(st==='PER'&&G.flags&&G.flags.blackout&&LV[G.lv]&&LV[G.lv].indoor&&!(G.flags.citypower||(G.flags.streetpower&&(LV[G.lv].ch||1)===2))&&!hasI(p,'flashlight')&&!tr(p,'nightowl'))m-=1;
  // 恐懼：驚恐以上感知 −2，崩潰邊緣魅力 −2
  if(st==='PER'&&fstg(p)>=2)m-=2;
  if(st==='CHA'&&fstg(p)>=3)m-=2;
  return m}
// 檢定專用的額外加值
function checkBonus(p,st){let b=0;if(st==='AGI'&&tr(p,'athletic'))b++;if(st==='PER'&&tr(p,'keen'))b+=2;if(st==='CHA'&&tr(p,'talker'))b++;const fx=G.lv&&LV[G.lv]&&LV[G.lv].fx||{};if(st==='CHA'&&fx.cha)b+=fx.cha;return b}
const bestSt=(p,sts)=>sts.reduce((a,b)=>statMod(p,b)>statMod(p,a)?b:a);
const sgn=m=>(m>=0?'+ ':'− ')+Math.abs(m);
const pct=(p,st,dc,mod)=>{const need=dc-(statMod(p,st)+checkBonus(p,st)+(mod||0));return Math.round(clamp((21-need)/20*100,5,95))};
const hitPct=(tot,def)=>Math.round(clamp((21-(def-tot))/20*100,5,95));
/* ================= 建立角色 ================= */
function makePlayer(b,i){
  b=normalizeBuild(b);
  const p={pid:b.pid,name:String(b.name||'無名').slice(0,10),col:COLS[i%COLS.length],kind:'custom',bg:null,traits:[],st:{STR:0,AGI:0,CON:0,PER:0,INT:0,CHA:0},
    hp:0,max:0,fe:0,inf:0,hun:8,thi:8,nT:0,bleed:0,frac:0,pk:0,items:{},gear:[],hand:{R:null,L:null},eq:{head:null,body:null,arm:null,leg:null},usd:0,down:0,dead:0,lost:0,mad:0,bon:{},kills:0,defPen:0,combo:0,counter:0,brace:0,actUsed:0,aimed:0,lv:1,xp:0,pts:0,photoLv:null,jamGuard:0};
  G.players.push(p);
  const pr=PRESETS[b.kind]||GUESTS[b.kind],J=JOBS[b.kind];
  if(pr){p.kind=b.kind;p.name=pr.n;Object.assign(p.st,pr.st);

function handle(pid,a){

  if(a.a==='tell')return run(async()=>{tell(p,a.i)});
  if(G.phase==='shop'&&G.shop&&!p.down&&!p.mad){if(a.a==='buy')return run(async()=>{shopBuy(p,a.i)});if(a.a==='sell')return run(async()=>{shopSell(p,a.k)});if(a.a==='shopdone')return run(()=>shopReady(p))}
  if(G.fight&&['atk','tact','reload','unjam','cock','pickup','kick','counter','brace','molotov','ext','flee','use','revive','equip','guard','free','block','dodge','cover','dual','calm','subdue','csk','spot','pat'].includes(a.a))return run(()=>fightAct(pid,a));
  if(G.fight)return;
  if(p.down)return;
  if(a.a==='use')return run(async()=>{await useItem(p,a.k,a.to)});
  if(a.a==='repair')return run(async()=>{await repair(p,a.k,a.u)});
  if(a.a==='brew')return run(async()=>{brew(p)});
  if(a.a==='soothe')return run(async()=>{await soothe(p,P(a.to))});
  if(a.a==='revive')return run(async()=>{await revive(p,a.to,a.k)});
  if(a.a==='equip')return run(async()=>{if(doEquip(p,a))snd('equip',.8)});
  if(a.a==='unwear')return run(async()=>{unwear(p,a.s)});
  if(a.a==='giveusd')return run(async()=>{giveUsd(p,a.to,a.n)});
  if(a.a==='give')return run(async()=>{give(p,a.to,a.k,a.u)});
  if(a.a==='pick')return run(async()=>{pickGround(p,a.i)});
  if(a.a==='drop')return run(async()=>{if(a.u!=null){const g=gearOf(p,a.u);if(g){rmGear(p,a.u);toGround({g})}}else if(hasI(p,a.k)){takeI(p,a.k);toGround({k:a.k,q:1})}});
  if(a.a==='craft')return run(()=>craft(p,a.slots||[]));
}

/* ================= QTE：突然發生的事，沒反應過來就會受傷 =================
   畫面左右兩側會跳出有編號的格子，一次出現兩格（例如 1、2），照順序點完才出現下一組。
   全部格子要在固定的總時間內點完；點歪、順序點錯、總時間到了還沒點完，都算失敗。電腦用 WASD：A 左、D 右、W 上、S 下。
   房主決定誰要反應、要點幾格；反應時間在被點名那個人自己的裝置上計算，結果再送回房主，

const QTE_D={normal:{per:560,n:[3,4]},hard:{per:560,n:[3,4]},real:{per:480,n:[4,6]}};
function qtePer(p){const D=QTE_D[G.opts.diff]||QTE_D.hard;let ms=D.per+statMod(p,'AGI')*20+statMod(p,'PER')*10;if(p.dazed)ms-=90;if(p.frac)ms-=60;if(tr(p,'athletic'))ms+=40;return clamp(Math.round(ms),360,760)}
const QZ={A:{x:[.05,.3],y:[.3,.82]},D:{x:[.7,.95],y:[.3,.82]},W:{x:[.36,.64],y:[.2,.36]},S:{x:[.36,.64],y:[.7,.86]}};

  for(let i=0;i<n;i++){const pool=i%2===1?['A','D','W','S'].filter(z=>z!==last):['A','D','A','D','W','S'];
    // 大部分在左右兩側；同一組裡的兩格一定在不同位置，鍵盤才不會混淆
    let z=pick(pool);if(i%2===1&&Math.random()<.75)z=last==='A'?'D':last==='D'?'A':pick(['A','D']);

  const id=G.rid+'-'+(++QSEQ);const spec={id,to:p.pid,per:qtePer(p),t:o.t,seq:qteSeq(n,words)};

  if(FTAB==='other'){let h='';

    for(const t of able().filter(q=>q!==m&&q.mad)){h+=chBtn(`data-fa="calm" data-to="${t.pid}"`,`安撫${esc(t.name)}`,`魅力檢定${DF().num?'（難度 14）':''}：成功就讓他恢復意識。每場戰鬥只能試一次`,m.calmUsed?'已使用':'每場一次','t-x',m.calmUsed);h+=chBtn(`data-fa="subdue" data-to="${t.pid}"`,`制伏${esc(t.name)}`,'用手上的武器打他；打倒之後救起來就會清醒，但仍在崩潰邊緣','','t-dg')}

function actLabel(m,a){if(a.a==='csk')return CSKILL[a.id].n+(a.to&&P(a.to)?' → '+esc(P(a.to).name):'');if(a.a==='flee'&&a.csk)return '緊急撤退';if(a.a==='atk'){const x=handsOf(m).find(y=>y.h===(a.h||'R'));return (x?x.lab+'・':'')+(a.csk?CSKILL[a.csk].n:a.sk?SKILL[a.sk].n:'普通攻擊')+(a.t!=null&&G.fight.foes[a.t]?' → '+G.fight.foes[a.t].n:'')}if(a.a==='tact')return TACT[a.id].n;return {reload:'裝填',unjam:'排除卡彈',cock:'上弦',pickup:'撿起武器',kick:'踢回武器',molotov:'丟燃燒瓶',ext:'噴滅火器',flee:'逃跑',free:'掙脫',use:'使用物品',revive:'救隊友',equip:'換武器',guard:'格擋',block:'格擋',dodge:'閃躲',cover:'掩蔽',dual:'雙持攻擊',calm:'安撫隊友',subdue:'制伏隊友'}[a.a]||a.a}
const backBtn=()=>chBtn('data-ftab=""','返回','回到上一層','','');
function targetBtns(m){const a=PEND.a;let w=null,sk=a.sk;if(a.a==='atk'){const x=atkHands(m).find(y=>y.h===(a.h||'R'));w=x.w}
  return aliveF().map(f=>{let tag='';if(w&&DF().num){const st=bestSt(m,w.st);tag=`命中 ${f.prone?100:hitPct(statMod(m,st)+hitBonus(m,a.h||'R',w,sk),fDef(f))}%`}
    return chBtn(`data-tgt="${f.id}"`,f.n,`生命 ${f.hp}/${f.max}　${DF().num===0?'':`防禦 ${fDef(f)}　`}${knowTxt(f)}`,'','')}).join('')+chBtn('data-cancel','返回','重新選擇行動','','')}
function needTarget(a){if(a.a==='atk'){const sk=a.sk;if(sk&&SKILL[sk].all)return false;const x=atkHands(me()).find(y=>y.h===(a.h||'R'));if(x&&x.w.kind==='spray')return false;if(sk&&SKILL[sk].prep)return false}
  if(a.a==='csk')return a.id==='awe'&&aliveF().length>1;
  if(a.a==='tact'){const T=TACT[a.id];if(!T.one)return false;return aliveF().filter(f=>T.foes.includes(f.type)).length>1}
  return (a.a==='atk'||a.a==='ext'||a.a==='dual')&&aliveF().length>1}

function eqCol(m,inF,can){

function itemCol(m,inF,can){
  const mates=G.players.filter(p=>p!==m&&!p.dead&&!p.down&&!p.away);const giveTo=G.players.filter(p=>p!==m&&!p.dead);
  let h=`<div class="usdrow"><b>$${m.usd||0}</b><span>美金</span>${!inF&&(m.usd||0)>0?giveTo.map(t=>ibt(`data-giveusd="${Math.min(10,m.usd)}" data-to="${t.pid}"`,`給${esc(t.name)} $${Math.min(10,m.usd)}`,0,can)).join(''):''}</div>`;
  h+=`<p class="slots">背包 <b>${used(m)}／${cap(m)}</b> 格　<small>同種 5 個疊 1 格；拿在手上、穿著的不佔格</small>${inF?'<br><b>戰鬥中使用物品或換武器會用掉回合。</b>':''}</p>`;
  const spare=m.gear.filter(g=>m.hand.R!==g.u&&m.hand.L!==g.u||g.drop);
  if(spare.length)h+='<div class="cat">武器</div>';
  for(const g of spare){const w=WEAP[g.id];const sel=SEL==='g'+g.u;
    h+=`<div class="irow ${sel?'sel':''}" data-sel="g${g.u}"><div class="in"><b>${w.n}</b>${g.drop?`<small style="display:inline">　${g.drop==='far'?'飛遠了（戰後撿回）':'掉在腳邊'}</small>`:''}<small>${wLine(m,w,g,'R')}　技能：${w.sk.map(s=>SKILL[s].n+(SKILL[s].per?'（每場一次）':'')).join('、')||'無'}</small></div></div>`;
    if(sel&&!g.drop){let a='';if(w.hands===2){a+=ibt(`data-eq="${g.u}" data-h="R"`,'雙手拿',0,can);if(w.one)a+=ibt(`data-eq="${g.u}" data-h="R" data-one="1"`,'單手拿（右手）',0,can)+ibt(`data-eq="${g.u}" data-h="L" data-one="1"`,'單手拿（左手）',0,can)}else a+=ibt(`data-eq="${g.u}" data-h="R"`,'拿在右手',0,can)+ibt(`data-eq="${g.u}" data-h="L"`,'拿在左手',0,can);
      if(!inF)a+=ibt(`data-dropg="${g.u}"`,'丟掉',0,can)+giveTo.map(t=>ibt(`data-giveg="${g.u}" data-to="${t.pid}"`,'給'+esc(t.name),0,can)).join('');h+=`<div class="acts">${a}</div>`}}
  for(const c of Object.keys(CATN)){const ks=Object.keys(m.items).filter(k=>m.items[k]>0&&ITEMS[k]&&ITEMS[k].t===c);if(!ks.length)continue;h+=`<div class="cat">${CATN[c]}</div>`;
    for(const k of ks){const it=ITEMS[k];const sel=SEL===k;const usable=['med','food','wear','misc'].includes(it.t)&&!it.revive;
      const main=usable?ibt(`data-use="${k}"`,it.t==='wear'?'穿上':it.t==='food'?(it.verb?'用':'吃／喝'):'使用',0,can):'';
      h+=`<div class="irow ${sel?'sel':''}" data-sel="${k}"><div class="in"><b>${it.n}　×${m.items[k]}</b><small>${it.d}</small></div>${main}</div>`;
      if(sel){let a='';
        if(usable&&it.t!=='wear'&&it.t!=='misc')a+=mates.map(t=>ibt(`data-useon="${k}" data-to="${t.pid}"`,'替'+esc(t.name)+(it.t==='food'?'吃':'使用'),0,can)).join('');
        if(it.revive)a+=G.players.filter(p=>p.down&&!p.dead).map(t=>ibt(`data-rev="${k}" data-to="${t.pid}"`,'救'+esc(t.name),0,can)).join('');
        if(it.fixFor&&!inF)a+=ibt(`data-fix="${k}"`,'修理',0,can);
        if(!inF)a+=giveTo.map(t=>ibt(`data-give="${k}" data-to="${t.pid}"`,'給'+esc(t.name),0,can)).join('')+ibt(`data-drop="${k}"`,'丟一個',0,can);
        if(a)h+=`<div class="acts">${a}</div>`;
        if(FIXK===k&&!inF)h+=`<div class="acts"><small>要修哪一把？</small>${m.gear.filter(g=>g.dur!=null||WEAP[g.id].kind==='gun').map(g=>ibt(`data-fixu="${g.u}" data-k="${k}"`,WEAP[g.id].n,0,can)).join('')||'<small>沒有能修的武器。</small>'}</div>`}}}
  if(!spare.length&&!Object.keys(m.items).some(k=>m.items[k]>0))h+='<p class="note">背包是空的。</p>';
  return h}
function panel(k){

  if((k==='bag'||k==='craft')&&!m){toast('觀戰中沒有背包。');OVK=null;return}
  const inF=!!(G&&G.fight),can=G&&!G.busy&&!m.dead&&(!inF||myTurn())&&!m.down;
  if(k==='bag'){
    const gr=G.ground.length?`<div class="cat">地上</div>${G.ground.map((x,i)=>`<div class="irow"><div class="in"><b>${x.g?WEAP[x.g.id].n:ITEMS[x.k].n+(x.q>1?' ×'+x.q:'')}</b><small>放在這個地方，回來還撿得到。</small></div><button class="btn" data-pick="${i}" ${can&&!inF?'':'disabled'}>撿起</button></div>`).join('')}`:'';
    openOv(`<div class="boxhead"><b>背包與裝備</b><span class="hbtns">${inF?'':'<button class="btn" data-open="craft">合成</button>'}${X}</span></div><div class="bagwrap b3"><div class="scr2">${sheet(m)}</div><div class="scr2">${eqCol(m,inF,can)}</div><div class="scr2">${itemCol(m,inF,can)}${gr}</div></div>`);
  }else if(k==='craft'){
    if(inF){toast('戰鬥中不能合成。');OVK=null;return}
    const slotName=s=>s.u!=null?(gearOf(m,s.u)?WEAP[gearOf(m,s.u).id].n:'?'):ITEMS[s.k].n;
    const slots=Array.from({length:CRAFT_SLOTS},(_,i)=>{const s=SLOTS[i];return s?`<button class="cslot has" data-unslot="${i}"><b>${slotName(s)}</b><small>點一下拿出來</small></button>`:`<div class="cslot"><small>空格</small></div>`}).join('');
    const pool=[...m.gear.filter(g=>!g.drop).map(g=>({u:g.u,n:WEAP[g.id].n,c:1})),...Object.keys(m.items).filter(x=>m.items[x]>0).map(x=>({k:x,n:ITEMS[x].n,c:m.items[x]-SLOTS.filter(s=>s.k===x).length}))];
    openOv(`<div class="boxhead"><b>合成</b>${X}</div>${tabs}<div class="bagwrap"><div class="scr2"><div class="grid">${pool.map(x=>x.u!=null?`<button class="it" data-craftg="${x.u}" ${SLOTS.some(s=>s.u===x.u)?'disabled':''}><b>${x.n}</b><em>武器</em></button>`:`<button class="it" data-crafti="${x.k}" ${x.c<=0?'disabled':''}><b>${x.n}</b><em>×${x.c}</em></button>`).join('')}</div></div><div class="scr2"><div class="cgrid">${slots}</div><div class="cmsg">${CMSG||'把東西放進格子裡，用常識想想看能湊出什麼。工具（打火機、鐵鎚、小刀、鉗子）也要放進格子，但不會被消耗。'}</div><div class="seg"><button class="btn" data-craft ${SLOTS.length&&can?'':'disabled'}>合成</button><button class="btn" data-clear ${SLOTS.length?'':'disabled'}>清空</button></div>${knownTxt()}</div></div>`);
  }else if(k==='shop'){
    if(!G.shop){OVK=null;closeOv();return}const S=G.shop,sh=SHOPS[S.id];const rd=ctl().filter(q=>S.ready[q.pid]).length;const ok=G&&!G.busy&&m&&!m.dead&&!m.down&&!m.mad;
    let left='';
    if(SHOPMODE==='buy'){left=`<div class="sgrid">${S.items.map((x,i)=>{const it=ITEMS[x.k];const cant=x.q<=0||(m.usd||0)<x.p;return `<div class="scard ${SHOPSEL===i?'on':''}" data-shopsel="${i}"><div class="st"><b>${it.n}</b><small>${CATN[it.t]||''}｜${x.q>0?'剩 '+x.q+' 個':'賣完了'}</small></div><small class="sd">${it.d}</small><div class="sp"><b class="${(m.usd||0)<x.p?'no':''}">$${x.p}</b>${ibt(`data-buy="${i}"`,x.q<=0?'賣完了':(m.usd||0)<x.p?'買不了':'購買',cant,ok)}</div></div>`}).join('')}</div>`}
    else{const ks=Object.keys(m.items).filter(k=>m.items[k]>0&&sellPrice(k));left=ks.length?ks.map(k=>`<div class="irow"><div class="in"><b>${ITEMS[k].n}　×${m.items[k]}</b><small>${ITEMS[k].d}</small></div>${ibt(`data-sell="${k}"`,`賣 $${sellPrice(k)}`,0,ok)}</div>`).join(''):'<p class="note">沒有這裡收的東西。</p>'}
    const x=S.items[SHOPSEL]||S.items[0];const it=x&&ITEMS[x.k];
    const det=SHOPMODE==='buy'&&it?`<b class="dn">${it.n}</b><small>${CATN[it.t]||''}｜$${x.p}｜${x.q>0?'剩 '+x.q+' 個':'賣完了'}</small>${m.items[x.k]?`<p class="note">你的背包裡已經有 ${m.items[x.k]} 個。</p>`:''}<p>${it.d}</p>`+ibt(`data-buy="${S.items.indexOf(x)}"`,x.q<=0?'賣完了':`買下（$${x.p}）`,x.q<=0||(m.usd||0)<x.p,ok):`<p class="note">賣東西給這裡：價錢是平常的三分之一。</p>`;
    openOv(`<div class="boxhead"><b>${sh.n}</b><span class="hbtns"><span class="smoney">$${m.usd||0}　背包 ${used(m)}／${cap(m)} 格</span><button class="btn" data-shopshut>先收起來</button></span></div><p class="note sintro">${sh.d}</p><div class="shopwrap"><div class="scr2">${left}</div><div class="scr2 sdet">${det}</div></div>
      <div class="sfoot">${ibt('data-shopdone',S.ready[MYPID]?`等其他人（${rd}／${ctl().length}）`:`買好了，繼續（${rd}／${ctl().length} 人準備好）`,!!S.ready[MYPID],ok)}<button class="btn" data-open="bag">打開背包</button><button class="btn ${SHOPMODE==='sell'?'on':''}" data-shopmode>${SHOPMODE==='sell'?'回到商品':'賣東西給這裡'}</button></div>`);
  }else if(k==='settings'){
    const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="btn ${UI[key]===v?'on':''}" data-ui="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
    const hostOpt=ROLE==='host'&&G&&!G.over?`<p class="note">倒數（房主）</p><div class="seg">${[['off','關閉'],['host','房主按下才倒數'],['force','強制倒數']].map(([v,l])=>`<button class="btn ${G.opts.cd===v?'on':''}" data-gcd="${v}">${l}</button>`).join('')}</div><div class="seg">${[15,20,30].map(v=>`<button class="btn ${G.opts.sec===v?'on':''}" data-gsec="${v}">${v} 秒</button>`).join('')}</div>`:'';
    openOv(`<div class="boxhead"><b>設定</b>${X}</div>${hostOpt}<p class="note">音效</p>${seg('snd',[[1,'開'],[0,'關']])}<p class="note">背景音樂</p>${seg('bgm',[[1,'開'],[0,'關']])}<p class="note">擲骰與文字速度</p>${seg('spd',[[1,'完整'],[.55,'快速'],[.3,'極快']])}<p class="note">畫面方向（手機直拿時）</p>${seg('orient',[['auto','自動轉成橫向'],['off','不旋轉']])}<div class="seg"><button class="btn" data-full>全螢幕</button><button class="btn" data-open="credits">製作與授權</button>${G?`<button class="btn" data-quit>${ROLE==='solo'?'回到選單（沒存檔的進度會消失）':'離開房間'}</button>`:''}</div>`);
  }else if(k==='credits'){
    openOv(`<div class="boxhead"><b>製作與授權</b><span class="hbtns"><button class="btn" data-open="settings">← 回設定</button>${X}</span></div><p class="note">${CREDITS}</p>`);
  }
}

document.addEventListener('click',e=>{
  if(!e.target.closest('button')){const r=e.target.closest('[data-sel]');if(r){SEL=SEL===r.dataset.sel?null:r.dataset.sel;FIXK=null;sfx('click',.4);panel('bag');return}}
  if(!e.target.closest('button')){const sc=e.target.closest('[data-shopsel]');if(sc){SHOPSEL=+sc.dataset.shopsel;panel('shop');return}}
  const b=e.target.closest('button,[data-tgt]');if(!b){if(DD&&!e.target.closest('#tdd')){DD=false;$('#tdd').hidden=true}return}const d=b.dataset;
  if(b.closest('#scr'))return onScr(b,d);
  if(b.hasAttribute('data-save')){saveGame();return}
  if(b.hasAttribute('data-dd')){DD=!DD;if(DD)drawDD();else $('#tdd').hidden=true;sfx('click',.5);return}
  if(d.cfok!=null){$('#cfm').hidden=true;act({a:'vote',i:+d.cfok});return}
  if(b.hasAttribute('data-cfno')){$('#cfm').hidden=true;sfx('click',.4);return}
  if(d.tell!=null)act({a:'tell',i:+d.tell});
  else if(d.ch!=null){if(!longAsk(+d.ch))act({a:'vote',i:+d.ch})}
  else if(d.rv)act({a:'rv',t:d.rv});
  else if(b.hasAttribute('data-cdgo'))act({a:'cdgo'});
  else if(d.ftab!=null){FTAB=d.ftab||null;sfx('click',.4);draw()}
  else if(d.fa){const a={a:d.fa,h:d.h,sk:d.sk,csk:d.csk,to:d.to,k:d.k,id:d.id,u:d.u!=null?+d.u:undefined};if(needTarget(a)){PEND={a,lab:b.querySelector('.cl').textContent};draw();return}FTAB=null;act(a)}
  else if(d.tgt!=null&&PEND){const a=PEND.a;a.t=+d.tgt;PEND=null;FTAB=null;draw();act(a)}
  else if(b.hasAttribute('data-cancel')){PEND=null;draw()}
  else if(d.open){sfx(d.open==='bag'?'zipper':'click',.6);SEL=null;FIXK=null;panel(d.open)}
  else if(b.hasAttribute('data-close')){closeOv();SEL=null;FIXK=null;if(G&&G.phase==='shop'&&!SHOPSHUT)panel('shop')}
  else if(d.shopsel!=null&&!b.matches('button')){SHOPSEL=+d.shopsel;panel('shop')}
  else if(d.buy!=null){act({a:'buy',i:+d.buy});later2()}
  else if(d.sell){act({a:'sell',k:d.sell});later2()}
  else if(b.hasAttribute('data-shopdone')){act({a:'shopdone'});later2()}
  else if(b.hasAttribute('data-shopmode')){SHOPMODE=SHOPMODE==='sell'?'buy':'sell';panel('shop')}
  else if(b.hasAttribute('data-shopshut')){SHOPSHUT=true;closeOv();draw()}
  else if(b.hasAttribute('data-openshop')){SHOPSHUT=false;panel('shop')}
  else if(d.craftg!=null){if(SLOTS.length<CRAFT_SLOTS){SLOTS.push({u:+d.craftg});CMSG='';sfx('click',.5)}panel('craft')}
  else if(d.crafti){if(SLOTS.length<CRAFT_SLOTS){SLOTS.push({k:d.crafti});CMSG='';sfx('click',.5)}panel('craft')}
  else if(d.unslot!=null){SLOTS.splice(+d.unslot,1);CMSG='';panel('craft')}
  else if(b.hasAttribute('data-clear')){SLOTS=[];CMSG='';panel('craft')}
  else if(b.hasAttribute('data-craft')){CMSG='……';act({a:'craft',slots:SLOTS.slice()});panel('craft')}
  else if(d.lvl){act({a:'lvl',st:d.lvl});later()}
  else if(b.hasAttribute('data-brew')){act({a:'brew'});later()}
  else if(d.soothe){act({a:'soothe',to:d.soothe});later()}
  else if(d.use){const inF=!!G.fight;act({a:'use',k:d.use});if(inF)closeOv();else later()}
  else if(d.useon){const inF=!!G.fight;act({a:'use',k:d.useon,to:d.to});if(inF)closeOv();else later()}
  else if(d.giveusd){act({a:'giveusd',n:+d.giveusd,to:d.to});later()}
  else if(d.rev){closeOv();act({a:'revive',k:d.rev,to:d.to})}
  else if(d.fix){FIXK=FIXK===d.fix?null:d.fix;panel('bag')}
  else if(d.fixu!=null){act({a:'repair',k:d.k,u:+d.fixu});FIXK=null;later()}
  else if(d.eq!=null){const inF=!!G.fight;act({a:'equip',u:+d.eq,h:d.h,one:d.one?1:0});SEL=null;if(inF)closeOv();else later()}
  else if(d.uneq!=null){const m=me();const h=m.hand.R===+d.uneq?'R':'L';act({a:'equip',h});if(G.fight)closeOv();else later()}
  else if(d.unwear){act({a:'unwear',s:d.unwear});later()}
  else if(d.pick!=null){act({a:'pick',i:+d.pick});later()}
  else if(d.give){act({a:'give',k:d.give,to:d.to});later()}
  else if(d.giveg!=null){act({a:'give',u:+d.giveg,to:d.to});later()}
  else if(d.dropg!=null){act({a:'drop',u:+d.dropg});later()}
  else if(d.drop){act({a:'drop',k:d.drop});later()}
  else if(d.gcd){G.opts.cd=d.gcd;if(d.gcd!=='force'&&G.phase!=='fight')stopCd();else if(G.phase==='node'||G.phase==='roller')startCd();push();draw();panel('settings')}
  else if(d.gsec){G.opts.sec=+d.gsec;push();panel('settings')}
  else if(d.ui){const k=d.ui;UI[k]=k==='orient'?d.v:+d.v;saveUI();if(k==='snd'&&UI.snd){loading=null;loadSounds()}if(k==='bgm'){if(UI.bgm)startBgm();else stopBgm()}sfx('click',.6);panel('settings');layout()}
  else if(b.hasAttribute('data-full'))enterFull();
  else if(b.hasAttribute('data-quit')){closeOv();quitGame()}
  else if(b.hasAttribute('data-menu')){quitGame()}
  else if(b.hasAttribute('data-again')){quitGame().then(()=>{CMODE='pre';showPlay()})}
});

  if(e.ctrlKey||e.metaKey||e.altKey)return;const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;

  if(!$('#dice').hidden&&(e.key===' '||e.key==='Enter')){if(skipDice)skipDice();e.preventDefault();return}

  if(scrOn||!$('#ov').hidden||!G)return;

  scr(`<div class="sh"><h2>房間</h2><span class="shard">${host?'你是房主':'等待房主開始'}</span><button class="btn" data-m="leave">離開</button></div>
  <div class="sbody"><div class="two"><div><p class="note" style="text-align:center">把這組房號告訴隊友</p><div class="code">${NET.code}</div>
   ${!host&&!NET.hostPeer?`<p class="note" style="text-align:center;color:#d9918b">還沒找到房主。請確認房號${NET.kind==='claude'?'，並確認房主有把這個頁面分享給你':''}。</p>`:''}
   <p class="note">難度：<b>${DIFF[dk].n}</b>${host?'':'　'+DIFF[dk].d}</p>${host?`<div class="cards dcards">${diffCards(dk,'ldif')}</div>`:''}
   <p class="note">倒數：${cdn[o.cd]}${o.cd!=='off'?`（${o.sec} 秒）`:''}</p>
   ${host?`<div class="seg">${Object.entries(cdn).map(([v,l])=>`<button class="btn ${o.cd===v?'on':''}" data-lcd="${v}">${l}</button>`).join('')}</div><div class="seg">${[15,20,30].map(v=>`<button class="btn ${o.sec===v?'on':''}" data-lsec="${v}">${v} 秒</button>`).join('')}</div><p class="note">關閉：等所有人都投票。房主按下才倒數：房主可以隨時催促。強制倒數：每個選擇和每個回合都有時間限制，時間到了自動決定。</p>`:''}
  </div><div><div class="plist">${ps.map((p,i)=>`<div class="prow">${avH(p.pid,p.name,COLS[i%COLS.length],'big')}<b>${esc(p.name)}${p.pid===MYPID?'（你）':''}</b><small class="${p.ready?'ok':''}">${i>=MAXP?'觀戰':p.host?'房主':p.ready?'準備好了':'還沒好'}</small></div>`).join('')}</div>
   <p class="note">最多 ${MAXP} 人；超過的人只能觀戰。</p>
   ${host&&LS.get('zc7-mpsave',null)?`<div class="seg"><button class="btn ${LOBBY.load?'on':''}" data-m="loadmp">${LOBBY.load?'已載入多人存檔（點一下取消）':'讀取多人存檔'}</button></div>${LOBBY.load?`<p class="note">存檔裡的角色：${LOBBY.load.G.players.map(p=>esc(p.name)).join('、')}。他們加入房間就會自動接回；沒回來的角色會留在原地，等之後重新連線。</p>`:''}`:''}
   <div class="seg">${host&&LOBBY.load&&LOBBY.load.G.players.some(p=>p.pid===MYPID)?'':`<button class="btn" data-m="editc">${myb?'修改角色':'建立角色'}</button>`}${host?`<button class="btn" data-m="start" ${(LOBBY.load||myb)&&readyN>=Math.min(ps.length,MAXP)?'':'disabled'}>開始（${Math.min(readyN,MAXP)} 人）</button>`:''}</div></div></div></div>`)}
async function hostRoom(){LOBBY.load=null;LOBBY.opts.diff=UI.diff||'normal';
  const code=String(rnd(1000,9999));
  try{await openRoom(true,code)}catch(e){toast('連不上房間功能。');return}
  NET.build=buildOut();if(LS.get('zc7-mpsave',null))showLobby();else{NET.ready=true;setPres();showLobby()}}
async function joinRoom(){
  const code=JOIN;const msg=$('#jmsg');if(msg)msg.textContent='連線中……';
  try{await openRoom(false,code)}catch(e){if(msg)msg.textContent='連不上房間功能。';return}
  NET.build=null;
  for(let i=0;i<30&&!NET.hostPeer;i++)await wait(200);
  if(!NET.hostPeer){await leaveRoom();if(msg)msg.textContent=NET.kind==='claude'?'找不到這個房間。請確認房號，以及房主有把這個頁面分享給你。':'找不到這個房間。請確認房號，以及房主已經開好房間。';return}
  if(NET.hostPres&&NET.hostPres.started){toast('這局已經開始了，正在接回……');NET.build=buildOut();NET.ready=true;setPres();sendAv();requestSync();SCR='game';return}
  const sp=NET.hostPres&&NET.hostPres.savePids;if(sp&&sp.includes(MYPID)){NET.build={kind:'saved',name:'存檔角色'};NET.ready=true;setPres();showLobby();return}
  NET.build=buildOut();NET.ready=true;setPres();sendAv();showLobby()}
function startMP(){
  const ps=lobbyPlayers().filter(p=>p.ready).slice(0,MAXP);
  if(LOBBY.load){
    G=migrateG(JSON.parse(JSON.stringify(LOBBY.load.G)));LOG=LOBBY.load.LOG||[];G.mode='mp';G.host=MYPID;G.opts=Object.assign({},LOBBY.opts);G.busy=0;G.cd=null;busy=false;
    const here=new Set(ps.map(p=>p.pid));
    for(const p of G.players)p.away=here.has(p.pid)?0:1;
    for(const p of ps)if(!p.saved&&p.build&&!G.players.some(q=>q.pid===p.pid)&&G.players.length<MAXP){const np=makePlayer(Object.assign({},p.build,{pid:p.pid}),G.players.length);np.lv=1}
    NET.started=1;setPres();
    out('—— 冒險繼續 ——','hd',true);out('上一次的調查中斷了。大家回到中斷前的那個地方，接著走。','sys',true);
    for(const p of G.players)out(p.away?`${nm(p)}還沒有回來。`:`${nm(p)}（生命 ${Math.max(0,p.hp)}／${p.max}、${fstgN(p)}）`,'sys',true);
    fullSync();showGame();if(G.fight&&!G.fight.group)run(advance);else{startCd();push();draw()}
    return}
  newRun(ps.map(p=>Object.assign({},p.build,{pid:p.pid})),LOBBY.opts,'mp');
  NET.started=1;setPres();fullSync();showGame();run(()=>enterNode('A1'));
}
function showDiff(){SCR='diff';
  scr(`<div class="sh"><h2>選擇難度</h2><span class="shard">進去之後就不能改</span><button class="btn" data-m="playback">返回</button></div><div class="sbody"><div class="cards dcards">${diffCards(UI.diff,'dif')}</div><p class="note">碎片倍率：困難 ×1.3、真實 ×1.7。</p><div class="seg" style="justify-content:center"><button class="btn big" data-m="go">開始調查（${DIFF[UI.diff].n}）</button></div></div>`)}
function diffCards(cur,attr,dis){return Object.entries(DIFF).map(([k,d])=>`<button class="card ${cur===k?'on':''}" data-${attr}="${k}" ${dis?'disabled':''}><b>${d.n}</b><small>${d.d}</small></button>`).join('')}
function startSolo(){ROLE='solo';newRun([buildOut()],{diff:UI.diff},'solo');showGame();run(()=>enterNode('A1'))}
function resumeSolo(){const d=LS.get('zc7-save',null);if(!d||!d.G)return showMenu();if(!d.G.v9){toast('這是舊版本（還有章節時）的存檔，沒辦法接著玩，請重新開始。');return showMenu()}ROLE='solo';G=migrateG(d.G);LOG=d.LOG||[];G.busy=0;G.cd=null;busy=false;showGame();
  out('—— 冒險繼續 ——','hd',true);if(G.fight&&!G.fight.group)run(advance);}
function onScr(b,d){
  sfx('click',.5);
  if(d.m==='menu'){if(ROLE!=='solo')leaveRoom();showMenu()}
  else if(d.m==='solo')showDiff();
  else if(d.m==='playback')showPlay();
  else if(d.m==='backc'){CMODE='pre';if(CB.kind==='custom'){CTAB='who';showCreate()}else showRoster(GUESTS[CB.kind]?'guest':'story')}
  else if(d.m==='rback')showRoster(GUESTS[CB.kind]?'guest':'story');
  else if(d.cat){if(d.cat==='custom'){CB.kind='custom';startCreate('pre')}else showRoster(d.cat)}
  else if(d.rsel){CB.kind=d.rsel;showRoster(RCAT)}
  else if(d.m==='rpick'){if(unlocked(lockId(CB.kind))){startCreate('pre')}}
  else if(d.ubuy){const u=UNLOCKS.find(x=>x.id===d.ubuy);if(u&&META.shards>=u.cost&&!unlocked(u.id)){META.shards-=u.cost;META.unlocked.push(u.id);saveMeta();sfx('ok')}showRoster(RCAT)}
  else if(d.m==='resume')resumeSolo();
  else if(d.m==='host')hostRoom();
  else if(d.m==='join'){JOIN='';showJoin()}
  else if(d.m==='dojoin')joinRoom();
  else if(d.m==='unlock')showUnlock();
  else if(d.m==='settings')panel('settings');
  else if(d.m==='lobby')showLobby();
  else if(d.m==='leave'){leaveRoom();showMenu()}
  else if(d.m==='editc'){CMODE=ROLE==='host'?'host':'client';CTAB='who';showCreate()}
  else if(d.m==='start'){if(ROLE==='host'){enterFull(true);startMP()}}
  else if(d.m==='loadmp'){const sv=LS.get('zc7-mpsave',null);if(!LOBBY.load&&sv&&sv.G&&!sv.G.v9){toast('這是舊版本（還有章節時）的多人存檔，沒辦法接著玩，請重新開始。');return}LOBBY.load=LOBBY.load?null:sv;setPres();showLobby()}
  else if(d.m==='go'){enterFull(true);startSolo()}
  else if(d.dif){UI.diff=d.dif;saveUI();showDiff()}
  else if(d.ldif){LOBBY.opts.diff=d.ldif;UI.diff=d.ldif;saveUI();setPres();showLobby()}
  else if(d.m==='cdone'){if(CB.kind==='custom'&&(!TALENT[CB.tal]||!CSKILL[CB.sk])){toast('還沒選天賦或技能。');return}const b=buildOut();if(CMODE==='pre')showPlay();else{NET.build=b;NET.ready=true;setPres();sendAv();showLobby()}}
  else if(d.m==='avpick'){const f=$('#avfile');if(f)f.click()}
  else if(d.m==='avdel'){LS.del('zc8-avatar');delete AVS[MYPID];if(NET.r&&ROLE==='client')sendAv();if(ROLE==='host')send({t:'av',d:{pid:MYPID,d:null}});if(SCR==='menu')showMenu();else showCreate()}
  else if(d.key!=null){if(d.key==='del')JOIN=JOIN.slice(0,-1);else if(JOIN.length<4)JOIN+=d.key;showJoin()}
  else if(d.buy){const u=UNLOCKS.find(x=>x.id===d.buy);if(u&&META.shards>=u.cost&&!unlocked(u.id)){META.shards-=u.cost;META.unlocked.push(u.id);saveMeta();sfx('ok')}showUnlock()}
  else if(d.ctab){CTAB=d.ctab;showCreate()}
  else if(d.st){const v=CB.st[d.st]+(+d.d);if(v>=0&&v<=STAT_MAX&&(+d.d<0||statUsed()<STAT_PTS))CB.st[d.st]=v;showCreate()}
  else if(d.tal){CB.tal=d.tal;showCreate()}
  else if(d.csk&&SCR==='create'){CB.sk=d.csk;showCreate()}
  else if(d.ld){const q=(CB.load[d.ld]||0)+(+d.d);if(q<=0)delete CB.load[d.ld];else if(+d.d<0||(loadPts()>=LOADOUT[d.ld].c&&q<=3))CB.load[d.ld]=q;showCreate()}
  else if(d.lcd){LOBBY.opts.cd=d.lcd;setPres();showLobby()}
  else if(d.lsec){LOBBY.opts.sec=+d.lsec;setPres();showLobby()}
}
/* ================= 橫向、全螢幕與啟動 ================= */
function layout(){
  const st=$('#stage'),W=window.innerWidth,H=window.innerHeight;
  // 輸入文字時暫時不轉向，讓手機鍵盤和輸入框方向一致
  const typing=document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)&&document.activeElement.type!=='file';
  // 開頭的「進入遊戲」畫面維持直的；進入之後才轉成橫向（能真的全螢幕時手機自己會轉，就不用再轉）
  const rot=BOOTED&&UI.orient!=='off'&&H>W&&!typing;
  st.classList.remove('r90');
  if(rot){st.classList.add('r90');st.style.width=H+'px';st.style.height=W+'px'}else{st.style.width=W+'px';st.style.height=H+'px'}
  const sw=rot?H:W,sh=rot?W:H;
  st.classList.toggle('short',sh<=480);st.classList.toggle('narrow',sw<=700);st.classList.toggle('tall',!rot&&sh>sw);
  st.style.setProperty('--fs',(sh<=480?14:16)+'px');
  // v0.21.0 朋友回饋：大螢幕（含電腦全螢幕）整個畫面等比放大，不再擠在中間一小塊
  const Z=!rot&&sw>=1280&&sh>=720?Math.min(sw/1280,sh/720):1;
  if(Z>1.04){st.style.zoom=Z;st.style.width=(W/Z)+'px';st.style.height=(H/Z)+'px'}else st.style.zoom='';
}
let rzT=null;function onResize(){clearTimeout(rzT);rzT=setTimeout(layout,120)}
window.addEventListener('resize',onResize);document.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))layout()});document.addEventListener('focusout',e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))setTimeout(layout,60)});window.addEventListener('orientationchange',onResize);
document.addEventListener('fullscreenchange',onResize);document.addEventListener('webkitfullscreenchange',onResize);
// 全螢幕並鎖定橫向；quiet＝開始遊戲時自動呼叫（已經是全螢幕就跳過，失敗只提示一次）
let FULL_WARNED=false;
async function enterFull(quiet){
  const el=document.documentElement;let ok=!!(document.fullscreenElement||document.webkitFullscreenElement);
  if(!ok){try{if(el.requestFullscreen){await el.requestFullscreen({navigationUI:'hide'});ok=true}else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();ok=true}}catch(e){}}
  let locked=false;try{if(ok&&screen.orientation&&screen.orientation.lock){await screen.orientation.lock('landscape');locked=true}}catch(e){}
  if(!ok&&(!quiet||!FULL_WARNED)){FULL_WARNED=true;toast('這個畫面不允許全螢幕，只能用轉向的畫面；鍵盤會維持直的。用 Chrome 開啟遊戲連結就能真的橫向全螢幕。')}
  layout();
}
let BOOTED=false;
function boot(full){BOOTED=true;$('#gate').hidden=true;audio();startBgm();if(full)enterFull();else layout();loadSounds();showMenu()}
$('#gateGo').addEventListener('click',()=>boot(true));
$('#gateNo').addEventListener('click',()=>boot(false));
layout();
</script>
