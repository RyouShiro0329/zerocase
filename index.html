/* 版面：仿《露涅希亞・旅途》的橫向舞台。整個畫面放在 #stage，手機直拿時由程式轉成橫向。
   上方工具列（地點｜時間與探索進度｜功能鍵），戰鬥時多一列敵人卡；下方左側敘事、右側選項與麥琪狀態。

:root{

  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{font-variant-numeric:lining-nums tabular-nums}
input,textarea,select{font-family:var(--serif)}
/* v0.21.0 朋友回饋：畫面上的字不能被選取（輸入框除外） */
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:var(--fs);line-height:1.65;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{position:absolute;inset:0;display:flex;flex-direction:column;box-sizing:border-box;padding:max(4px,var(--st)) max(12px,var(--sr)) max(6px,var(--sb)) max(12px,var(--sl));gap:6px}
.panel{background:linear-gradient(145deg,rgba(15,16,14,.92),rgba(5,6,5,.94));border:1px solid var(--line);border-radius:3px;box-shadow:inset 0 0 22px rgba(0,0,0,.85),0 5px 18px rgba(0,0,0,.55)}
.btn{background:linear-gradient(180deg,#292a26,#111210);border:1px solid #5a574e;border-radius:3px;box-shadow:inset 0 0 15px #000,0 2px 8px #000;color:var(--ink)}

.time-weather{position:relative;flex:1;min-width:240px;display:flex;align-items:center;justify-content:center;gap:10px}.mid{flex:0 0 164px;min-width:164px;display:flex;flex-direction:column;align-items:center;gap:2px}.sky-clock{width:100%}.weather{position:absolute;left:calc(50% + 86px);width:34px;display:flex;flex-direction:column;align-items:center;gap:1px;color:#b9b5a6;font-size:.7rem;white-space:nowrap}.weather svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

.ch{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;width:100%;min-width:0;text-align:left;padding:8px 12px;background:linear-gradient(180deg,rgba(43,42,36,.9),rgba(22,22,19,.92));border:1px solid #4f4c43;border-radius:6px;box-shadow:inset 0 0 14px #000,0 2px 6px rgba(0,0,0,.6)}
.ch:active:not(:disabled){border-color:var(--gold)}

.ch.done{opacity:.42}
.ch.locked{opacity:.5;border-style:dashed}
.ch .zst{display:block;flex-basis:100%;font-weight:400;color:var(--gold);font-size:.8em;line-height:1.4;order:5}
.ch .cm{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;flex-basis:100%;min-width:0;margin-top:2px}

.t-go{color:var(--gold);border-color:#6b5c3a}.t-in{color:var(--ok);border-color:#33503a}.t-ck{color:var(--blue);border-color:#2f4560}.t-dg{color:#d9918b;border-color:#5a3632}.t-x{color:#f1e3bd;border-color:var(--gold)}

/* 擲骰 */
#dice{position:absolute;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);transition:opacity .25s}
#dice.out{opacity:0}
.tray{min-width:min(360px,80%);padding:12px 22px 14px;text-align:center;background:linear-gradient(145deg,rgba(22,22,19,.97),rgba(5,6,5,.98));border:1px solid #686257;border-radius:4px;box-shadow:0 20px 60px #000,inset 0 0 30px #000}

@keyframes traycrit{0%{box-shadow:0 20px 60px #000,0 0 0 2px #f3d996,0 0 46px 10px rgba(240,200,110,.65)}100%{box-shadow:0 20px 60px #000}}
@media (prefers-reduced-motion:reduce){.tray.t-ng,.tray.t-fumble{animation:none}}
@keyframes tumble{0%{transform:translate(-90px,-34px) rotate(-260deg) scale(.6)}35%{transform:translate(24px,8px) rotate(-60deg) scale(1.05)}55%{transform:translate(-10px,-12px) rotate(30deg)}75%{transform:translate(4px,2px) rotate(-8deg)}100%{transform:translate(0,0) rotate(0) scale(1)}}

.res{font-size:1.05rem;font-weight:900;letter-spacing:.06em;min-height:1.6em}

/* 疊層 */
.ov{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:max(8px,var(--st)) max(12px,var(--sr)) max(8px,var(--sb)) max(12px,var(--sl))}

const rcNorm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function rcHash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('zc-guest:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function redeem(raw){const c=rcNorm(raw);if(c.length<6){toast('請輸入完整的兌換碼。');return false}
  if(!(window.crypto&&crypto.subtle)){toast('這個瀏覽器沒辦法兌換，請換一個瀏覽器試試。');return false}
  const h=await rcHash(c);const hit=Object.entries(GUESTS).find(([,g])=>g.rc===h);
  if(!hit){toast('兌換碼不正確。');return false}
  const id=lockId(hit[0]);if(unlocked(id)){toast(`${hit[1].n}已經解鎖過了。`);return false}
  META.unlocked.push(id);saveMeta();sfx('ok');toast(`已解鎖訪客：${hit[1].n}`);return true}

 C:{n:'電梯井',sub:'纜繩',en:'LEVEL C · ELEVATOR SHAFT',rule:'懸在半空：有效敏捷 −2，連帶影響敏捷相關攻防、先攻；離開後恢復。'},
 D:{n:'外牆',sub:'消防梯',en:'LEVEL D · FIRE ESCAPE',rule:'無處可躲：戰鬥中不能逃跑。'},
 E:{n:'一樓',sub:'熄燈',en:'LEVEL E · GROUND FLOOR',rule:'一片漆黑：沒有裝手電筒且沒有夜貓子天賦時，有效感知 −2；離開黑暗或取得照明後恢復。'},
 F:{n:'員工廚房',sub:'瓦斯',en:'LEVEL F · KITCHEN',rule:'瓦斯外洩：在這裡開槍或用火，會連你一起炸。'},
 G:{n:'地下設備層',sub:'腐殖',en:'LEVEL G · BASEMENT',rule:''},
 I:{n:'接待大廳',sub:'南門',en:'LEVEL I · THE LOBBY',rule:'門外就是街道。門內，還有東西在等。'}
};
/* 節點：t 描寫；c 選項；next 預設下一個節點
   選項：l 標籤、s 說明、k 檢定能力、d 難度、req 需要的物品（g: 武器）、need／hide 旗標
   結果 ok／ng：t 敘述、r 獎勵、p 代價、fight 戰鬥、go 前往 */
const N={
/* ---------- A 三樓 ---------- */
A1:{L:'A',n:'301 號房',next:'A2',
 t:`槍聲。

不是電視裡的那種。很近，很實在，一連三下，窗玻璃跟著震了一下。你從床上彈起來，心臟跳得像要從喉嚨裡衝出來。

房間裡一片黑。冷氣停了，那陣低沉的運轉聲也跟著消失。你摸到床頭的手機，螢幕顯示 20:00。

整棟樓剛剛停電，只剩門縫底下透進來一點緊急照明的紅光。

傍晚的時候，大廳的電視在播新聞，說市區接連發生「不明原因的暴力事件」，請民眾減少外出。櫃台的人說只是幾個喝醉的，你也就沒放在心上。

窗外又是一串槍響，接著是很多人的尖叫聲。樓下傳來玻璃碎掉的聲音，很大一片。`,
 tm:`你的外套口袋裡還塞著那份案件資料。你來這座城市，是為了一宗「曾接受治療的患者攻擊他人」的傷人案。委託你的人是被害人的家屬，就住在這間旅館等開庭。`,
 c:[
 {t:'q',l:'掀開窗簾往外看',ok:{t:`街口的警車後面，幾個穿防彈背心的警察對著人群開槍。被打中的人倒下去，又爬起來，繼續往前撲。一台公車橫在路中間，車門開著，有人從車裡爬出來，又被後面的人拖了回去。

正下方，旅館大廳的落地窗破了一個大洞。有人從洞裡爬進去，一個接一個。他們的動作不對，像是感覺不到玻璃在割他們。

這不是喝醉的人。`,r:{flag:'sawstreet'},p:{fear:8}}},
 {t:'sd',l:'翻迷你吧和抽屜',ok:{t:`小冰箱已經不冷了。裡面還有一瓶礦泉水和一小瓶旅館附的威士忌，上方抽屜躺著一個印著旅館名字的打火機。

你把它們塞進口袋。手指碰到冰涼的瓶身時，你才發現自己的手一直在抖。`,r:{items:{water:1,whiskey:1,lighter:1}}}},
 {t:'q',l:'看門背後的逃生路線圖',ok:{t:`每間旅館的房門背後都貼著一張逃生路線圖。你用手機的光照著看：三樓東側有一座逃生樓梯；電梯旁邊印著「火災時請勿搭乘」；301 的窗戶外面，標著一個小小的梯子符號。

窗外有消防梯。`,r:{flag:'map'}}},
 {t:'q',l:'貼著門聽外面',s:'感知檢定',k:'PER',d:11,ok:{t:`你把耳朵貼在門板上。走廊上有人在跑，有人在拍門大喊，然後是一聲很短的慘叫。之後是拖行聲，停在走廊中段，接著是很輕的、有規律的刮擦聲，像指甲一下一下刮著牆。

那個東西在 303 門口。背對著這邊。你記住了這件事。`,r:{flag:'heard'}},ng:{t:`門外的聲音太亂了：腳步聲、拍門聲、哭聲，全混在一起。然後一切突然安靜下來。安靜到你開始懷疑，是不是有東西也正貼著門的另一邊，在聽你。`,p:{fear:5}}}
 ]},
A2:{L:'A',n:'301 號房',next:'A3',
 t:`砰。

有東西撞在你的房門上。門板整個往內一彈，門鏈嘩啦啦地跳。

砰。又一下。門外傳來喘氣聲，濕的，一口接著一口，夾著指甲刮過木頭的聲音。剛才在走廊上拍門大喊的那個人，已經沒有聲音了。

門鎖撐不了多久。`,
 c:[
 {t:'q',l:'用身體抵住門',s:'力量檢定',k:'STR',d:12,ok:{t:`你整個人壓在門板上，雙腳蹬住地毯。每撞一下，門框就往內彈一下，震得你牙齒發酸。

撞了十幾下之後，力道越來越弱。外面的東西喘著氣在門口站了一會兒，然後拖著腳走開，撞向隔壁的門。`,p:{fear:6}},
  ng:{t:`你剛壓上去，門就被撞開了一半，門板直接砸在你臉上。你往後摔倒，一個穿睡衣的人從門縫擠了進來，嘴邊全是血。`,p:{hp:-2,fear:10},fight:{n:1,mode:'ambush',names:['撞門的感染者']}}},
 {t:'q',l:'把書桌拖過去頂住門',ok:{t:`你把書桌拖過地毯，斜卡在門後。門外的東西撞得更兇了，每一下書桌都往後滑一截。你用整個身體壓著桌子，聽見門板另一側傳來指甲刮木頭的聲音。

十幾下之後，撞擊停了。它沒有離開，只是站在那裡喘氣。然後它走了。`,p:{fear:10,alarm:2}}},
 {t:'q',l:'從貓眼看清楚外面',k:'PER',d:12,ok:{t:`門外只有一個。穿著旅館的浴袍，半張臉腫得發紫，肩膀上一個咬痕還在流血。它每撞一次門，就退後兩步，再撞一次。

只有一個。你退到門邊的牆後，握緊手上的東西，等它下一次撞進來。`,r:{flag:'saw'},fight:{n:1,mode:'first',names:['撞門的感染者']}},
  ng:{t:`你把臉貼上貓眼的那一刻，門被撞開了。`,p:{fear:12},fight:{n:1,mode:'ambush',names:['撞門的感染者']}}},
 {t:'q',l:'躲進浴室，鎖上門',k:'CON',d:11,ok:{t:`你閃進浴室，扣上門鎖，蹲在浴缸裡。外面的房門被撞開了。它在房間裡走來走去，撞翻了檯燈，在浴室門外停了很久，一直在聞。

然後它走了。你這才發現自己一直沒有呼吸。`,p:{fear:12}},
  ng:{t:`你蹲進浴缸的時候，膝蓋撞到了水龍頭。浴室門外的腳步聲停了一下，接著是一下一下的撞門聲。浴室的門比房門薄得多。`,p:{fear:12},fight:{n:1,mode:'ambush',names:['撞門的感染者']}}}
 ]},
A3:{L:'A',n:'三樓走廊',next:'A4',
 t:`你把門推開一條縫。

走廊比房間更暗，緊急照明每隔幾秒閃一次。紅地毯上有一道深色的拖痕，從 303 門口一路延伸到東側樓梯。

閃光亮起。303 門口站著一個人，背對著你，頭歪向一邊，肩膀隨著呼吸大幅度地起伏。

閃光暗下。再亮起的時候，他的頭轉過來了一點。`,
 c:[
 {t:'q',l:'趁暗的時候摸過去偷襲',k:'AGI',d:12,bonusFlag:'heard',ok:{t:`你等燈光暗下，貼著牆往前移動。地毯吞掉了你的腳步聲。燈再亮起時，你已經在他身後一步的距離。他的後頸有一大片發紫的瘀痕，皮膚底下有東西在蠕動。`,fight:{n:1,mode:'first',names:['穿制服的感染者']}},
  ng:{t:`你踩到了一個空的易開罐。那個聲音在安靜的走廊裡大得像槍響。他整個身體猛地轉過來，嘴巴張得太開，發出一種不像人的聲音。`,p:{fear:5},fight:{n:1,mode:'ambush',names:['穿制服的感染者']}}},
 {t:'q',l:'站穩，正面迎戰',ok:{t:`你往前踏了一步。他轉過來了。他的臉一半是正常的，另一半腫脹發紫，嘴角一直裂到耳根。他看著你，像是在努力想起什麼。然後他放棄了，朝你撲了過來。`,fight:{n:1,mode:'normal',names:['穿制服的感染者']}}},
 {t:'q',l:'退回房間，等他走開',k:'INT',d:12,ok:{t:`你虛掩著門，從門縫往外看。他在 303 門口站了很久，久到你的腿開始發麻。然後他轉身，一拐一拐地朝東側樓梯走去，消失在紅光裡。

他走的，是你也要走的方向。`,r:{flag:'stairsFoe'},p:{alarm:1}},
  ng:{t:`你往後退的時候，門板撞到了門擋。很輕的一聲。他的頭立刻轉過來，下一次閃光亮起時，他已經在走廊中間了。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['穿制服的感染者']}}}
 ]},
A4:{L:'A',n:'三樓走廊',next:'A5',
 t:`走廊暫時安靜了。你看清楚了這條走廊：301 到 306 兩兩相對，牆上嵌著一個紅色的消防栓箱，玻璃後面掛著一把消防斧。302 的門縫透出手機螢幕的冷光；306 的門開著一條縫，裡面傳出濕濕的聲音；304 的門沒關。

拖行聲又在遠處響起。你沒辦法每一間都進去。`,
 c:[
 {t:'q',l:'302：有光的那間',sign:{t:'那間像是倉庫，裡面有東西在翻找。',dc:13},ok:{t:`你推開 302 的門。床被拆掉了，兩座置物架把房間隔成兩半。一個男人蹲在架子之間，正抱著一大包蘇打餅乾往嘴裡塞，連包裝一起。

他抬起頭，嘴裡的餅乾屑混著血沫掉下來。`,fight:{n:1,mode:'normal',names:['房客模樣的感染者']},go:'A4b'}},
 {t:'q',l:'306：門縫裡有聲音的那間',sign:{t:'門縫底下露出一隻手，袖口是看護制服。',dc:14},ok:{t:`你從門縫看進去。行李推車橫在床尾，旁邊倒著一個穿淺藍色看護制服的男人，臉朝下。另一個東西跪在他旁邊，頭埋在他的肩膀裡。

它在吃。它太專心了，沒有聽見你進來。`,fight:{n:1,mode:'first',names:['跪著的感染者']},go:'A4c'}},
 {t:'q',l:'304：門沒關的那間',sign:{t:'304 安靜得過分，門縫裡沒有一點聲音。',dc:12},ok:{t:`304 整齊得過分。床鋪得平平整整，枕頭上的薄荷糖還沒被動過。只有床頭櫃的抽屜被拉出一半，浴室洗手台上放著旅館的盥洗包。鏡子上用口紅寫著：「我先上頂樓了，聽說有直升機。看到就上來。」

行李箱的夾層裡有一包急救敷料包。你把盥洗包裡的針線包也收了起來。

行李箱最底下壓著一支黃色的筆狀注射器，標籤寫著「腎上腺素自動注射筆」，主人大概有嚴重過敏。`,r:{items:{med:1,sewing:1,adrenaline:1}},p:{fear:4}}},
 {t:'q',l:'打破消防栓箱拿斧頭',k:'STR',d:10,ok:{t:`你用外套包住手肘，對準玻璃角落狠狠一撞。玻璃碎成好幾大片落在地毯上。消防斧比你想像的重，斧刃上的紅漆有幾處剝落。

你順手撿了一片又長又尖的碎玻璃，用布包好。`,r:{gear:'fireaxe',items:{glass:1,magazine:1}},p:{alarm:3}},
  ng:{t:`玻璃碎了，你的手臂也跟著穿了過去。一道長長的口子從手肘劃到手腕。你咬著牙取下斧頭，用手掌死死壓住傷口。`,r:{gear:'fireaxe'},p:{hp:-3,bleed:1,inf:3,alarm:3}}}
 ]},
A4b:{L:'A',n:'302 號房',next:'A5',
 t:`地上掉著一支還亮著的手機，螢幕停在一則未讀訊息：「今晚巡房前先量完體溫。有人發燒，立刻回報，不要讓他離開房間。」

置物架上的東西被拿走了大半。牆邊排著三只一模一樣的行李箱，裡面裝著尺寸相同的旅館制服，姓名牌全被拆掉了。`,
 c:[
 {t:'q',l:'掃一遍置物架',ok:{t:`你抓了一卷布膠帶、兩包蘇打餅乾和一瓶 75% 的外用酒精，塞進口袋就往外走。`,r:{items:{tape:1,cookie:2,alcohol:1,hairspray:1}}}},
 {t:'m',l:'仔細翻那三只行李箱',ok:{t:`三只行李箱連吊牌編號都只差一號。最上面都放著同一張巡房表：303、305、306，每晚兩次，量體溫、看瞳孔。305 那一欄從三天前起就劃掉了，旁邊寫著「已轉出」。

制服的領口內側繡著旅館的名字，底下一行小字：SINCE 1987。

第三只的夾層裡，壓著一捲沒拆封的尼龍繩和一盒長鐵釘。像是有人原本打算把什麼釘起來。`,r:{items:{rope:1,nails:1,board:1},flag:'csafe'},p:{alarm:2,fear:3}}}
 ]},
A4c:{L:'A',n:'306 號房',next:'A5',
 t:`房裡有一股濃重的鐵鏽味。

穿淺藍色看護制服的男人倒在床尾，背上被啃開了一大塊。他的右手壓在身體底下，制服腰側鼓起一塊，形狀很硬。胸前的識別證印著「ARC 合作門診　隨行看護」，名字那一格寫著：卡爾。`,
 c:[
 {t:'q',l:'把屍體翻過來',s:'智力檢定',k:'INT',d:11,ok:{t:`你抓住他的肩膀用力一翻。他比你想像的輕，臉上的表情很平靜，平靜得不像被活活吃掉的人。

制服底下壓著一把貝瑞塔 92F。你退出彈匣：只剩 4 發。備用彈匣是空的。皮夾裡還有幾張美金，和一張旅館的臨時員工證，背面燙著金字：SINCE 1987。`,r:{gear:'beretta',mag:4,flag:'csafe',usd:6}},
  ng:{t:`你的手剛碰到他，他的手指抽動了一下。你整個人往後摔，撞翻了行李推車，鐵盤和玻璃杯全砸在地上。

那只是神經反射。你喘著氣爬回去，從他身下抽出一把貝瑞塔 92F，彈匣裡只剩 4 發。走廊上傳來急促的腳步聲。`,r:{gear:'beretta',mag:4},p:{fear:10,alarm:3}}},
 {t:'q',l:'收拾推車上的東西就走',ok:{t:`你別開視線，只撿推車上撒出來的東西：一捲尼龍繩、一盒長鐵釘，和一條乾淨的毛巾。`,r:{items:{rope:1,nails:1,cloth:1,tableleg:1}}}}
 ]},
A5:{L:'A',ev:1,next:'A6'},
A6:{L:'A',n:'三樓・出口',
 t:`拖行聲越來越近了。你得離開這一層。

你想到三條路：東側樓梯，紅色的逃生燈還亮著；走廊盡頭的電梯，門縫裡一片漆黑，聞得到機油味；還有 301 的窗戶，窗外如果真有消防梯的話。`,
 c:[
 {t:'q',l:'東側樓梯',sign:{t:'逃生燈一路亮下去，應該直接通到二樓。',dc:12},ok:{t:`你推開逃生門。冷空氣帶著潮濕的水泥味灌上來。往下的階梯轉個彎就消失在紅光裡。`,go:'A6e'}},
 {t:'mv',l:'撬開電梯門，爬電梯井',s:'需要鐵撬或消防斧',req:['g:fireaxe','g:crowbar'],reqAny:1,ok:{t:`你把工具卡進電梯門縫，用全身的重量往外扳。門慢慢滑開，一股機油和腐敗混在一起的氣味湧了出來。底下很深，纜繩在黑暗裡輕輕晃動。`,go:'C1'}},
 {t:'mv',l:'徒手扳開電梯門',s:'力量檢定',k:'STR',d:14,ok:{t:`你把手指塞進門縫，咬緊牙關往外扳。門一寸一寸地滑開，一股機油和腐敗混在一起的氣味湧了出來。底下很深，纜繩在黑暗裡輕輕晃動。`,go:'C1'},ng:{t:`門縫只開了一點，又猛地彈了回去，夾住你的手指。你抽出手，指甲已經發紫了。`,p:{hp:-2,alarm:2},go:'A6'}},
 {t:'mv',l:'從 301 的窗戶爬到消防梯',s:'需要知道窗外有消防梯',need:'map',ok:{t:`你回到 301，推開窗戶。冷風灌進來，帶著焦味和遠處的警報聲。窗台外一公尺，就是生鏽的消防梯。`,go:'D1'}}
 ]},
A6e:{L:'A',n:'東側樓梯',next:'B1',
 t:`只有一盞紅色的逃生指示燈還亮著。牆上掛著一支乾粉滅火器。

你往下走了兩階就停住了。轉角的平台上站著一個人，面對著牆，一動也不動，嘴裡喃喃唸著什麼。`,
 c:[
 {t:'mv',l:'先把滅火器拿下來',k:'AGI',d:12,ok:{t:`你慢慢把滅火器從掛勾上取下。很重，壓力錶還在綠色區。你貼著牆一階一階往下，經過他身後的時候，聽清楚了他在唸什麼：「……請在房內等候……請在房內等候……」

他沒有回頭。`,r:{items:{extinguisher:2}}},
  ng:{t:`掛勾發出一聲金屬摩擦。他猛地轉過身，整張臉在紅光下發黑，嘴裡還在唸：「請在房內等候——」然後他撲了過來。`,r:{items:{extinguisher:2}},fight:{n:1,mode:'ambush',names:['樓梯間的感染者']}}},
 {t:'mv',l:'衝下去先發制人',ok:{t:`你沒給自己猶豫的時間，直接衝下樓梯。他轉過來的時候，你已經到了他面前。`,fight:{n:1,mode:'first',names:['樓梯間的感染者']}}},
 {t:'mv',l:'屏住呼吸溜過去',s:'敏捷檢定',k:'AGI',d:13,ok:{t:`你貼著牆往下走，每一階都停一下。他一直面對著牆唸那句話。你走過去了。`},
  ng:{t:`你的鞋跟在水泥階梯上滑了一下。他轉過身來。`,p:{fear:5},fight:{n:1,mode:'ambush',names:['樓梯間的感染者']}}}
 ]},
/* ---------- B 二樓 ---------- */
B1:{L:'B',n:'二樓走廊',next:'B2',
 t:`二樓的逃生門被人用椅子卡住了。你推開椅子，門內是另一條一模一樣的走廊。

不一樣的是地上。彈殼散滿了地毯，一路往西側樓梯延伸。牆上有好幾個彈孔，一具穿保全制服的屍體靠著牆坐著，頭垂在胸前。有人在這裡開過很多槍，而且最後沒能離開。

走廊兩端，各有一個身影慢慢轉向你。`,
 c:[
 {t:'q',l:'退到門框裡，一次只讓一個靠近',ok:{t:`你背靠門框站好。走廊太窄，它們只能一前一後地擠過來。第一個已經到了。`,fight:{n:2,mode:'first',names:['西側的感染者','東側的感染者']}}},
 {t:'q',l:'丟燃燒瓶',s:'需要燃燒瓶和打火機',req:['molotov','lighter'],ok:{t:`你點燃布條，把瓶子朝走廊中間用力一丟。火舌轟地竄上天花板，兩個身影在火裡扭動、尖叫，但還是朝你走來。`,r:{use:'molotov',burn:1},fight:{n:2,mode:'normal',names:['西側的感染者','東側的感染者']}}},
 {t:'q',l:'站在原地迎戰',ok:{t:`你握緊武器。它們從兩端同時朝你走來。`,fight:{n:2,mode:'normal',names:['西側的感染者','東側的感染者']}}}
 ]},
B2:{L:'B',n:'二樓走廊',next:'B3',
 t:`走廊終於安靜了。保全的屍體腰上掛著彈藥工具袋，他的左手緊緊握成拳頭。房門大多關著，只有 203 的門板上有一個彈孔，205 的門內側釘著被撞斷的木條。

拖行聲在樓上。你只能停留一下。`,
 c:[
 {t:'q',l:'搜保全的屍體',sign:{t:'保全的手裡好像握著什麼。',dc:12},ok:{t:`他的右手還握著手槍的握把，但槍管和滑套都不見了，是被硬生生扯斷的。工具袋裡沒有子彈，只剩一罐裝填火藥。

你掰開他的左手，裡面是一張皺巴巴的紙條：「一樓沒有燈。帶手電筒。」`,r:{items:{gunoil:1},flag:'darkhint'}}},
 {t:'q',l:'進 203：門上有彈孔的那間',sign:{t:'203 的書桌抽屜沒關。',dc:13},ok:{t:`衣櫃門內側貼著一張紙：「不要開門。外面的人再怎麼求你都不要開。它們聽得到聲音，一開門就會全部進來。」

書桌抽屜裡有一把剪刀、一卷膠帶，和一本被翻爛的露營雜誌。摺角的那一頁，教人用 PVC 水管做弓：兩端用火烤軟彎成弓臂，膠帶固定，綁上繩子當弓弦。`,r:{gear:'scissors',items:{tape:1,hanger:2},learn:'pvcbow'}}},
 {t:'q',l:'進 205：門被釘過的那間',sign:{t:'205 的門是從裡面釘起來的，有人想把自己關在裡面。',dc:13},ok:{t:`門板內側被釘了三道木條，全被從外面撞斷了。書桌上有一個工具包：一把羊角鎚、一盒長釘。

旁邊的草圖畫著門栓的加固方式。紙的背面也有畫：一支球棒，棒頭從各個方向釘滿長釘，旁邊寫著「如果門擋不住」。`,r:{gear:'hammer',items:{nails:1,pipe:1},learn:'nailbat'}}},
 {t:'q',l:'進 206：門邊擺著行李的那間',sign:{t:'206 門邊的行李都打包好了，住客好像隨時準備要走。',dc:13},ok:{t:`床上丟著一支被拆開的手電筒，電池被拿走了，燈泡還是好的。行李箱上的防潮盒裡，用面紙一發一發包著 3 發 9×19mm 子彈，盒蓋貼著便利貼：「別在走廊開槍。它們聽得到。」`,r:{items:{deadlight:1,ammo9:3}}}}
 ]},
B3:{L:'B',ev:1,next:'B4'},
B4:{L:'B',n:'二樓・出口',
 t:`彈殼一路滾向西側樓梯，扶手上有一串乾掉的血手印，越往下越模糊。

走廊另一端有一扇不起眼的門，上面貼著「員工專用」，門縫裡飄出一股淡淡的、甜甜的臭味。`,
 c:[
 {t:'mv',l:'西側樓梯',sign:{t:'彈殼一路掉到樓下，這條樓梯通到一樓。',dc:12},ok:{t:`你沿著血手印往下走。每一個手印都比上一個更歪斜，像是那個人每往下一階，就更沒力氣一點。一樓的逃生門開著，門後是完全的黑暗。`,go:'E1'}},
 {t:'mv',l:'員工專用門',sign:{t:'門後飄來一股甜甜的臭味，像是廚房。',dc:13},ok:{t:`門後是一道狹窄的員工樓梯，牆上的油漆被蒸氣燻得發黃。越往下，那股甜甜的臭味越重。你認得這個味道。是瓦斯。`,go:'F1'}}
 ]},
/* ---------- C 電梯井 ---------- */
C1:{L:'C',env:'shaft',n:'電梯井',next:'C2',
 t:`你攀上纜繩。鋼索冰冷油膩，在你手裡輕輕晃動。往下看，只有黑暗；往上看，三樓的電梯門縫透著一線紅光，越來越遠。

井道裡的回音很怪。你每喘一口氣，都會從很深的地方傳回來兩次。`,
 c:[
 {t:'q',l:'用腳夾著纜繩慢慢滑下去',s:'敏捷檢定',k:'AGI',d:11,ok:{t:`你用鞋底夾住鋼索，一點一點往下放。手掌被磨得發燙，但你穩住了。`},
  ng:{t:`你的手一滑，整個人往下墜了好幾公尺才抓住鋼索。手掌的皮被磨掉一層，肩膀撞在井壁上。`,p:{hp:-4,fear:6}}},
 {t:'q',l:'用布纏住手再往下',s:'需要布料（會用掉一份）',req:'cloth',ok:{t:`你把布料纏在手上，抓著鋼索往下滑。布很快就被磨穿了，但手掌沒事。`,r:{use:'cloth'}}}
 ]},
C2:{L:'C',n:'電梯車廂頂',next:'C3',
 t:`你踩到了一個平面。是電梯車廂的頂板，停在一樓和二樓之間。檢修蓋開著，底下的車廂裡沒有燈。

有東西在車廂裡動。很慢。撞到牆，轉向，再撞到牆。`,
 c:[
 {t:'q',l:'從檢修口往下看',s:'感知檢定',k:'PER',d:12,ok:{t:`車廂裡是一個穿西裝的男人，額頭撞得血肉模糊。他還在一下一下地撞著電梯門，像是以為門總有一天會打開。

角落裡有一個公事包，旁邊掉著一支手電筒，還亮著微弱的光。你從檢修口伸手，勾到了手電筒。`,r:{items:{flashlight:1}}},
  ng:{t:`你探頭的那一刻，一隻手從黑暗裡伸上來，抓住了你的衣領。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['車廂裡的感染者']}}},
 {t:'q',l:'不管車廂，繼續往下爬',s:'敏捷檢定',k:'AGI',d:12,ok:{t:`你繞過車廂邊緣，沿著另一側的鋼索往下爬。車廂裡的撞擊聲一直跟著你。`},
  ng:{t:`你的腳踩空，整個人從車廂邊緣滑下去，膝蓋重重撞在導軌上。底下的撞擊聲停了。`,p:{hp:-3,frac:1}}}
 ]},
C3:{L:'C',env:'shaft',ev:1,next:'C4'},
C4:{L:'C',n:'電梯井底',
 t:`你的腳終於踩到了地面。井底積著一層黑色的水，水面上浮著一層油膜。空氣又悶又甜，帶著一股你說不出來的、像是爛掉的植物的味道。

井底的維修門開著一條縫，門後是地下設備層。`,
 c:[
 {t:'mv',l:'推開維修門',sign:{t:'門後有機器低低的運轉聲，是地下設備層。',dc:13},ok:{t:`門軸發出一聲長長的嘎吱。門後的空氣更重了，像是有人把一整座溫室悶在地底下，讓它慢慢爛掉。`,go:'G1'}}
 ]},
/* ---------- D 外牆消防梯 ---------- */
D1:{L:'D',n:'外牆',next:'D2',
 t:`你爬出窗戶。風從兩棟大樓之間灌進來，把你的衣服吹得獵獵作響。消防梯鏽得很厲害，每踩一階都會發出一聲呻吟。

從這裡看得到整條街。車子塞成一片，沒有一輛在動。遠處幾個路口拉起了封鎖線，探照燈在大樓之間來回掃。一架沒有任何標誌的直升機低低地飛過。`,
 c:[
 {t:'q',l:'看清楚街上的情況',s:'感知檢定',k:'PER',d:11,ok:{t:`封鎖線後面有人在走動，穿著全套防護衣，戴著面罩。他們沒有在救人。他們在把什麼東西搬上卡車，一個接一個，用黑色的袋子裝著。

你看見其中一個人抬頭，朝旅館的方向看了一眼。你縮回陰影裡。`,p:{fear:6},r:{flag:'saw_cordon'}},
  ng:{t:`風太大了，你的眼睛被吹得睜不開。你只能抓緊扶手，一階一階往下。`}},
 {t:'q',l:'不看，專心往下爬',ok:{t:`你盯著自己的腳，一階一階往下。風聲蓋過了一切。`}}
 ]},
D2:{L:'D',n:'消防梯・二樓平台',next:'D3',
 t:`二樓的平台上，有一扇窗戶開著，窗簾被風吹得往外翻。房間裡很暗。

平台的另一頭蹲著一個人，背對著你，正在啃自己的手指。消防梯很窄，你得從他身邊過去。`,
 c:[
 {t:'q',l:'趁他沒注意，一腳把他踹下去',s:'力量檢定',k:'STR',d:13,ok:{t:`你衝上前，用盡全力一腳踹在他背上。他翻過欄杆，沒有叫，就這樣掉進了底下的巷子裡。很久之後，你才聽到落地的聲音。`},
  ng:{t:`你的腳踹在他背上，他晃了一下，卻抓住了欄杆。他慢慢轉過頭來，嘴裡還咬著自己的手指。`,fight:{n:1,mode:'normal',names:['平台上的感染者']}}},
 {t:'mv',l:'從開著的窗戶進二樓',sign:{t:'從這扇窗進去，可以避開上面那個人。',dc:13},ok:{t:`你翻進窗戶，落在一張床上。是 202 號房。窗戶被報紙糊了一半，門後立著一支金屬球棒。你拿起球棒，推開房門，走進二樓的走廊。`,r:{gear:'bat'},go:'B2'}},
 {t:'q',l:'正面打過去',ok:{t:`你握緊武器朝他走過去。他聽到了，慢慢站起來，轉過身，嘴邊全是血。`,fight:{n:1,mode:'normal',names:['平台上的感染者']}}}
 ]},
D3:{L:'D',ev:1,next:'D4'},
D4:{L:'D',n:'消防梯・底部',
 t:`消防梯的最後一段被拉起來了，離地面還有三公尺。底下是旅館的後巷，堆滿了垃圾袋和廚房的油桶。

巷子的盡頭通往大街。另一邊，廚房的後門半開著，門內透出一點火光。`,
 c:[
 {t:'q',l:'跳下去，直接從後巷離開',s:'敏捷檢定',sign:{t:'後巷沒有圍牆，跳下去就能離開旅館。',dc:13},k:'AGI',d:11,ok:{t:`你翻過欄杆，懸在半空，然後放手。落地的時候你順勢一滾，垃圾袋接住了你。`,go:'END_alley'},
  ng:{t:`你落地的時候腳一歪，一陣劇痛從腳踝竄上來。你咬著牙爬起來，一跛一跛地往巷口走。`,p:{hp:-3,frac:1},go:'END_alley'}},
 {t:'mv',l:'跳下去，進廚房後門',sign:{t:'那扇後門通往員工廚房，裡面也許還有東西。',dc:13},ok:{t:`你跳進後巷，推開廚房的後門。火光是瓦斯爐上一圈小小的藍色火焰，旁邊的鍋子已經燒乾了。

空氣裡全是瓦斯味。`,go:'F2'}}
 ]},
/* ---------- E 一樓 ---------- */
E1:{L:'E',n:'一樓走廊',next:'E2',
 t:`一樓沒有燈。不是停電的那種暗，是連緊急照明都沒有的那種暗。你站在樓梯口，眼睛花了很久才適應，只能勉強看見走廊的輪廓。遠處接待大廳的方向，透進一點點街燈的橘光。

走廊東端，有個東西正貼著牆移動。很慢。它停了下來，像是在聽。`,
 c:[
 {t:'q',l:'貼著牆等它過去',s:'體質檢定',k:'CON',d:12,ok:{t:`你把呼吸放到最慢。它在走廊中間站了很久，頭一下一下往旁邊偏，像狗在聞氣味。然後它轉了個方向，一拐一拐地走進交誼廳。`},
  ng:{t:`你的肚子發出一聲響。在這麼安靜的走廊裡，那聲音大得荒謬。它的頭立刻轉過來。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['貼著牆的感染者']}}},
 {t:'q',l:'主動迎上去',ok:{t:`你不想讓它先找到你。在黑暗裡，你只看得到它的輪廓，和那雙在橘光下反光的眼睛。`,fight:{n:1,mode:'normal',names:['貼著牆的感染者']}}}
 ]},
E2:{L:'E',n:'一樓走廊',next:'E3',
 t:`辦公室、備品間和公共衛浴的門沿著走廊排開，櫃台後面還有一間行李寄放間。拖行聲還在遠處，你沒辦法每一扇都打開。`,
 c:[
 {t:'q',l:'辦公室',sign:{t:'門縫裡看得到牆角有一個保險箱。',dc:13},ok:{t:`值班書桌上的電話聽筒垂在桌邊。值班表上寫著一條撤離指示：「從一樓大廳南側推門離館。」最下面另外加了一行：「303、305、306 由門診人員負責，房務一律不要進去。」

桌墊底下壓著一張經理的便條：「保險箱密碼改回開幕那年了，別再把號碼貼在桌上。」

牆角有一個四位數的轉盤保險箱。辦公室最裡面是一扇比任何門都厚的鐵門，讀卡器熄著，門框上有一個被刮掉一半的標記：一根杖，杖上纏著一條蛇。`,r:{flag:'csafe'},go:'E2o'}},
 {t:'q',l:'備品間',sign:{t:'門內有布料撕裂的聲音。',dc:13},ok:{t:`你一腳踹開門。一個穿廚師服的人站在布巾架前，正用牙齒把一條毛巾撕開。布從他嘴角掉下來，上面全是血。`,fight:{n:1,mode:'first',names:['穿廚師服的感染者']},go:'E2s'}},
 {t:'q',l:'公共衛浴',sign:{t:'衛浴那邊傳來滴水聲。',dc:12},ok:{t:`滴答，滴答。鏡子碎了一半，剩下的那一半映出你的臉，比你記憶中蒼白得多。洗手台下的維修櫃裡有一瓶外用酒精。鏡子有一片又長又尖，你用布包住，扳了下來。

最裡面的隔間門關著，水箱上放著一瓶沒開過的礦泉水，和一張用口紅寫的字條：「我出去找人了。水給你。」`,r:{items:{alcohol:1,glass:1,water:1,mop:1}}}},
 {t:'q',l:'行李寄放間',sign:{t:'那扇門沒有鎖。',dc:12},ok:{t:`你繞到櫃台後面。寄放間的門虛掩著，裡面有東西在撞。`,go:'E2x'}}
 ]},
E2o:{L:'E',n:'辦公室',next:'E3',
 t:`保險箱的轉盤上沒有任何提示。四位數。

牆上掛著一個白色的員工急救箱。`,
 c:[
 {l:'輸入 1987',s:'旅館開幕那年',need:'csafex2',ok:{t:`你把轉盤轉到 1，9，8，7。最後一格落下，保險箱喀一聲彈開了。

裡面用絨布包著一把 S&W Model 10 左輪。彈巢裡裝了 2 發，旁邊還有 2 發散裝的 .38 特殊彈。絨布底下壓著一張紙：「303、305、306 有狀況，先鎖門，再打門診的電話。不要報警。」旁邊還有一疊用橡皮筋綁著的零用金，夠每個人分一份。`,r:{gear:'model10',mag:2,items:{ammo38:2,blade:1},usdAll:20}}},
 {t:'q',l:'聽轉盤試著開',k:'INT',d:16,ok:{t:`你把耳朵貼在保險箱上，一格一格地轉。終於聽見彈片落下的聲音。裡面是一把 S&W Model 10 左輪，彈巢裡裝了 2 發，旁邊還有 2 發 .38 特殊彈。`,r:{gear:'model10',mag:2,items:{ammo38:2,blade:1}}},
  ng:{t:`你轉了好幾圈，什麼都沒聽到。再轉下去只是浪費時間。也許密碼就藏在這間旅館的某個地方。`,p:{alarm:1}}},
 {t:'q',l:'打開急救箱',ok:{t:`急救箱裡還剩兩捲繃帶、一瓶優碘和一包止痛藥。箱門內側貼著緊急聯絡電話，最上面那支被圈起來，旁邊寫著：「打了沒人接」。`,r:{items:{bandage:2,iodine:1,painkiller:1}}}}
 ]},
E2s:{L:'E',n:'備品間',next:'E3',
 t:`備品間裡堆滿了東西：布巾架、備品架、掛滿維修用具的工具架。地上有一道拖曳的血痕，盡頭倒著一個人。`,
 c:[
 {t:'q',l:'工具架',ok:{t:`工具架上剩下一根鐵撬、半捲膠帶，還有一截一公尺長的 PVC 水管，最上層掛著一頂白色的工地安全帽。鐵撬很重，握在手裡很踏實。`,r:{gear:'crowbar',items:{tape:1,pvc:1,pipe:1,superglue:1,pliers:1,hardhat:1}}}},
 {t:'q',l:'備品架和布巾架',ok:{t:`備品架後面卡著一個員工急救袋，裡面有一包急救敷料包。布巾架最下層的防潮袋裡，還有兩條乾的擦拭布。

門邊牆上掛著一個 AED 箱，箱門開著，機器還在，電池燈亮著綠色。`,r:{items:{med:1,cloth:2,aed:1}}}},
 {t:'q',l:'掰開那個人的手',s:'智力檢定',k:'INT',d:10,ok:{t:`他手裡攥著一張撕爛的房務單，背面用紅筆寫著：「大廳的玻璃破了，它們從那裡進來。往樓上跑。」外套口袋裡有一包止痛藥，和一小瓶野營用燃料。`,r:{items:{painkiller:1,fuel:1,sedative:1}}},
  ng:{t:`你碰到他手指的那一刻，那隻手握得更緊了。只是屍體的僵直，你告訴自己。你沒有再試。`,p:{fear:8}}}
 ]},
E3:{L:'E',ev:1,next:'E4'},
E4:{L:'E',n:'一樓・出口',
 t:`走廊盡頭分成兩條路。一條通往接待大廳，那裡有光，有大門。另一條是往地下室的樓梯，鐵門上貼著「機房重地」，門縫裡吹出一股又悶又甜的風。`,
 c:[
 {t:'mv',l:'接待大廳',sign:{t:'大廳就是出去的路，但那裡的動靜不小。',dc:13},ok:{t:`你朝那一點橘光走過去。`,go:'I1'}},
 {t:'mv',l:'地下室樓梯',sign:{t:'樓梯往下通到地下設備層。',dc:13},ok:{t:`你推開鐵門。樓梯往下延伸，空氣越來越重，像是有人把一整座溫室悶在地底下，讓它慢慢爛掉。`,go:'G1'}}
 ]},
/* ---------- F 員工廚房 ---------- */
F1:{L:'F',n:'員工廚房',next:'F2',
 t:`員工廚房很大，不鏽鋼工作台排成兩列，掛勾上的鍋具在通風口吹出來的風裡輕輕碰撞。瓦斯爐上還開著一圈小小的藍色火焰，旁邊的鍋子已經燒乾了。

瓦斯味重得讓人頭暈。冷凍庫的門關著，門裡傳來一下一下的撞擊聲。`,
 c:[
 {t:'q',l:'先把瓦斯關掉',k:'INT',d:11,ok:{t:`你沿著管線找到牆上的總開關，用力一扳。藍色的火焰熄滅了。瓦斯味還在，但至少不會再變濃了。`,r:{flag:'gasoff'}},
  ng:{t:`管線太多了，你找不到總開關。你只能把爐火關掉，然後盡量不要在這裡待太久。`,p:{inf:2}}},
 {t:'sd',l:'不管它，先找東西',sign:{t:'刀架上還掛著刀。',dc:12},ok:{t:`你從刀架上取下一把菜刀，刀刃很利。料理台的櫃子裡還有幾罐沒開過的罐頭和一包泡麵。`,r:{gear:'kitchenknife',items:{noodle:1,bar:1,chopsticks:1,whetstone:1}}}}
 ]},
F2:{L:'F',n:'員工廚房',next:'F3',
 t:`冷凍庫的撞擊聲停了。

門把慢慢往下轉。門開了一條縫，一股白色的冷氣從縫裡湧出來，貼著地板往外流。一隻凍得發紫的手，抓住了門框。`,
 c:[
 {t:'q',l:'用身體把門頂回去',s:'力量檢定',k:'STR',d:13,ok:{t:`你整個人撞在冷凍庫門上，把那隻手夾在門框裡。門內傳來一聲悶悶的嚎叫。你抓起一支湯勺，卡進門把裡。撞擊聲又開始了，但門打不開了。`},
  ng:{t:`你撞上去的時候，門已經被推開了一半。一個穿廚師服的人從冷氣裡走出來，全身結著一層薄霜，眼睛是白色的。`,fight:{n:1,mode:'normal',names:['冷凍庫裡的感染者']}}},
 {t:'q',l:'準備好，等它出來',ok:{t:`你站在門邊，舉起武器。門一推開，你就揮了下去。`,fight:{n:1,mode:'first',names:['冷凍庫裡的感染者']}}},
 {t:'q',l:'開槍',req:'gun',ok:{t:`你舉起槍，扣下扳機。

槍口的火光點燃了空氣。`,p:{hp:-10,fear:10},r:{gasboom:1},go:'F3'}}
 ]},
F3:{L:'F',ev:1,next:'F4'},
F4:{L:'F',n:'員工廚房・出口',
 t:`廚房有兩個出口。一扇是通往大廳的雙開門，門上的圓窗透出一點橘光。另一扇是後門，外面是後巷，有一部載貨用的小電梯，鐵柵門開著。`,
 c:[
 {t:'mv',l:'雙開門，去大廳',sign:{t:'雙開門另一邊就是大廳，那裡的動靜不小。',dc:13},ok:{t:`你推開雙開門，穿過一條短短的走道，眼前就是接待大廳。`,go:'I1'}},
 {t:'q',l:'後門，從後巷離開',sign:{t:'後門外面就是後巷，可以直接離開旅館。',dc:13},ok:{t:`你推開後門。後巷堆滿了垃圾袋，巷口外就是大街。你頭也不回地往外走。`,go:'END_alley'}}
 ]},
/* ---------- G 地下設備層 ---------- */
G1:{L:'G',n:'地下設備層',next:'G2',
 t:`地下設備層的天花板很低，管線在頭頂交錯。牆角、管線上、地板的縫隙裡，長滿了一種你沒見過的東西：鮮紅色的，一條一條，粗的像手指，細的像頭髮，從排水溝那頭沿著牆一路長過來，分岔，再分岔，像人身上的血管。

它們在跳。一下，一下，很慢，跟脈搏一樣。

這些紅色的東西一路長到一個人身上。他半個身體已經被包住，靠著牆坐著。他的胸口還在起伏。`,
 c:[
 {t:'q',l:'用布遮住口鼻再前進',s:'需要布料（會用掉一份）',req:'cloth',ok:{t:`你把布料浸濕，綁在臉上。氣味淡了一點，但那股甜膩的感覺還是黏在喉嚨裡。`,r:{use:'cloth',flag:'mask'}}},
 {t:'q',l:'看清楚那個人',s:'智力檢定',k:'INT',d:13,ok:{t:`你逼自己走近。他的眼睛還睜著，看著你。他的嘴唇動了動，你聽不清楚，只看得出嘴型。

「……停……不……下來……」

那些紅色的東西從他的皮膚底下長出來，又長回牆裡，跟著他的心跳一起鼓。他不是被什麼東西抓住了。他是變成了這個東西的一部分。`,p:{fear:12},r:{flag:'saw_bed'}},
  ng:{t:`你只走了兩步就停下來了。那個人的頭轉向了你。他的脖子發出一聲像濕布被撕開的聲音。你轉身就走，不敢再看。`,p:{fear:15}}},
 {t:'q',l:'不看，直接往前走',ok:{t:`你低著頭，沿著管線往前走，盡量不碰到任何一條紅色的東西。`}}
 ]},
G2:{L:'G',n:'配電室',next:'G3',
 t:`配電室的門開著。裡面有一台大型的備用發電機，旁邊的配電盤上，大部分的開關都被扳到了「關」。

配電盤上貼著一張手寫的紙：「地下讀卡門　獨立迴路　沒有授權切勿強制啟動」。`,
 c:[
 {t:'q',l:'啟動發電機',k:'INT',d:12,ok:{t:`你按照發電機側面的說明，打開燃料閥、拉動啟動繩。第三次的時候，機器咳了兩聲，轟隆隆地轉了起來。

配電盤上的燈一個接一個亮起。走廊深處，有一扇門的讀卡器，亮起了綠燈。

天花板裡傳來一陣嗡嗡聲。樓上的燈，大概也跟著亮了。`,r:{flag:'power'},p:{alarm:3}},
  ng:{t:`你拉了好幾次啟動繩，發電機只是咳了幾聲，又安靜下來。聲音已經傳出去了。`,p:{alarm:3}}},
 {t:'q',l:'只拿配電室裡的東西',ok:{t:`牆角有一個維修工具箱。裡面有一捲膠帶、幾段電線，還有一個濾毒罐已經過期的防護面罩。`,r:{items:{tape:1,hanger:2},flag:'mask'}}}
 ]},
G3:{L:'G',ev:1,next:'G4'},
G4:{L:'G',n:'地下設備層・盡頭',
 t:`走廊的盡頭有兩扇門。

一扇是貨梯，鐵柵門開著，往上可以通到一樓的接待大廳後方。

另一扇是一道厚重的鐵門，和辦公室裡那扇一模一樣。門框上的標記沒有被刮掉：一根杖，杖上纏著一條蛇，杖頭被畫成了針頭的形狀。讀卡器是熄著的。`,
 c:[
 {t:'mv',l:'搭貨梯上去',sign:{t:'貨梯會停在接待大廳後面。',dc:13},ok:{t:`你拉上鐵柵門，按下按鈕。貨梯晃了一下，嘎吱嘎吱地往上升。`,go:'I1'}},
 {t:'q',l:'看看那扇鐵門',s:'需要先恢復電力',need:'power',ok:{t:`讀卡器的小螢幕亮了起來：「S 區　請感應授權卡」。門沒有開。

門上有一道窄窄的強化玻璃窗。玻璃後面是一道往下的樓梯，乾淨得不像是這間旅館的一部分。白色的牆，白色的燈。樓梯的盡頭，有一扇玻璃門，門上印著一個你在醫療收據上看過的標誌。

門的另一邊傳來一個聲音。很遠，很平靜，像是錄音：

「第二期受試者，請在房內等候。」`,go:'END_lab'}}
 ]},
/* ---------- I 接待大廳 ---------- */
I1:{L:'I',n:'接待大廳',next:'I2',
 t:`接待大廳一片狼藉。南側整面落地窗破了一個大洞，街燈的橘光從洞裡照進來，照著滿地的碎玻璃、翻倒的行李推車，和拖了一路的血。大門就在那裡，二十步的距離。

櫃台後面沒有人。電腦螢幕是黑的，電話聽筒垂在桌邊晃。櫃台前面跪著一個人，背對著你，頭埋在地上那個穿接待員背心的人身上。

沙發區還有一個，一直在原地打轉，撞到茶几，轉個方向，又撞到。`,
 c:[
 {t:'q',l:'丟燃燒瓶',s:'需要燃燒瓶和打火機',req:['molotov','lighter'],ok:{t:`你點燃布條，把瓶子朝櫃台前丟過去。火焰轟地炸開。跪著的那個站了起來，背上帶著火朝你走來。沙發區那個也轉過來了。`,r:{use:'molotov',burn:1},fight:{n:2,mode:'normal',names:['跪在櫃台前的感染者','沙發邊的感染者']}}},
 {t:'q',l:'貼著柱子溜向大門',k:'AGI',d:14,ok:{t:`你貼著柱子的陰影移動，每一步都先試過腳下有沒有玻璃。啃食的聲音一直沒有停。十步，五步，你的手碰到了冰冷的門把。`,go:'END_main'},
  ng:{t:`你踩碎了一片玻璃。在這麼安靜的大廳裡，那聲音清脆得刺耳。櫃台前那顆頭猛地抬起來，嘴裡還咬著東西。`,p:{fear:8},fight:{n:2,mode:'ambush',names:['跪在櫃台前的感染者','沙發邊的感染者']}}},
 {t:'q',l:'推一台行李推車出去引開它們',k:'INT',d:13,ok:{t:`你扶起一台行李推車，朝電梯那頭用力一推。推車一路滑過大理石地板，撞上電梯門，聲音在大廳裡來回彈。兩個都朝那邊撲了過去。

你從另一邊溜到大門。`,go:'END_main'},ng:{t:`推車滑到一半撞上柱子，停了。它們轉過頭來，看的不是推車，是推車後面的你。`,p:{fear:6},fight:{n:2,mode:'normal',names:['跪在櫃台前的感染者','沙發邊的感染者']}}},
 {t:'q',l:'趁它們還沒發現，先動手',ok:{t:`你不想從它們身邊溜過去，再賭它們不會回頭。你握緊武器，朝櫃台前那個背影走過去。`,fight:{n:2,mode:'first',names:['跪在櫃台前的感染者','沙發邊的感染者']}}}
 ]},
I2:{L:'I',n:'接待大廳',
 t:`大廳安靜下來了。櫃台上攤著入住簿，旁邊倒著那個穿接待員背心的人，胸前的名牌寫著「夜班」。大門就在那裡。`,
 c:[
 {t:'q',l:'看一眼入住簿再走',ok:{t:`入住簿最後幾頁被撕掉了。剩下的那幾頁，有三間房被另外註記「ARC 合作門診　長期包房　追蹤觀察」：303、305、306。付款欄是同一個單位，已經付到下個月底。305 那一行三天前被劃掉，旁邊寫著「已轉出」。

那三間房，都在你那一層。`,p:{fear:6},go:'END_main'}},
 {t:'q',l:'推開大門',ok:{t:`你沒有回頭。`,go:'END_main'}}
 ]}
};
/* ---------- 隨機事件（每個小關從中抽一個沒遇過的） ---------- */
const EVPOOL=[
 {id:'lights',t:`緊急照明突然全滅了。黑暗裡，有東西在地上拖行，越來越近。`,c:[
  {t:'q',l:'貼著牆不動',k:'CON',d:11,ok:{t:`你屏住呼吸數到二十。拖行聲經過你面前，然後遠去。燈重新亮了起來。`},ng:{t:`你忍不住往後退，腳跟撞到了什麼。拖行聲停了。`,p:{fear:6},fight:{n:1,mode:'ambush'}}},
  {t:'q',l:'摸黑往前走',k:'AGI',d:12,dark:1,ok:{t:`你摸著牆走到轉角。緊急照明重新亮起來的時候，你才發現自己走偏了，站在另一條走廊上。`},ng:{t:`你被地上的東西絆倒，膝蓋重重撞在地上。`,p:{hp:-3}}}]},
 {id:'name',t:`身後有人在叫：「救我……拜託……有沒有人……」

是個男人的聲音，很近，喘得很厲害。`,c:[
  {t:'q',l:'不回頭，繼續走',k:'INT',d:12,ok:{t:`你咬著牙往前走。那個聲音一直在求救，然後變成尖叫，然後就沒有了。`,p:{fear:6}},ng:{t:`你還是回頭了。一個男人扶著牆朝你走過來，脖子上一大片咬痕，嘴裡還在說「救我」。他的眼睛已經不對了。他撲了過來。`,p:{fear:10},fight:{n:1,mode:'ambush',names:['還在說話的感染者']}}},
  {t:'q',l:'回頭看',ok:{t:`走廊盡頭，一個男人扶著牆慢慢滑坐下去。他的脖子被咬開了一個口子，血從指縫裡一直冒出來。他看著你，張開嘴，什麼都沒說出來。

他不動了。過了一會兒，他的手指又抽動了一下。你沒有等著看接下來會怎樣。`,p:{fear:12}}}]},
 {id:'floor',t:`地毯上有東西在微光下反光。`,c:[
  {t:'q',l:'蹲下來看',k:'PER',d:12,dark:1,ok:{t:`是一發掉在地上的 9×19mm 子彈。`,r:{items:{ammo9:1}}},ng:{t:`只是碎玻璃。你的手被割了一下。`,p:{hp:-1,inf:1},r:{items:{glass:1,magazine:1}}}},
  {t:'q',l:'不理它',ok:{t:`你跨過那片反光，沒有停下腳步。`}}]},
 {id:'blood',t:`這一段地板濕透了，踩上去會發出聲音。血一路延伸到前面的轉角。`,c:[
  {t:'q',l:'踩著乾的地方走',k:'AGI',d:11,ok:{t:`你踮著腳走過血泊，沒有發出半點聲音。`},ng:{t:`你腳下一滑，整個人摔進血泊裡，腳踝傳來一聲悶響。`,p:{hp:-2,frac:1}}},
  {t:'q',l:'沿著血跡看過去',k:'PER',d:12,dark:1,ok:{t:`轉角後面沒有人，只有一卷沒用完的繃帶。`,r:{items:{bandage:1,tourniquet:1}}},ng:{t:`轉角後面有人。只是，已經不是人了。`,p:{fear:6},fight:{n:1,mode:'ambush'}}}]},
 {id:'radio',t:`不知道哪裡傳來收音機的聲音，斷斷續續：「……市府宣布……暫時封鎖……請民眾留在室內……等候……」雜訊吞掉了後面的字。`,c:[
  {t:'sd',l:'找到收音機',dl:'繼續仔細翻收音機附近',k:'PER',d:11,ok:{t:`收音機在一張推車的下層，旁邊有一包沒拆的能量棒。你關掉收音機，世界一下子安靜得可怕。`,r:{items:{bar:1,chopsticks:1}}},ng:{t:`你循著聲音找過去，收音機突然停了。你站在原地，聽見自己身後也有東西停了下來。`,p:{fear:8,alarm:2}}},
  {t:'q',l:'不理它，繼續走',ok:{t:`「……不要前往醫院……」那是你聽見的最後幾個字。`,p:{fear:3}}}]},
 {id:'survivor',t:`一扇門後面傳來壓低的聲音：「外面……還有人嗎？」是一個活人。聲音在發抖。`,c:[
  {t:'q',l:'「有。你還好嗎？」',ok:{t:`門開了一條縫，一個穿睡衣的中年女人看著你，眼睛紅腫。她說她先生聽到槍聲就下樓去看，一直沒有回來。她塞給你一瓶水和一包餅乾，然後又把門關上了。

「我要等他，」她隔著門說，「他說會回來的。」`,r:{items:{water:1,cookie:1,cigarette:1}},p:{fear:-5}}},
  {t:'q',l:'說服她開門跟你走',s:'統帥檢定',k:'CHA',d:13,ok:{t:`你隔著門跟她說了很久：外面還有路、你知道出口、一個人等下去只會餓死。門鎖喀的一聲打開了。她不肯跟你走，但把房裡剩下的東西都塞給了你，還有一盒她先生的香菸。

「如果你出去了，」她說，「幫我跟外面的人說，這裡還有人。」`,r:{items:{water:1,cookie:1,cigarette:2,sedative:1}},p:{fear:-8}},ng:{t:`你講得太急了。門後安靜了一下，然後她開始尖叫，叫你走開，叫得整條走廊都聽得到。`,p:{fear:4,alarm:3}}},
  {t:'q',l:'不出聲，繼續走',k:'INT',d:10,ok:{t:`你沒有回答。門後的聲音問了好幾次，最後變成啜泣。你走了。`,p:{fear:4}},ng:{t:`你停下了腳步，但還是沒有開口。門後的人聽見了你的腳步聲，開始拍門大喊：「我知道你在外面！拜託，不要丟下我！」整條走廊都聽得到。`,p:{fear:6,alarm:3}}}]},
 {id:'body',t:`一具屍體倒在路中間，臉朝下，背包還背在身上。`,c:[
  {t:'q',l:'翻他的背包',k:'INT',d:11,ok:{t:`背包裡有一卷繃帶、一瓶礦泉水，還有一張全家福和一個皮夾。你把照片留下了。`,r:{items:{bandage:1,water:1,sock:1,coin:1},usd:4}},ng:{t:`你剛碰到背包，他的頭轉了過來。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['還有呼吸的人']}}},
  {t:'q',l:'繞過去',ok:{t:`你貼著牆繞過他，盡量不看他的臉。`}}]},
 {id:'smell',t:`空氣裡有一股甜膩的味道，像是放了很久的水果。味道越來越重，你的頭開始發暈。`,c:[
  {t:'q',l:'用布摀住口鼻快步通過',req:'cloth',ok:{t:`你用布摀住口鼻，加快腳步。走過那一段之後，頭暈慢慢退了。`}},
  {t:'q',l:'憋氣衝過去',k:'AGI',d:11,ok:{t:`你深吸一口氣，一口氣衝過去。`},ng:{t:`你沒憋住，吸了一大口。喉嚨像被什麼東西刮過，你咳了很久。`,p:{inf:6}}}]}
];
/* ---------- 結局 ---------- */
const END={
 END_main:{n:'南門',shards:30,t:`你推開大門。冷風灌進來，帶著焦味和遠處的警報聲。

街上沒有救護車，也沒有人來救。路口的警察已經不見了，警車的門開著，車頂的警示燈還在空轉。

你把領子拉高，握緊手上的武器。這座城市正在一點一點地死去，而你還不知道為什麼。你只知道一件事：那家門診包下的幾間房，就在你房間的隔壁。`},
 END_alley:{n:'後巷',shards:22,t:`你走出後巷，混進大街上逃難的人潮裡。沒有人看你一眼，每個人都在跑，往同一個方向，那個方向只有更多的車和更多的封鎖線。

你回頭看了一眼旅館。三樓的某扇窗戶後面，有一個人影正看著你。

你轉身跟著人潮跑。你知道自己逃掉了什麼，但你不知道自己錯過了什麼。`},
 END_lab:{n:'地下',shards:40,t:`你沒有授權卡，那扇門不會為你打開。

你隔著玻璃看了很久，直到發電機的聲音把什麼東西引了過來。讀卡器的光在你身後熄滅。

你從貨梯回到大廳，推開南門，走進夜色裡。那個標誌一直跟著你：一根杖，一條蛇，一根針。你會再見到它的。你很確定。`}
};
/* ================= 第一章延伸：旅館加長 ================= */
Object.assign(LV,{
 R:{n:'頂樓',sub:'水塔',en:'LEVEL R · ROOFTOP',rule:'風聲蓋過一切：發出的聲音不會提高警戒，但有效感知 −2；離開後恢復。',fx:{noAlarm:1,per:-2},ch:1},
 H:{n:'洗衣房',sub:'員工宿舍',en:'LEVEL H · LAUNDRY',rule:'滿地積水，水管一直在滴：每次提高警戒時少 1；地板濕滑，有效敏捷 −1，連帶影響相關攻防、先攻；離開後恢復。',fx:{alarmMinus:1,agi:-1},ch:1},
 P:{n:'地下停車場',sub:'B2',en:'LEVEL P · CAR PARK',rule:'一片漆黑，而且車子會叫：沒有裝手電筒且沒有夜貓子天賦時，有效感知 −2；戰鬥開始時警戒 +1。',fx:{dark:1,fightAlarm:1},ch:1}
});
Object.assign(N,{
/* ---------- A 三樓：製冰機間 ---------- */
A3x:{L:'A',n:'製冰機間',next:'A4',
 t:`走廊轉角有一個小隔間，門牌寫著「製冰機・販賣機」。

停電之後，製冰機不響了，冰槽裡的冰在融化，水從機器底下一直流出來。販賣機的燈全黑，飲料隔著玻璃排得整整齊齊。

地上那灘水是粉紅色的。製冰機和牆之間的縫裡，卡著一個人。`,
 c:[
  {t:'q',l:'把那個人拉出來看',k:'CON',d:11,ok:{t:`他已經死了，喉嚨被咬開，大概是想躲進縫裡的時候被追上的。手腕上還戴著旅館的住客手環，房號 309。

他的手裡死死攥著一串鑰匙，上面掛著一張小卡片：「布巾室」。你把鑰匙撥了出來，順手拿走他口袋裡的手帕。`,r:{items:{cloth:2},flag:'linenkey'},p:{fear:8}},ng:{t:`你才把他拉出來一半，他的頭就往你這邊歪過來，喉嚨的傷口整個翻開。你的胃翻了過來，跪在那灘粉紅色的水裡吐了好久。`,p:{fear:12,hun:-1}}},
  {t:'q',l:'撬開販賣機',k:'STR',d:12,s:'力量檢定',ok:{t:`玻璃碎了一地。你飛快地把能拿的東西塞進背包。聲音不大，但在這層樓已經夠大了。`,r:{items:{water:1,cola:1,chips:1}},p:{alarm:1}},ng:{t:`玻璃只裂了一條縫，倒是響了很大一聲。你縮在牆角等了很久，什麼都沒有來。至少這一次沒有。`,p:{alarm:2}}},
  {t:'q',l:'不碰任何東西，繼續走',ok:{t:`融化的冰水在你身後滴答滴答地流。你沒有回頭。`}}]},
A5x:{L:'A',ev:1,next:'A6'},
/* ---------- B 二樓：宴會廳 ---------- */
B2x:{L:'B',n:'宴會廳',next:'B3',
 t:`二樓的宴會廳門開著一半。今晚這裡辦過一場婚宴，散場還沒收完：紅色桌巾、喜糖、印著新人名字的立牌，椅子東倒西歪。

燈全黑了。只有舞台邊的一台筆電還亮著，靠電池撐著，一張一張地播新人的成長照片，從嬰兒到畢業典禮到求婚，光打在空蕩蕩的舞池上。

舞台旁邊停著一台收到一半的送餐推車。圓桌底下，有好幾雙腳。都沒有在動。`,
 c:[
  {t:'q',l:'把推車推到走廊上',ok:{t:`推車的輪子吱吱叫，你推得很慢。你把它停在走廊轉角，車上還壓著一疊乾淨的餐巾。`,r:{items:{cloth:2},flag:'cart'}}},
  {t:'sd',l:'到主桌翻看看',k:'PER',d:12,s:'感知檢定',ok:{t:`主桌旁邊的禮金箱被打翻了。賀卡和信封散了一地，你沒有撿。你撿的是新郎座位底下那個工具包：伴郎大概負責修音響。`,r:{items:{tape:1,pliers:1,battery:2}}},ng:{t:`你彎下腰的時候，圓桌底下那雙腳動了。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['穿禮服的感染者']}}},
  {t:'q',l:'闔上那台筆電',k:'INT',d:10,s:'智力檢定',ok:{t:`你摸黑走到舞台邊，把筆電闔上。宴會廳一下子全暗了。你不知道為什麼，覺得自己好像為那對新人做了一件事。`,p:{fear:-6}},ng:{t:`你碰到了觸控板，音樂突然大聲放了出來。是一首很老的情歌。`,p:{alarm:3}}}]},
B3x:{L:'B',ev:1,next:'B4'},
/* ---------- C 電梯井：維修平台 ---------- */
C2x:{L:'C',n:'維修平台',next:'C3',
 t:`電梯井的牆上有一個凹進去的維修平台，大概只夠一個人蹲著。平台上有一個工具箱，還有一件被扯破的維修員背心。

背心上的名牌寫著「戴爾」。名牌上有指甲刮過的痕跡。

纜繩在你身邊輕輕晃動。上面或下面，有東西正在順著纜繩移動。`,
 c:[
  {t:'q',l:'打開工具箱',ok:{t:`工具箱裡有一把鉗子、一卷膠帶，還有一張被汗浸濕的紙條：「B2 停車場的鐵捲門要用手動鏈條拉。不要開燈。」`,r:{items:{pliers:1,tape:1},flag:'parknote'}}},
  {t:'q',l:'抓住纜繩，聽聽是從哪裡來的',k:'PER',d:11,s:'感知檢定',ok:{t:`是從上面來的。你往下滑了兩公尺，躲進陰影裡。一個東西沿著纜繩爬過你頭頂，手腳並用，像一隻很大的蜘蛛。`},ng:{t:`你聽錯了方向。牠是從下面來的。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['倒吊著的感染者']}}}]},
/* ---------- D 外牆：往上的鐵梯 ---------- */
D2x:{L:'D',n:'消防梯・三樓平台',next:'D3',
 t:`風把消防梯吹得嘎嘎作響。往下是後巷，往上，鐵梯一路延伸到頂樓，最上面那一段已經生鏽到發紅。

隔壁大樓屋頂的樓梯間小屋亮著一盞燈。有人在那裡。也可能只是忘了關燈。

你腳下的平台少了兩根螺絲，每一次風吹過來，整片鐵板都會往下沉一點。`,
 c:[
  {t:'mv',l:'往上爬到頂樓',k:'STR',d:11,s:'力量檢定',ok:{t:`你一格一格往上爬，手掌被鐵鏽磨出血。翻過頂樓的女兒牆時，風一下子大到你聽不見自己的喘氣聲。`,go:'R1'},ng:{t:`爬到一半，一根橫桿斷了。你吊在半空中晃了好幾秒才抓回去，肩膀扭了一下。你還是爬上去了。`,p:{hp:-2},go:'R1'}},
  {t:'q',l:'繼續往下',ok:{t:`你決定不賭運氣，繼續往下走。`}}]},
/* ---------- E 一樓：行李寄放間 ---------- */
E2x:{L:'E',n:'行李寄放間',next:'E3',
 t:`櫃台後面的行李寄放間沒有上鎖。架子上整整齊齊排著行李箱，每一個都掛著號碼牌。

有一個箱子在動。

不是被風吹動。是從裡面，一下、一下，往外推。號碼牌上寫著：「寄存人：未取」。`,
 c:[
  {t:'q',l:'翻找代客泊車的櫃子',k:'PER',d:11,dark:1,s:'感知檢定',ok:{t:`牆上的鑰匙櫃開著，大部分的鉤子都空了。最後一個鉤子上掛著一把車鑰匙，號碼牌寫著「B2-17」。`,r:{flag:'carkey'}},ng:{t:`太黑了。你摸到的鉤子全是空的。`}},
  {t:'q',l:'先不管那個箱子',ok:{t:`你退出寄放間，把門帶上。箱子推門的聲音一直跟著你。`,p:{fear:4}}}]},
E3x:{L:'E',ev:1,next:'E4'},
/* ---------- F 員工廚房：冷凍庫 ---------- */
F2x:{L:'F',n:'冷藏室門口',next:'F3',
 t:`廚房最裡面還有一間步入式冷藏室。門被一根拖把柄從外面卡住。門縫底下滲出冷氣，地上結了一層薄霜。

門上有手印。從裡面拍的，很多個，大大小小。最下面那個手印，是在離地很近的地方。

卡住門的拖把柄上，綁著一條廚師圍裙。圍裙上用麥克筆寫著：「不要開。拜託。」

門裡面有人在敲。三下，停一下，又三下。`,
 c:[
  {t:'q',l:'把圍裙上的字看清楚',k:'INT',d:10,s:'智力檢定',once:1,stay:1,ok:{t:`圍裙背面還有字，寫得很小：「裡面是被咬的阿傑和小麥，他們已經不認得人了。瓦斯總閥在後門旁邊，紅色的那個。」

可是會照著節奏敲門的，不會是不認得人的東西。`,r:{flag:'gasnote'}},ng:{t:`字太潦草了，你只看懂「不要開」三個字。`}},
  {l:'拆開拖把柄，把門打開',t:'q',ok:{t:`你抽走拖把柄，拉開門。冷氣撲了你一臉。

貨架之間縮著幾個人，裹著保鮮膜和紙箱取暖。站在最前面的兩個穿著廚師服，脖子上都是咬痕，眼睛是白色的。牠們轉過頭來。`,p:{fear:6,alarm:1},fight:{n:2,mode:'normal',names:['被咬過的阿傑','被咬過的小麥']},
   win:{t:`冷藏室裡剩下兩個人：一個穿房務制服的女人，抱著一個發抖的老先生。她叫蘿莎。

「是經理把我們關進來的，」她的嘴唇是紫的，「他說外面比較危險。然後他自己拿著門卡，下地下室去了。每天晚上等門診的人巡完房，他都會刷卡下去那扇白色的門。」

她把老先生扶起來。「我們去大廳找人。你如果也要往大廳……我們會幫你。」`,r:{flag:['freezer_open','fzhint']}}}},
  {t:'q',l:'不開，讓拖把柄卡著',ok:{t:`你把拖把柄又往下壓緊了一點，退開。

敲門聲又響了。三下，停一下，又三下。你走到廚房另一頭的時候，它還在敲。`,r:{flag:'freezer_shut',karma:-1},p:{fear:8}}}]},
/* ---------- G 地下設備層：排水溝 ---------- */
G2x:{L:'G',n:'排水溝',next:'G3',
 t:`地下室的地板中間有一條排水溝，上面蓋著鐵柵欄。柵欄底下的水不是在流，是在冒泡。

一條條鮮紅色的東西從排水溝裡長出來，沿著牆往上爬，一路分岔，像人身上的血管。它們一下一下地鼓起來又縮回去，跟脈搏一樣。

牆上的告示牌被那些東西蓋住了一半，只看得到一個標誌：一根杖，一條蛇。`,
 c:[
  {t:'q',l:'用布摀住口鼻',req:'cloth',s:'需要布料',ok:{t:`你把布浸濕綁在臉上。呼吸變得很悶，但那股甜膩的腐臭味少了一大半。`,r:{flag:'mask',use:'cloth'}}},
  {t:'q',l:'撕下告示牌',k:'STR',d:12,s:'力量檢定',ok:{t:`告示牌下面是一張樓層圖。地下二樓標著「停車場」，旁邊用紅筆加了一行字：「C 區通道已封。」你記住了另一條路。`,r:{flag:'parknote'}},ng:{t:`那些紅色的東西黏得很緊。你用力一扯，有一根斷了，噴出一點黏液在你手背上。`,p:{inf:4}}},
  {t:'q',l:'快步走過去',k:'AGI',d:10,s:'敏捷檢定',ok:{t:`你踩著乾的地方跳過去，沒有碰到任何一根。`},ng:{t:`你踩到一根。它在你鞋底下扭動，像是活的。`,p:{inf:3,fear:4}}}]},
/* ---------- R 頂樓 ---------- */
R1:{L:'R',n:'頂樓',next:'R2',
 t:`頂樓的風大到站不穩。整座城市在你腳下鋪開：一半的街區停電了，另一半還亮著，像是有人用刀把城市切成兩塊。

遠處有好幾道探照燈在雲層下面掃來掃去。直升機的聲音被風吹得忽大忽小。

頂樓的鐵門從裡面反鎖。水塔旁邊有一間小小的機房，門口坐著一個人，背對著你，一動也不動。`,
 c:[
  {t:'q',l:'靠近坐著的那個人',k:'PER',d:11,s:'感知檢定',ok:{t:`你繞到側面看。他已經死了，脖子上一個咬痕，身體還沒完全冷掉。他大概是逃上來求救的，手上還握著一支對講機，頻道停在 7。你把對講機拿了起來。`,r:{items:{battery:1},flag:'radio'}},ng:{t:`你走到他背後的時候，他的頭轉了過來。脖子上少了一大塊肉，眼睛是混濁的白。`,p:{fear:10},fight:{n:1,mode:'ambush',names:['頂樓的保全']}}},
  {t:'q',l:'去看探照燈的方向',ok:{t:`探照燈集中在城東的醫院一帶。一列沒有標示的黑色車隊在那附近停下，車上的人下得很快。其中一個人轉身的時候，探照燈掃過他的臂章：紅黑兩色，一根像矛又像針的杖。`,p:{fear:4},r:{flag:'acrusign'}}}]},
R2:{L:'R',n:'水塔',next:'R3',
 t:`水塔的鐵梯上掛著一條登山繩，繩子另一端垂進水塔的開口裡。

繩子在動。很輕，很規律，像有人在下面呼吸。

水塔旁邊有一塊木板，搭在這棟樓和隔壁大樓的頂樓之間。木板很窄，下面是七層樓高的防火巷。`,
 c:[
  {t:'q',l:'把登山繩拉上來',k:'STR',d:12,s:'力量檢定',ok:{t:`繩子很沉。拉上來的是一個防水背包，綁在繩子末端。有人把它藏在水塔裡，就沒有再回來拿。`,r:{items:{water:2,bar:2,med:1,rope:1}}},ng:{t:`繩子拉到一半，下面的東西抓住了它。你鬆手的時候，聽見水塔裡傳來一聲很長的、濕漉漉的嘆息。`,p:{fear:8}}},
  {t:'q',l:'喝水塔裡的水',k:'CON',d:11,s:'體質檢定',ok:{t:`水很冰，有鐵鏽味，但你喝得停不下來。`,r:{flag:'drankroof'},p:{hp:1}},ng:{t:`水裡有東西。你喝下去才發現。`,p:{inf:8}}},
  {t:'q',l:'先不碰水塔',ok:{t:`你繞開水塔。繩子在你身後晃了一下。`}}]},
R3:{L:'R',ev:1,next:'R4'},
R4:{L:'R',n:'頂樓・出口',
 t:`風停了一瞬間。整座城市安靜得讓人發毛。

你有兩條路：走那塊木板到隔壁大樓的屋頂，那裡還亮著燈；或是撬開機房，從維修樓梯回到樓下。

木板在風裡輕輕顫了一下。`,
 c:[
  {t:'q',l:'走木板過去',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你張開雙手，一步一步走過去，眼睛只看著對面那盞燈。踩上對面頂樓的那一刻，你才發現自己一直沒有呼吸。`,go:'END_roof'},ng:{t:`走到一半，木板翻了一下。你整個人往下滑，用手肘勾住了對面的女兒牆，手臂被水泥磨得血肉模糊。你爬上去了。`,p:{hp:-4,bleed:1},go:'END_roof'}},
  {t:'mv',l:'撬開機房，走維修樓梯',req:['g:crowbar','g:fireaxe','g:hammer'],reqAny:1,s:'需要鐵撬、消防斧或鐵鎚',ok:{t:`機房的門鎖被你撬開。裡面的維修樓梯又窄又陡，一路往下，盡頭是蒸氣和洗衣粉的味道。`,go:'H1'}},
  {t:'mv',l:'用身體撞開機房',k:'STR',d:13,s:'力量檢定',ok:{t:`你撞到第三下，門框裂開了。`,go:'H1',p:{alarm:1}},ng:{t:`門紋風不動，你的肩膀先撐不住了。你只剩下木板這條路。`,p:{hp:-2},go:'R4'}}]},
/* ---------- H 洗衣房與員工宿舍 ---------- */
H1:{L:'H',n:'洗衣房',next:'H2',
 t:`洗衣房在二樓和一樓之間的夾層，又悶又濕。停電的時候，一整排工業用滾筒洗衣機全停在洗到一半，玻璃窗後面泡著毛巾和床單，水從門縫一直滲出來。

地板上全是泡沫和水，水裡漂著一隻鞋子。

最裡面那台洗衣機的玻璃窗後面，有一張臉貼著玻璃。`,
 c:[
  {t:'q',l:'看清楚洗衣機裡那張臉',k:'PER',d:11,s:'感知檢定',ok:{t:`那張臉在眨眼。是一個穿洗衣房制服的年輕女人，整個人縮在滾筒裡，膝蓋抵著胸口。她看到你，拚命搖頭，又指了指門外。

你等了一下，確定走廊沒有東西，才把門拉開。她爬出來的時候全身都在抖，把口袋裡的東西全塞給你，小聲說：「員工通道往停車場的那扇門……下面不要開燈。」然後她往樓上跑了。`,r:{items:{coffee:1,lighter:1},flag:'laundryoff'},p:{fear:-6}},ng:{t:`你湊近玻璃的時候，那張臉猛地撞了上來。玻璃窗的卡榫鬆了，門彈開，一個穿洗衣房制服的人從滾筒裡爬了出來。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['滾筒裡的感染者']}}},
  {t:'sd',l:'在布巾架翻找',need:'linenkey',ok:{t:`布巾室的鐵櫃裡堆滿了乾淨的床單和毛巾，最下層還有一個員工急救箱。`,r:{items:{cloth:3,bandage:2,iodine:1}}}},
  {t:'sd',l:'在籃子裡翻找',k:'PER',d:11,s:'感知檢定',ok:{t:`有人把東西忘在制服口袋裡：一支打火機，還有一包壓扁的香菸。`,r:{items:{lighter:1,cigarette:2,sock:1}}},ng:{t:`你翻到一件制服，口袋裡全是黏稠的東西。`,p:{inf:2}}}]},
H2:{L:'H',n:'員工宿舍',next:'H3',
 t:`洗衣房後面是員工宿舍，一條窄窄的走廊，兩邊是上下舖的房間。

每一扇門上都貼著員工的名字和排班表。最後一個班是「23:00～07:00」，每個名字旁邊都打了勾，只有一個沒有：「代客泊車　凱文」。

凱文的房門開著。床上沒有人，但被子是溫的。`,
 c:[
  {t:'m',l:'搜凱文的房間',k:'PER',d:10,s:'感知檢定',hide:'kevin_alive',ok:{t:`他的置物櫃裡掛著一件代客泊車的背心，口袋裡有一把車鑰匙，牌子寫著「B2-17」。還有一張他和家人的合照。`,r:{flag:'carkey',items:{photo:1}}},ng:{t:`你把房間翻遍了，什麼都沒找到。床底下傳來很輕的刮擦聲。`,p:{fear:4}}},
  {l:'等凱文回來，幫他包紮',s:'會用掉一份繃帶、敷料或酒精',req:['bandage','sbandage','med','alcohol'],reqAny:1,hide:'kevin_met',t:'m',ok:{t:`過了很久，走廊盡頭傳來腳步聲。凱文扶著牆走回來，手上拿著一根撬棒，左手臂被碎玻璃劃開一道很長的口子，血一直往下滴。他看見你的時候差點揮下來。

你讓他坐下，幫他把傷口清乾淨、包起來。他一直在發抖，可是沒有叫。

「停車場裡有一台車還能開，」他把鑰匙塞進你手裡，又拿過你的筆，在你手背上畫了一條線，「C 區不要走，那裡最多。沿著牆，B 區那排柱子後面有一條路。」`,r:{use:'$req',flag:['kevin_met','kevin_alive','carkey','parknote'],items:{coffee:1}},p:{fear:-6}}},
  {l:'等凱文回來',k:'CHA',d:12,hide:'kevin_met',t:'m',ok:{t:`他回來了，手上拿著一根撬棒，看見你的時候差點揮下來。你們談了很久。最後他說停車場裡有一台車還能開，但他不敢一個人下去。他把鑰匙交給你，自己往樓上跑了。`,r:{flag:['kevin_met','kevin_alive','carkey'],items:{coffee:1}},p:{fear:-6}},ng:{t:`回來的是凱文，但已經不是凱文了。牠的背心上全是血。`,r:{flag:'kevin_met'},p:{fear:8},fight:{n:1,mode:'normal',names:['穿泊車背心的感染者']}}},
  {t:'q',l:'不要停留',ok:{t:`你快步穿過宿舍走廊，經過每一扇門的時候都沒有往裡面看。`}}]},
H3:{L:'H',ev:1,next:'H4'},
H4:{L:'H',n:'員工通道・出口',
 t:`員工通道的盡頭有兩扇門。一扇寫著「往大廳」，另一扇寫著「往 B2 停車場・閒人勿入」。

往停車場的那扇門上，有人用口紅寫了一行字：「下面不要開燈」。`,
 c:[
  {t:'mv',l:'往大廳',ok:{t:`你推開門，回到一樓的走廊。`,go:'E1'}},
  {t:'mv',l:'往停車場',ok:{t:`樓梯一路往下，空氣越來越冷，越來越潮，還有機油和汽油的味道。`,go:'P1'}}]},
/* ---------- P 地下停車場 ---------- */
P1:{L:'P',n:'停車場坡道',next:'P2',
 t:`B2 停車場一片漆黑。緊急照明全壞了，只有出口的綠色標示燈還亮著，遠遠地浮在黑暗裡。

你聽見水滴聲，還有很多很多的呼吸聲。

停車格裡停滿了車。有些車的車門開著，有些車窗上全是手印。有一台車的警報器在很遠的地方，有氣無力地叫了兩聲，又停了。`,
 c:[
  {t:'q',l:'打開旁邊那台車的車頭燈',ok:{t:`你拉開一台沒鎖的轎車，扭開車頭燈。兩道白光直直打進停車場深處。

停車場裡站滿了人。所有人都轉過頭來看著你。`,p:{fear:12,alarm:4}}},
  {t:'q',l:'靠著柱子慢慢走',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你貼著柱子移動，一根一根數過去。黑暗裡有東西經過你身邊，近到你聞得到牠的味道，但牠沒有停下來。`},ng:{t:`你撞到一台車的後照鏡。警報器尖叫起來。`,p:{alarm:3},fight:{n:1,mode:'ambush'}}},
  {t:'q',l:'照著紙條走',need:'parknote',ok:{t:`你照著紙條和樓層圖，避開 C 區，沿著牆走。一路上什麼都沒有遇到。`,r:{flag:'safepath'}}}]},
P2:{L:'P',n:'車陣',next:'P3',
 t:`你走到 B 區。這裡的車停得亂七八糟，有幾台撞在一起，引擎蓋扭成一團。

一台休旅車的後車廂開著，裡面堆滿了行李，像是一家人正準備出發。駕駛座上坐著一個人，雙手還握著方向盤，頭靠在車窗上。

車窗內側全是霧氣。他還在呼吸。`,
 c:[
  {t:'sd',l:'翻後車廂',k:'PER',d:11,dark:1,s:'感知檢定',ok:{t:`行李裡有登山用品：一支手電筒、一卷繩子，還有一盒罐頭。全家出遊的東西。`,r:{items:{flashlight:1,rope:1,bar:2}}},ng:{t:`你翻得太大聲了。駕駛座的那個人抬起頭，貼著車窗看你。`,p:{fear:6},fight:{n:1,mode:'normal',names:['駕駛座上的感染者']}}},
  {t:'q',l:'敲車窗',k:'CHA',d:13,s:'統帥檢定',ok:{t:`他搖下車窗，臉色死白，但還是人。他說他被咬了，不敢回家。他把一盒餅乾和一把螺絲起子給你，說：「我老婆小孩在河對岸，你如果出得去，拜託……」他沒有說完。`,r:{items:{cookie:2},gear:'screwdriver'},p:{fear:-4}},ng:{t:`他沒有搖下車窗。他用頭撞了一下車窗。又一下。玻璃上出現了裂痕。`,p:{fear:8}}},
  {t:'q',l:'繞過這台車',ok:{t:`你繞了一大圈。休旅車的雨刷在你經過的時候突然動了一下。`,p:{fear:3}}}]},
P3:{L:'P',ev:1,next:'P4'},
P4:{L:'P',n:'B2-17',
 t:`B2-17 停著一台銀色的小轎車，車身有一道很長的刮痕。它離車道出口只有五十公尺。

出口的鐵捲門關著一半。外面就是街道，你看得見路燈，還有被風吹過去的塑膠袋。

鐵捲門下面，有一群東西擠在那裡，背對著你，像是在等門打開。`,
 c:[
  {t:'q',l:'開車衝出去',need:'carkey',s:'用 B2-17 的車鑰匙',k:'AGI',d:11,ok:{t:`引擎發動的聲音在停車場裡迴盪。鐵捲門下的東西全轉過來了。你油門踩到底，撞開牠們，撞開鐵捲門，衝上街道。

後照鏡裡，停車場的出口像一張嘴，慢慢闔上。`,go:'END_car'},ng:{t:`你撞開了鐵捲門，但有一隻攀在引擎蓋上，用頭撞擋風玻璃。你猛打方向盤把牠甩下去，車子擦過牆，後照鏡斷了。你還是衝出去了。`,p:{hp:-3,fear:6},go:'END_car'}},
  {t:'q',l:'從車道邊的人行通道溜出去',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你貼著牆，從鐵捲門旁邊那條窄窄的人行通道鑽了出去。身後的東西一直沒有回頭。`,go:'END_ramp'},ng:{t:`你快到門口時，一隻轉過頭來。然後是全部。`,p:{fear:8},fight:{n:2,mode:'normal',names:['擠在門口的感染者','擠在門口的感染者']},go:'END_ramp'}},
  {t:'q',l:'丟東西引開牠們',req:['cola','water','bottle','coin'],reqAny:1,s:'需要可以丟的東西',ok:{t:`你把手上的東西用力丟到停車場另一頭。撞擊聲在水泥牆之間彈來彈去。牠們全轉過去了。你趁機從人行通道溜了出去。`,r:{use:'coin'},go:'END_ramp'}},
  {t:'q',l:'撿地上的碎石丟出去引開',k:'AGI',d:12,ok:{t:`你從柱子邊撿起一塊剝落的水泥塊，往停車場另一頭用力丟出去。撞擊聲在水泥牆之間彈來彈去。牠們全轉過去了。你趁機從人行通道溜了出去。`,go:'END_ramp'},ng:{t:`水泥塊砸在附近的車門上，太近了。牠們轉過來的方向，正好是你。`,p:{fear:8},fight:{n:2,mode:'normal'}}}]}
});
/* v0.39.0 旅館的抉擇卡（HOTEL_ROUTE_SPEC 第 4 節；文字是草案，主人試玩後調整）。
   卡的先後順序寫在 ROUTE（節點流程那一段），這裡只放卡的內容。 */
Object.assign(N,{
A6d:{L:'A',n:'三樓走廊・轉角',
 t:`拖行聲轉過了西側的轉角。不只一個。

305 的門突然開了一條縫。一個穿淺藍色看護制服的年輕人探出頭來，臉色慘白，名牌上寫著「馬可」。「卡爾呢？」他壓低聲音問，「306 那個，跟我一起巡房的……」他看見你的表情，就沒有再問了。

「牠們每隔一陣子就會從那邊過來，」他指著走廊盡頭，「整層樓的門，牠們會一扇一扇撞。」

走廊口很窄，一次只過得了一個。302 的門還開著。`,
 c:[
  {t:'q',l:'拿消防斧守住走廊口',req:'g:fireaxe',ok:{t:`你讓馬可退回 305，自己握著斧頭站到走廊最窄的地方。第一個影子從轉角拖出來的時候，你先揮了下去。`,fight:{n:2,mode:'first',names:['拖著腳的感染者','拖著腳的感染者']},win:{t:`最後一個倒下的時候，305 的門開了。馬可扶著門框走出來，看著地上的東西，吐了。

「我欠你一次。」他擦了擦嘴，「我要下樓找我們的車。如果你也往下走……我會等你。」`,r:{flag:'corr_held'}}}},
  {t:'q',l:'守住走廊口',ok:{t:`你讓馬可退回 305，自己站到走廊最窄的地方。第一個影子從轉角拖了出來。`,fight:{n:2,mode:'normal',names:['拖著腳的感染者','拖著腳的感染者']},win:{t:`最後一個倒下的時候，305 的門開了。馬可扶著門框走出來，看著地上的東西，吐了。

「我欠你一次。」他擦了擦嘴，「我要下樓找我們的車。如果你也往下走……我會等你。」`,r:{flag:'corr_held'}}}},
  {l:'把聲音引到 302',t:'q',ok:{t:`你抓起地毯上的玻璃菸灰缸，用力砸向 302 的門框，然後閃進 304。拖行聲停了一下，轉了方向，一個接一個擠進 302。

你從 304 的門縫看出去。305 的門開著，馬可沒有來得及關上。

你聽見他叫了一聲。只有一聲。`,r:{flag:'corr_lured',karma:-2},p:{fear:10,alarm:1}}}
 ]},
E3d:{L:'E',n:'一樓走廊・寄放間前',
 t:`行李寄放間的門半開著，裡面那個箱子還在一下一下地動。

寄放間門口的地上趴著一個穿工程部制服的人。他還在呼吸，褲管被血浸透了一半，手裡死死抓著一串鑰匙。

「員工樓梯……」他說，「可以直接下停車場……」

拖行聲又從樓梯那邊傳過來了。你只來得及顧一件事。`,
 c:[
  {l:'幫他止血',s:'會用掉一份繃帶、敷料或止血帶',req:['bandage','sbandage','med','tourniquet'],reqAny:1,t:'m',ok:{t:`你撕開他的褲管，壓住傷口，綁緊。他痛得咬住自己的袖子，沒有叫出聲。過了很久，血才慢慢止住。

他叫路易斯，夜班的工程師。「我帶你走員工樓梯，」他喘著說，「那條路不經過大廳，直接到停車場的車位。」

寄放間裡的箱子，不知道什麼時候不動了。`,r:{use:'$req',flag:'staff_alive'},p:{fear:-4}}},
    {t:'q',l:'打開寄放間裡那個在動的箱子',k:'CHA',d:13,ok:{t:`「裡面有人嗎？我要打開了，不要怕。」箱子不動了。你拉開拉鍊，裡面縮著一個瘦小的男人，滿臉是淚。

他說樓下一出事他就躲進來了，在裡面縮了好幾個小時。他把口袋裡所有的東西都塞給你，其中有一把掛著「B2-17」牌子的車鑰匙，是他從泊車櫃順手抓的。然後他一個人往廚房的方向跑走了。

門口那個人在你身後，慢慢不動了。`,r:{items:{cigarette:2,lighter:1,coin:1},flag:'carkey'},p:{fear:-6}},ng:{t:`你一拉開拉鍊，裡面的東西就撲了出來。牠已經不是人了。牠縮在箱子裡太久，關節全反折著。`,p:{fear:10},fight:{n:1,mode:'ambush',names:['箱子裡的感染者']}}},
  {t:'q',l:'不碰，繼續走',ok:{t:`你從他身邊跨過去。他伸手抓了一下你的褲管，沒有抓住。

「我沒被咬，」他說，「是擋風玻璃。」`,
 c:[
  {t:'q',l:'幫司機包紮',req:['bandage','sbandage'],reqAny:1,s:'需要繃帶或消毒繃帶',ok:{t:`你爬上公車，用繃帶把他大腿上的傷口紮緊。他痛得一直吸氣，但一聲都沒叫。

「我本來要載一車人去北邊的檢查站，」他說，「市政府要在北口檢查站辦撤離，國民兵會派車來接。哪一天還沒公布，可是司機的無線電裡已經傳開了。」

他從零錢箱裡抓了一把硬幣塞給你，又從駕駛座底下拿出一瓶水。「我走不動了。你先去北口檢查站看看。」`,r:{use:'$req',flag:'busnews',items:{water:1},usd:6}}},
  {t:'q',l:'不管他，繼續走',ok:{t:`你從公車旁邊走過去。司機沒有叫你，只是一直看著你走遠。`}}]},
J5:{L:'J',n:'前街・岔路',
 t:`前面的路分成兩條。

左邊是一條夾在兩排老舊紅磚公寓之間的後巷，牆上掛滿了鏽紅色的防火梯，有幾戶的燈還亮著。

右邊街角有一間二十四小時便利商店，招牌還亮著，自動門開開關關，每開一次，門口的感應器就響一次「叮咚」。`,
 c:[
  {t:'c',l:'走進後巷',ok:{t:`你轉進巷子。路燈少了，空氣裡多了一股垃圾和雨水混在一起的味道。`,go:'K1'}},
  {t:'c',l:'去便利商店',ok:{t:`你朝那個「叮咚」走過去。這座城市裡，還有東西在歡迎客人上門。`,go:'M1'}}]},
/* ---------- K 後巷 ---------- */
K1:{L:'K',n:'巷口',next:'K2',
 t:`巷子很窄，擺了兩個垃圾子車就只剩一個人能過。頭頂的防火梯一層疊一層，路燈的光被切得零零碎碎。

一樓有一戶人家的窗戶裝著防盜鐵柵，窗台上點著一排電子蠟燭，中間立著一尊小小的聖母像，紅色的光映在窗簾上。窗簾後面有人影在動，很慢很慢地來回走。

巷子深處傳來狗叫聲。然後狗叫聲停了，停得很突然。`,
 c:[
  {t:'q',l:'敲那戶人家的窗',k:'CHA',d:12,s:'統帥檢定',ok:{t:`窗簾拉開一角，一個老太太看著你。她什麼都沒說，只是從鐵柵的縫隙遞出一個塑膠袋：兩根能量棒、一瓶水。然後她把窗簾拉上了。`,r:{items:{bar:2,water:1}},p:{fear:-8}},ng:{t:`窗簾拉開了。窗戶後面站著的不是人。牠把臉貼在鐵柵上，張開了嘴。牠出不來。你知道牠出不來。但你的腿還是軟了。`,p:{fear:12}}},
  {t:'q',l:'往狗叫的方向走',k:'PER',d:11,s:'感知檢定',ok:{t:`你在一個垃圾子車旁邊找到狗的牽繩，繩子斷了。地上有拖行的痕跡，一路往巷子深處去。你決定繞開那個方向。`,r:{flag:'dogtrail'}},ng:{t:`你看見那隻狗了。牠倒在垃圾子車旁邊，已經不動了。蹲在牠旁邊的那個人慢慢抬起頭，嘴邊全是毛，眼睛是白色的。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['蹲在垃圾子車旁的人']}}},
  {t:'q',l:'沿著牆快步走',ok:{t:`你貼著牆走，經過每一扇後門的時候都屏住呼吸。`}}]},
K2:{L:'K',n:'紅磚公寓',next:'K3',
 t:`一棟紅磚公寓的大門開著，門鎖被撬壞了，樓梯間的燈一閃一閃。門廳的信箱全被撬開了，傳單和帳單散了一地。

二樓傳來小聲的爭吵聲，是兩個男人：「……我說了不能開門！」「她是我老婆！」

然後是一聲尖叫，接著什麼聲音都沒有了。`,
 c:[
  {t:'q',l:'上去看看',k:'CHA',d:13,ok:{t:`「我是人！我沒被咬！」門開了一條縫。兩個男人和一個坐在地上發抖的女人。她的手臂纏著繃帶，滲著血。

他們讓你進去喝了一杯水，分了你一些東西，然後請你離開。走的時候，你聽見那個女人在小聲地哼歌。`,r:{items:{water:1,noodle:1,whiskey:1}},p:{fear:-4}},ng:{t:`你一出聲，門後就傳來推東西的聲音，然後是槍聲。子彈打在你頭頂的牆上。「滾！」`,p:{fear:10,alarm:3}}},
  {t:'sd',l:'搜一樓的空房',k:'PER',d:11,s:'感知檢定',ok:{t:`一樓的住戶跑得很急，連瓦斯爐都沒關。你關掉瓦斯，在廚房找到一把菜刀和一些乾糧。`,r:{gear:'kitchenknife',items:{nuts:1}}},ng:{t:`一樓的住戶沒有跑。他只是躺在床上，躺了很久。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['躺在床上的住戶']}}},
  {t:'q',l:'離開這棟樓',ok:{t:`你退出樓梯間。樓上又傳來一聲尖叫，這次是男人的聲音。`,p:{fear:5}}}]},
K3:{L:'K',ev:1,next:'K4'},
K4:{L:'K',n:'屋頂棚屋',next:'K5',
 t:`巷子盡頭被一台翻倒的貨車堵住了。你只能順著防火梯爬上屋頂，再從屋頂跨到隔壁那棟。

屋頂的水塔底下，有人用棧板和防水布搭了一個棚子，防水布被風吹得嘩啦嘩啦響。屋子裡有人生活過：棉被、泡麵、一台小小的收音機。牆上貼滿了這幾天的報紙，有人用紅筆把每一則「不明原因攻擊事件」都圈了起來。

報紙中間釘著一張照片：一個穿白袍的女人，站在一棟玻璃大樓前面。照片背面寫著：「她知道。」`,
 c:[
  {t:'q',l:'把報紙看完',k:'INT',d:11,s:'智力檢定',ok:{t:`你把報紙一張一張看過去。最早的一則是兩個月前，在社會版的角落：一名病患在回診時咬傷護理師，報導說他「有精神病史」。之後每一週都多一則，每一則都比上一則更靠近這個街區。`,r:{flag:'clippings'},p:{fear:4}},ng:{t:`那些字在你眼前糊成一片。你只記得一直重複出現的那幾個字：「原因不明」。`}},
  {t:'q',l:'拿走生活用品',ok:{t:`你把能用的東西都拿了：泡麵、電池、一卷膠帶。收音機你沒拿，它只會一直播同一句話。`,r:{items:{noodle:2,battery:2,tape:1}}}},
  {t:'q',l:'聽收音機',ok:{t:`「……這裡是緊急廣播系統……醫療隔離區已擴大……請避開第七街以東……重複……」一個男人的聲音，非常冷靜。冷靜得讓人害怕。`,p:{fear:4},r:{flag:'heardpa'}}}]},
K5:{L:'K',n:'後巷・出口',
 t:`你順著另一棟的防火梯爬下來，落在另一條街上。

往前是一條大馬路，馬路中間拉起了一整排紅黑相間的拒馬，上面掛著「醫療隔離區・禁止通行」。探照燈從拒馬後面掃過來。

街角是一個地鐵站的入口，往下的樓梯一片漆黑，傳來流水聲。`,
 c:[
  {t:'c',l:'往封鎖線走',ok:{t:`探照燈從你頭頂掃過去。你縮在一台廢棄的公車後面。`,go:'Q1'}},
  {t:'c',l:'走進地鐵站',ok:{t:`你扶著欄杆走下樓梯。每走一階，水聲就大一點。`,go:'U1'}}]},
/* ---------- M 便利商店 ---------- */
M1:{L:'M',n:'便利商店',next:'M2',
 t:`「叮咚。」

自動門在你身後關上，又打開，又關上。店裡的日光燈亮得刺眼，冷藏櫃嗡嗡作響。貨架被搶過一輪，地上全是踩爛的餅乾和打翻的飲料。

櫃台後面站著一個穿制服的店員，背對著你，低著頭，一下、一下地用頭撞著收銀機。

「叮咚。」`,
 c:[
  {t:'q',l:'把自動門的電源拔掉',k:'INT',d:11,s:'智力檢定',ok:{t:`你在門邊找到電源開關。自動門終於停在半開的位置，那個叮咚聲不再響了。店員停止了撞頭，慢慢轉過身來。`,r:{flag:'dooroff'},fight:{n:1,mode:'first',names:['穿制服的店員']}},ng:{t:`你按錯了開關，整間店的燈都熄了。黑暗裡，店員撞收銀機的聲音停了。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['穿制服的店員']}}},
  {t:'q',l:'趁店員背對你，快速搜貨架',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你蹲低身子，在貨架之間移動，飛快地把剩下的東西掃進背包。店員一直沒有轉頭。`,r:{items:{water:2,chips:1,coffee:1}}},ng:{t:`你碰倒了一排罐頭。撞頭聲停了。`,fight:{n:1,mode:'normal',names:['穿制服的店員']}}},
  {t:'q',l:'從後門的倉庫進去',k:'STR',d:12,ok:{t:`倉庫的門被你撞開。裡面還有沒上架的貨：一整箱礦泉水，還有一箱杯麵。你拿到背包裝不下為止。`,r:{items:{water:2,noodle:2,cola:1}},p:{alarm:1}},ng:{t:`門紋風不動，肩膀倒是先撞痛了。`,p:{hp:-1,alarm:1}}}]},
M2:{L:'M',n:'倉庫',next:'M3',
 t:`倉庫裡堆滿了紙箱，最裡面有一扇小門通往員工休息室。

休息室裡有人。你聽見小聲的哭泣，還有壓低聲音的爭吵。門縫底下透出手機螢幕的光。

門上用麥克筆寫著：「被咬的不准進來」。`,
 c:[
  {t:'q',l:'敲門',hide:'jessebox',k:'CHA',d:12,s:'統帥檢定',ok:{t:`開門的是一個年輕的大夜班店員和兩個客人。他們看了你的手臂、脖子，確定你沒被咬，才讓你進去。

大夜班店員說，他看見好幾台沒有標示的車往城東開，車上的人穿著全套防護衣，「他們不是來救人的，是來收東西的。」他給了你一些物資，還有一張地鐵路線圖。`,r:{items:{bandage:1,coffee:1,cigarette:2},flag:'metromap'},p:{fear:-6}},ng:{t:`門後的人不肯開門。過了一會兒，門縫底下塞出來一張紙：「我們沒有東西可以給你了，對不起。」`,p:{fear:3}}},
  {t:'q',l:'敲門',need:'jessebox',ok:{t:`門開了一條縫。一個年輕的店員從門縫往外看，視線越過你，停在那幾個被拆開的紙箱上。

「那些是我們的。」他說完就把門關上，上了鎖。你再怎麼敲，門後都沒有人回答。`,p:{fear:3}}},
  {t:'m',l:'搜倉庫的紙箱',k:'PER',d:11,s:'感知檢定',once:1,stay:1,ok:{t:`紙箱裡有一箱還沒拆封的日用品：膠帶、襪子、打火機，還有一盒釘子。不知道為什麼便利商店會賣釘子，但你很感激。`,r:{items:{tape:1,sock:1,lighter:1,nails:1},flag:'jessebox'}},ng:{t:`你翻開一個紙箱，裡面有東西在動。是老鼠，很多很多老鼠，眼睛都是白的。`,p:{inf:3,fear:6}}},
  {t:'q',l:'不打擾他們',ok:{t:`你悄悄退出倉庫。休息室裡的哭聲一直沒有停。`}}]},
M3:{L:'M',ev:1,next:'M4'},
M4:{L:'M',n:'停車場',next:'M5',
 t:`便利商店後面有一個小小的停車場。一台購物車翻倒在地上，裡面的東西撒了一地。旁邊停著一台警車，車頂的警示燈還在轉，沒有聲音。

警車的駕駛座車門開著，座位上全是血。後車廂關著。

停車場另一頭，有三個男人正在撬一台貨車的車門。一個腰上插著獵刀，一個扛著一把單管霰彈槍，一邊撬一邊笑。`,
 c:[
  {t:'q',l:'打開警車後車廂',req:['g:crowbar','g:screwdriver','g:fireaxe'],reqAny:1,s:'需要撬開的工具',k:'STR',d:12,ok:{t:`後車廂彈開了。裡面有一把霰彈槍，用鎖鏈鎖在支架上，你花了好一陣子才弄下來。旁邊的彈藥盒裡只剩三發。

那三個男人的笑聲停了。他們都看著你。`,r:{gear:'r870',mag:2,items:{shell:1}},p:{alarm:2}},ng:{t:`後車廂撬不開，倒是發出很大的聲音。那三個男人轉過頭來，朝你走過來。`,fight:{n:2,mode:'normal',names:['拿獵刀的劫匪','拿霰彈槍的劫匪']}}},
  {t:'q',l:'跟那三個男人談',k:'CHA',d:13,s:'統帥檢定',ok:{t:`你走過去，舉起雙手。「我只是路過。」帶頭的那個打量了你很久，最後丟給你一瓶水：「往警察局那邊不要去，那邊在開槍。」他們繼續撬他們的車。`,r:{items:{water:1},flag:'tippolice'}},ng:{t:`「路過？」帶頭的那個笑了，「路過也要繳過路費啊。」`,fight:{n:2,mode:'normal',names:['拿獵刀的劫匪','拿霰彈槍的劫匪']}}},
  {t:'q',l:'躲著他們離開',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你貼著牆繞過停車場，他們沒有注意到你。`},ng:{t:`你踢到一個空罐。「喂！」`,fight:{n:2,mode:'normal',names:['拿獵刀的劫匪','拿霰彈槍的劫匪']}}}]},
M5:{L:'M',n:'便利商店・出口',
 t:`從停車場出去有兩條路。

一條沿著大馬路走，前面拉起了紅黑相間的拒馬，掛著「醫療隔離區」的牌子，探照燈在拒馬後面掃來掃去。

另一條往下，是地鐵站的入口。往下的樓梯一片漆黑。`,
 c:[
  {t:'c',l:'往封鎖線走',ok:{t:`你沿著大馬路走向那排拒馬。`,go:'Q1'}},
  {t:'c',l:'走進地鐵站',ok:{t:`你走下樓梯。下面的空氣又冷又濕。`,go:'U1'}}]},
/* ---------- Q 封鎖線 ---------- */
Q1:{L:'Q',n:'封鎖線外',next:'Q2',
 tx:()=>G.flags.acru?'拒馬還在，牌子也還是市衛生局的，但守在後面的人換了：穿黑色制服、戴著紅色鏡片的防毒面具，胸前沒有名牌，也沒有警徽。他們不喊話，看到人就舉槍。':G.flags.shadow?'有幾面市衛生局的牌子被撕了下來，丟在路邊。地上多了幾道很寬的新輪胎痕，不是警車的胎紋。':'',
 t:`拒馬拉了整整一條街，紅黑兩色，每隔幾公尺就掛著一面牌子：「市衛生局　醫療隔離區　禁止進入　違者依法究辦」。牌子下方印著市警局的徽章。

拒馬後面停著兩台警方特勤隊的裝甲車，車頂上架著探照燈。沒有人。只有無人機在頭頂上嗡嗡地轉。`,
 tm:`你是律師。你知道「依法究辦」這四個字平常是什麼意思。你也知道，今天晚上它大概什麼意思都沒有。`,
 c:[
  {t:'q',l:'觀察無人機的巡邏路線',k:'PER',d:12,s:'感知檢定',ok:{t:`你看了五分鐘。無人機每四十秒繞一圈，西邊那段拒馬有一個死角。你算準時間，從死角鑽了過去。`,r:{flag:'dronegap'}},ng:{t:`你看得太專心，忘了自己也在燈光範圍裡。探照燈一下子打在你身上。擴音器響了：「隔離區外人員，請立即離開。重複，請立即離開。」`,p:{alarm:3,fear:6}}},
  {t:'q',l:'翻過拒馬',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你趁探照燈轉開的瞬間翻了過去。拒馬上的鐵絲勾破了你的外套，但沒有勾到你。`},ng:{t:`鐵絲劃開了你的手臂。你還是翻過去了，但血滴了一路。`,p:{hp:-2,bleed:1}}}]},
Q2:{L:'Q',n:'裝甲車',next:'Q3',
 t:`裝甲車的後艙門開著。裡面沒有人，只有一排排固定在牆上的擔架，擔架上的束帶全都被扯斷了。

地上散落著空的針筒、撕開的防護衣，還有一台平板電腦，螢幕裂了，但還亮著。

裝甲車外面的地上有一個人。他穿著警方特勤隊的黑色戰術背心，外面套著一件拋棄式防護衣，面罩破了，臉朝下趴著。他的手邊有一個彈匣。`,
 c:[
  {t:'q',l:'看平板電腦',k:'INT',d:12,s:'智力檢定',ok:{t:`平板停在一份表單上：「收容對象：第二期受試者／接觸者　狀態：轉送　接收單位：（權限不足，無法顯示）」。下面一長串名字，有些被打了勾，有些被畫了叉。

你在名單的最後一頁，看見一個你認識的地名。是你住的那間旅館。`,r:{flag:'acrulist'},p:{fear:8}},ng:{t:`平板跳出一個視窗：「請掃描識別證」。三秒後，它自動鎖上了。`}},
  {t:'q',l:'搜那個趴著的警察',k:'CON',d:11,ok:{t:`他已經死了，防護衣下面的身體腫脹發黑。他的腰包裡有一盒軍用急救包，還有幾發子彈和一捲美金。他的槍不見了。`,r:{items:{surgkit:1,ammo9:4},usd:10},p:{fear:6}},ng:{t:`你翻他的時候，他的手指動了一下。你往後退，他慢慢撐了起來，面罩裡的臉已經不是人的臉了。`,p:{fear:8},fight:{n:1,mode:'normal',names:['穿防護衣的特勤隊員']}}},
  {t:'q',l:'快速通過',ok:{t:`你不想知道裝甲車裡發生過什麼。你低著頭跑過去。`}}]},
Q3:{L:'Q',ev:1,next:'Q4'},
Q4:{L:'Q',n:'臨時檢疫站',next:'Q5',
 tx:()=>G.flags.acru?'帳篷被燒成了一副副鐵骨架，地上的灰還是溫的。折疊桌倒在一邊，那疊同意書一張都不剩。':G.flags.shadow?'咳嗽聲沒有了。帳篷全空了，行軍床上的束帶都被剪斷，地上留著一排很整齊的鞋印，一路走到路邊。衛生局的醫護人員也不見了。':'',
 t:`封鎖線後面搭著幾頂白色的帳篷，帳篷上印著紅十字和「市衛生局」的字樣。

帳篷裡傳來咳嗽聲。很多人在咳，此起彼落。

帳篷外面有一張折疊桌，桌上放著一疊表格和一支筆。表格的標題是：「自願接受觀察同意書」，抬頭沒有印任何單位的名字。桌子旁邊站著一個穿防護衣的人，背對著你，一動也不動。`,
 c:[
  {t:'q',l:'走過去跟他說話',hide:'shadow',k:'CHA',d:13,s:'統帥檢定',ok:{t:`他轉過身來，面罩後面是一個疲憊的年輕人，防護衣底下露出市立醫院緊急醫療隊的臂章。他是活人。他看了你一眼，低聲說：「不要簽。往十字路口走，不要回頭。」然後他塞給你一支鎮定劑，又轉回去背對著你。`,r:{items:{sedative:1},flag:'medichint'},p:{fear:-6}},ng:{t:`他轉過身來。面罩裡的臉被一層鮮紅色的組織蓋滿了，像一張用血管織成的網，眼睛的位置只剩兩個凹陷。那層組織隨著呼吸一起一伏。`,p:{fear:12},fight:{n:1,mode:'ambush',names:['穿防護衣的東西']}}},
  {t:'q',l:'偷看帳篷裡',hide:'shadow',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你掀開帳篷的一角。裡面是一排排行軍床，每張床上都綁著一個人。有些還在咳嗽，有些已經不動了。床尾掛著牌子，寫著日期和一個字：「觀察」。

你放下帳篷，退了出來。`,p:{fear:10},r:{flag:'tentseen'}},ng:{t:`你掀開帳篷的瞬間，離你最近的那張床上的人坐了起來，束帶一條一條斷掉。`,p:{fear:10},fight:{n:2,mode:'normal',names:['帳篷裡的病人','帳篷裡的病人']}}},
  {t:'q',l:'翻一翻空帳篷',need:'shadow',hide:'acru',k:'PER',d:12,s:'感知檢定',once:1,ok:{t:`他們搬得很急。一張行軍床底下滾著一盒沒開的藥，帳篷角落還有一個被踩扁的保溫箱，箱子上的標誌被刮掉了一半：一根杖，一條蛇。`,r:{items:{antibiotic:1,sedative:1},flag:'acruseen'},p:{fear:6}},ng:{t:`你只翻到一地被剪斷的束帶。每一條的切口都一樣整齊。`,p:{fear:6}}},
  {t:'q',l:'繞過檢疫站',ok:{t:`你繞了很大一圈，一直沒有回頭。`,p:{fear:4}}}]},
Q5:{L:'Q',n:'封鎖線・盡頭',
 t:`封鎖線的盡頭被炸開了一個缺口。缺口外面，是一個空蕩蕩的大十字路口。

你回頭看了一眼。探照燈還在掃，帳篷裡的咳嗽聲還在響，無人機還在轉。整條封鎖線像一台還在運作的機器，只是操作它的人都不見了。`,
 c:[
  {t:'c',l:'走向十字路口',ok:{t:`你從缺口走出去。`,go:'V1'}}]},
/* ---------- U 地鐵站 ---------- */
U1:{L:'U',n:'地鐵站大廳',next:'U2',
 t:`樓梯底下積了水，淹到小腿。水很冷，混著油汙，表面浮著一層彩色的膜。

售票機的螢幕還亮著：「本站暫停營運，請改搭其他交通工具」。十字轉門全被拆開了。

月台的方向一片漆黑。水面上有東西在漂，有時候是一個紙杯，有時候是一隻手。`,
 c:[
  {t:'q',l:'踩著售票機上方的平台走',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你爬上售票機旁邊的平台，沿著牆上的管線往前走，腳沒有沾到水。`,r:{flag:'drypath'}},ng:{t:`管線斷了。你整個人摔進水裡，嗆了一大口。`,p:{inf:6,hp:-1}}},
  {t:'sd',l:'在站務亭找東西',k:'PER',d:11,dark:1,s:'感知檢定',ok:{t:`站務亭的抽屜裡有一支強力手電筒和一個急救箱。站務員把東西整理得很整齊，大概是個很認真的人。`,r:{items:{flashlight:1,bandage:2}}},ng:{t:`太黑了。你摸到的東西軟軟的，還有溫度。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['站務亭裡的站務員']}}},
  {t:'q',l:'直接涉水過去',ok:{t:`你咬著牙走進水裡。水底有東西擦過你的腳踝。`,p:{inf:3,fear:4}}}]},
U2:{L:'U',n:'月台',next:'U3',
 t:`月台上停著一班列車，車門全開著。車廂裡的燈一節亮一節暗，大概是靠備用電池撐著。

只有第一節車廂的門沒有開。玻璃上全是手印，裡面擠著一群人，有的把臉貼在玻璃上，有的一直用頭撞車門。列車停下來的時候，他們大概就被關在裡面了。

月台的廣播一直重複同一段錄音：「本列車因故暫停運轉，請依照站務人員指示，由月台兩側出口疏散。」月台上沒有站務人員。`,
 c:[
  {t:'q',l:'穿過車廂走到另一頭',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你從第三節車廂鑽進去，往列車尾端走。車廂裡沒有人，只有掉了一地的包包和鞋子。背後第一節車廂那邊，撞玻璃的聲音一陣比一陣急。你從最後一節車廂出來的時候，手心全是汗。`,p:{fear:8}},ng:{t:`你走到一半，背後傳來玻璃碎掉的聲音。第一節車廂的車窗被撞破了，裡面的人一個接一個從窗口爬出來，朝你衝過來。`,p:{fear:10},fight:{n:2,mode:'normal',names:['車廂裡的乘客','車廂裡的乘客']}}},
  {t:'q',l:'走軌道旁邊的維修步道',k:'PER',d:12,dark:1,s:'感知檢定',ok:{t:`維修步道很窄，旁邊就是軌道。你一路摸著牆走，在一個維修櫃裡找到一把大鐵鎚。`,r:{gear:'sledge'}},ng:{t:`步道上躺著一個人。你踩到他的時候才發現。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['步道上的維修工']}}},
  {t:'q',l:'聽廣播的內容',k:'INT',d:11,s:'智力檢定',ok:{t:`錄音重複了好幾次。第三次之後，插進一段不一樣的聲音，是有人拿月台的廣播麥克風在講話，背景很吵：「……地下通道往十字路口的出口還能走……不要往市政廳方向……那邊已經……」錄音斷了。`,r:{flag:'metrohint'}},ng:{t:`廣播的備用電源快撐不住了，聲音越拖越長，越來越走音，最後停了。月台上只剩積水滴下來的聲音，還有第一節車廂裡撞玻璃的聲音。`,p:{fear:6}}}]},
U3:{L:'U',ev:1,next:'U4'},
// v0.43.0 網改成腐殖核心（主人 2026-11-20）：不燒掉就過不去，可以退回地面改走封鎖線
U4:{L:'U',n:'轉乘通道',next:'U5',
 t:`轉乘通道的牆上長滿了東西。鮮紅色的根從天花板垂下來，一條一條鼓脹著，像是剝了皮的血管。

那些根在地上纏成一張很大的網，把整條通道封死了。網的正中央包著一團東西，一下一下地跳動，像一顆很大的心臟；又像一個繭，裡面有什麼正在長大。所有的根，都是從它身上長出去的。

這是腐殖核心。

網的旁邊，散落著好幾個背包。有些人走到這裡，就沒有再往前了。`,
 c:[
  {t:'q',l:'燒掉腐殖核心',req:['molotov','g:flamer','fuel'],reqAny:1,s:'需要燃燒瓶、噴火器或燃料',ok:{t:`火一碰到核心，整條通道就尖叫了起來。不是聲音，是那些根在火裡扭動、收縮、爆開。核心裂開的時候，噴出來的不是血，是又黑又燙的汁液。你摀著口鼻從燒焦的網中間衝過去，身後的火光把整條通道照成橘紅色。`,r:{use:'$req',flag:'burnednest'},p:{fear:6}}},
  {t:'q',l:'撿那些背包',k:'CON',d:12,once:1,stay:1,ok:{t:`你屏住呼吸，靠過去拖了兩個背包回來。裡面有水、食物，還有一支沒用過的抗生素。`,r:{items:{water:1,bar:1,antibiotic:1}},p:{inf:4}},ng:{t:`你靠得太近了。網動了，一條根纏上你的手腕，你用力扯斷它，手腕上留下一圈發黑的痕跡。`,p:{inf:10,fear:8}}},
  {t:'c',l:'退回地面，改走封鎖線',ok:{t:`這條路過不去。你退回月台，扶著欄杆爬回地面，繞到封鎖線那一頭。`,go:'Q1'}}]},

U5:{L:'U',n:'地下道・出口',
 t:`通道的盡頭是一座往上的樓梯，樓梯口的指標寫著：「4 號出口　往十字路口」。

外面的風灌了進來。你從來沒有覺得夜晚的空氣這麼乾淨過。`,
 c:[
  {t:'c',l:'走上去',ok:{t:`你一階一階爬上樓梯，走回地面。`,go:'V1'}}]},
/* ---------- V 十字路口 ---------- */
V1:{L:'V',n:'十字路口',next:'V2',
 t:`一個很大的十字路口。四個方向的紅綠燈同時閃著黃燈。

路口中間有一台公車翻倒在地上，車身燒得焦黑。公車旁邊有一個用油漆畫的箭頭，指向三個方向，每個箭頭旁邊都寫著字：

「消防局→　有人」
「購物中心→　有物資」
「警察局→　有槍」

三行字是三種不同的筆跡。`,
 c:[
  {t:'m',l:'搜翻倒的公車',k:'CON',d:12,ok:{t:`公車裡的人都燒焦了，但駕駛座旁邊的急救箱還在，外殼燒得變形，裡面的東西還能用。`,r:{items:{med:1,iodine:1,splint:1}},p:{fear:6}},ng:{t:`焦臭味嗆得你眼淚直流。你什麼都沒找到。`,p:{fear:4}}},
  {t:'q',l:'看清楚那三行字',k:'PER',d:11,s:'感知檢定',ok:{t:`「消防局」那行的油漆還沒乾。「購物中心」那行旁邊有一個血手印。「警察局」那行下面，有人用很小的字補了一句：「不要相信他們。」`,r:{flag:'arrows'}},ng:{t:`太暗了，你只看得清楚那三個箭頭。`}}]},
V2:{L:'V',ev:1,next:'V3'},
V3:{L:'V',n:'十字路口・抉擇',
 t:`你站在路口中間。

北邊，消防局的紅色車庫門關著一半，裡面亮著燈，有人在喊話，聽起來像是在組織人手。

東邊，購物中心的巨大招牌熄了一半，只剩下「……MALL」幾個字母還亮著。停車場裡停滿了車，入口用購物車堵了起來。

西邊，警察局的方向傳來零星的槍聲。屋頂上有人影在移動。

每個方向都有人，也都有危險。先在街區站穩腳步，再決定下一步。`,
 c:[
  {t:'c',l:'在街區找個落腳的地方',ok:{t:`你離開路口中間，往街區裡面走。`,go:'Z0'}}]}
});
/* ---------- 第二章隨機事件 ---------- */
EVPOOL.push(
 {id:'scooter',ch:2,t:`一台重型機車倒在路中間，車燈還亮著，引擎還在怠速。騎士不見了，安全帽滾在一旁，裡面有東西。`,c:[
  {t:'q',l:'看安全帽裡面',k:'CON',d:12,ok:{t:`是一支手機，螢幕上停在一則沒有送出的訊息：「我快到家了」。你把手機放回去。旁邊的側箱裡有一瓶水和一包菸。你把安全帽倒過來抖了抖，戴上剛好。`,r:{items:{water:1,cigarette:1,motohelmet:1}},p:{fear:4}},ng:{t:`是一顆頭。你知道你不該看的。`,p:{fear:12}}},
  {t:'q',l:'把引擎熄火',k:'AGI',d:10,ok:{t:`你轉動鑰匙，引擎停了。街上安靜得可怕。後座綁著一個網袋，裡面是騎士的護肘和護膝。`,r:{items:{motoarm:1,motoleg:1}}},ng:{t:`你一碰，車身就滑向另一邊，喇叭響了很長一聲。`,p:{alarm:3}}}]},
 {id:'drone',ch:2,t:`頭頂傳來嗡嗡聲。一架無人機低低地飛過來，探照燈在地上畫出一個白色的圓，一路朝你掃過來。`,c:[
  {t:'q',l:'躲進公寓門廊',k:'AGI',d:11,ok:{t:`你閃進一棟公寓門廊的陰影裡。白色的圓從你腳邊掃過去，停了一下，又繼續往前。`},ng:{t:`你慢了半步。白色的圓停在你身上。無人機的擴音器響了：「發現未登記人員。」`,p:{alarm:4,fear:6}}},
  {t:'q',l:'站著不動',k:'INT',d:12,ok:{t:`你賭它是用動作偵測。你賭對了。無人機在你頭頂盤旋了一圈，飛走了。`},ng:{t:`你賭錯了。`,p:{alarm:4},fight:{n:1,mode:'normal'}}}]},
 {id:'pack',ch:2,t:`遠處傳來很多人的喘氣聲，還有光著腳踩在柏油路上的啪嗒聲。聲音越來越近。`,c:[
  {t:'q',l:'爬到車頂上',k:'AGI',d:11,ok:{t:`你爬上一台轎車的車頂。三個人從你腳下跑過去，赤著腳，眼睛是白的，嘴巴張得很開。他們沒有抬頭。`},ng:{t:`你爬到一半，一隻手抓住了你的腳踝，把你往下拖。`,fight:{n:2,mode:'ambush',names:['赤腳的感染者','赤腳的感染者']}}},
  {t:'q',l:'丟東西引開他們',req:['bottle','coin','cola','water'],reqAny:1,ok:{t:`你把手上的東西遠遠丟出去，撞擊聲在街上彈來彈去。那群人轉了個方向，撲向那個聲音。`,r:{use:'$req'}}},
  {t:'q',l:'撿路邊的碎石丟出去引開',k:'AGI',d:11,ok:{t:`你從人行道邊撿起一塊碎掉的水泥塊，往街的另一頭用力丟出去。石頭砸在一台車的引擎蓋上，砰的一聲。那群人轉了個方向，撲向那個聲音。`},ng:{t:`石頭只滾到前面幾步的地方，喀啦喀啦停在你腳邊不遠。白色的眼睛一起轉了過來。`,p:{fear:6},fight:{n:2,mode:'normal'}}}]},
 {id:'atm',ch:2,get t(){return pwNow()?`一台提款機的螢幕還亮著，上面停在「交易完成，請取回您的卡片」。卡片還插在裡面。提款機前面的地上，有一攤很大的血。`:`一台提款機的螢幕黑著，卡片還插在插卡口，出鈔口卡著幾張鈔票。提款機前面的地上，有一攤很大的血。`},c:[
  {t:'q',l:'拿走卡片看看',k:'PER',d:11,ok:{t:`卡片上的名字被血蓋住了，但背面貼著一張便利貼：「媽，密碼是你的生日」。提款機旁邊掉了一包零錢，出鈔口還卡著幾張鈔票，剛好每個人分得到。`,r:{items:{coin:1},usdAll:12},p:{fear:4}},ng:{get t(){return pwNow()?`你伸手的時候，提款機的螢幕跳出一行字：「是否繼續交易？」你不知道為什麼，覺得很冷。`:`你伸手的時候，摸到插卡口邊緣黏黏的。是還沒乾的血。`},p:{fear:6}}},
  {t:'q',l:'不要碰',ok:{get t(){return pwNow()?`你繞過那攤血。螢幕在你身後換成了「感謝您的使用」。`:`你繞過那攤血，沒有回頭。`}}}]},
 {id:'shrine',ch:2,t:`街角的電線桿底下有一個臨時的悼念處：一圈燒到一半的蠟燭、幾束花、一隻泰迪熊，還有一張用膠帶貼在桿子上的照片。照片裡是一個穿球衣的少年。

蠟燭旁邊放著一瓶威士忌和一包沒拆的餅乾。蠟燭還沒燒完，有人剛來過。`,c:[
  {t:'q',l:'停下來，替他默哀一下',ok:{t:`你站在那裡，低著頭。你不認識他，也不知道該說什麼，但心裡安靜了一點。`,p:{fear:-8}}},
  {t:'q',l:'拿走那些東西',k:'CHA',d:12,ok:{t:`你說了一聲「抱歉」，拿走了餅乾和那瓶酒。你覺得他應該會懂。`,r:{items:{cookie:1,whiskey:1}}},ng:{t:`你拿起那瓶酒的時候，一陣風吹過來，所有的蠟燭同時熄了。`,p:{fear:10}}}]},
