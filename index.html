  {t:'q',l:'跟歐文談',hide:'fdopen',trust:1,k:'CHA',d:12,s:'統帥檢定',stay:1,once:1,ok:{t:`你說了你們從哪裡來、路上看到了什麼。他聽完，從裝備架上拿下一副防毒面具丟給你。\n\n「有些地方的空氣已經不能吸了。」他指了指後面的裝備室，「需要什麼自己拿，別拿太多。」`,r:{items:{gasmask:1,filter:1},flag:'fdopen'}},ng:{t:`「我們自己的人都不夠用了。」他轉身回去整理水帶，沒有再看你。`}},
  {l:'跟他們出去救人',hide:'fdopen',trust:1,once:1,t:'m',ok:{t:`歐文把一副防毒面具塞進你手裡：「戴著，別走散。」\n\n你們跟著雲梯車衝到兩條街外那棟冒煙的公寓。樓梯間裡全是煙，煙裡有東西在動。`,r:{items:{gasmask:1,filter:1},flag:'fdopen',karma:1},fight:{n:2,mode:'normal'},go:'T0'}},
  {t:'q',l:'趁沒人注意，溜進裝備室',hide:'fdopen',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你等歐文轉身去接無線電，貼著雲梯車的車身溜到後面。`,r:{karma:-1},go:'T1'},ng:{t:`「喂！」歐文一把抓住你的領子，把你推出車庫門。「我們這裡不歡迎小偷。」`,p:{fear:6},go:'Z0'}},
  {t:'q',l:'去裝備室',need:'fdopen',ok:{t:`你們穿過車庫，推開後面那扇寫著「裝備室」的門。`,go:'T1'}},
  {t:'q',l:'上屋頂的瞭望台',ok:{t:`你們爬上消防局的鐵梯，推開屋頂的門。`,go:'T2'}},
  {...sleepC('在消防員宿舍過夜',`宿舍裡一排上下舖，被子都沒有疊。你挑了一張靠門的床躺下，車庫那邊的無線電一整晚都在沙沙地響，偶爾有人說話，聽不清楚在說什麼。\n\n天亮的時候，無線電安靜了。`),need:'fdopen',hide:'acru'},
  {t:'c',l:'回街區',ok:{t:`你們走出車庫，回到大馬路上。`,go:'Z0'}}]},
T1:{L:'T',n:'消防局・裝備室',
 t:`一整面牆的置物櫃，每一格都貼著名字。掛鉤上吊著消防衣和空氣呼吸器，鋼瓶全是空的。角落的工具架上放著一台黃色的油壓擴張器，旁邊是兩把消防斧。`,
 c:[
  {t:'q',l:'拿液壓破拆工具',once:1,stay:1,ok:{t:`油壓擴張器比你想的重得多，背在背上像背了一個人。`,r:{items:{spreader:1}}}},
  {t:'q',l:'拿一把消防斧',once:1,stay:1,ok:{t:`斧柄上纏著膠帶，刃口磨得很亮。`,r:{gear:'fireaxe'}}},
  {t:'sd',l:'翻置物櫃',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`大部分的櫃子都是空的。最下面一格塞著一個紙箱，裡面是兩個還沒拆封的濾毒罐和一包消毒繃帶。`,r:{items:{filter:2,sbandage:1}}},ng:{t:`你翻了一排又一排，只找到別人的家庭照片和幾雙襪子。`}},
  {t:'q',l:'拿一副備用的防毒面具',once:1,stay:1,ok:{t:`面罩的鏡片有一道刮痕，但扣環還是好的。裡面已經裝著一個濾罐。`,r:{items:{gasmask:1,filter:1}}}},
  {t:'q',l:'回車庫',ok:{t:`你們把裝備室的門帶上。`,go:'T0'}}]},
T2:{L:'T',n:'消防局・瞭望台',
 tx:()=>G.flags.streetpower?'東邊的配電站有燈，街區的路燈亮了一半。':G.flags.blackout?'整座城市都是黑的，連醫院那邊也是，只有幾扇窗戶裡有手電筒的光在晃。東邊那片鐵絲網圍起來的地方，就是配電站。':'',
 t:`從這裡看得到整個街區。北口檢查站的鐵絲網、購物中心那塊缺了半邊字的招牌、西邊警察局的屋頂。東南邊那棟白色的大樓是聖瑪莉醫院，救護車道上停滿了車，一台都沒有在動。`,
 c:[{t:'q',l:'回車庫',ok:{t:`你們順著鐵梯爬下去。`,go:'T0'}}]},
/* ---------- 醫院（v0.56.0 深地圖範本：三層單向路線，PROPOSAL_HOSPITAL，主人 2026-11-23 定案） ----------
   第一層 急診「聲音」（ROUTE.O 警戒倍率 2）→ 第二層 四樓 4 West「伸手可及」→ 第三層 地下室「空氣」。
   卡的先後寫在檔尾的 ROUTE.O／OF／OB；O0～O3 沿用舊代號（O2＝四樓第一張、O3＝地下室第一張），舊存檔接得上。 */
O0:{L:'O',n:'聖瑪莉醫院・急診入口',
 tx:()=>G.flags.acru?'救護車道上停滿了沒有標示的黑色車輛，急診的燈全亮著，用的是他們自己的發電車。自動門口站著兩個穿全套防護衣的人，背對著你們，在看平板。從正門進去不可能。':(G.flags.shadow?'救護車道上多了一排沒有標示的黑色廂型車，引擎都沒熄。':'')+(pwNow()?'急診裡的燈亮著，有一根燈管一直在閃。':'急診裡面一片黑，只有緊急出口的標示還亮著一點綠光。'),
 t:`救護車一台接一台停在急診入口，後車門全開著，擔架床歪在地上。

自動門的玻璃碎了一地。裡面很安靜，安靜到聽得見布簾後面的呼吸聲：喉嚨裡卡著痰，每吸一口氣都帶著咕嚕的水聲。不只一張床。

救護車道旁邊有一扇員工側門，門上的讀卡機是暗的。`,
 c:[
  {t:'q',l:'踩著碎玻璃走進去',hide:'acru',ok:{t:`你的鞋底踩碎了一片玻璃。最近的那張簾子後面，呼吸聲停了。病床的鐵架輕輕響了一下，像有人在床上翻身。

過了一會兒，呼吸聲又開始了。`,r:{flag:'ernoise'},p:{alarm:1}}},
  {t:'m',l:'撬開員工側門',hide:'acru',req:['g:crowbar','g:fireaxe','spreader'],reqAny:1,k:'STR',d:11,s:'需要鐵撬、消防斧或破拆工具',ok:{t:`你把工具塞進門縫，一點一點往外撐。門鎖的舌片慢慢彎掉，門開了，幾乎沒有聲音。側門後面是急診的員工走道，牆上掛著一排白袍。`},ng:{t:`工具從門縫滑出來，敲在鐵門上，噹的一聲。你們等了很久才敢再試一次。門最後還是開了。`,r:{flag:'ernoise'},p:{alarm:1}}},
  {t:'q',l:'從救護車的後車廂翻進檢傷區',hide:'acru',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`有一台救護車是倒車停進來的，後車門正對著檢傷區被撞破的玻璃隔間。你從擔架床上爬過車廂，翻過隔間的鋁框，落地的時候只踩到一張病歷。`},ng:{t:`你翻過鋁框的時候，背包勾到了車廂裡的點滴架。點滴架倒下來，撞在車廂的鐵板上。

布簾後面有好幾張床響了一下。`,r:{flag:'ernoise'},p:{alarm:2,fear:3}}},
  {t:'m',l:'繞到後面，從救護車後門進地下室',need:'acru',ok:{t:`你們繞過停車場，貼著醫院的外牆走到後面。`,r:{flag:'hback'},go:'OBa'}},
  {t:'c',l:'回街區',ok:{t:`你們退出救護車道。`,go:'Z0'}}]},
O1:{L:'O',n:'急診・檢傷站',
 tx:()=>pwNow()?'檢傷站的電腦螢幕還亮著，停在一張沒有填完的檢傷單上。':'檢傷站的電腦螢幕是黑的。桌上有一支筆型手電筒還開著，光照在天花板上，電池快沒了。',
 t:`檢傷站的櫃台後面，地上散著一疊檢傷單和一捲撕到一半的手圈貼紙。櫃台的玻璃上貼著一張手寫的紙：「發燒＋咬傷：直接送觀察區，不要排隊」。

往裡面看，整條急診走道兩邊都是布簾，大部分拉著。牆上有一大塊病床配置白板。`,
 c:[
  {t:'sd',l:'翻檢傷櫃台的抽屜',stay:1,ok:{t:`抽屜裡是檢傷用的東西：一盒乳膠手套、一支筆型手電筒、幾包酒精棉片，還有一卷繃帶。`,r:{items:{flashlight:1,alcohol:1,bandage:1}}}},
  {t:'q',l:'看病床配置白板',once:1,stay:1,ok:{t:`白板上畫著急診的床位，一格一格寫著床號和姓名縮寫。1 到 12 號床大部分都寫了名字，旁邊用藍筆註記「發燒」「咬傷」「躁動，已約束」。

有五個床號被紅筆劃掉，旁邊寫著同一個字：「轉 4W」。最底下一行字跡很潦草：「4W 不收了。剩下的留在原床。」

你記下哪幾張床有人。`,r:{flag:'erboard'}}},
  {t:'q',l:'站在走道口聽一陣子',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`你閉上眼睛聽。左邊第二張、第三張、右邊最裡面那張，呼吸聲最重。7 號床的簾子後面有布料摩擦的聲音，一直沒停。其他的簾子後面很安靜。`,r:{flag:'erlisten'}},ng:{t:`呼吸聲太多了，混在一起，分不出是從哪裡來的。你只知道，比你以為的還多。`,p:{fear:3}}},
  {t:'mv',l:'往裡面走',ok:{t:`你們放輕腳步，走進布簾之間的走道。`}}]},
OE1b:{L:'O',n:'急診・家屬等候區',
 tx:()=>pwNow()?'牆上的電視還開著，靜音，新聞台的跑馬燈一直在跑：「市府：急診量增加屬季節性現象，民眾毋須恐慌」。':'牆上的電視是黑的，螢幕上映著你們的影子。',
 t:`檢傷站旁邊是家屬等候區，三排藍色的塑膠椅，椅子上丟著外套、包包和喝到一半的咖啡。角落有一台自動販賣機，玻璃後面還有飲料和餅乾。

有一排椅子被推倒了，地上有一道拖過的血跡，一路通往布簾那邊。`,
 c:[
  {t:'sd',l:'翻椅子上的包包',stay:1,ok:{t:`大部分的包包裡只有錢包、鑰匙和手機。有一個媽媽包裡塞著一瓶水、一包蘇打餅乾，還有一小罐酒精乾洗手。`,r:{items:{water:1,cookie:1,alcohol:1}}}},
  {t:'q',l:'撬開自動販賣機',once:1,stay:1,req:['g:crowbar','g:fireaxe','spreader'],reqAny:1,s:'需要鐵撬、消防斧或破拆工具',ok:{t:`你把工具卡進販賣機的門縫，用力一扳。門鎖撐住了一下，然後整片玻璃門彈開，撞在旁邊的椅子上。

布簾那邊有床在響。你把飲料和餅乾一把一把掃進背包。`,r:{items:{cola:2,water:2,chips:1},flag:'ernoise'},p:{alarm:2}}},
  {t:'q',l:'看看那道血跡',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`血跡是一個人被拖著走留下的，鞋跟在地上刮出兩條線，到 3 號床的簾子前面就斷了。簾子底下露出一隻皮鞋。

3 號床。你記住了，不要靠近那一張。`,r:{flag:'erlisten'},p:{fear:4}},ng:{t:`血跡在布簾那邊轉了彎，你看不出是到哪一張床。`,p:{fear:2}}},
  {t:'mv',l:'往裡面走',ok:{t:`你們離開等候區，走進布簾之間的走道。`}}]},
OE2:{L:'O',n:'急診・布簾之間',
 t:`走道不到兩公尺寬，兩邊都是淺綠色的布簾，底下露出病床的輪子和垂下來的點滴管。地上有一灘乾掉的嘔吐物，被輪子壓出兩條線。

走道中間停著一台推床，床上沒有人，床單捲成一團。要往裡面走，得先過這台推床。`,
 c:[
  {t:'q',l:'貼著牆，從推床旁邊擠過去',k:'AGI',d:11,bonusFlag:'erboard',s:'敏捷檢定',ok:{t:`你側著身子，從推床和牆壁之間擠過去，一直貼著沒有人的那一邊。推床的扶手擦過你的外套，沒有發出聲音。`},ng:{t:`你的外套勾到了簾子的掛鉤，整片布簾被扯開一截。簾子後面的人側躺著，背對你，肩膀一起一伏。

他沒有轉過來。你慢慢把手抽回來。`,p:{fear:5}}},
  {t:'q',l:'把推床推到一邊',ok:{t:`推床的輪子很久沒上油，一推就嘎吱嘎吱地響。你推到一半就停住了。左邊有兩張簾子同時動了一下，簾子底下露出的那隻腳，腳趾縮了起來。

你等了一會兒，把推床留在原地，從旁邊擠了過去。`,r:{flag:'ernoise'},p:{alarm:1,fear:3}}},
  {t:'q',l:'從推床底下爬過去',ok:{t:`你趴下來，從推床底下爬過去。地板很冰，有消毒水和別的東西的味道。爬到另一頭，你的臉離一張病床的輪子不到一個手掌。床上的人翻了個身，床墊陷下去，彈簧響了一聲。

你等它不動了，才爬出來。`,p:{fear:4}}}]},
OE3:{L:'O',n:'急診・7 號床',
 t:`7 號床的簾子在動。不是風吹的那種動，是有東西在裡面，一下一下撞著簾子，布料被撐出一個圓圓的形狀，又縮回去。

簾子底下露出一截床欄，上面綁著一條白色的約束帶，另一頭是空的。

床頭的掛勾上掛著一件深藍色的護理師外套，胸前別著「夜班護理長」的名牌，口袋裡露出一串鑰匙。`,
 c:[
  {t:'q',l:'不碰，繞過去',ok:{t:`你貼著對面的布簾走過去，眼睛一直盯著那個一撐一縮的形狀。它沒有出來。`,p:{fear:3}}},
  {t:'q',l:'從簾子的縫看進去',k:'PER',d:12,bonusFlag:'erlisten',s:'感知檢定',ok:{t:`床上的人一隻手還綁在床欄上，另一隻手的約束帶被扯斷了。他坐在床上，用額頭一下一下撞簾子後面的牆，撞得很慢，很規律。

外套掛在床頭，離他的手不到半公尺。你趁他的頭往後仰的那一下，伸手把鑰匙從口袋裡勾了出來。`,r:{flag:'erkey'},p:{fear:5}},ng:{t:`你湊近簾子的縫，裡面的人正好轉過頭來。你們隔著一條縫對看了一眼。

他整個人撲向簾子，被綁住的那隻手把床欄扯得哐噹一聲。`,r:{flag:'ernoise'},p:{alarm:2,fear:8}}},
  {t:'q',l:'拉開簾子',ok:{t:`你一把拉開簾子。床上的人一隻手還綁在床欄上，另一隻手已經伸了過來。`,fight:{n:1,mode:'first',names:['7 號床的病人']},win:{t:`你從外套口袋裡拿到那串鑰匙。名牌上的照片是一個短頭髮的中年女人，名字底下印著「急診部」。`,r:{flag:'erkey'}}}}]},
OE4:{L:'O',n:'急診・護理站',
 tx:()=>pwNow()?'護理站的電腦螢幕還亮著，滑鼠垂在桌邊晃。':'護理站的電腦螢幕是黑的。旁邊的交班本攤開著，夾滿了印出來的單子。',
 t:`護理站是一圈 U 字形的櫃台，櫃台上擺著三台電腦、一支內線電話和一個插滿病歷夾的架子。椅子全被推開了，有一張倒在地上。

櫃台旁邊停著一台藥車，抽屜一格一格貼著床號，有一個輪子纏著膠帶。`,
 c:[
  {t:'q',l:'翻交班本',once:1,stay:1,k:'INT',d:11,s:'智力檢定',ok:{get t(){return (pwNow()?'電腦上的':'交班本裡夾著一疊印出來的')+`掛號紀錄停在三天前。那一天急診收了四十幾個病人，備註欄寫的都是同一行字：「ARC 合作門診・第二期回診」。最後一筆的備註多了一句：「旅館那幾位，改成到院觀察。」

交班本最後一頁是手寫的：「4W 說滿了，不收。藥局鎖了，瑞秋在裡面，鑰匙在護理長身上。」`},r:{flag:['erlog','ernurseknow']},p:{fear:4}},ng:{get t(){return pwNow()?`螢幕跳出登入畫面，要員工證才能進去。`:`交班本被血泡過，一頁一頁黏在一起，字全糊了。`}}},
  {t:'sd',l:'翻護理站的抽屜',stay:1,ok:{t:`抽屜裡塞著一包止痛藥、一卷膠帶、兩顆三號電池，還有一包沒拆的消毒繃帶。最裡面是一個塑膠盒，裝著別人的午餐。`,r:{items:{painkiller:1,tape:1,battery:2,sbandage:1}}}},
  {t:'q',l:'只拉開藥車最上面那一格',once:1,stay:1,hide:'ercart',ok:{t:`你按住藥車，不讓它動，只把最上面那一格慢慢拉開。裡面是一板抗生素。你把它拿出來，再把抽屜慢慢推回去。`,r:{items:{antibiotic:1},flag:'ercart1'}}},
  {t:'q',l:'把藥車推走',once:1,stay:1,hide:'ercart1',ok:{t:`你抓住藥車的把手一拉，輪子同時嘎嘎地響，纏著膠帶的那一個卡住了，整台車往旁邊一歪，撞在櫃台上。

布簾後面有床在響。不只一張。

你把藥車拖到櫃台後面，一格一格拉開：抗生素、優碘，還有兩支腎上腺素注射筆。`,r:{items:{antibiotic:1,iodine:1,adrenaline:2},flag:['ercart','ernoise']},p:{alarm:2,fear:4}}},
  {t:'mv',l:'往前走',ok:{t:`你們離開護理站，往走道深處走。`}}]},
OE5:{L:'O',n:'急診・內線電話',
 t:`你們剛離開護理站，櫃台上的內線電話就響了。

紅色的燈一閃一閃，鈴聲在整條走道上傳得很遠，一聲，兩聲。螢幕上顯示著來電的分機：「藥局」。

布簾後面，有一張床的床欄開始哐噹哐噹地響。`,
 c:[
  {t:'q',l:'接起來',ok:{t:`你一把抓起話筒，鈴聲停了。

話筒另一頭是一個女人的聲音，壓得很低，在發抖：「……外面有人？你是人對不對？我在藥局，我出不去。鐵捲門鎖了，鑰匙不在我這裡……拜託。」

床欄的聲音慢慢停了。`,r:{flag:'ernurseknow'}}},
  {t:'q',l:'把電話線拔掉',ok:{t:`你摸到電話背後的線，一把扯掉。鈴聲斷在一半。

床欄又響了兩下，停了。走道盡頭那扇掛著「藥局」牌子的鐵捲門後面，傳來一聲很輕的「喂？」，然後就沒有聲音了。`,r:{flag:'ernurseknow'},p:{fear:2}}},
  {t:'q',l:'不管它，快步離開',ok:{t:`你們加快腳步往前走。鈴聲在身後一直響，響了十幾聲才停。

你們走過的那幾張簾子後面，床欄都在響。`,r:{flag:'ernoise'},p:{alarm:2,fear:4}}}]},
OE6:{L:'O',n:'急診・急救室',
 tx:()=>pwNow()?'急救室的燈全開著，心電圖監視器還在嗶嗶地叫，螢幕上是一條直線。':'急救室裡只有一台監視器還亮著，靠的是它自己的電池。螢幕上是一條直線。',
 t:`急救室有一扇可以關上的推門。裡面只有一張急救床，床單上全是血，旁邊是急救推車和一台被推到牆邊的超音波。

地上散著拆開的針頭包裝和剪開的衣服。牆上掛著一個白色的 AED 箱，箱子上的綠燈還亮著。`,
 c:[
  {t:'sd',l:'翻急救推車的抽屜',stay:1,ok:{t:`急救推車的抽屜照顏色分好了。你拿走了一個手術包、兩卷消毒繃帶和一副夾板。`,r:{items:{surgkit:1,sbandage:2,splint:1}}}},
  {t:'q',l:'打開牆上的 AED 箱',once:1,stay:1,ok:{t:`你一拉開箱門，箱子就響了：一陣尖銳的「嗶——嗶——」，是讓人找得到它的警報。你手忙腳亂地把整台 AED 抱出來，按住箱子上的靜音鍵，按了三次才停。

推門外面有腳步聲，拖著地，從門口經過。`,r:{items:{aed:1},flag:'ernoise'},p:{alarm:2,fear:4}}},
  {t:'qh',kind:'躲藏',l:'關上推門，在裡面等一陣子',quiet:1,stay:1,ok:{t:`你把推門關上，用急救床頂住。門上的小窗外面有人影晃過去，停了一下，又走了。你們靠著牆坐著，一直等到走道上只剩下呼吸聲。`}},
  {t:'mv',l:'往前走',ok:{t:`你們推開急救室的門，回到走道上。`}}]},
OE7:{L:'O',n:'急診・藥局門口',
 tx:()=>G.flags.ernurseknow?'剛才打內線電話的人，就在這扇鐵捲門後面。':'',
 t:`走道盡頭是藥局。領藥窗口拉下了鐵捲門，旁邊的鐵門也鎖著，門上貼著「管制藥品區　非藥局人員禁止進入」。

你們經過的時候，鐵捲門從裡面被敲了三下。很輕，很小心。停了一下，又三下。`,
 c:[
  {t:'q',l:'小聲回應',ok:{t:`你貼著鐵捲門，壓低聲音說：「外面有人。」

裡面安靜了很久。然後是一個女人的聲音：「我叫瑞秋，是急診的護理師。他們把我鎖在這裡面，說等一下就回來。那是三天前。」她頓了一下，「鐵捲門的鑰匙在夜班護理長的外套裡，7 號床。拜託。」`,r:{flag:['ernurse','ernurseknow']}}},
  {t:'q',l:'寫字從門縫塞進去',ok:{t:`你從檢傷單撕下一角，寫上「外面有人，要怎麼開」，從鐵捲門底下的縫塞進去。

過了一會兒，紙條被推了出來，背面寫著：「我是護理師瑞秋。鑰匙在夜班護理長的外套口袋，7 號床。小心，他還綁著一隻手。」`,r:{flag:['ernurse','ernurseknow']}}},
  {t:'q',l:'不出聲，繼續走',ok:{t:`你們從鐵捲門前面走過去，誰都沒有出聲。身後又敲了三下，比剛才更輕。然後就沒有了。`,r:{flag:'nursestay'},p:{fear:3}}}]},
OE8:{L:'O',n:'急診・藥局的鐵捲門',cond:'ernurse',
 t:`鐵捲門的鑰匙孔在門框右下角，旁邊有一個拉環。門很重，是那種一拉就整片嘩啦啦捲上去的鐵捲門。

瑞秋在裡面說：「慢一點。這一帶的床，都有人。」`,
 c:[
  {t:'q',l:'用鑰匙開，慢慢推上去',need:'erkey',ok:{t:`鑰匙轉了半圈，鎖開了。你一手托著鐵捲門的底，一點一點往上推，每推一截就停下來聽。推到膝蓋那麼高，一隻手從底下伸出來，抓住你的手腕。是溫的，在發抖。

瑞秋從門底下爬了出來。`,r:{flag:'ernurseout'}}},
  {t:'m',l:'回 7 號床拿護理長的鑰匙',hide:'erkey',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你們退回 7 號床。床上的人還在撞牆，一下，一下。你趁他的頭往後仰，從外套口袋裡勾出鑰匙，再一路退回藥局。

鑰匙轉了半圈，鐵捲門慢慢升起來。瑞秋從門底下爬了出來。`,r:{flag:['erkey','ernurseout']}},ng:{t:`你的手剛碰到口袋，床上的人就轉過頭來。`,fight:{n:1,mode:'ambush',names:['7 號床的病人']},win:{t:`你從外套口袋裡拿到鑰匙，回到藥局，把鐵捲門慢慢推上去。瑞秋從門底下爬了出來。`,r:{flag:['erkey','ernurseout']}}}},
  {t:'q',l:'用撬棍慢慢把鐵捲門撐起來',hide:'erkey',req:['g:crowbar','g:fireaxe'],reqAny:1,k:'STR',d:12,s:'需要鐵撬或消防斧',ok:{t:`你把撬棍塞進鐵捲門底下，一點一點往上撬。鎖舌卡在軌道裡，被你撬彎了。門升起一個人爬得過去的高度，聲音不大。瑞秋從底下爬了出來。`,r:{flag:'ernurseout'}},ng:{t:`鎖舌突然鬆開，整片鐵捲門嘩啦一聲捲了上去，撞在頂上。

整條走道的床都在響。瑞秋從裡面衝出來，抓住你的手臂：「快走。」`,r:{flag:['ernurseout','ernoise']},p:{alarm:3,fear:6}}},
  {t:'q',l:'抓住拉環硬拉',hide:'erkey',k:'STR',d:14,s:'力量檢定',ok:{t:`你雙手抓住拉環，用全身的重量往上拉。鎖舌被扯斷了，鐵捲門嘩啦一聲捲上去一半。瑞秋從底下爬出來。

走道兩邊的布簾，一張接一張動了起來。`,r:{flag:['ernurseout','ernoise']},p:{alarm:2,fear:4}},ng:{t:`鐵捲門紋風不動，只發出一陣哐啷哐啷的聲音。你又拉了一次，還是不動。

布簾後面的床欄響成一片。瑞秋在裡面說：「別拉了。你們先走。」`,r:{flag:['nursestay','ernoise']},p:{alarm:3,fear:6}}},
  {t:'q',l:'跟她說你們開不了',ok:{t:`「開不了。」你說，「我們找到辦法再回來。」

裡面安靜了一下。「好。」她說，「藥局裡有水，我撐得住。小心 9 號到 12 號床，那幾個是最早送來的。」`,r:{flag:'nursestay'},p:{fear:3}}}]},
OE9:{L:'O',n:'急診・瑞秋',cond:'ernurseout',
 t:`瑞秋大概三十歲，穿著深藍色的護理師制服，左手手背貼著一塊紗布，名牌上寫著「瑞秋・莫拉雷斯　RN」。她提著一個藥局的提籃，裡面裝滿了藥。

她先看你們的手臂，再看脖子。看完，她才鬆了一口氣。

「我要走了。」她說，「這裡不會有人回來了。」`,
 c:[
  {t:'q',l:'帶她一起走一段',ok:{t:`「跟我們走，到樓梯口再說。」

她點點頭，把提籃抱在胸前，走在你們中間。她走路很輕，每經過一張簾子就小聲說床號：「這張沒人。這張有，別碰簾子。」

「我送你們到樓梯口，」她說，「然後我自己從救護車道出去。四樓我不會再上去了。」`,r:{flag:'nursewith',karma:1}}},
  {t:'q',l:'用水或食物跟她換藥',req:['water','bar','cola','mre','cookie','noodle'],reqAny:1,s:'需要水或食物',ok:{t:`你把東西遞給她。她看了一眼，從提籃裡拿出一板抗生素和一盒鎮定劑塞給你。「藥我有，吃的沒有。」

她把東西收進口袋，往救護車道的方向走了。走到一半，她回頭說：「地下室的救護車後門，鐵捲門旁邊有一條手動的鏈條。停電也拉得起來。」`,r:{use:'$req',items:{antibiotic:1,sedative:1},flag:'nursetip'}}},
  {t:'q',l:'讓她自己走',ok:{t:`「你自己小心。」

她看了你們一眼，點點頭，提著籃子往救護車道走了。走之前她說：「四樓的病人都綁著。如果你們要上去，不要走到床邊。」`,p:{fear:-2}}}]},
OE10:{L:'O',n:'急診・觀察區',
 t:`觀察區是走道最裡面的一塊空地，六張床排成兩排，中間只隔著布簾。最靠近你的那張床旁邊，一支點滴架歪向走道，上面還掛著半袋生理食鹽水，管子垂到地上。

你的肩膀擦過布簾。點滴架晃了一下，開始往下倒。`,
 c:[
  {t:'q',l:'撲過去接住',ok:{t:`你往前一撲。`,qte:{t:'點滴架的鐵桿往地上倒，鹽水袋甩了出去——',w:['接住','扶穩','抓緊','穩住'],ok:{t:'你在鐵桿碰到地板之前抓住了它，另一隻手接住鹽水袋，整個人跪在地上，一動也不敢動。\n\n布簾後面的人翻了個身，又沒有動靜了。'},ng:{t:'你的指尖碰到了鐵桿，沒有抓住。點滴架整支砸在地上，聲音在觀察區裡彈來彈去。',r:{flag:'ernoise'},p:{alarm:2,fear:4}}}}},
  {t:'q',l:'伸腳去頂住',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你伸出腳，用鞋尖頂住點滴架的底座。鐵桿晃了兩下，停住了，鹽水袋在半空中慢慢打轉。你把它扶正，放回原位。`},ng:{t:`你的腳頂歪了。點滴架往另一邊倒，連著布簾一起扯了下來。`,r:{flag:'ernoise'},p:{alarm:2,fear:4}}},
  {t:'q',l:'讓它倒，往後退',ok:{t:`你往後退了一步。點滴架砸在地上，鐵桿在磁磚上彈了兩下。

六張床都響了。`,r:{flag:'ernoise'},p:{alarm:2,fear:4}}}]},
OE11:{L:'O',n:'急診・被吵醒的病人',cond:'ernoisex2',
 t:`剛才的聲音太多了。

觀察區另一頭，一張簾子被從裡面扯了下來，掛勾一個一個崩開。一個穿病人服的男人站在那裡，點滴的針頭還插在手背上，管子拖在地上。接著是第二張簾子。

它們還沒看見你們，但它們在往這邊轉頭，一次轉一點，在找剛才的聲音是從哪裡來的。`,
 c:[
  {t:'q',l:'躲進旁邊沒人的簾子',k:'AGI',d:12,bonusFlag:'erboard',s:'敏捷檢定',ok:{t:`你們閃進一張空床的簾子後面，把簾子拉好。腳步聲從外面經過，近到看得見布簾底下的腳：光著，指甲是黑的。它們走過去了。`,p:{fear:5}},ng:{t:`你們躲進去的那張床不是空的。`,p:{fear:8},fight:{n:2,mode:'ambush',names:['簾子後面的病人','被吵醒的病人']}}},
  {t:'q',l:'先動手',ok:{t:`你們趁它們還在找，先衝了上去。`,fight:{n:2,mode:'first',names:['被吵醒的病人','被吵醒的病人']}}},
  {t:'q',l:'衝向樓梯間',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你們拔腿往樓梯間的方向跑。身後的腳步聲跟了上來，又被一張翻倒的推床擋住。`,r:{flag:'ernoise'},p:{alarm:1}},ng:{t:`你們跑到一半，前面的布簾也被扯開了。`,fight:{n:2,mode:'normal',names:['被吵醒的病人','被吵醒的病人']}}},
  {t:'q',l:'敲藥局的鐵捲門，把它們引過去',need:'nursestay',ok:{t:`你抓起地上的點滴架，往藥局的鐵捲門用力砸過去，一下，兩下。哐——哐——

整條走道的頭都轉了過去。它們一個接一個，往藥局的方向走。

鐵捲門後面，有人在問：「是誰？」

你們從另一邊走開了。身後，鐵捲門被撞得哐啷哐啷地響，有幾片葉片被擠得從軌道裡彎了出來。過了一會兒，有一個女人在叫。只叫了一聲。`,r:{flag:'nurselured',karma:-2},p:{fear:10}}}]},
OE12:{L:'O',n:'急診・樓梯間門口',
 t:`樓梯間的防火門前面，被人用兩台推床和一張輪椅堵住了。推床的輪子用膠帶纏死，上面壓著一箱生理食鹽水。有人想擋住從樓梯下來的東西，或是想擋住急診裡的東西上樓。

防火門上的小窗後面是暗的。門旁邊是電梯，樓層顯示停在「4」。`,
 c:[
  {t:'m',l:'把紙箱搬下來，慢慢拆開',ok:{t:`你們把鹽水一袋一袋搬下來，再一圈一圈撕開輪子上的膠帶。膠帶撕開的聲音很刺耳，你們每撕一段就停下來聽。花了很久，推床被你們悄悄推開了。`}},
  {t:'q',l:'從推床上面爬過去',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你踩著輪椅的扶手，從推床上面翻過去，落在防火門前面。其他人一個接一個跟上。`},ng:{t:`輪椅在你腳下一滑，整台翻倒，紙箱跟著掉下來，鹽水袋滾了一地。`,r:{flag:'ernoise'},p:{alarm:2,hp:-1}}},
  {t:'q',l:'整個推開',k:'STR',d:11,s:'力量檢定',ok:{t:`你用肩膀頂住推床，一口氣推開。輪子被膠帶纏著，在地上拖出一聲長長的尖響。`,r:{flag:'ernoise'},p:{alarm:1}},ng:{t:`推床卡住了。你再用力一頂，整堆東西一起倒下，砸在地上。`,r:{flag:'ernoise'},p:{alarm:2}}}]},
OE12n:{L:'O',n:'急診・樓梯口',cond:'nursewith',
 t:`瑞秋停在樓梯口，把提籃放在地上。

「我就送到這裡。」她說，「走之前，讓我看一下你們的傷。」`,
 c:[
  {t:'m',l:'讓瑞秋處理傷口',once:1,stay:1,ok:{t:`她讓你們一個一個坐下，剪開沾血的布條，消毒、上藥、重新包紮。她的手很穩，一邊包一邊小聲說話，說的都是床號、藥名、劑量，好像這樣手就不會抖。`,r:{rest:{hp:6}}}},
  {t:'q',l:'問她地下室的事',once:1,stay:1,ok:{get t(){return `「地下室有機房、中央供應室，還有太平間。」她說，「救護車後門在最裡面，鐵捲門旁邊有一條手動的鏈條，停電也拉得起來。」`+(G.flags.blackout?`

她想了想。「停電那天晚上，工務的赫克特下去開發電機，後來是被人用電梯抬上來的。排風機壞了。如果你們要開發電機，不要在下面待太久。」`:'')},r:{flag:'nursetip'}}},
  {t:'mv',l:'跟她道別',ok:{t:`瑞秋提起籃子，往救護車道的方向走。她走到轉角，回頭揮了一下手，就不見了。`}}]},
OE13:{L:'O',n:'急診・樓梯間的防火門',
 onEnter(){G.flags.hpw=pwNow()},
 tx:()=>pwNow()?'電梯的樓層顯示亮著，停在「4」。':'電梯的樓層顯示是黑的。',
 t:`你推開防火門，用肩膀頂著，不讓它關上。

門後是樓梯間。往上的樓梯通到四樓，牆上的指標寫著「4 West　臨床合作病房」；往下只有半層，盡頭是另一扇防火門，門上有一根推桿，貼著「出口　往救護車後門」。

你低頭看了一眼。這扇門只有急診這一側有門把，樓梯間那一側是平的。一放手，它就會自己關上，從樓梯間那邊打不開。`,
 c:[
  {t:'mv',l:'上四樓',ok:{t:`你們放開防火門，它在身後「喀」地扣上。你們踩著樓梯一層一層往上爬，二樓、三樓的門都關著，門後面很安靜。`,go:'O2'}},
  {t:'q',l:'搭電梯上四樓',need:'hpw',ok:{t:`你按下按鈕。電梯從四樓慢慢降下來，「叮」的一聲，門開了，聲音在急診裡傳得很遠。你們走進去，按下 4。門關上之前，你聽見走道上有東西在跑。`,r:{flag:'ernoise'},p:{alarm:2},go:'O2'}},
  {t:'mv',l:'下地下室',ok:{t:`你們放開防火門，往下走半層，推開那扇貼著「出口」的防火門。`,r:{flag:'hfront'},go:'O3'}},
  {t:'c',l:'放棄，從救護車道回街區',ok:{t:`你讓防火門慢慢關上，帶著大家退回急診，從救護車道出去。走出自動門的時候，身後的布簾一張一張在動。`,r:{flag:'hspout'},go:'Z0'}}]},
/* 第二層：四樓・臨床合作病房（4 West）「伸手可及」 */
O2:{L:'OF',n:'四樓・4 West 門口',
 onEnter(){const F=G.flags;F.ofpre=!F.shadow&&!F.acru?1:0;F.ofempty=F.ofpre?0:1},
 tx:()=>G.flags.acru?'玻璃門被拆了下來，靠在牆邊。門口的地上貼著一條黃黑相間的膠帶，上面印著一排看不懂的代碼。':G.flags.shadow?'玻璃門大開著，門口的地上有一排很整齊的靴印，一路進去，一路出來。':'',
 t:`四樓的樓梯間出來就是一扇玻璃門，門上貼著「ARC 臨床合作病房　4 West」，底下一行小字：「受試者家屬請於護理站登記」。讀卡機被人用東西砸爛了，門鎖鬆開，門半開著。

走廊上鋪著淺灰色的地墊，吸掉了所有的腳步聲。兩邊是一間一間的病房，每間的門都開著。`,
 c:[
  {t:'q',l:'推開玻璃門進去',ok:{t:`玻璃門的鉸鏈響了一聲。走廊上沒有東西出來。`}},
  {t:'q',l:'先從門上的玻璃看一陣子',k:'PER',d:11,s:'感知檢定',ok:{get t(){return G.flags.ofpre?`你貼在玻璃上看。每間病房裡都是同樣的擺法：一張病床、一個床頭櫃、一支點滴架，病床的四個角都扣著白色的約束帶。床上的人都在動，但都只動一點，手腕被拉住，腳踝被拉住。

他們搆不到門口，也搆不到床頭櫃以外的地方。`:`你貼在玻璃上看。病房的門都開著，床上沒有人。約束帶還扣在床欄上，一條一條垂著。`},r:{flag:'ofpeek'}},ng:{t:`玻璃上全是指紋和霧氣，看不清楚。你只看得到走廊盡頭有一扇窗戶，窗外是別的大樓的屋頂。`}},
  {t:'q',l:'貼著牆溜進去',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你從門縫側身鑽進去，背貼著牆，一步一步往前挪。`},ng:{t:`你的背包撞到門框，玻璃門晃了一下，撞在牆上。走廊兩邊的病房裡，床欄響了一陣。`,p:{alarm:1,fear:3}}}]},
OF1:{L:'OF',n:'四樓・家屬休息區',
 t:`玻璃門旁邊是一個小小的家屬休息區：一排塑膠椅、一台飲水機、一個佈告欄。椅子底下有人留下一個背包和一件外套。

佈告欄上釘著幾張紙，最上面那張印著 ARC 的標誌，標題是「臨床合作計畫　受試者家屬須知」。`,
 c:[
  {t:'sd',l:'翻椅子底下的背包',stay:1,ok:{t:`背包裡有一瓶水、兩包蘇打餅乾和一本被翻爛的平裝小說。外套口袋裡有一張停車票根，日期是四天前。`,r:{items:{water:1,cookie:2}}}},
  {t:'q',l:'看佈告欄上的家屬須知',once:1,stay:1,ok:{t:`「一、第二期受試者需住院觀察十四天，期間家屬不得進入病房。
二、為確保受試者安全，觀察期間可能採取必要之約束措施。
三、受試者完成觀察後，將依計畫安排至合作地點休養，費用由 ARC 全額負擔。」

最底下有人用原子筆寫了一行字，又被人用力劃掉：「我先生進去九天了，沒有人告訴我」。`,p:{fear:4}}},
  {t:'q',l:'聽走廊上的動靜',once:1,stay:1,k:'PER',d:12,s:'感知檢定',ok:{get t(){return G.flags.ofpre?`走廊上很安靜，只有床欄偶爾響一下，還有約束帶被拉緊的聲音，一下，鬆開，又一下。都是從病房裡傳出來的，沒有一個在走廊上。

只有最裡面那一間，有人在小聲說話。`:`太安靜了。沒有床欄的聲音，沒有呼吸聲，只有窗外的風。`},r:{flag:'ofpeek'}},ng:{t:`你聽了很久，只聽見自己的心跳。`}},
  {t:'mv',l:'往病房走',ok:{t:`你們離開休息區，走進病房之間的走廊。`}}]},
OF2:{L:'OF',n:'四樓・病房走廊',cond:'ofpre',
 t:`走廊兩邊各有幾間病房，門上貼著房號，沒有名字。每間門口掛著一塊小白板，寫著床上那個人的編號和「觀察第幾日」。

床上的東西大多放在床邊：床頭櫃、點滴架、床尾掛著病歷夾。你們沒有時間每一間都進去。`,
 c:[]},
OF2a:{L:'OF',n:'401：白板寫著「觀察第 9 日」',
 t:`401 的病床上躺著一個中年男人，四肢都被約束帶扣在床欄上，頭往旁邊偏著。他的眼睛是睜開的，跟著你移動，喉嚨裡發出很低的聲音。床尾的掛板上夾著病歷，編號「B-117」。

床頭櫃上放著一個塑膠杯、一支手機和一個透明的藥袋，藥袋裡有幾板藥。床頭櫃離他的右手大概一個手掌遠。`,
 c:[
  {t:'q',l:'拿床尾的病歷夾',ok:{t:`床尾離他的腳還有一段距離。你把病歷夾從掛板上抽出來：B-117，四十六歲，「第二期回診後出現發燒、躁動，第三日起約束」。最後一頁的護理紀錄停在三天前：「受試者持續拉扯約束帶，右手腕皮膚破損。」

他的右手腕上纏著紗布，紗布是黑的。`,p:{fear:4}}},
  {t:'q',l:'拿床頭櫃上的藥袋',k:'AGI',d:12,bonusFlag:'ofpeek',s:'敏捷檢定',ok:{t:`你蹲低，從床頭櫃的另一邊伸手，兩根手指夾住藥袋，慢慢拉過來。他的右手在床欄上猛地一扯，約束帶繃得直直的，指尖離你的袖子只差一點。

藥袋裡是抗生素和止痛藥。`,r:{items:{antibiotic:1,painkiller:1}}},ng:{t:`你伸手去拿藥袋，他的右手比你快。`,hz:{st:'STR',dc:12,l:'掙脫',t:'一隻手扣住你的手腕，把你往床邊拉——',ok:{t:'你把手腕轉了半圈，從他的指縫裡抽出來，往後跌坐在地上。藥袋掉在床邊，你沒有再去撿。',p:{fear:6}},ng:{t:'他把你拉到床邊，頭一偏，牙齒咬進你的前臂。你用另一隻手撐著床欄拚命往後扯，才把手抽回來。',p:{hp:-3,inf:6,fear:8}}}}},
  {t:'q',l:'拿他的手機',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`手機在床頭櫃最靠近他的那一邊。你等他的頭轉向另一邊，才一把抓過來。

螢幕裂了，還有一點電。最後一則訊息是一個叫「蘿倫」的人傳的：「醫院說你轉去休養了，可是他們不讓我知道在哪裡。你在哪裡？」`,p:{fear:4}},ng:{t:`你的手剛碰到手機，他的頭就轉了過來。`,hz:{st:'STR',dc:12,l:'掙脫',t:'他的手指勾住你的袖口，把你往床邊扯——',ok:{t:'袖口撕開一條口子，你跌回走廊上。手機掉在地上，螢幕又多了一道裂痕。',p:{fear:6}},ng:{t:'他把你扯到床邊，牙齒咬在你的手背上。你一腳蹬在床欄上，才把手抽出來。',p:{hp:-3,inf:6,fear:8}}}}}]},
OF2b:{L:'OF',n:'403：白板是空白的',
 t:`403 的病床是空的。約束帶有一條斷了，斷口不是剪的，是被拉斷的，邊緣全是毛邊。床單上有一大片褐色的痕跡，一路拖到病房裡的廁所門口。

廁所的門關著。門後面偶爾響一下，像是有人用肩膀靠在門上，又站直。`,
 c:[
  {t:'sd',l:'翻床頭櫃的抽屜',stay:1,sign:{t:'廁所的門把慢慢轉了半圈，又轉回去。',dc:12},ok:{t:`抽屜裡有一包濕紙巾、一盒優碘棉棒和一卷紗布。最底下壓著一個受試者手圈，編號被撕掉了一半。`,r:{items:{iodine:1,bandage:1,cloth:1}}}},
  {t:'q',l:'打開廁所的門',ok:{t:`你握住門把，數到三，一把拉開。`,fight:{n:1,mode:'first',names:['403 的病人']},win:{t:`他倒在廁所的地上，手腕上還套著半截約束帶。洗手台底下有一個護理師留下的急救包。`,r:{items:{med:1,sbandage:1}}}}},
  {t:'mv',l:'回走廊',ok:{t:`你們退出 403，把病房的門帶上。`}}]},
OF2c:{L:'OF',n:'405：門上多了一道密碼鎖',
 t:`405 是單人房，門上加裝了一個密碼鎖，但門是開著的，鎖舌用膠帶貼住了。房間裡沒有病床，只有一台推車、一台小冰箱和一張摺疊桌。桌上的筆電開著，螢幕是黑的。

小冰箱上貼著一張紙：「檢體　4°C　勿斷電」。冰箱的燈是暗的。`,
 c:[
  {t:'q',l:'看筆電',once:1,stay:1,k:'INT',d:12,s:'智力檢定',ok:{t:`你敲了一下鍵盤，螢幕亮了，停在一張表格上。每一列是一個編號，B-101 到 B-130，欄位是「回診日」「發燒」「約束」「轉出」。轉出那一欄有一半填了東西，都是同一個代碼：「S」。`,p:{fear:5}},ng:{t:`螢幕要密碼。你試了幾組，鎖住了。`}},
  {t:'sd',l:'翻推車的抽屜',stay:1,ok:{t:`推車的抽屜裡是抽血用的東西：止血帶、酒精棉片，還有一盒沒拆的縫合包。`,r:{items:{tourniquet:1,alcohol:1,suture:1}}}},
  {t:'mv',l:'回走廊',ok:{t:`你們退出 405。`}}]},
OFs:{L:'OF',n:'四樓・被搬空的病房',cond:'ofempty',
 t:`病房被清空了。每一張病床都還在，約束帶扣在床欄上，一條一條垂著，床上沒有人。床墊被翻過來，床頭櫃的抽屜全被拉出來，小冰箱的門開著，裡面一格一格都是空的。

太安靜了。這一層樓本來有三十個人在呼吸。`,
 c:[
  {t:'sd',l:'翻床墊底下',stay:1,ok:{t:`有一張床的床墊底下壓著一包沒拆的消毒繃帶和一包止痛藥，大概是哪個病人偷藏的。`,r:{items:{sbandage:1,painkiller:1}}}},
  {t:'sd',l:'翻被拉出來的抽屜',stay:1,ok:{t:`抽屜縫裡卡著一板抗生素和一瓶優碘，搬東西的人沒有看到。`,r:{items:{antibiotic:1,iodine:1}}}},
  {t:'q',l:'看那些約束帶',once:1,stay:1,ok:{t:`每一條約束帶的扣環都是解開的，不是剪斷的。有人一張床一張床地解開，把人帶走了。有幾條約束帶上沾著血，已經乾了。`,p:{fear:4}}},
  {t:'mv',l:'往前走',ok:{t:`你們離開病房，往護理站走。`}}]},
OF3:{L:'OF',n:'四樓・407',cond:'ofpre',
 t:`走廊最裡面那間是 407。說話的聲音是從這裡傳出來的。

床上的人很年輕，二十出頭，手腕和腳踝都扣著約束帶。他的臉色是灰的，嘴唇乾裂，額頭上全是汗，但他的眼睛跟著你，眼神是清楚的。床尾的掛板寫著「B-124　觀察第 4 日」。

「你們不是護理師。」他說，聲音很啞，「拜託……幫我解開。我還沒有變成那樣。你看，我還會說話。」

他手背上的點滴針頭周圍，皮膚發黑，一條一條的黑線順著血管往手肘爬。`,
 c:[
  {t:'q',l:'問他這裡發生了什麼事',once:1,stay:1,ok:{t:`「他們說是疫苗的第二期。」他說，「打完回診，抽血，量體溫。然後就發燒了，所有人都發燒。他們把我們綁起來，說是為了我們好。」

他看著天花板。「燒到第五天、第六天的人，會被推出去，推進走廊盡頭那台電梯。那台電梯沒有樓層的按鈕，只有一個讀卡機。推出去的人沒有回來過。」

「我第四天了。」他說。`,p:{fear:6}}},
  {t:'q',l:'解開他的約束帶',ok:{t:`你解開他手腕上的扣環，再解開腳踝。他坐起來，揉著手腕，揉了很久。

「謝謝。」他說，「我叫丹尼。」他下了床，腳有點軟，扶著牆站穩。「護理站那個灰色鐵櫃，密碼是 4719。我看護理師按過很多次。裡面是他們不給我們的藥。」

他沒有跟你們走。「我要去找我姊。」他說，然後光著腳往樓梯間走。你們聽見樓梯間的門開了，又自己關上。`,r:{flag:['b124free','ofkey']}}},
  {t:'q',l:'給他打一針鎮定劑',req:'sedative',s:'需要鎮定劑',ok:{t:`「這會讓你好過一點。」你說。

他看著針頭，沒有掙扎。「你們不會解開我，對不對。」他不是在問。藥推進去之後，他的眼皮慢慢垂下來，呼吸變得又長又慢。

睡著之前他說了一句話，你沒聽清楚，好像是一個人的名字。`,r:{use:'sedative'},p:{fear:4}}},
  {t:'q',l:'不解開他，繼續走',ok:{t:`你往後退了一步。

「不要走。」他說，「拜託。不要走。」你轉身的時候，他開始大喊，喊的是「救命」，喊得整層樓都聽得見。走廊兩邊的病房裡，床欄一間接一間響了起來。

你們走到走廊轉角，他還在喊。`,p:{alarm:3,fear:8}}}]},
OF4:{L:'OF',n:'四樓・護理站',
 tx:()=>G.flags.ofempty?'護理站被翻過了。病歷架是空的，電腦主機被拆走，只剩螢幕和一團電線。牆角那個灰色鐵櫃的門被撬開了，裡面什麼都沒有。':'',
 t:`4 West 的護理站比樓下的小，櫃台後面是一整面病歷架，每一格都貼著編號。牆角有一個灰色的鐵櫃，櫃門上是電子密碼鎖，貼著「管制藥品　雙人核對」。

櫃台上的白板寫著今天的轉出：「B-112、B-115　→ S」。`,
 c:[
  {t:'m',l:'翻病歷',hide:'ofempty',once:1,stay:1,k:'INT',d:12,s:'智力檢定',ok:{t:`病歷夾裡寫的都是編號：「第二期受試者　B-117」「B-118」……每一份的「回診後安置地點」都填著同一個地址。你認得那個地址。是那間旅館。`,r:{flag:'arcfile'},p:{fear:8}},ng:{t:`滿頁的縮寫和數字，你看不懂。只看懂一件事：每一份都蓋著同一個紅色的章，「保密」。`,p:{fear:4}}},
  {t:'q',l:'翻那些被拉開的抽屜',need:'ofempty',once:1,stay:1,k:'PER',d:13,s:'感知檢定',ok:{t:`他們搬得很徹底，只漏了一張夾在抽屜縫裡的轉送單：「轉送地點：S-」，後面整行被黑筆塗掉了。`,r:{flag:'arcfile'},p:{fear:6}},ng:{t:`什麼都沒有。連一張紙都沒有留下。`,p:{fear:4}}},
  {t:'q',l:'輸入管制藥品櫃的密碼',need:'ofkey',hide:'ofempty',once:1,stay:1,ok:{t:`你按下 4、7、1、9。鎖「嗶」了一聲，櫃門彈開一條縫。

櫃子裡一層一層排著藥盒，大部分你都不認得。你挑了認得的：鎮定劑、止痛藥，還有一個沒拆封的手術包。`,r:{items:{sedative:2,painkiller:2,surgkit:1}}}},
  {t:'sd',l:'翻護理站的櫃子',stay:1,hide:'ofempty',ok:{t:`櫃子裡是病房用的東西：一疊備用的約束帶、兩卷繃帶和一瓶外用酒精。約束帶你沒有拿。`,r:{items:{bandage:2,alcohol:1}}}},
  {t:'mv',l:'往前走',ok:{t:`你們離開護理站，往走廊另一頭走。`}}]},
OF4b:{L:'OF',n:'四樓・呼叫鈴',cond:'ofpre',
 t:`你們剛離開護理站，走廊上方的呼叫燈亮了。410 的門口，一盞紅燈一閃一閃，護理站那邊跟著「叮咚——叮咚——」地響，一聲接一聲，沒有要停的意思。

410 的床上，病人被約束帶綁著，臉朝著牆。他的右手壓在床欄上的呼叫鈴上，壓著不放，手指一下一下地抽。`,
 c:[
  {t:'q',l:'進去把呼叫鈴從他手底下抽出來',k:'AGI',d:12,bonusFlag:'ofpeek',s:'敏捷檢定',ok:{t:`你從床頭櫃那一側彎腰過去，抓住呼叫鈴的線，一口氣從他的手掌底下抽出來。他的手指在空中抓了兩下，抓到的是床單。叮咚聲停了。`},ng:{t:`你的手才碰到線，他的手就翻了過來。`,hz:{st:'STR',dc:12,l:'掙脫',t:'他的手指扣住你的手背，指甲陷進肉裡——',ok:{t:'你把手抽回來，手背上留下四道紅痕。呼叫鈴也跟著被你扯了下來，叮咚聲停了。',p:{fear:5}},ng:{t:'他把你的手拉到嘴邊。你用另一隻手扳開他的下巴，才把手抽出來，手背上一圈齒痕在滲血。呼叫鈴終於被扯斷了。',p:{hp:-3,inf:6,fear:8}}}}},
  {t:'m',l:'回護理站把呼叫系統關掉',k:'INT',d:11,s:'智力檢定',ok:{t:`護理站櫃台底下有一台呼叫系統的主機。你找到電源開關，按了下去。整層樓的叮咚聲一起停了，只剩下 410 門口那盞紅燈，還在一閃一閃。`},ng:{t:`主機上全是按鍵和代碼，你按了好幾個，叮咚聲換成了更急的嗶嗶聲。你只好拔掉主機的插頭。`,p:{alarm:1}}},
  {t:'q',l:'不管它，繼續走',ok:{t:`你們從 410 門口走過去。叮咚聲一直跟在身後，響遍整條走廊。

走廊兩邊的病房裡，床欄一間接一間響了起來。`,p:{alarm:2,fear:3}}}]},
OF5:{L:'OF',n:'四樓・被服間',
 t:`走廊轉角有一間被服間，門可以從裡面鎖上。架子上疊著床單、病人服和毛巾，角落停著一台髒衣推車。`,
 c:[
  {t:'sd',l:'翻架子最上層',stay:1,ok:{t:`最上層是乾淨的床單和毛巾，撕成布條剛好。後面藏著一盒不知道是誰的能量棒。`,r:{items:{cloth:3,bar:1}}}},
  {t:'qh',kind:'躲藏',l:'鎖上門，在裡面躲一陣子',quiet:1,stay:1,ok:{t:`你把門鎖上，背靠著架子坐下。外面的床欄響了一陣，慢慢停了。被服間裡有一股洗衣粉的味道，是這幾天聞過最乾淨的味道。`}},
  {t:'mv',l:'往前走',ok:{t:`你們打開門鎖，回到走廊上。`}}]},
OF6:{L:'OF',n:'四樓・走廊上的輪床',cond:'ofpre',
 t:`走廊另一頭停著一張輪床，橫在走廊正中間，大概是推到一半就被丟下了。床上的人被約束帶綁著，穿著病人服，頭不停地左右甩，兩隻手扣在床欄上，手指一直在抓。

輪床兩邊各剩下不到一個肩膀寬的空隙。`,
 c:[
  {t:'q',l:'從床尾那一頭擠過去',k:'AGI',d:11,bonusFlag:'ofpeek',s:'敏捷檢定',ok:{t:`你從輪床的床尾那一側側身擠過去，離他的腳踝只有一個拳頭。他的腳被扣著，只踢得到床欄。`},ng:{t:`你擠到一半，他的頭甩了過來。`,hz:{st:'STR',dc:12,l:'掙脫',t:'他的手指勾住你的衣角，把你往床邊扯——',ok:{t:'你一把扯回衣角，布料撕開一條口子，人跌到牆邊。',p:{fear:5}},ng:{t:'他把你扯到床邊，牙齒咬在你的肩膀上，隔著外套還是咬進了肉裡。',p:{hp:-3,inf:6,fear:8}}}}},
  {t:'q',l:'把輪床推進旁邊的病房',k:'STR',d:11,s:'力量檢定',ok:{t:`你繞到床尾，抓住床尾的欄杆，把輪床一路推進旁邊的空病房，再把門帶上。輪子很響，但走廊空出來了。`,p:{alarm:1}},ng:{t:`輪床的煞車是踩著的，你推不動，只推得它在原地打轉。床上的人整個往你這邊甩過來。`,p:{alarm:1,fear:6}}},
  {t:'q',l:'從旁邊的病房繞過去',ok:{t:`409 和 411 中間有一扇連通門。你們穿過 409，床上的人掙了一下，約束帶繃緊。你們貼著另一邊的牆走過去，從 411 出來，已經在輪床的另一頭了。`,p:{fear:4}}}]},
OF7:{L:'OF',n:'四樓・那台電梯',
 t:`走廊盡頭有一台電梯，和樓下那台不一樣，外面是不鏽鋼的，沒有樓層顯示。面板上只有開門、關門兩顆按鈕，下面多了一顆沒有數字的按鈕，旁邊是讀卡機。

電梯門前的地上有幾道輪床的輪子留下的黑色痕跡，一路拖進電梯門縫。旁邊的牆角靠坐著一個穿白袍的人，頭垂在胸前，脖子上掛著識別證。`,
 c:[
  {t:'q',l:'搜他身上',k:'CON',d:11,s:'體質檢定',ok:{t:`你蹲下去，忍著味道翻他的口袋：一包菸、一個打火機，還有一支沒電的呼叫器。白袍的胸口繡著「ARC 臨床研究」。

他的額頭正中間有一個小小的洞，邊緣很乾淨。`,r:{items:{cigarette:2,lighter:1}},p:{fear:6}},ng:{t:`你才翻到他的外套，胃就整個翻了上來。你退到牆邊吐了。`,p:{fear:4}}},
  {t:'q',l:'拿他的識別證刷那台電梯',ok:{t:`你從他的脖子上取下識別證，在讀卡機上刷了一下。燈閃了紅色，小螢幕跳出一行字：「權限已撤銷」。

你把識別證放回他身上。`,p:{fear:3}}},
  {t:'q',l:'按那顆沒有數字的按鈕',ok:{t:`你按了。讀卡機的燈閃了一下紅色，什麼都沒有發生。你又按了一次，還是一樣。

電梯門的縫裡吹出一陣冷風，有消毒水的味道。`,p:{fear:2}}}]},
OF8:{L:'OF',n:'四樓・樓梯間前',cond:'ofpre',
 t:`往樓梯間的走廊上，有一間病房的門口躺著一條斷掉的約束帶，病房裡的床是空的。

走廊盡頭，樓梯間的防火門前面，站著一個穿病人服的女人，背對著你們，額頭抵在門上的小窗。她的手腕上還套著半截約束帶，垂著晃。她沒有在動，只是站著。`,
 c:[
  {t:'m',l:'躲進旁邊的病房，等她走開',ok:{t:`你們閃進旁邊的空病房，貼著門後的牆等。過了很久，走廊上傳來拖著腳的聲音，從門口經過，往護理站那邊去了。`,p:{fear:4}}},
  {t:'q',l:'從背後摸過去先動手',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你貼著牆走過去，地墊吃掉了你的腳步聲。她沒有回頭。`,fight:{n:1,mode:'first',names:['掙脫約束帶的病人']}},ng:{t:`你走到一半，她轉過身來。`,fight:{n:1,mode:'normal',names:['掙脫約束帶的病人']}}},
  {t:'q',l:'丟東西到走廊另一頭引開她',req:['cola','water','bottle','coin'],reqAny:1,s:'需要可以丟的東西',ok:{t:`你把東西往護理站的方向丟出去。落地的聲音在走廊上滾了好幾下。她的頭慢慢轉過去，離開防火門，往聲音那邊走。你們等她走遠，從她剛才站的地方推開了門。`,r:{use:'$req'},p:{alarm:1}}}]},
OF9:{L:'OF',n:'四樓・樓梯間',
 tx:()=>G.flags.acru?'樓梯間的每一扇防火門都被人用橡膠門擋卡住了。':'',
 t:`4 West 的防火門在你們身後關上。樓梯間裡只有緊急照明，往下的樓梯通到一樓和地下室。

一樓急診那扇門，從樓梯間這一側是平的，沒有門把。再往下半層，地下室的防火門上有一根推桿，貼著「出口　往救護車後門」。`,
 c:[
  {t:'mv',l:'下地下室',ok:{t:`你們往下走，推開地下室的防火門。`,r:{flag:'hfront'},go:'O3'}},
  {t:'m',l:'從另一頭的逃生梯下樓，回街區',ok:{t:`你們推開 4 West 的門，從走廊另一頭的逃生梯一路往下，推開一樓的逃生門，出來是醫院側面的停車場。逃生門在身後關上了。`,r:{flag:'hspout'},go:'Z0'}}]},
/* 第三層：地下室「空氣」 */
O3:{L:'OB',n:'地下室・防火門',cond:'hfront',
 tx:()=>hspLit()?'天花板上的日光燈亮著，有幾根在閃。':'沒有燈。只有防火門上方的出口標示亮著一點綠光，照不到三步遠。',
 t:`你們推開推桿，走進地下室。防火門在身後被閉門器慢慢拉上，「喀」的一聲扣住。

你回頭看。門的這一面是平的，沒有門把，也沒有推桿，只有一行噴漆：「樓梯間　禁止由此進入」。

走廊又長又窄，牆上全是管線。空氣裡是柴油味，又悶又重，吸進去黏在喉嚨裡。`,
 c:[
  {t:'q',l:'推推看那扇門',once:1,stay:1,ok:{t:`你用肩膀頂了一下。門紋風不動，閉門器連響都沒有響。這扇門只開一個方向。`,p:{fear:3}}},
  {t:'q',l:'聽走廊深處的聲音',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`除了水管滴水的聲音，走廊最裡面還有一個很慢的聲音：咚。過了很久，又咚一聲。像是有人用拳頭在敲一扇很厚的門。`,r:{flag:'oblisten'}},ng:{t:`水管滴水的聲音太吵了，蓋過了別的聲音。`}},
  {t:'mv',l:'往前走',ok:{t:`你們沿著管線往前走。`}}]},
OBa:{L:'OB',n:'地下室・救護車後門',cond:'hback',
 tx:()=>G.flags.acru?'卸貨區停著一台黑色的發電車，引擎轟轟地響，電纜從車上拉進地下室，地下室的燈全亮著。兩個穿黑色制服的人坐在發電車的另一頭抽菸，背對著你們。':'',
 t:`救護車後門是一個卸貨區，一台救護車倒車停在斜坡上，後車門開著。鐵捲門拉起一半，底下的縫剛好可以讓人彎腰鑽過去。

鐵捲門後面是地下室的走廊。柴油味從裡面飄出來，又悶又重。`,
 c:[
  {t:'q',l:'彎腰鑽進鐵捲門',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你們一個接一個彎腰鑽進去，沒有碰到鐵捲門。`},ng:{t:`你的背包撞到鐵捲門的底邊，整片門晃了一下，嘩啦啦地響。`,p:{alarm:2}}},
  {t:'c',l:'不進去了，回街區',ok:{t:`你們退回卸貨區，從斜坡走回街上。`,go:'Z0'}}]},
OBk:{L:'OB',n:'地下室・走廊上的丹尼',cond:'b124free',
 t:`走廊轉角，有一個人坐在地上，背靠著管線，光著腳。是丹尼。

他的頭垂著，下巴抵在胸口，肩膀一抽一抽的。聽見你們的腳步聲，他慢慢抬起頭。他的眼睛已經不對了，黑色的線爬滿了整個眼白。

他張開嘴，發出來的不是說話的聲音。`,
 c:[
  {t:'q',l:'動手',ok:{t:`你們沒有等他站起來。`,fight:{n:1,mode:'first',names:['丹尼']}}},
  {t:'q',l:'叫他的名字',k:'CHA',d:13,s:'統帥檢定',ok:{t:`「丹尼。」

他停住了，頭歪向一邊，好像在想這兩個字是什麼意思。他就這樣一直歪著頭，沒有站起來。你們從他身邊走過去，他沒有跟上來。`,p:{fear:8}},ng:{t:`「丹尼。」

他聽見了。他撐著管線站起來，朝你們撲過來。`,fight:{n:1,mode:'normal',names:['丹尼']}}},
  {t:'q',l:'貼著另一邊的牆走過去',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你們貼著另一邊的牆，一步一步從他面前走過去。他的頭跟著你們轉，嘴巴一張一合，但他沒有站起來。`,p:{fear:6}},ng:{t:`你的鞋底在積水裡滑了一下。他轉過頭，撐著管線站了起來。`,fight:{n:1,mode:'ambush',names:['丹尼']}}}]},
OB1:{L:'OB',n:'地下室・走廊',
 t:`地下室的走廊兩邊是一扇一扇的鐵門，門上貼著牌子：「機房」「中央供應室」「員工休息室」「太平間」。地上畫著黃色的線，一路通到最裡面的「救護車後門」。

牆上有一張消防平面圖，旁邊停著一台工務的推車。`,
 c:[
  {t:'q',l:'看牆上的消防平面圖',once:1,stay:1,ok:{t:`平面圖上標著地下室每一間房間和兩條逃生路線。機房在走廊中段，旁邊用紅筆圈了一個小方塊，寫著「排風機」。救護車後門那一格旁邊印著：「鐵捲門　停電時使用手動鏈條」。`,r:{flag:'obmap'}}},
  {t:'sd',l:'翻工務的推車',stay:1,ok:{t:`推車上是工務的工具：一捲電工膠帶、一支手電筒，還有一把鉗子。推車的掛勾上吊著一盒小保險絲，不是配電站用的那種。`,r:{items:{tape:1,flashlight:1,pliers:1}}}},
  {t:'mv',l:'往機房走',ok:{t:`你們順著地上的黃線往前走。`}}]},
OB2:{L:'OB',n:'地下室・機房',
 onEnter(){const F=G.flags;F.hblk=F.blackout&&!pwNow()&&!F.acru?1:0},
 tx:()=>G.flags.acru?'發電機旁邊多了一排黑色的箱子，上面印著白色的字母和數字。他們的電纜接在配電盤上，發電機本身沒有在轉。':pwNow()?'市電有送過來，配電盤上的燈都是綠的。備用發電機沒有在轉。':hspGen()?'發電機在轟轟地響，整間機房都在震。'+(G.flags.hvent?'天花板角落的排風機轉起來了。':'排氣管接頭的地方冒著一點煙，排風機還是不動。'):'機房裡一片黑。',
 get t(){return G.flags.blackout?`機房裡是一台和小貨車差不多大的柴油發電機，外殼漆成灰色，旁邊是一排配電盤和一座保險絲架。發電機的控制面板上，紅色的緊急停止按鈕被按了下去，上面貼著一段膠帶，膠帶上用麥克筆寫著：「不要開　排風機壞了　——H」。

天花板角落的排風機是靜止的，扇葉上積了一層灰。`:`機房裡是一台和小貨車差不多大的柴油發電機，外殼漆成灰色，旁邊是一排配電盤和一座保險絲架。發電機安安靜靜地停著，控制面板上亮著一顆綠燈：「自動待機」。

天花板角落的排風機嗡嗡地轉著。`},
 c:[
  {l:'找備用發電機的備品',hide:'gotfuse',t:'m',k:'PER',get d(){return hspLit()?11:13},s:'感知檢定',ok:{t:`保險絲架上還剩一根高壓保險絲，旁邊的維修櫃裡有一個沒拆封的濾毒罐。`,r:{items:{fuse:1,filter:1},flag:'gotfuse'},stay:1},ng:{t:`你在保險絲架前面翻的時候，撞翻了一台推車。機房的角落裡，有東西被吵醒了。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['機房裡的工務人員']},go:'OB2'}},
  {t:'q',l:'看發電機的運轉紀錄',need:'blackout',once:1,stay:1,ok:{t:`控制面板旁邊掛著一本運轉紀錄，最後幾行是手寫的：

「停電　21:48　自動啟動」
「22:30　排風機跳脫，復歸無效」
「23:55　機房一氧化碳警報，赫克特頭暈嘔吐，送急診」
「00:10　手動急停。等廠商。」

廠商沒有來。`,p:{fear:2}}},
  {t:'m',l:'修排風機',need:'hblk',hide:'hvent',once:1,stay:1,k:'INT',d:13,bonusFlag:'obmap',s:'智力檢定',ok:{t:`你爬上鐵梯，打開排風機的電箱。熱繼電器跳脫了，皮帶也鬆了一圈。你把皮帶重新繃緊，按下復歸。只要有電，它應該就會轉。`,r:{flag:'hvent'}},ng:{t:`電箱裡的線你看不懂，皮帶是哪一條也搞不清楚。你爬下來的時候，手上全是油。`}},
  {t:'m',l:'重設緊急停止，把發電機開起來',need:'hblk',hide:'hgen',stay:1,k:'INT',d:11,s:'智力檢定',get ok(){const w=flagOk('ernoisex2');return {t:`你把緊急停止按鈕轉起來，照著面板上的步驟：預熱、啟動。啟動馬達咳了兩下，發電機轟地一聲動了起來，整間機房都在震。

走廊上的日光燈一根一根亮起來。樓上的某個地方也有東西跟著動了：電梯的馬達，某扇門的電子鎖「喀」地彈開。`+(w?`

樓梯間那頭，傳來很多腳步聲，往有光的地方走下來。`:''),r:{flag:w?['hgen','hgenw']:'hgen'},p:{alarm:2}}},ng:{t:`啟動馬達轉了幾下就停了，排氣管噴出一團黑煙，嗆得你們一直咳。`,p:{alarm:1,hp:-1}}},
  {t:'q',l:'把發電機關掉',need:'hgen',hide:'hgenoff',once:1,stay:1,ok:{t:`你按下緊急停止。發電機的聲音慢慢低下去，停了。日光燈一根一根熄滅，耳朵裡還在嗡嗡地響。`,r:{flag:'hgenoff'}}},
  {t:'mv',l:'往前走',ok:{t:`你們離開機房。`}}]},
OBw:{L:'OB',n:'地下室・燈亮之後',cond:'hgenw',
 t:`你們走出機房的時候，走廊另一頭，樓梯間那扇防火門被推開了。

推門的是一個穿病人服的人，身後還有好幾個，有的手背上還插著點滴的針頭。是急診布簾後面的那些。它們聽見了發電機，看見了燈，就跟著下來了。

防火門在它們身後關上。它們也回不去了。`,
 c:[
  {t:'q',l:'守在機房門口',ok:{t:`你們退到機房門口，讓它們一次只能進來一個。`,fight:{n:3,mode:'first',names:['從急診下來的病人','從急診下來的病人','從急診下來的病人']}}},
  {t:'q',l:'關掉發電機，讓走廊暗下來',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你衝回機房，按下緊急停止。發電機的聲音低下去，燈一根一根熄滅。走廊上的腳步聲停了，在黑暗裡散開，往四面八方去找剛才的聲音。你們貼著牆，從另一頭溜走了。`,r:{flag:'hgenoff'},p:{fear:8}},ng:{t:`你衝回機房的時候，它們已經到門口了。`,r:{flag:'hgenoff'},fight:{n:3,mode:'ambush',names:['從急診下來的病人','從急診下來的病人','從急診下來的病人']}}},
  {t:'q',l:'往走廊另一頭跑',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你們頭也不回地往走廊另一頭跑，轉進中央供應室，把門關上。腳步聲從門外經過，往發電機的方向去了。`,p:{fear:6}},ng:{t:`走廊太長了。`,fight:{n:3,mode:'normal',names:['從急診下來的病人','從急診下來的病人','從急診下來的病人']}}}]},
OB3:{L:'OB',n:'地下室・積水的走廊',
 onEnter(){G.flags.hlitf=hspLit()&&!pwNow()&&!G.flags.acru?1:0},
 tx:()=>hspLit()?'天花板的管線架上，有一條電線垂了下來，末端泡在水裡。':'太暗了，看不清楚水裡有什麼。',
 t:`再往裡走，走廊有一段積了水，從牆邊漫到另一邊，大概到腳踝那麼深。天花板上的水管破了一個口，水一直滴下來。

水的另一邊就是中央供應室和太平間。`,
 c:[
  {t:'q',l:'踩水過去',k:'PER',get d(){return hspLit()?12:10},s:'感知檢定',ok:{get t(){return hspLit()?`你正要踩下去，看見那條垂下來的電線末端在水裡輕輕晃。你縮回腳，帶著大家沿著牆邊最淺的地方，一步一步繞過電線掉下來的那一段。`:`水很冰，鞋子一下就濕透了。水底下踩到一些軟軟的東西，你沒有低頭看。`}},ng:{get t(){return hspLit()?`你一腳踩進水裡，整條腿麻了一下，肌肉自己縮起來，你整個人往後摔在地上。`:`水底下有一塊鬆掉的地磚，你一腳踩空，整個人跪進水裡。`},get p(){return hspLit()?{hp:-4,fear:6}:{hp:-1,fear:2}}}},
  {t:'q',l:'從管線架旁邊的窄道擠過去',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`牆邊有一條維修用的窄道，比水面高一點，只容得下一隻腳。你們扶著管線，一個一個側著身子擠過去，鞋子沒有濕。`},ng:{t:`你扶的那一截管線是燙的。你一縮手，整個人滑進水裡。`,p:{hp:-2}}},
  {t:'m',l:'回機房拉掉這一段的電',need:'hlitf',ok:{t:`你們回到機房，照著配電盤上的標示，拉掉「B1 走廊　照明及插座」那一路。走廊這一半的燈熄了，垂在水裡的電線不會再有電。你們摸黑踩水過去。`}}]},
OB4:{L:'OB',n:'地下室・中央供應室',
 t:`中央供應室是醫院消毒器械的地方。一整面牆都是不鏽鋼的架子，上面一包一包用藍色包布包好的手術器械，每一包都貼著滅菌指示膠帶，膠帶上的線條已經變成黑色，代表滅菌過了。

角落有兩台像大冰箱一樣的高壓滅菌鍋，門開著。牆邊停著一台補給推車。`,
 c:[
  {t:'sd',l:'翻架子上的器械包',stay:1,ok:{t:`大部分是手術室用的器械，太重、太專門。你挑了幾包用得到的：一個手術包、兩包消毒繃帶，還有一盒縫合包。`,r:{items:{surgkit:1,sbandage:2,suture:1}}}},
  {t:'q',l:'把補給推車推走',once:1,stay:1,ok:{t:`補給推車上疊滿了消毒繃帶和敷料包。你推著它往門口走，四個輪子在磁磚上叫個不停，車上的不鏽鋼盤子一直撞來撞去。

你在門口停下來，把塞得進背包的全塞進去，推車留在原地。`,r:{items:{sbandage:3,med:2}},p:{alarm:2}}},
  {t:'q',l:'看高壓滅菌鍋裡面',once:1,stay:1,k:'PER',d:12,s:'感知檢定',ok:{t:`滅菌鍋裡掛著一排架子。最下層有一個不屬於醫院的東西：一個黑色的硬殼箱，鎖扣開著，裡面是空的，海綿墊上留著幾個試管形狀的凹槽。箱蓋內側貼著一張標籤：「ARC　檢體運送　4W → S」。`,p:{fear:4}},ng:{t:`滅菌鍋裡黑漆漆的，你只看到架子。`}},
  {t:'mv',l:'往前走',ok:{t:`你們離開中央供應室。`}}]},
OB4b:{L:'OB',n:'地下室・醫療廢棄物間',
 t:`中央供應室再過去，是醫療廢棄物間。門口貼著黃色的生物危害標誌，門開著，一台裝滿紅色垃圾袋的大推車卡在門框上，袋子被撕開了好幾個，裡面的東西散了一地。

推車後面，廢棄物間裡有東西在動，還有撕塑膠袋的聲音。要往裡面走，就得經過這扇門。旁邊另一條走廊通往洗衣房，路比較遠。`,
 c:[
  {t:'q',l:'快步從門口走過去',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你們低著頭，一個接一個從門口快步走過去。撕袋子的聲音停了一下，又繼續。`},ng:{t:`你踩到地上的一個針頭盒，塑膠盒「啪」地裂開。撕袋子的聲音停了。`,fight:{n:1,mode:'ambush',names:['廢棄物間裡的清潔工']}}},
  {t:'q',l:'把推車推回去，順手把門關上',k:'STR',d:12,s:'力量檢定',ok:{t:`你用肩膀頂住推車，把它推回廢棄物間裡，再把門帶上，門鎖「喀」地扣住。門板被撞了一下，又一下，然後就沒有聲音了。`},ng:{t:`推車的輪子卡在門檻上，你一推，整車紅色垃圾袋倒了出來，裡面的東西也被你推得往前一撲。`,fight:{n:1,mode:'normal',names:['廢棄物間裡的清潔工']}}},
  {t:'m',l:'繞路經過洗衣房',ok:{t:`你們繞到另一條走廊，穿過洗衣房。一排大型洗衣機的門都開著，裡面塞著沒洗完的床單，空氣又熱又悶。走了很久，才從洗衣房的另一頭繞回主走廊。`,p:{fear:2}}}]},
OB5:{L:'OB',n:'地下室・員工休息室',
 t:`員工休息室裡有一張沙發、一台微波爐和一排置物櫃。牆上的軟木板釘滿了紙條，有排班表、外送的傳單，還有一張小孩畫的圖，畫著一個穿藍色衣服的人站在一棟大房子前面。

沙發上丟著一件工務的外套，口袋上繡著「赫克特」。`,
 c:[
  {t:'sd',l:'翻沒上鎖的置物櫃',stay:1,ok:{t:`大部分的置物櫃都鎖著。沒鎖的那幾個裡面有一罐咖啡、一根能量棒和一瓶礦泉水。`,r:{items:{coffee:1,bar:1,water:1}}}},
  {t:'q',l:'看軟木板上的紙條',need:'blackout',once:1,stay:1,ok:{t:`排班表上，停電那天晚上的工務只排了一個人：赫克特。排班表旁邊有一張紙條，字跡歪歪扭扭：

「機房一氧化碳警報響了。我頭很暈。發電機我先停了，排風機要等廠商。不要在機房待超過半小時。——H」`,p:{fear:2}}},
  {t:'q',l:'摸赫克特的外套口袋',once:1,stay:1,ok:{t:`外套口袋裡有一串鑰匙、一張識別證和一個打火機。鑰匙圈上掛著一個小塑膠牌：「救護車後門　邊門」。`,r:{items:{lighter:1},flag:'obdoorkey'}}},
  {t:'mv',l:'往前走',ok:{t:`你們離開休息室。`}}]},
OB6:{L:'OB',n:'地下室・太平間',
 tx:()=>!G.flags.blackout?'':hspLit()?'冷藏櫃的壓縮機重新動了起來，嗡嗡地響。':'冷藏櫃的壓縮機已經停了好幾天。',
 get t(){return (G.flags.blackout?`太平間的門一推開，味道就撲了過來。停電之後，冷藏櫃就不冷了。`:`太平間的門一推開，一股冷氣和消毒水的味道就撲了過來。冷藏櫃的壓縮機在嗡嗡地響。`)+`

一整面牆都是不鏽鋼的冷藏櫃門，每一格門上都插著一張名牌。房間中間有兩張不鏽鋼台子，其中一張上面躺著一個用白布蓋著的人。牆邊的架子上放著一排透明的遺物袋。

有一格冷藏櫃的門在響：咚。過了很久，又咚一聲。`},
 c:[
  {t:'q',l:'翻遺物袋',once:1,stay:1,k:'CON',d:12,s:'體質檢定',ok:{t:`你憋著氣，把遺物袋一個一個打開：手錶、皮夾、手機、婚戒。你只拿了皮夾裡的現金和一個沒用過的打火機，其他的都放回去。`,r:{usd:12,items:{lighter:1}}},ng:{t:`你才打開第二個袋子，胃就翻了上來。你跑到門外吐了很久。`,p:{fear:5}}},
  {t:'q',l:'看冷藏櫃門上的名牌',once:1,stay:1,ok:{t:`名牌上大部分寫著名字和日期。最右邊那一排不一樣，只有編號：B-103、B-107、B-109、B-114。每一張名牌的角落都蓋著同一個藍色的小章：「4W　待 ARC 回收」。`,p:{fear:6}}},
  {t:'q',l:'打開那一格在響的冷藏櫃',once:1,stay:1,k:'STR',d:11,bonusFlag:'oblisten',s:'力量檢定',ok:{t:`你拉開冷藏櫃的門把，裡面的滑板一下子被推了出來。屍袋的拉鍊從裡面被扯開了一半。`,fight:{n:1,mode:'first',names:['冷藏櫃裡的病人']},win:{t:`你們把它推回冷藏櫃裡。屍袋的標籤上寫著「B-111」。滑板底下壓著一個醫院的急救包，大概是送下來的時候跟著一起放進去的。`,r:{items:{med:1,antibiotic:1}}}},ng:{t:`門把卡住了。你再用力一拉，整個人往後一倒，撞在不鏽鋼台子上，台子上的白布滑了下來。`,p:{fear:8,alarm:1}}},
  {t:'mv',l:'往前走',ok:{t:`你們把太平間的門帶上。`}}]},
OB7:{L:'OB',n:'地下室・救護車後門',
 onEnter(){G.flags.hlitf=hspLit()?1:0},
 tx:()=>(G.flags.acru?'卸貨區那台黑色發電車還在轟轟地響。':'')+(G.flags.hback?'鐵捲門還是你們進來時的樣子，拉起一半。':''),
 t:`走廊盡頭是卸貨區，一台救護車倒車停在斜坡底下。通往外面的是一扇大鐵捲門，旁邊有一扇小小的邊門。

鐵捲門的控制盒上有上、下、停三顆按鈕。旁邊垂著一條手動鏈條，鏈條的下半段收在一個鐵盒裡，掛著一個鎖頭。`,
 c:[
  {t:'q',l:'從鐵捲門底下鑽出去',need:'hback',ok:{t:`你們彎腰從原來的縫鑽出去，回到卸貨區的斜坡上。`,r:{flag:'hspout'},go:'Z0'}},
  {t:'q',l:'按按鈕把鐵捲門打開',need:'hlitf',hide:'hback',ok:{t:`你按下「上」。鐵捲門的馬達轟地一聲啟動，整片門嘎啦嘎啦地往上捲，聲音大得整個地下室都聽得見。門開到一半，你們就鑽了出去。`,r:{flag:'hspout'},p:{alarm:3},go:'Z0'}},
  {t:'m',l:'拉手動鏈條',hide:'hback',k:'STR',d:12,bonusFlag:'nursetip',s:'力量檢定',ok:{t:`你們撬開鏈條盒上的小鎖頭，一節一節拉動鏈條。鐵捲門一格一格往上升，很慢，但沒什麼聲音。升到膝蓋那麼高，你們就從底下爬了出去。`,r:{flag:'hspout'},go:'Z0'},ng:{t:`鏈條卡在齒輪上，你一用力，整條鏈條嘩啦一聲滑下來，砸在鐵盒上。你們手忙腳亂地重來一次，總算把門拉起一個縫，爬了出去。`,r:{flag:'hspout'},p:{alarm:2},go:'Z0'}},
  {t:'q',l:'用赫克特的鑰匙開邊門',need:'obdoorkey',hide:'hback',ok:{t:`鑰匙一插就轉開了。邊門外面是卸貨區旁邊的人行通道，再走幾步就是街上。邊門在身後自己關上，鎖住了。`,r:{flag:'hspout'},go:'Z0'}},
  {t:'q',l:'撞開邊門',hide:'obdoorkey',k:'STR',d:14,s:'力量檢定',ok:{t:`你們用肩膀撞了三下，門鎖的螺絲終於崩開了。`,r:{flag:'hspout'},p:{alarm:2},go:'Z0'},ng:{t:`門撞不開，你的肩膀先痛了起來。你們只好改去拉鏈條，花了很久才把鐵捲門拉起一個縫，爬了出去。`,r:{flag:'hspout'},p:{hp:-2,alarm:2},go:'Z0'}},
  {t:'m',l:'從樓梯上四樓',need:'acru',ok:{t:`樓梯間的防火門都被人用橡膠門擋卡住了，大概是為了搬東西方便。你們沿著樓梯一路往上，到了四樓。`,go:'O2'}}]},
Orv:{L:'O',n:'聖瑪莉醫院・救護車道',
 onEnter(){G.flags.hbsee=(G.route||[]).includes('OB')?1:0},
 tx:()=>G.flags.acru?'救護車道上停滿了沒有標示的黑色車輛，急診的燈全亮著。門口站著兩個穿全套防護衣的人。':'',
 t:`你們又回到聖瑪莉醫院的救護車道。急診的自動門還是碎的，門口的玻璃被很多雙腳踩成了碎屑。

自動門後面被人用推床和輪椅堵死了，堵的人是從裡面堵的。布簾後面傳來床欄的聲音。`,
 c:[
  {t:'m',l:'繞到後面，從救護車後門進地下室',hide:'hbsee',ok:{t:`你們繞過停車場，貼著醫院的外牆走到後面的卸貨區。`,r:{flag:'hback'},go:'OBa'}},
  {t:'q',l:'走到隔壁的警察局',ok:{t:`你們穿過醫院的停車場，警察局就在對面。`,go:'L0'}},
  {t:'c',l:'回街區',ok:{t:`你們退出救護車道。`,go:'Z0'}}]},
/* ---------- 配電站 ---------- */
W0:{L:'W',n:'配電站・鐵門',
 t:`一大片鐵絲網圍起來的空地，裡面是一排排灰色的變壓器。鐵門上掛著「高壓危險　非工作人員禁止進入」的牌子，門被一條鐵鍊鎖著。以前這裡一天到晚都在嗡嗡響，現在一點聲音都沒有。`,
 c:[
  {l:'用工具撬開鐵門',req:['g:crowbar','g:fireaxe','spreader'],reqAny:1,hide:'wopen',t:'q',s:'需要鐵撬、消防斧或破拆工具',ok:{t:`鐵鍊斷掉的聲音在空地上傳得很遠。`,r:{flag:'wopen'},p:{alarm:1},go:'W1'}},
  {t:'q',l:'把鐵門扳開',once:1,hide:'wopen',k:'STR',d:13,s:'力量檢定',ok:{t:`你抓著鐵門用力往外扳，門框終於彎出一個縫。`,r:{flag:'wopen'},go:'W1'},ng:{t:`鐵門紋風不動，你的手倒是先磨破了。`,p:{hp:-1},stay:1}},
  {t:'q',l:'翻過鐵絲網',hide:'wopen',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你踩著鐵絲網的格子翻過去，落地的時候只擦破了一點皮。`,go:'W1'},ng:{t:`鐵絲網頂端的刺絲勾住了你的手臂。你還是翻過去了，但血滴了一路。`,p:{hp:-2,bleed:1},go:'W1'}},
  {t:'q',l:'從撬開的鐵門進去',need:'wopen',ok:{t:`鐵門還開著，跟你們上次離開的時候一樣。`,go:'W1'}},
  {t:'c',l:'回街區',ok:{t:`你們往回走。`,go:'Z0'}}]},
W1:{L:'W',n:'配電站・變電場',
 tx:()=>G.flags.powerfix?'變壓器在嗡嗡地響。這是你們修好的。':G.flags.acru?'有人來過了。一台漆成黑色的發電車接在配電盤上，粗粗的電纜沿著人行道一路往城北拉。':'',
 t:`變電場中間有一間水泥砌的控制小屋，門開著。配電盤上的保險絲座燒得焦黑，其中一根保險絲已經碎了，陶瓷碎片散了一地。`,
 c:[

});

L0:{L:'L',n:'第 4 分局・門口',

 t:`第 4 分局的門口用沙包堆了半人高的一道牆，牆上架著兩支長槍。停車場裡的警車有一半被翻倒，剩下的車窗全被砸碎了。`,
 c:[
  {t:'q',l:'舉起手走過去',hide:'evacgone',ok:{t:`你們舉著手慢慢走近。一個穿防彈背心的女警從沙包後面走出來，先看你們的手臂，再看脖子，最後才揮手要你們進去。她的名牌寫著「羅培茲」。`,go:'L1'}},
  {l:'用工具剪開鐵鍊',hide:'l0lock',req:['pliers','g:crowbar','g:fireaxe','spreader'],reqAny:1,t:'q',s:'需要鉗子、鐵撬、消防斧或破拆工具',ok:{t:`鐵鍊斷了，嘩啦一聲掉在地上。`,p:{alarm:1},go:'L1'}},
  {t:'q',l:'從破掉的窗戶爬進去',need:'evacgone',hide:'acru',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你從一扇被打破的側窗翻進去，落在一張辦公桌上。`,go:'L1'},ng:{t:`窗框上的碎玻璃割開了你的手掌。`,p:{hp:-2,bleed:1},go:'L1'}},

 t:`值班台後面的無線電一直在沙沙作響。牆上掛著轄區地圖，上面用紅筆圈了好幾個地方：醫院、旅館、北口檢查站。`,
 c:[
  {t:'q',l:'跟羅培茲警佐談',hide:'evacgone',trust:1,once:1,stay:1,k:'CHA',d:12,s:'統帥檢定',ok:{t:`她聽你們說完，沉默了一下。「我們也聯絡不上任何人。」她從腰上解下一根伸縮警棍丟給你，「拿著。槍我不能給你。想休息的話，拘留室後面那間是空的。」`,r:{gear:'baton',flag:'pdok'}},ng:{t:`「我現在沒空聽故事。」她轉身去接無線電。`}},
  {t:'q',l:'幫她把一個掙脫手銬的人押回去',hide:'evacgone',trust:1,once:1,ok:{t:`那個人撲向離他最近的警察。你們衝了過去。`,r:{flag:'pdok',karma:1},fight:{n:1,mode:'normal',names:['銬在椅子上的人']},go:'L1'}},
  {t:'q',l:'給羅培茲警佐看旅館的入住簿',need:'ledgerq',once:1,stay:1,ok:{t:`她翻到註記「ARC 合作門診」的那幾頁，手指停在 303、305、306 上。

「上個月有兩件傷人案，」她說，「嫌犯登記的住址，就是這三個房號。我們去旅館問過，門診的人說他們是『追蹤觀察中的病人』，有醫師負責。隔天，上面就叫我們結案。」

她把入住簿闔上，沒有還給你們。「紀錄室在走廊盡頭。你們想看什麼，自己去看。」`,r:{flag:['ledgercop','pdok']}}},
  {t:'q',l:'去紀錄室',need:'pdok',ok:{t:`你們穿過辦公區，推開走廊盡頭那扇寫著「紀錄室」的門。`,go:'L2'}},
  {t:'q',l:'趁亂溜進紀錄室',once:1,hide:'pdok',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你趁大家都在看角落那幾個人，貼著牆溜進走廊。`,r:{karma:-1},go:'L2'},ng:{t:`「你要去哪裡？」一個年輕警員擋在走廊口，手按在槍套上。你只好退回來。`,p:{fear:4},stay:1}},
  {t:'q',l:'翻值班台',need:'evacgone',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`抽屜裡有一張掛著繩子的門禁卡，上面寫著「證物室」，還有兩顆電池。`,r:{flag:'pdcard',items:{battery:2}}},ng:{t:`抽屜裡只有一堆罰單和一個咬了一半的甜甜圈。`}},

  {...sleepC('在拘留室後面過夜',`拘留室後面那間空房只有一張鐵床。你把門鎖上，聽著外面的無線電一直沙沙地響。半夜有人在拘留室那邊拍鐵欄杆，拍了很久。\n\n天亮的時候，聲音停了。`),need:'pdok',hide:'acru'},
  {t:'q',l:'回門口',ok:{t:`你們走回沙包後面。`,go:'L0'}}]},

  {l:'打開門禁面板的維修模式',job:'guard',need:'pw',t:'q',ok:{t:`你掀開面板的蓋子，按住重設鍵，輸入這個牌子預設的維修碼。門鎖喀的一聲彈開了。`,go:'L3'}},

 t:`購物中心的入口用購物車堆成了一道牆，只留一條側著身子才過得去的縫。大門上方的招牌「河景廣場」缺了半邊字。`,

  {t:'q',l:'繳過路費',need:'mraid',usd:15,s:'需要 $15',ok:{t:`錢遞過去，他們數了兩遍，讓開一條縫。`,r:{payUsd:15,flag:'mpass'},go:'S1'}},

  {t:'c',l:'回街區',ok:{t:`你們離開購物中心。`,go:'Z0'}}]},
S1:{L:'S',n:'河景廣場・一樓中庭',
 tx:()=>G.flags.acru?'中庭的天窗被燒穿了，灰從上面一直飄下來。一半的店都燒過了。':G.flags.raiders?'每一家店的鐵捲門都被撬開過，地上全是被拆開的包裝。':'中庭的噴水池乾了，裡面堆滿了被搬出來的紙箱。手扶梯停著，有人沿著扶手擺了一排露營燈，一路亮到二樓。',
 t:`一樓的店一家挨著一家：藥妝店、運動用品店、服飾店。往下的指標寫著「維修區・員工專用」，手扶梯通往二樓的美食街。`,
 c:[
  {l:'搜藥妝店',once:1,stay:1,t:'m',k:'PER',d:12,s:'感知檢定',ok:{t:`架上的藥幾乎被拿光了，但收銀台後面的櫃子還鎖著。你撬開它，裡面是幾樣處方藥和一包繃帶。`,r:{items:{painkiller:1,iodine:1,alcohol:1,bandage:2}}},ng:{t:`你只找到一堆過期的維他命和一瓶洗髮精。`}},
  {l:'搜運動用品店',once:1,stay:1,t:'m',k:'PER',d:12,s:'感知檢定',ok:{t:`倉庫最裡面的架子上，有一把還裝在盒子裡的複合弓，旁邊是一打箭。`,r:{gear:'compbow',items:{arrow:6}}},ng:{t:`倉庫的門一推開，一個穿著店員背心的人從紙箱堆後面爬了出來。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['穿店員背心的人']}}},
  {t:'sd',l:'搜服飾店',once:1,stay:1,ok:{t:`衣架倒了一地。你從試衣間裡翻出一件皮外套，尺寸剛好，還有幾件能撕成布條的襯衫。`,r:{items:{jacket:1,cloth:3}}}},
  {t:'q',l:'上二樓美食街',ok:{t:`你們踩著停住的手扶梯往上走。`,go:'S2'}},
  {t:'q',l:'下維修區',ok:{t:`你們推開寫著「員工專用」的門，順著樓梯往下走。`,go:'S3'}},
  {t:'q',l:'回入口',ok:{t:`你們走回購物車牆那邊。`,go:'S0'}}]},
S2:{L:'S',n:'河景廣場・二樓美食街',
 onEnter(){const F=G.flags;F.mrose=F.raiders?0:1;F.mboss=F.raiders&&!F.acru&&!F.mclear?1:0;F.mloot=F.raiders&&!F.acru&&F.mclear?1:0},
 tx:()=>G.flags.acru?'美食街燒得只剩骨架，桌椅熔成一團。牆上那面倖存者名單被燒掉了一半。':G.flags.mclear&&G.flags.raiders?'劫匪的據點沒人了。睡袋、空罐頭和彈殼散了一地，牆角還堆著他們沒來得及帶走的東西。':G.flags.raiders?'倖存者不見了。美食街變成劫匪的據點，桌子拼成一排，上面堆滿搶來的東西。帶頭的是一個光頭的男人，大家叫他德克。他看了你一眼：「要交易就快點。」':'',
 t:`美食街的桌子被拼成一張張床，幾十個人或坐或躺。一個繫著圍裙的中年女人在發罐頭，她是一家墨西哥餐廳的老闆，大家叫她蘿絲。牆上貼著一張手寫的名單，標題是「我們在這裡」。`,
 c:[
  {t:'q',l:'跟蘿絲買東西',need:'mrose',stay:1,ok:{t:`蘿絲把幾個紙箱推到你面前。「我們也要活下去，所以要收錢。」`,r:{shop:'mall'}}},
  {t:'q',l:'把抗生素給蘿絲',hide:'raiders',req:'antibiotic',once:1,stay:1,ok:{t:`蘿絲接過抗生素，眼眶一下子紅了。她從櫃台下面拿出一副防毒面具塞給你。「之前一個消防員留下來的。地下室那邊的空氣不對勁，你們拿去用。」\n\n「以後想睡覺，這裡給你們留一張桌子。」`,r:{use:'antibiotic',items:{gasmask:1,filter:1},flag:'mallok',karma:1}}},
  {l:'問蘿絲外面的事',need:'mrose',once:1,stay:1,t:'q',ok:{t:`「警察局那邊還有人守著，可是不收人了。北口檢查站那邊好像在搭什麼東西。」她壓低聲音，「還有，最近夜裡有幾台車在附近繞，車上的人會拿東西出來比對這裡的人。我不喜歡。」`}},
  {...sleepC('在蘿絲留的桌子上過夜',`蘿絲把一張桌子推到柱子後面，給你們一條毯子。半夜有人在哭，有人在打呼，有人一直在小聲地數數。\n\n天亮的時候，蘿絲已經在發早餐了。`),need:'mallok',hide:'raiders'},
  {t:'q',l:'跟德克交易',need:'mboss',stay:1,ok:{t:`德克把桌上的東西往你這邊推了推。「付現金。別想耍花樣。」`,r:{shop:'raider'}}},
  {t:'q',l:'偷劫匪的物資',need:'mboss',once:1,k:'AGI',d:14,ok:{t:`你趁德克在罵人，從桌子底下拖走一個背包，若無其事地走開。`,r:{items:{ammo9:6,water:2,bar:2},karma:-1},stay:1},ng:{t:`「小偷！」德克一腳踢翻桌子。`,r:{flag:'mclear',karma:-1},fight:{n:3,mode:'normal',names:['拿獵刀的劫匪','拿霰彈槍的劫匪','劫匪']},go:'S2'}},
  {l:'翻劫匪留下的東西',need:'mloot',once:1,stay:1,t:'m',ok:{t:`他們搶來的東西還剩不少。你挑了能帶走的：子彈、水、幾條能量棒，還有一卷捆好的美金。`,r:{items:{ammo9:8,shell:3,water:2,bar:2},usd:15}}},
  {l:'在燒過的美食街裡找找',need:'acru',once:1,stay:1,t:'m',ok:{t:`大部分的東西都燒掉了。你在一台被燻黑的冰箱裡找到兩瓶水。`,r:{items:{water:2}}}},
  {t:'q',l:'回一樓',ok:{t:`你們順著手扶梯走下去。`,go:'S1'}}]},
S3:{L:'S',n:'河景廣場・地下維修區',
 tx:()=>pwNow()?'天花板的燈管亮著，嗡嗡地響。':'沒有燈。走廊的盡頭有東西在滴水，一滴、一滴。',
 t:`維修區的走廊又窄又長，兩邊是機電室和倉庫。牆上的管線上長了一層鮮紅色的東西，一條一條，像血管，摸起來是溫的。通往停車場的鐵門開著。`,
 c:[
  {l:'翻機電室',hide:'gotfuse2',t:'m',k:'PER',d:12,dark:1,s:'感知檢定',ok:{t:`配電櫃旁邊的備品箱裡有一根高壓保險絲，還有一把鉗子和一卷膠帶。`,r:{items:{fuse:1,pliers:1,tape:1},flag:'gotfuse2'},stay:1},ng:{t:`你伸手去摸備品箱，摸到的是一團溫溫的、會動的東西。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['機電室裡的東西']},go:'S3'}},
  {l:'看看管線上那層東西',once:1,stay:1,t:'q',ok:{t:`那些紅色的東西像很細的血管，一條一條貼著管線，一路往停車場那邊長過去，一下一下地鼓，跟脈搏一樣。你湊近一點，聞到一股甜甜的爛水果味。`,p:{fear:4}}},
  {t:'q',l:'回一樓',ok:{t:`你們爬回一樓。`,go:'S1'}},
  {t:'c',l:'從停車場出去',ok:{t:`你們從停車場的斜坡走出去，回到街上。`,go:'Z0'}}]},

 onEnter(){G.flags.pw=pwNow()},
 tx:()=>G.flags.acru?'鐵捲門上噴了一個大大的橘色叉，旁邊寫著「已清查」。':G.flags.raiders?'鐵捲門被人用車撞開了一半，底下還卡著一截保險桿。':'',
 t:`一間不大的店面，鐵捲門拉到底，上面貼著「本店配合市府命令暫停營業」。招牌上的步槍剪影少了一半的燈管。旁邊有一扇鐵製的側門，門鎖很新。`,
 c:[
  {t:'q',l:'用店主的鑰匙開側門',need:'gunkey',hide:'raiders',ok:{t:`鑰匙轉了兩圈，側門開了。很安靜。`,go:'N1'}},
  {t:'q',l:'短路捲門的馬達',once:1,need:'pw',hide:'raiders',k:'INT',d:13,ok:{t:`你撬開後巷的控制箱，把兩條線碰在一起。鐵捲門抖了一下，嘎啦嘎啦地捲了上去。`,p:{alarm:1},go:'N1'},ng:{t:`控制箱裡噴出一串火花，你的手麻了好一陣子。`,p:{hp:-2},stay:1}},
  {l:'用破拆工具撐開捲門',req:'spreader',hide:'raiders',t:'q',ok:{t:`捲門被一點一點撐出一個洞，金屬撕開的聲音整條街都聽得到。`,p:{alarm:3},go:'N1'}},
  {t:'q',l:'從撞開的地方鑽進去',need:'raiders',ok:{t:`你們從那半扇捲門底下鑽進去。`,go:'N1'}},
  {t:'c',l:'回街區',ok:{t:`你們離開那條小路。`,go:'Z0'}}]},

 tx:()=>G.flags.raiders?'展示櫃全被砸了，牆上的槍架一把都不剩。地上全是玻璃和空盒子。':'展示櫃裡空空的，牆上的槍架也空了，只剩價格牌。看樣子封城之前就被收走了。',
 t:`店面很窄，一邊是玻璃展示櫃，一邊是掛滿空槍架的牆。櫃台後面有一扇門，上面寫著「工作區　閒人勿進」。`,
 c:[
  {t:'sd',l:'翻展示櫃下面的抽屜',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`抽屜裡有幾盒散裝的子彈和一瓶槍油。`,r:{items:{ammo9:6,ammo38:4,gunoil:1}}},ng:{t:`抽屜都被拉出來過了，只剩收據。`}},
  {t:'q',l:'看看最底層的展示櫃',once:1,stay:1,k:'PER',d:13,s:'感知檢定',ok:{t:`最底層的櫃子有一塊活動的底板。底板下面藏著一把手弩和一捆弩箭。`,r:{gear:'handxbow',items:{bolt:6}}},ng:{t:`櫃子是空的。`}},
  {t:'q',l:'進工作區',ok:{t:`你推開櫃台後面那扇門。`,go:'N2'}},
  {t:'q',l:'回店門',ok:{t:`你們走回門口。`,go:'N0'}}]},
N2:{L:'N',n:'卡特槍械・後場工作區',
 onEnter(){const F=G.flags;F.nok=(!F.raiders||F.acru||F.nclear)?1:0;F.nraid=F.nok?0:1;F.mp5lock=(F.nraid||F.gotmp5)?1:0},
 tx:()=>G.flags.nraid?'工作區裡有兩個人在把一箱一箱的東西往外搬，背對著你們。其中一個背著霰彈槍。':G.flags.acru?'有人來搜過了，地上全是靴印。槍架的位置空了一塊。':'',
 t:`後場比店面大，一張長長的工作台上擺滿了零件和工具，牆上有一個上了大鎖的槍架。角落的折疊椅上坐著一個穿格子襯衫的老人，頭垂著，一動也不動。`,
 c:[
  {t:'q',l:'先處理那兩個劫匪',need:'nraid',ok:{t:`你們從門後衝出去。`,r:{flag:'nclear'},fight:{n:2,mode:'first',names:['拿霰彈槍的劫匪','劫匪']},go:'N2'}},
  {l:'看看椅子上的老人',need:'nok',once:1,stay:1,t:'q',ok:{t:`你走近一點，老人的頭突然抬了起來。他的眼睛是灰白的。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['穿格子襯衫的老人']}}},
  {l:'撬開槍架的鎖',hide:'mp5lock',req:['g:crowbar','g:fireaxe','spreader'],reqAny:1,t:'q',s:'需要鐵撬、消防斧或破拆工具',ok:{t:`大鎖崩開了。槍架上只剩一把黑色的衝鋒槍，彈匣插在上面，是滿的。`,r:{gear:'mp5',mag:30,flag:'gotmp5'},go:'N2'}},
  {t:'q',l:'用工作台上的工具撥開槍架的鎖',once:1,hide:'mp5lock',k:'INT',d:13,s:'智力檢定',ok:{t:`你用工作台上的細鐵絲和起子撥了很久，鎖終於開了。槍架上只剩一把衝鋒槍，彈匣是滿的。`,r:{gear:'mp5',mag:30,flag:'gotmp5'},go:'N2'},ng:{t:`鐵絲斷在鎖孔裡。`,stay:1}},
  {l:'翻工作台',need:'nok',once:1,stay:1,t:'m',ok:{t:`工作台上的東西大多是零件，你挑了一套修理工具、一塊磨刀石。`,r:{items:{repairkit:1,whetstone:1}}}},
  {t:'q',l:'找工作台下面的暗格',job:'veteran',need:'nok',once:1,stay:1,ok:{t:`你在工作台下面敲了敲，有一塊板子的聲音不一樣。撬開來，裡面是一盒霰彈和一盒 9mm。`,r:{items:{shell:4,ammo9:8}}}},
  {t:'q',l:'回店面',ok:{t:`你們退回店面。`,go:'N1'}}]}
});
/* ================= v0.14.0 滅菌部隊營地與基地（主人 2026-11-13 定案） =================
   營地（城北的舊貨運場，LV CA，節點 CA0～CA5）：第 5 天影子期起才有，掛「ARC 醫療物流站」的牌子；第 6 天起公開營運。
     找到營地（campknown）：藥局的黑色廂型車、集合檢查的卡車、配電站的黑色發電車、警察局被搬剩的紙箱。
     通訊帳篷聽無線電 → 基地（baseknown）；指揮帳篷 → 隊長的門禁卡（acrucard）。
   基地（北郊的陸軍後備中心，LV BA，節點 BA0～BA5、BA1a）：潛入（門禁卡、制服＋防毒面具、躲補給車）或強攻（哨塔狙擊手可以先處理）都能走。
     指揮中心：作戰紀錄（opslog）、S 區門禁卡（labcard）。研究所入口照主人的規則：所有條件＋市電＋供水＋S 區門禁，回旅館那扇門（v1.0.0 再做）。
     停機坪：第 6 天起有直升機 → 結局 B「搶直升機逃出城」。
   G.flags.warn＝第 7 天 05:00 預警之後。 */
Object.assign(LV,{
 CA:{n:'舊貨運場',sub:'鐵絲網後的營地',en:'FORWARD CAMP',rule:'鐵絲網、探照燈，還有一根一直在冒煙的煙囪。',fx:{},ch:2,fire:'camp'},
 BA:{n:'陸軍後備中心',sub:'北郊',en:'ARMY RESERVE CENTER',rule:'門口的國旗被換成了一面紅底的旗子。',fx:{},ch:2,fire:'base'}
});
Object.assign(LV_POOL,{CA:['infected'],BA:['infected']});
// 全隊都穿制服、戴防毒面具
const acruDisg=()=>{const a=able();return a.length&&a.every(p=>p.eq&&p.eq.body&&p.eq.body.k==='acruuni'&&maskWorn(p))?1:0};
const campFt=()=>G.flags.acru?{n:3,names:['A.C.R.U. 隊員','A.C.R.U. 隊員','背燃料罐的 A.C.R.U.']}:{n:2,names:['A.C.R.U. 隊員','A.C.R.U. 隊員']};
const gateFt=()=>G.flags.towerdown?{n:2,names:['A.C.R.U. 隊員','A.C.R.U. 隊員']}:{n:3,names:['A.C.R.U. 隊員','A.C.R.U. 隊員','哨塔上的狙擊手']};
{const i=N.Z0.c.findIndex(c=>c.l==='回旅館');N.Z0.c.splice(i,0,
 {t:'c',l:'去城北的舊貨運場',need:'campknown',ok:{t:`你們避開大路，沿著鐵軌往城北走。`,go:'CA0'}},
 {l:'去北郊的陸軍後備中心',need:'baseknown',t:'l',ok:{t:`你們沿著北郊公路的路肩走，一有車燈就趴進路邊的排水溝。`,go:'BA0'}})}
// 找到營地的線索
{const e=EVPOOL.find(x=>x.id==='shadow1');e.c.splice(1,0,{l:'跟著那台車',k:'AGI',d:13,t:'m',ok:{t:`你隔著兩條街跟在後面。廂型車沒有開燈，一路往城北開，最後開進一片用新鐵絲網圍起來的空地——城北的舊貨運場。門口掛著一面牌子：「ARC 醫療物流站」。`,r:{flag:'campknown'},p:{fear:6}},ng:{t:`轉過第三個路口，車子就不見了。`,p:{fear:4}}})}
{const e=EVPOOL.find(x=>x.id==='acru2');const c=e.c.find(x=>x.l==='看看他們把人帶去哪');c.ok={t:`卡車先在旅館門口停了一下，下來兩個人，往地下室的方向走。然後卡車繼續往城北開，開進舊貨運場那片新拉的鐵絲網裡。那裡有一根煙囪在冒煙。`,r:{flag:['acrutruck','campknown']},p:{fear:10}}}
N.W1.c.splice(N.W1.c.length-1,0,{l:'順著那條電纜走',need:'acru',once:1,stay:1,k:'PER',d:12,s:'感知檢定',t:'m',ok:{t:`電纜沿著人行道拉了好幾條街，最後穿過一道鐵絲網，接進城北舊貨運場裡的一排發電機。鐵絲網後面是一整片灰色的帳篷，還有一根冒著煙的煙囪。`,r:{flag:'campknown'},p:{fear:6}},ng:{t:`電纜在一個路口分成好幾條，你跟丟了。`}});
N.L2.c.splice(N.L2.c.length-2,0,{t:'q',l:'看看那些被搬剩的紙箱',need:'acru',once:1,stay:1,k:'PER',d:12,s:'感知檢定',ok:{t:`紙箱上貼著列印的標籤：「轉送：前進營地（城北貨運場）　保管：A.C.R.U.」箱子裡是空的資料夾，夾子上還寫著嫌犯的名字。`,r:{flag:'campknown'}},ng:{t:`紙箱都是空的，標籤被撕掉了。`}});
Object.assign(N,{

CA0:{L:'CA',n:'舊貨運場・營地外圍',
 onEnter(){G.flags.disg=acruDisg()},
 tx:()=>G.flags.warn?'營地在拆。帳篷一頂一頂倒下來，卡車排成一列往北開。門口沒有人在看了。':G.flags.acru?'煙囪整天都在冒煙。卡車一台接一台開進去，車斗的帆布放下來，看不到裡面。門口站著四個穿黑色制服的人，每一台車都要停下來查。牌子還是那面「ARC 醫療物流站」。':'門口掛著一面牌子：「ARC 醫療物流站　生物檢體處理中　非相關人員禁止進入」。只有兩個人在門口站崗，穿的是黑色制服，不是醫護人員的衣服。',
 t:`城北的舊貨運場。一整片空地用新拉的鐵絲網圍起來，四個角各有一座鷹架搭的哨塔，探照燈在空地上慢慢掃。鐵絲網裡面是一排一排灰色的帳篷，最裡面那一頭，立著一根臨時的煙囪。`,
 c:[
  {t:'q',l:'剪開鐵絲網鑽進去',hide:'warn',req:['pliers','spreader'],reqAny:1,k:'AGI',d:12,s:'需要鉗子或破拆工具',ok:{t:`你們等探照燈掃過去，剪開最下面的幾格，一個接一個鑽過去。`,p:{alarm:1},go:'CA1'},ng:{t:`探照燈停在你們身上。哨塔上有人在對講機裡說了一句話。`,get fight(){return campFt()},go:'CA1'}},
  {l:'等換哨的空檔溜進去',hide:'acru',k:'PER',d:13,t:'m',ok:{t:`你們趴在對面的貨櫃後面看了很久。他們每兩個小時換一次哨，交接的時候兩個人都背對著門。你們就是在那時候溜進去的。`,go:'CA1'},ng:{t:`你們算錯了時間。剛走到門口，換哨的人從帳篷後面轉出來。`,get fight(){return campFt()},go:'CA1'}},
  {t:'q',l:'躲在卡車底下混進去',need:'acru',hide:'warn',k:'AGI',d:14,ok:{t:`你們趁卡車在路口減速時鑽到車底，抓著底盤上的橫桿。卡車在門口停了一下，有手電筒往車底照了一圈，照到你們旁邊的輪胎就移開了。`,go:'CA1'},ng:{t:`手電筒照到了你的鞋子。「車底有人。」`,get fight(){return campFt()},go:'CA1'}},
  {t:'q',l:'穿著 A.C.R.U. 的制服走進去',need:'disg',hide:'warn',k:'CHA',d:12,ok:{t:`你們排成一列走向門口，誰也沒有說話。門口的人看了你們一眼，揮手讓你們過去。紅色的鏡片後面，看不出他在想什麼。`,go:'CA1'},ng:{t:`門口的人伸手攔住你：「編號。」你答不出來。`,get fight(){return campFt()},go:'CA1'}},
  {t:'q',l:'硬闖',hide:'warn',ok:{t:`你們搶在探照燈掃過來之前衝向門口。`,get fight(){return Object.assign({mode:'first'},campFt())},go:'CA1'}},
  {t:'q',l:'從開著的門走進去',need:'warn',ok:{t:`你們從一台正要開走的卡車旁邊走進去，沒有人回頭。`,go:'CA1'}},
  {t:'c',l:'回街區',ok:{t:`你們沿著鐵軌往回走。`,go:'Z0'}}]},
CA1:{L:'CA',n:'營地・隔離區',
 tx:()=>G.flags.warn?'籠子的門都開著，裡面沒有人了。':G.flags.cfreed?'籠子的門被剪開了，裡面空了一半。':G.flags.acru?'籠子裡擠滿了人。有人在哭，有人一直用額頭撞鐵絲網，有人只是坐著，盯著煙囪。':'籠子裡只關了幾個人，都穿著醫院的病人服。',
 t:`帳篷之間用鐵絲網隔成一格一格的籠子。每一格前面插著一塊白板，用黑筆寫著：「陰性・觀察」「陽性・處置」「知情・轉送」。\n\n「陽性・處置」那一格是空的。地上有拖過的痕跡，一路拖向煙囪那邊。`,
 c:[
  {t:'q',l:'跟籠子裡的人說話',hide:'warn',once:1,stay:1,ok:{get t(){return G.flags.acru?`一個穿睡衣的男人抓著鐵絲網：「他們說只是檢查。量完體溫就把人分開。」他指著那一格空掉的「陽性・處置」：「我太太被分到那一格。她只是發燒。」`:`一個穿病人服的女人靠到鐵絲網邊，手腕上戴著一圈塑膠手環，上面印著「B-」開頭的編號。「我只是去回診，」她小聲說，「回診完，他們就把我們送來這裡。」`},p:{fear:8}}},
  {t:'q',l:'剪開籠子，放他們出去',hide:'cfreed',req:['pliers','spreader'],reqAny:1,s:'需要鉗子或破拆工具',ok:{t:`鐵絲一根一根斷開。籠子裡的人愣了一下，接著全部往外擠，往鐵絲網的破口跑。哨塔上的探照燈轉了過來。`,r:{flag:'cfreed',karma:1},p:{alarm:3},stay:1}},
  {t:'q',l:'撬開籠子的鎖',once:1,hide:'cfreed',k:'INT',d:13,s:'智力檢定',ok:{t:`掛鎖是便宜貨。你用一根鐵絲撥了幾下就開了。籠子裡的人一個接一個溜出去，誰也沒有出聲。`,r:{flag:'cfreed',karma:1},p:{alarm:1},stay:1},ng:{t:`鐵絲斷在鎖孔裡。`,stay:1}},
  {t:'q',l:'去煙囪那邊',ok:{t:`你們順著地上拖過的痕跡走。`,go:'CA2'}},
  {t:'q',l:'去掛紅十字的帳篷',ok:{t:`你們貼著帳篷的影子走過去。`,go:'CA3'}},
  {t:'q',l:'去天線最多的帳篷',ok:{t:`無線電的沙沙聲從那頂帳篷裡傳出來。`,go:'CA4'}},
  {t:'q',l:'去最大的那頂帳篷',ok:{t:`門口拉著兩道防水布。`,go:'CA5'}},
  {t:'c',l:'從原路溜出去',ok:{t:`你們從進來的地方溜回鐵絲網外面。`,go:'Z0'}}]},
CA2:{L:'CA',n:'營地・焚化區',
 t:`煙囪底下是一台用拖車改裝的焚化爐，爐門關著，還在發燙。旁邊的棧板上堆著一排黑色的屍袋，每一個都綁著標籤。\n\n空氣裡全是燒焦的味道。`,
 c:[
  {t:'q',l:'看屍袋上的標籤',once:1,stay:1,k:'CON',d:11,ok:{get t(){return G.flags.arcfile?`標籤上寫著日期、時間和一行編號，沒有名字。其中一個寫著「B-118」。你在醫院的病歷裡看過這個號碼。`:`標籤上寫著日期、時間和一行編號，像是「B-118」「C-0042」。沒有名字。`},p:{fear:10}},ng:{t:`你走到一半就停下來了。腳不聽使喚。`,p:{fear:6}}},
  {t:'q',l:'回隔離區',ok:{t:`你們離開那根煙囪。`,go:'CA1'}}]},
CA3:{L:'CA',n:'營地・軍醫帳篷',
 tx:()=>G.flags.warn?'大部分的藥品箱已經搬走了，地上只剩被拆開的紙盒。':'',
 t:`帳篷裡擺著兩張行軍床和一排鋁製的藥品箱，箱子上印著一個徽章：紅底的生物危害標誌，正中央插著一把雙刃劍，底下一行小字「A.C.R.U.」。角落的衣架上掛著幾套折好的黑色制服。`,
 c:[
  {l:'翻藥品箱',once:1,stay:1,t:'m',ok:{t:`軍用的東西，包裝都比醫院的厚。`,r:{items:{surgkit:1,antibiotic:1,sedative:1,sbandage:2}}}},
  {t:'q',l:'拿幾包軍糧',once:1,stay:1,ok:{t:`行軍床底下有一整箱鋁箔袋裝的軍糧。`,r:{items:{mre:3}}}},
  {t:'q',l:'拿走衣架上的制服',once:1,stay:1,ok:{t:`黑色的戰術服，右上臂縫著一圈紅底的徽章。穿上這個，再戴上防毒面具，遠遠看起來就跟他們一樣。`,r:{items:{acruuni:4}}}},
  {t:'q',l:'回隔離區',ok:{t:`你們走出帳篷。`,go:'CA1'}}]},
CA4:{L:'CA',n:'營地・通訊帳篷',
 t:`折疊桌上擺著一台軍用無線電和一本攤開的值勤日誌，旁邊還有一壺冷掉的咖啡。無線電的喇叭一直在沙沙地響。`,
 c:[
  {t:'q',l:'讀值勤日誌',hide:'opsnote',stay:1,ok:{get t(){return G.flags.acru?`日誌裡寫的都是代號和數字，一行一行，沒有任何原因：\n\n「D+5　0540　藥局三處　回收　冷藏檢體 14」\n「D+7　0610　北區集合點　接收 212　陰性 31　陽性 168　知情 13」\n「D+7　1100　處置 168」\n「知情 13　轉送　牧杖」`:`日誌裡寫的都是代號和數字，一行一行，沒有任何原因：\n\n「D+5　0510　聖瑪莉醫院四樓　回收　病歷　全數」\n「D+5　0540　藥局三處　回收　冷藏檢體 14」\n「D+5　——　北區集合點　準備中」`},r:{flag:'opsnote'},p:{fear:10}}},
  {l:'聽無線電',hide:'baseknown',stay:1,t:'m',ok:{t:`雜訊裡夾著一段很短的對話：「前進營地呼叫牧杖，今晚的轉送車隊十八點出發，走北郊公路。」另一頭回答：「牧杖收到。後備中心的門會開著。」\n\n北郊公路上只有一個後備中心：陸軍後備中心。`,r:{flag:'baseknown'}}},
  {t:'q',l:'回隔離區',ok:{t:`你們走出帳篷。`,go:'CA1'}}]},
CA5:{L:'CA',n:'營地・指揮帳篷',
 onEnter(){const F=G.flags;F.capin=F.acru&&!F.capdown&&!F.warn?1:0;F.capout=F.capin?0:1},
 tx:()=>G.flags.capin?'長桌旁邊站著一個戴紅色貝雷帽的人，正在地圖上畫線。門口的兩個隊員轉過頭來，紅色的鏡片對著你們。':G.flags.capdown?'帳篷裡只剩倒在地上的人，和那張畫滿線的地圖。':G.flags.warn?'長桌上的地圖被捲走了，只剩幾張忘了收的紙。':'帳篷裡沒有人。長桌上的檯燈還亮著。',
 t:`指揮帳篷比其他的大，門口拉著兩道防水布。裡面有一張鋪滿地圖的長桌、一張行軍床，床尾整整齊齊地放著一件長皮大衣。`,
 c:[
  {t:'q',l:'動手',need:'capin',ok:{t:`你們搶在他們開口之前動手。`,fight:{n:3,names:['滅菌隊長','A.C.R.U. 隊員','A.C.R.U. 隊員']},win:{t:`隊長的胸前口袋裡有一張黑色的門禁卡。長桌上的地圖用紅筆圈著北郊公路的盡頭，旁邊寫著兩個字：「牧杖」。`,r:{flag:['capdown','acrucard','baseknown']}},go:'CA5'}},
  {t:'q',l:'退出去',need:'capin',ok:{t:`你們退出帳篷。背後沒有腳步聲，只有對講機響了一下。`,p:{alarm:2},go:'CA1'}},
  {t:'q',l:'翻長桌上的東西',need:'capout',hide:'acrucard',stay:1,k:'AGI',d:13,ok:{t:`地圖用紅筆圈著北郊公路的盡頭，旁邊寫著兩個字：「牧杖」。行軍床的枕頭底下壓著一張黑色的門禁卡，背面印著一個編號。`,r:{flag:['acrucard','baseknown']}},ng:{t:`防水布被掀開了。「你們在這裡做什麼？」`,fight:{n:2,names:['A.C.R.U. 隊員','A.C.R.U. 隊員']}}},
  {t:'q',l:'回隔離區',ok:{t:`你們走出帳篷。`,go:'CA1'}}]},
/* ---------- 基地 ---------- */
BA0:{L:'BA',n:'陸軍後備中心・大門',
 onEnter(){G.flags.disg=acruDisg()},
 tx:()=>(G.flags.warn?'直升機一架接一架從基地裡飛起來，往北邊去。閘門開著，卡車擠成一團，沒有人在查。':G.flags.acru?'補給卡車在閘門前排成一列，每一台都要刷卡、掀開車斗檢查。':'門口很安靜。偶爾有一台黑色廂型車開進去，閘門升起、放下。')+(G.flags.towerdown?'哨塔的窗口裡沒有人了。':''),
 t:`北郊公路的盡頭，一整片低矮的水泥建築，外面圍著兩層鐵絲網。門口的崗哨有一道升降閘門和讀卡機，旁邊是一座水泥哨塔，塔頂的窗口黑漆漆的。\n\n旗桿上掛著一面紅底的旗子：生物危害標誌，正中央插著一把雙刃劍。`,
 c:[
  {l:'刷隊長的門禁卡',need:'acrucard',hide:'warn',t:'q',ok:{t:`讀卡機亮起綠燈，閘門升了起來。崗哨裡的人低頭看著螢幕，沒有抬頭。`,go:'BA1'}},
  {t:'q',l:'穿著制服，跟在補給車後面走進去',need:'disg',hide:'warn',k:'AGI',d:12,ok:{t:`你們貼著卡車的車尾走，閘門升起來的時候，跟著車一起過去。`,go:'BA1'},ng:{t:`閘門落得比你想的快。你們被攔在外面，崗哨裡的人站了起來。`,r:{flag:'bloud'},get fight(){return gateFt()},go:'BA1a'}},
  {t:'q',l:'躲進補給車的車斗',need:'acru',hide:'warn',k:'AGI',d:14,ok:{t:`你們縮在幾個大木箱後面。帆布被掀開，手電筒的光從箱子上掃過去，帆布又放下了。`,go:'BA1'},ng:{t:`手電筒停在你的臉上。`,r:{flag:'bloud'},get fight(){return gateFt()},go:'BA1a'}},
  {t:'q',l:'用步槍打掉哨塔上的人',once:1,hide:'towerdown',req:['g:r700','g:model70','g:fal'],reqAny:1,stay:1,k:'PER',d:14,s:'需要步槍',ok:{t:`你趴在公路對面的土堤上，等了很久。塔頂的窗口裡有一點紅光閃了一下。你扣下扳機，那點紅光就再也沒有亮過。`,r:{flag:'towerdown'},p:{alarm:2}},ng:{t:`子彈打在窗框上。下一秒，一發子彈從塔頂回敬過來，打碎了你旁邊的石頭，碎片劃開你的臉。`,p:{hp:-5,fear:10,alarm:2}}},
  {t:'q',l:'摸上哨塔',hide:'towerdown',k:'AGI',d:14,s:'敏捷檢定',ok:{t:`你們繞到哨塔背後，順著水管爬上去。塔頂的人趴在步槍後面，一直盯著公路，到最後都沒有回頭。`,r:{flag:'towerdown'},stay:1},ng:{t:`爬到一半，水管的固定環斷了，整條水管撞在牆上。`,r:{flag:'bloud'},get fight(){return gateFt()},go:'BA1a'}},
  {t:'q',l:'正面強攻',hide:'warn',ok:{t:`你們從路邊的排水溝裡衝出去。`,r:{flag:'bloud'},get fight(){return Object.assign({mode:'first'},gateFt())},go:'BA1a'}},
  {t:'q',l:'趁亂走進去',need:'warn',ok:{t:`你們混在擠成一團的卡車中間走進閘門，沒有人看你們一眼。`,go:'BA1'}},
  {l:'回街區',t:'l',ok:{t:`你們沿著北郊公路往回走。`,go:'Z0'}}]},
BA1a:{L:'BA',n:'基地・警報',
 t:`警報響了。營舍那邊的門被撞開，又有人衝出來，其中一個背著燃料罐。`,
 c:[
  {t:'q',l:'找掩體，迎戰',ok:{t:`你們躲到崗哨的水泥牆後面。`,fight:{n:2,names:['A.C.R.U. 隊員','背燃料罐的 A.C.R.U.']},win:{t:`警報還在響，但車道上沒有人再跑出來了。`,r:{flag:'bclear'}},go:'BA1'}},
  {t:'c',l:'退回公路上',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你們翻過路邊的護欄，滾進排水溝，一路爬到他們看不到的地方。`,go:'Z0'},ng:{t:`他們追出來了。`,fight:{n:2,names:['A.C.R.U. 隊員','背燃料罐的 A.C.R.U.']},win:{r:{flag:'bclear'}},go:'BA1'}}]},
BA1:{L:'BA',n:'基地・車道',
 onEnter(){const F=G.flags;F.bopen=F.acrucard||F.bclear||F.warn?1:0},
 tx:()=>G.flags.warn?'人都在往停機坪跑，沒有人管你們。':G.flags.bloud&&!G.flags.bclear?'警報還在響，遠處有腳步聲在找你們。':G.flags.acru?'停機坪那邊傳來旋翼的聲音。':'',
 t:`基地裡面比外面看起來大。一條水泥車道串起好幾棟建築：營舍、一棟掛著「軍械」牌子的倉庫、一棟屋頂插滿天線的指揮大樓，還有後面的一片停機坪。車道上每隔一段就有一支監視器。`,
 c:[
  {t:'q',l:'進軍械庫',need:'bopen',ok:{t:`軍械庫的門開了。`,go:'BA2'}},
  {l:'用破拆工具撐開軍械庫的門',hide:'bopen',req:'spreader',t:'q',ok:{t:`鐵門被撐開了。金屬撕開的聲音在車道上迴盪，營舍那邊有人在喊。`,fight:{n:2,names:['A.C.R.U. 隊員','A.C.R.U. 隊員']},go:'BA2'}},
  {t:'q',l:'進指揮大樓',need:'bopen',ok:{t:`你們推開指揮大樓的玻璃門，走上二樓。`,go:'BA3'}},
  {t:'q',l:'破解指揮大樓的門禁',hide:'bopen',k:'INT',d:14,s:'智力檢定',ok:{t:`你撬開讀卡機的外殼，把兩條線接在一起。門鎖喀的一聲彈開了。`,go:'BA3'},ng:{t:`讀卡機發出一長串嗶聲。走廊盡頭的門開了。`,fight:{n:2,names:['A.C.R.U. 隊員','A.C.R.U. 隊員']},go:'BA1'}},
  {t:'q',l:'去營舍後面的拘留區',ok:{t:`你們繞到營舍後面。`,go:'BA4'}},
  {t:'q',l:'去停機坪',ok:{t:`你們貼著倉庫的牆往後面走。`,go:'BA5'}},
  {l:'離開基地',t:'l',ok:{t:`你們從進來的路出去，沿著北郊公路往回走。`,go:'Z0'}}]},
BA2:{L:'BA',n:'基地・軍械庫',
 t:`一排一排的鐵架，大部分都空了，地上全是撕開的木箱。靠牆的槍架上只剩三把槍：一把 MP5、一把 FAL，還有一把裝著瞄準鏡的雷明頓 700。角落還疊著幾個彈藥箱。`,
 c:[
  {t:'q',l:'拿那把 MP5',once:1,stay:1,ok:{t:`彈匣是滿的。`,r:{gear:'mp5',mag:30}}},
  {t:'q',l:'拿那把 FAL',once:1,stay:1,ok:{t:`彈匣是滿的。`,r:{gear:'fal',mag:20}}},

 onEnter(){const F=G.flags;F.ppguard=F.acru&&!F.citypower&&!F.ppa2?1:0;F.ppnog=F.ppguard?0:1;F.ppeng=!F.acru&&!F.ppgrant?1:0;F.ppengno=F.ppeng?0:1;F.ppgo=F.ppgen&&!F.ppaux&&!F.ppguard?1:0;F.ppgg=F.ppgo&&F.ppgrant&&!F.acru?1:0;F.ppgb=F.ppgo&&!F.ppgg&&F.ppbook?1:0;F.ppgn=F.ppgo&&!F.ppgg&&!F.ppbook?1:0},
 tx:()=>G.flags.ppguard?'主控室裡有三個穿黑色制服的人，正在把電腦主機一台一台拆下來裝箱。其中一個戴著紅色的貝雷帽。':G.flags.acru?'主控室的地上有一灘乾掉的血，椅背上掛著一件工程師的外套。人不在了。':G.flags.ppgrant?(G.flags.ppaux?'葛蘭特坐在控制台前，盯著儀表上的指針。':'葛蘭特坐在控制台前，一直盯著那些不會亮的儀表。'):'控制台底下傳來很輕的呼吸聲。有人躲在那裡。',
 get t(){return `主控室整面牆都是儀表板和燈號，${G.flags.ppaux||G.flags.citypower?'燈號一排一排亮著。':'現在全是黑的。只有角落一盞接著蓄電池的工作燈還亮著，光很暗。'}牆上的書架擺著一排厚厚的資料夾。`},
 c:[
  {t:'q',l:'動手',need:'ppguard',ok:{t:`你們趁他們彎腰裝箱的時候衝了進去。`,fight:{n:3,mode:'first',names:['滅菌隊長','A.C.R.U. 隊員','A.C.R.U. 隊員']},win:{r:{flag:'ppa2'},t:'主控室安靜下來了。那幾箱拆下來的主機，你們沒有時間去管。'},stay:1}},
  {t:'q',l:'跟躲在控制台底下的人說話',once:1,need:'ppeng',k:'CHA',d:11,s:'統帥檢定',ok:{t:`「我們不是來搶東西的。」過了很久，一個穿工程師外套的中年男人慢慢爬出來，眼鏡缺了一角。\n\n「葛蘭特，值班工程師。」他說，「停電那天，整座電網垮了，保護電驛跳脫，全廠停機。我一個人沒辦法重新開機，要有人去把柴油發電機發動，還要有人守著。」他看著你們手上的武器，「你們……看起來守得住。」`,r:{flag:'ppgrant'},go:'PP2'},ng:{t:`「走開！」控制台底下的人拿一根扳手對著你們，「我看過外面那些人，我不會開門的！」`,stay:1}},
  {t:'q',l:'把水從控制台底下推過去',hide:'ppengno',req:'water',s:'需要礦泉水',ok:{t:`你把一瓶水放在地上，輕輕推過去。一隻手伸出來把它拿走了。過了一會兒，一個穿工程師外套的中年男人爬了出來，一口氣喝掉半瓶。\n\n「葛蘭特，值班工程師。」他說，「你們想讓電廠重新轉起來？那要先把柴油發電機發動。我一個人做不到。」`,r:{use:'water',flag:'ppgrant',karma:1},go:'PP2'}},
  {l:'拿書架上的操作程序書',need:'ppnog',hide:'ppbook',t:'m',ok:{t:`你翻了好幾本，終於找到一本封面寫著「黑啟動操作程序」的資料夾。裡面一步一步寫著：柴油發電機啟動、廠用電恢復、給水泵、送風機、點火、升溫升壓、併聯。每一頁的邊緣都是手寫的筆記。`,r:{flag:'ppbook'},go:'PP2'}},
  {t:'q',l:'讓葛蘭特照程序送廠用電',need:'ppgg',hide:'ppaux',ok:{t:`葛蘭特一個一個扳動開關，嘴裡唸著程序書上的步驟。天花板的燈管閃了兩下，亮了。控制台上的燈號一排一排亮起來，有紅的，有綠的。\n\n「給水泵、送風機都有電了。」他轉過頭來，臉色很難看，「接下來要點火。升溫升壓要好幾個小時，燈一亮、機器一響，方圓幾條街的東西都會往這裡來。你們要守得住才行。」\n\n他看著你們：「點火之前，先去把該補的補好。」`,r:{flag:'ppaux'},stay:1}},
  {t:'q',l:'照著程序書送廠用電',need:'ppgb',hide:'ppaux',ok:{t:`你照著程序書一頁一頁做。最後一個開關扳下去的時候，天花板的燈管閃了兩下，亮了。控制台上的燈號一排一排亮起來。\n\n程序書的下一頁，有人用紅筆寫著：「點火後升溫升壓約 4～6 小時。期間廠區照明全開，注意安全。」旁邊又補了一行很潦草的字：「守不住就不要點。」`,r:{flag:'ppaux'},stay:1}},
  {t:'q',l:'回汽機廠房',ok:{t:`你們爬下鐵梯。`,go:'PP1'}}]},
PP3:{L:'PP',n:'南岸電廠・柴油發電機房',
 onEnter(){const F=G.flags;F.pprdblk=F.raiders&&!F.acru&&!F.pprd?1:0;F.ppfuelok=!F.ppgen&&!F.pprdblk?1:0;F.ppfuelno=F.ppfuelok?0:1},
 tx:()=>G.flags.ppgen?'柴油發電機在轟轟地響，整個房間都在震。':G.flags.pprdblk?'輸油管一路接到外面的主油槽。窗外看得到，油槽旁邊停著三台油罐車，有人拿著槍在車頂上站崗。不先跟他們打交道，油是送不過來的。':'',
 t:`一台貨櫃那麼大的柴油發電機佔了整個房間，側面印著「黑啟動用　禁止移作他用」。旁邊的日用油槽是空的，油位計的指針貼在最底下。\n\n輸油泵的控制箱開著，裡面的保險絲燒得焦黑。`,
 c:[
  {t:'q',l:'換上保險絲，接通輸油泵',req:'fuse',hide:'ppfuelno',ok:{t:`你換上保險絲，按下輸油泵的啟動鈕。管子裡傳來咕嚕咕嚕的聲音，日用油槽的指針慢慢爬上來。\n\n你拉下發電機的啟動桿。機器咳了兩聲，然後轟地一聲轉了起來，整個房間都在震。這個聲音，整座廠區都聽得到。`,r:{use:'fuse',flag:'ppgen'},p:{alarm:3},get fight(){return ppFt(2)},stay:1}},
  {l:'用手搖泵一桶一桶打',need:'ppfuelok',t:'l',ok:{t:`你們輪流搖那支手搖泵，一桶一桶把柴油從主油槽打過來，手臂酸得抬不起來。日用油槽終於滿了。\n\n你拉下發電機的啟動桿。機器咳了兩聲，然後轟地一聲轉了起來。這個聲音，整座廠區都聽得到。`,r:{flag:'ppgen'},p:{alarm:3},get fight(){return ppFt(2)},stay:1}},
  {l:'從日用油槽放一桶柴油',need:'ppgen',once:1,stay:1,t:'m',sign:{t:'淨水廠的備用發電機，用的也是柴油。',dc:13},ok:{t:`你們找到一個空的鐵桶，從日用油槽的洩油閥放了滿滿一桶柴油。很重，要兩隻手提。`,r:{items:{diesel:1}}}},
  {t:'q',l:'去油槽看看',need:'pprdblk',ok:{t:`你們從後門出去，往油槽走。`,go:'PP6'}},
  {t:'q',l:'回汽機廠房',ok:{t:`你們回到汽機廠房。`,go:'PP1'}}]},
PP4:{L:'PP',n:'南岸電廠・鍋爐間',
 tx:()=>G.flags.ppbar?'廠房大門已經用堆高機和鐵板堵住了。':'',
 t:`鍋爐有十幾層樓高，裡面燒的是整座煤場的煤。控制台的燈號都亮了，就差點火。\n\n<b>點火之後要等好幾個小時</b>，燈一亮、機器一響，附近的東西都會往這裡來。這會是一場硬仗：點火之前，先把傷治好、把彈藥和吃的補好。`,
 c:[
  {l:'先把廠房大門堵起來',once:1,hide:'ppbar',k:'STR',d:12,t:'m',ok:{t:`你們把一台堆高機開到大門後面，又拖了幾塊鐵板卡在門縫裡。至少不會一次全部擠進來。`,r:{flag:'ppbar'},stay:1},ng:{t:`鐵板太重了，你們只堵住了一半。`,p:{hp:-1},stay:1}},
  {l:'點火，開始升溫升壓',hide:'ppboil',t:'l',ok:{t:`你按下點火鈕。爐膛深處傳來一聲悶響，接著是火焰被吸進去的呼嘯聲。廠區的照明一盞一盞全亮了，整座電廠像一座燈塔一樣立在黑暗的河岸上。\n\n然後，外面開始有聲音了。`,r:{flag:'ppfire'},go:'PP4a'}},
  {t:'q',l:'先回去整備',ok:{t:`你們離開鍋爐間。`,go:'PP1'}}]},
PP4a:{L:'PP',n:'南岸電廠・第一波',
 onEnter(){G.flags.ppw1=0;G.flags.ppw2=0},
 t:`第一批是從煤場那邊來的。牠們踩著煤堆衝下來，撞上廠房的鐵皮牆，一下、兩下，然後找到了門。`,
 tx:()=>G.flags.acru?'不對。來的不只是感染者。閘門那邊亮起一排手電筒，穿黑色制服的人也來了。':'',
 c:[{t:'q',l:'守住',ok:{t:`你們退到鍋爐控制台前面，背靠著背。`,get fight(){return G.flags.acru?{n:2,mode:'normal',names:['A.C.R.U. 隊員','A.C.R.U. 隊員']}:{n:3,mode:'normal',names:['穿工作服的感染者','煤場來的感染者','煤場來的感染者']}},win:{r:{flag:'ppw1'}},go:'PP4b'}}]},
PP4b:{L:'PP',n:'南岸電廠・第二波',
 onEnter(){G.flags.ppfail=G.flags.ppw1?0:1},
 tx:()=>G.flags.ppfail?'你們躲進了旁邊的儲藏室，等到外面安靜下來才敢出來。鍋爐沒人看著，火已經熄了。':'',
 t:`壓力錶的指針爬到一半。廠房外面又是一陣騷動，這一次的腳步聲很重。`,
 c:[
  {t:'q',l:'守住',hide:'ppfail',ok:{t:'大門那邊傳來一聲巨響，有東西正在把門撞開。',get fight(){return G.flags.acru?{n:3,mode:'normal',names:['A.C.R.U. 隊員','背燃料罐的 A.C.R.U.','A.C.R.U. 隊員']}:G.flags.ppbar?{n:1,mode:'normal',names:['穿防護衣的大個子']}:{n:3,mode:'ambush',names:['穿防護衣的大個子','煤場來的感染者','煤場來的感染者']}},win:{r:{flag:'ppw2'}},go:'PP4c'}},
  {t:'q',l:'回去重新點火',need:'ppfail',ok:{t:`你們回到鍋爐控制台前。一切都要重來。`,go:'PP4'}}]},
PP4c:{L:'PP',n:'南岸電廠・升壓',
 onEnter(){const F=G.flags;if(F.ppw2)F.ppboil=1;F.ppfail=F.ppw2?0:1},
 tx:()=>G.flags.ppfail?'你們退開了。等你們回來的時候，鍋爐的火已經熄了。':'',
 t:`天窗外的天色變了好幾次。壓力錶的指針終於爬到了綠色的區域，汽輪機開始慢慢轉起來，越轉越快，最後變成一種很低的、穩定的嗡嗡聲。\n\n只差最後一步：去開關場，把電送出去。`,
 c:[
  {t:'q',l:'去開關場',hide:'ppfail',ok:{t:`你們推開廠房側門。`,go:'PP5'}},
  {t:'q',l:'回去重新點火',need:'ppfail',ok:{t:`一切都要重來。`,go:'PP4'}}]},
PP5:{L:'PP',n:'南岸電廠・開關場',
 tx:()=>G.flags.citypower?(G.flags.eastpower?'北區和東區的燈都亮著。':'北區的燈亮著。控制箱上還有一條東區的饋線，接的是淨水廠。'):G.flags.ppgrant&&!G.flags.acru?'葛蘭特在對講機裡說：「一台機組撐不起整座城市。一區一區送，先送北區。全部一起送，負載一下子太大，機組會跳脫，就要全部重來。」':'',
 t:`開關場是一大片碎石地，一排排高壓斷路器和隔離開關立在鐵架上，絕緣子像一串一串白色的念珠。控制箱上貼著饋線的名牌：北區（旅館、醫院、第 4 分局）、東區、河景、南岸工業區。\n\n空氣裡有一種很細的嗡嗡聲。有東西帶電了。`,
 c:[
  {t:'q',l:'戴上絕緣手套，合上北區的斷路器',req:'gloves',hide:'citypower',ok:{t:`你戴上手套，握住操作桿，用力往下一推。鐵架上傳來一聲沉重的金屬撞擊聲。`,go:'PP5w'}},
  {t:'q',l:'徒手合上北區的斷路器',hide:'citypower',ok:{t:`你深吸一口氣，握住操作桿。`,qte:{t:'操作桿往下推到一半，旁邊的隔離開關「啪」地爆出一道電弧——',w:['放手','往後跳','趴下','滾開'],ok:{t:'你在電弧打過來之前鬆手往後一跳。操作桿自己落了下去，卡進了定位。'},ng:{t:'電弧擦過你的手臂。你整個人被彈出去，摔在碎石地上，手臂一片焦黑。',p:{hp:-5,fear:10}}},go:'PP5w'}},
  {t:'q',l:'合上東區（淨水廠）的斷路器',need:'citypower',hide:'eastpower',k:'INT',d:13,ok:{t:`你盯著控制箱上的負載表，等指針穩下來，才把東區的操作桿推下去。汽輪機的聲音沉了一下，又慢慢回到原來的音調。\n\n河的東岸，淨水廠那一片也亮了。`,r:{flag:'eastpower'},stay:1},ng:{t:`你推得太快了。負載表的指針一下子打到底。`,go:'PP5t'}},
  {t:'q',l:'全部一起送',hide:'citypower',k:'INT',d:13,s:'智力檢定',ok:{t:`你的手停在總開關上。一台機組，四條饋線，整座城市的冷氣、冰箱、路燈、醫院的機器全部一起接上來——你想起控制室那些燈號的上限，把手收了回來。\n\n一區一區送才對。`,stay:1},ng:{t:`你把四條饋線一起合上。一瞬間，整座城市的燈都亮了。`,go:'PP5t'}},
  {t:'q',l:'回汽機廠房',ok:{t:`你們回到廠房。`,go:'PP1'}}]},
PP5t:{L:'PP',n:'南岸電廠・跳脫',
 onEnter(){const F=G.flags;F.ppboil=0;F.ppw1=0;F.ppw2=0;F.citypower=0;F.eastpower=0;F.streetpower=F.powerfix?1:0},
 t:`然後全部熄了。\n\n廠房裡的嗡嗡聲變成一聲很長的、往下掉的哀鳴，汽輪機慢慢停了下來。控制箱上的燈號一個接一個變紅：「負載過大　機組跳脫」。\n\n鍋爐的火也熄了。一切都要重來。`,
 c:[{t:'q',l:'回廠房',ok:{t:`你們拖著腳步回到廠房。`,go:'PP1'}}]},
PP5w:{L:'PP',n:'南岸電廠・送電',
 onEnter(){G.flags.citypower=1;G.flags.streetpower=1;G.flags.wpknown=1},
 t:`一開始什麼都沒有發生。\n\n然後，河的對岸，一條街的路燈亮了起來。接著是另一條，再另一條，一路往北延伸。醫院的窗戶一層一層亮起來，警察局門口的燈亮了，旅館的招牌閃了兩下，也亮了。\n\n整座城市的北半邊，在黑暗裡亮了起來。\n\n<b>北區恢復市電</b>：醫院、警察局、購物中心、旅館都有電了。代價是，夜裡整片街區都照得清清楚楚，城市裡所有的東西都看得到——包括那些不想讓電回來的人。`,
 c:[{t:'q',l:'回廠房',ok:{t:`汽輪機在你們身後穩穩地轉著。`,go:'PP1'}},{l:'回街區',t:'l',ok:{t:`你們沿著河岸往北走，路燈一盞一盞從頭頂掠過。`,go:'Z0'}}]},
PP6:{L:'PP',n:'南岸電廠・油槽',
 tx:()=>G.flags.pprd?'油罐車已經開走了，地上只剩幾灘油漬。':'',
 t:`帶頭的是一個四十多歲的女人，頭髮剪得很短，手上握著一把霰彈槍，槍口朝下。她身後的油罐車車身漆著一家貨運公司的名字，車窗裡有小孩在看。\n\n「我叫瑪拉，」她說，「以前開這種車的。」她朝油槽抬了抬下巴，「北口檢查站的撤離車不載我們這種外地來的，我們二十幾個人，有一半是小孩。南橋還沒封死，只要有油，我們就衝得出去。」\n\n「所以，」她說，「你們是來跟我們搶油的嗎？」`,
 c:[
  {t:'q',l:'跟她談，油分一半',once:1,hide:'pprd',k:'CHA',d:13,ok:{t:`你跟她說，你們只要把發電機旁邊那個小油槽灌滿，剩下的都是她的。電廠的電如果送得出去，對留在城裡的人都有好處。\n\n瑪拉看了你很久，然後點點頭：「一半。我讓人幫你們接管子。」她轉身之前又說了一句：「南橋那邊，最近有穿黑衣服的人在架東西。你們如果也想走那條路，動作要快。」`,r:{flag:'pprd'},go:'PP3'},ng:{t:`「說得真好聽。」瑪拉身後的人把槍舉了起來，「油我們全要。你們要的話，拿東西來換。」`,stay:1}},
  {t:'q',l:'拿錢換',hide:'pprd',usd:20,s:'需要 $20',ok:{t:`瑪拉數了數錢，塞進口袋。「夠了。」她讓人把管子接到你們的油槽，「別說我們搶人。」`,r:{payUsd:20,flag:'pprd'},go:'PP3'}},
  {l:'幫他們把油罐車灌滿',hide:'pprd',t:'l',ok:{t:`你們跟著瑪拉的人一起扛管子、開閥門、守著油罐車的油位計。中間有兩隻感染者從煤場晃過來，被瑪拉一槍一個打倒。\n\n天色變了的時候，三台油罐車都灌滿了。瑪拉把一盒霰彈和一包吃的塞給你：「謝了。我們今晚就走。」她看著你們，「你們也該走了，這座城市不會再好了。」`,r:{flag:'pprd',karma:1,items:{shell:4,bar:2}},go:'PP3'}},

/* ================= v0.38.0 旅館階段：回訪的旅館會隨城市事件改變 =================
   階段＝既有城市旗標：1 停電前、2 停電（blackout）、3 劫匪（raiders）、4 佔領（acru）。
   每階段能搜的客房次數有限（HCAP），事件牌是 EVPOOL 裡標 z:'Y'、stg:[階段] 的牌，Y1 只從這些牌抽，所以每局看到的不同。
   決定牌 YD2～YD4：進入階段後第一次回到大廳時出現，二選一、不可逆；拖到下一階段還沒決定，就套用預設結果（YD.def）。
   旗標：ydN＝已決定，ydNa／ydNb＝選項，ydNc＝被世界逼著走的預設結果。 */
const hotelStage=()=>G.flags.acru?4:G.flags.raiders?3:G.flags.blackout?2:1;
const HCAP={1:3,2:3,3:3,4:2};
const HSTAGE_TX=['','','大廳沒有一盞燈亮著。櫃台上的蠟燭只剩半截，火光把鑰匙板的影子拉得很長。','大門外有人來回走動，玻璃碎片被踩得喀啦響。櫃台後面的抽屜全被拉開了。','旅館門口停著兩台沒有標示的黑色廂型車。大廳裡有穿黑色制服的人在守，櫃台的電腦被拆走了，入住簿一本都不剩。往地下室的那扇門前站著兩個人，槍口朝下，一直沒有離開。'];
function hotelTx(){const F=G.flags,s=hotelStage();
  const cap=(F['ys'+s]||0)>=HCAP[s]?'能搜的客房都翻過了，剩下的門不是鎖著，就是被家具堵死了。':'';
  return [HSTAGE_TX[s],cap].filter(Boolean).join('\n\n')}
const YD={
 2:{node:'YD2',def:{flag:['yd2','yd2c'],fear:3,t:'你一直沒有做決定。半夜有人在樓下拖了很久的東西，天亮的時候，櫃台後面的抽屜全空了，配電箱的蓋子丟在地上。'}},
 3:{node:'YD3',def:{flag:['yd3','yd3c'],fear:4,t:'門外的人等不到回答，開始用身體撞門。沙發被一寸一寸推開，等你聽見聲音趕過去，他們已經把一樓翻了一遍，走了。'}},
 4:{node:'YD4'}
};
// 下一階段來的時候，還沒決定的決定牌由世界替玩家決定
function hotelAuto(){const s=hotelStage();for(let k=2;k<s;k++){const d=YD[k];if(!d||!d.def||G.flags['yd'+k])continue;for(const f of d.def.flag)G.flags[f]=(G.flags[f]||0)+1;out(d.def.t,'rule');for(const q of able())scare(q,d.def.fear)}}
// 回到大廳時，如果目前階段還有沒做的決定，先去決定
function hotelDecision(id){if(id!=='Y0'||!G||G.guided||G.fight)return id;const s=hotelStage();for(let k=2;k<=s;k++){const d=YD[k];if(d&&!G.flags['yd'+k])return d.node}return id}
