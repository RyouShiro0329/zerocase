  {t:'q',l:'丟個東西下去試試',req:['coin','bottle','glass'],reqAny:1,s:'需要可以丟的東西',ok:{t:`你把東西往下丟。過了很久，才傳來一聲落水的悶響。喘氣聲往那個方向移了過去。你趁機往另一側的井壁爬。`,r:{use:'$req'}}}]},
 {id:'c_relic',at:['C'],t:`一條登機箱的背帶勾在纜繩的接頭上，在風裡輕輕晃。背帶另一頭吊著一個小小的化妝包。`,c:[
  {t:'q',l:'伸手把它勾過來',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你一隻手抓著維修梯，一隻手勾住背帶。化妝包裡有一捲繃帶、一盒止痛藥，還有一張登機證，日期是昨天。`,r:{items:{bandage:1,painkiller:1}}},ng:{t:`你勾到背帶的瞬間，化妝包掉了下去，一路撞著井壁往下落，聲音響了好久。`,p:{alarm:2}}},
  {t:'q',l:'不管它',ok:{t:`你繼續往下。化妝包在你頭頂晃著，越來越小。`}}]},
 {id:'c_oil',at:['C'],t:`井壁上滲出來的油膜反著微光。光裡映著一個人影，就在你背後。`,c:[
  {t:'q',l:'轉過身去',ok:{t:`你猛地轉身。背後只有纜繩和黑暗。

你再看回井壁，人影不見了。`,p:{fear:8}}},
  {t:'q',l:'不回頭，繼續往下',k:'INT',d:11,ok:{t:`只是反光，你告訴自己。只是你自己的影子。你一直到踩到下一根橫樑，都沒有回頭。`,p:{fear:2}},ng:{t:`你沒有回頭，可是你一直感覺得到。那個影子跟著你往下，一階，一階。`,p:{fear:12}}}]},
 {id:'c_drop',at:['C'],t:`上面某一層的電梯門縫裡，有東西掉了下來，擦過你的肩膀。`,c:[
  {t:'q',l:'伸手接住下一個',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`第二個東西掉下來的時候，你一把抓住。是一支手電筒，開關還是熱的。門縫裡沒有人探頭。`,r:{items:{flashlight:1}},p:{fear:4}},ng:{t:`第二個東西砸在你的額頭上，是一支手電筒。你眼前一黑，等回過神來，它已經掉到井底了。`,p:{hp:-2,fear:4}}},
  {t:'q',l:'貼著井壁閃開',ok:{t:`東西一個接一個掉下去，在井底碎成一片。門縫裡的光閃了一下，就熄了。`,p:{alarm:1,fear:3}}}]},
 {id:'d_figure',at:['D'],t:`你經過一扇窗戶的時候，窗內站著一個人，隔著玻璃看著你。他沒有動，也沒有出聲。`,c:[
  {t:'q',l:'朝他揮手',k:'CHA',d:11,s:'統帥檢定',ok:{t:`他愣了一下，慢慢把窗戶推開一條縫，塞出來一瓶水和一包餅乾。「下面的巷子有東西，」他說，「跳的時候小心。」然後他把窗戶關上，拉上窗簾。`,r:{items:{water:1,cookie:1}},p:{fear:-3}},ng:{t:`他突然把臉貼上玻璃，開始用力拍窗。那雙眼睛是白的。整排窗戶都在震。`,p:{fear:8,alarm:2}}},
  {t:'q',l:'別過頭，繼續往下',ok:{t:`你沒有再看那扇窗。往下爬了兩層，你還是覺得背後有人在看。`,p:{fear:3}}}]},
 {id:'d_curtain',at:['D'],t:`一陣強風把一片窗簾從破窗裡捲了出來，啪地纏住了你的腳踝。`,c:[
  {t:'q',l:'彎下腰解開',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你一手抓著扶手，一手把窗簾一圈一圈解開。風停的那一瞬間，你把它塞回了窗裡。`},ng:{t:`你彎腰的時候，風又來了。窗簾一扯，你整個人撞在欄杆上。`,p:{hp:-2,fear:4}}},
  {t:'q',l:'用力扯斷',k:'STR',d:11,s:'力量檢定',ok:{t:`布料嘶啦一聲裂開。你順手把扯下來的那一截收了起來，說不定用得上。`,r:{items:{cloth:1}}},ng:{t:`窗簾沒斷，窗框倒是整個鬆了，往下掉了三層樓，砸在後巷的垃圾桶上。`,p:{alarm:2}}}]},
 {id:'d_ladder',at:['D'],t:`腳下那一段鐵梯發出一聲金屬斷裂的脆響。固定在牆上的螺栓，斷了一根。`,c:[
  {t:'q',l:'慢慢把重心移到下一階',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你一點一點往下挪，每一步都先試過才踩實。鐵梯晃得厲害，可是撐住了。`},ng:{t:`你剛把重心移過去，那一段鐵梯就往外傾了。你抓著欄杆吊在半空，整個人被甩在牆上。`,p:{hp:-4,fear:6}}},
  {t:'q',l:'抓著旁邊的排水管爬過去',k:'STR',d:12,s:'力量檢定',ok:{t:`你換手抓住排水管，用手臂的力氣撐過那一段。身後，那段鐵梯又往下垂了一點。`},ng:{t:`排水管比你想的滑。你一路滑下去半層，掌心整片磨破了。`,p:{hp:-3,bleed:1}}}]},
 {id:'d_pack',at:['D'],t:`平台角落卡著一個登山背包，背帶纏在欄杆上。旁邊的鐵板上有一灘乾掉的血。`,c:[
  {t:'sd',l:'翻背包',ok:{t:`背包裡有一瓶水、一條能量棒和一捲繃帶。最底下是一本護照，照片上的女人在笑。你把護照留在背包裡。`,r:{items:{water:1,bar:1,bandage:1}},p:{fear:3}}},
  {t:'q',l:'不管它',ok:{t:`你跨過那灘血，繼續往下。`}}]},
 {id:'d_siren',at:['D'],t:`遠處響起一長串警報聲，整條街的狗都跟著叫了起來。後巷裡有東西開始動了。`,c:[
  {t:'q',l:'趁亂加快腳步往下',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你趁著警報聲蓋過一切的時候，一口氣往下爬了兩層。`},ng:{t:`你爬得太急，鞋子踢到欄杆，噹的一聲。後巷裡的東西抬起了頭。`,p:{alarm:2,fear:4}}},
  {l:'貼著牆，等它停下來',t:'q',ok:{t:`你貼著牆一動也不動。警報聲停了很久之後，後巷裡的腳步聲才慢慢散開。`,p:{fear:4}}}]},
 {id:'f_grease',at:['F'],t:`另一座爐台上，一鍋油開始冒煙了。油面上浮著一層細細的泡，隨時會燒起來。`,c:[
  {t:'q',l:'蓋上鍋蓋，關掉爐火',k:'INT',d:11,ok:{t:`你抓起旁邊的鍋蓋蓋上去，再把爐火轉到底。煙慢慢小了。你的手在發抖。`},ng:{t:`你伸手去關爐火的時候，鍋裡的油轟地燒了起來。你往後一跳，袖子還是被燎到了。`,p:{hp:-3,alarm:2}}},
  {t:'q',l:'不管它，離遠一點',ok:{t:`你繞到工作台的另一頭。身後傳來油爆的聲音，一聲接著一聲。`,p:{alarm:1,fear:3}}}]},
 {id:'f_pantry',at:['F'],t:`食材儲藏櫃的門開著一半，裡面的紙箱倒了一地。最裡面的架子上還有東西。`,c:[
  {t:'sd',l:'進去翻',dl:'繼續仔細翻儲藏櫃',k:'PER',d:11,dark:1,s:'感知檢定',ok:{t:`你摸到兩包泡麵和一瓶礦泉水，還有一包沒開過的方糖。`,r:{items:{noodle:2,water:1}}},ng:{t:`你伸手往架子後面摸，摸到的是一隻手。冰的，可是在動。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['躲在儲藏櫃裡的感染者']}}},
  {t:'q',l:'把門關上',ok:{t:`你把儲藏櫃的門推上。裡面有東西倒了下來，你沒有再開。`}}]},
 {id:'f_bell',at:['F'],t:`出菜口的服務鈴，叮地響了一聲。

出菜口後面沒有人。`,c:[
  {t:'q',l:'走過去看',k:'PER',d:12,s:'感知檢定',ok:{t:`鈴的旁邊壓著一張客房服務單，上面寫著「303 客房服務　照門診交代，放門口就好」。單子背面沾著一個血手印。你把它折起來收好。`,p:{fear:6}},ng:{t:`你走到出菜口前面的時候，鈴又響了一聲。這次你看清楚了：是天花板滴下來的水打在上面。你不知道為什麼，覺得那不是水。`,p:{fear:8}}},
  {t:'q',l:'不理它',ok:{t:`你沒有回頭。鈴聲沒有再響。`,p:{fear:2}}}]},
 {id:'h_dryer',at:['H'],t:`一整排滾筒洗衣機裡，有一台的門自己彈開了。濕衣服從裡面滑出來，攤在地上。`,c:[
  {t:'q',l:'過去看看',k:'PER',d:11,s:'感知檢定',ok:{t:`滾筒裡除了衣服，還有一件員工背心，口袋裡有一個沒開封的急救包。`,r:{items:{med:1}}},ng:{t:`你彎下腰往滾筒裡看。滾筒深處有一張臉，貼著鐵壁，對你張開了嘴。`,p:{fear:10},fight:{n:1,mode:'ambush',names:['卡在洗衣機裡的感染者']}}},
  {t:'q',l:'繞過去',ok:{t:`你貼著另一排洗衣機走過去。那台機器的門，在你身後慢慢闔上了。`,p:{fear:4}}}]},
 {id:'h_sheets',at:['H'],t:`曬衣架上掛著一整排床單，從天花板一路垂到地上。其中一條床單後面，有一個人的輪廓。`,c:[
  {t:'q',l:'掀開床單',ok:{t:`床單後面是一具掛在曬衣架上的燙衣板，上面披著一件制服。你站在那裡喘了很久。`,p:{fear:6}}},
  {t:'q',l:'繞遠路，從另一頭過去',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你繞了一大圈，貼著牆走過去。那個輪廓一直沒有動。`},ng:{t:`你碰到了一條床單。整排床單都晃了起來，那個輪廓也跟著晃——然後朝你走了過來。`,p:{fear:8},fight:{n:1,mode:'normal',names:['床單後面的感染者']}}}]},
 {id:'h_locker',at:['H'],t:`走廊邊一排員工置物櫃，有一格的鎖被撬開了，櫃門半開。`,c:[
  {t:'sd',l:'翻那一格',ok:{t:`裡面有一件外套、一包菸和半瓶水。外套口袋裡塞著一張排班表，凱文的名字被人用紅筆圈了起來。`,r:{items:{cigarette:1,water:1}}}},
  {t:'q',l:'把其他格也撬開',k:'STR',d:12,ok:{t:`你一格一格撬開。大部分都是空的，最後一格裡有一盒止痛藥和一捲繃帶。`,r:{items:{painkiller:1,bandage:1}},p:{alarm:2}},ng:{t:`鐵櫃門被你扳得嘎嘎作響，什麼都沒撬開，只是吵。`,p:{alarm:3}}}]},
 {id:'g_pipe',at:['G'],t:`頭頂的一根管線裂開了，一股帶著霉味的溫熱水霧噴了出來，正好擋在路中間。`,c:[
  {t:'q',l:'摀住口鼻，衝過去',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你低著頭衝過水霧。衣服濕了一片，帶著那股甜膩的味道。`,p:{inf:1}},ng:{t:`你衝到一半腳下一滑，整個人跪在水霧正下方，吸了一大口。`,p:{inf:4,hp:-1}}},
  {l:'找閥門把它關掉',k:'INT',d:12,s:'智力檢定',t:'q',ok:{t:`你順著管線摸到一個生鏽的閥門，用全身的力氣轉緊。水霧慢慢小了。`},ng:{t:`你轉錯了閥門。另一根管線也開始噴，整條走廊都起了霧。`,p:{inf:3,alarm:1}}}]},
 {id:'g_fiber',at:['G'],t:`地上那些紅色的東西突然收緊，纏住了你的鞋子。它在往回拉。`,c:[
  {t:'q',l:'用力扯開',k:'STR',d:12,s:'力量檢定',ok:{t:`它們一條一條斷開，發出很輕的、像濕紙撕開的聲音。斷口滲出溫溫的紅色汁液。`,p:{fear:4}},ng:{t:`你越扯，它纏得越緊。等你終於掙脫的時候，腳踝上多了一圈細細的紅痕。`,p:{inf:4,fear:6}}},
  {t:'q',l:'用刀割斷',req:'g:kitchenknife',s:'需要菜刀',ok:{t:`你蹲下來，一刀一刀把那些紅色的東西割開。刀刃上沾滿了黏稠的東西。`,p:{fear:3}}}]},
 {id:'g_worker',at:['G'],t:`管線底下坐著一個穿維修員制服的人，靠著牆，已經不動了。他的工具袋還掛在腰上。紅色的東西從他的袖口長出來，像血管一樣連到牆裡，還在一下一下地鼓。`,c:[
  {t:'q',l:'拿他的工具袋',k:'CON',d:11,ok:{t:`你屏住呼吸，解下工具袋就退開。裡面有一捲膠帶、一把鉗子和一顆電池。`,r:{items:{tape:1,pliers:1,battery:1}}},ng:{t:`你解工具袋的時候，他的手指動了一下，那些紅色的東西整片鼓了起來。你搶了工具袋就跑，吸了好幾口那股甜膩的空氣。`,r:{items:{tape:1,battery:1}},p:{inf:4,fear:8}}},
  {t:'q',l:'不碰他',ok:{t:`你繞過他。他的頭微微轉了一點，跟著你的方向。`,p:{fear:6}}}]},
 {id:'p_alarm',at:['P'],t:`離你最近的一台車，警報器突然響了起來。車頭燈一閃一閃，照亮了整排柱子。`,c:[
  {t:'q',l:'衝過去把它弄停',k:'INT',d:12,ok:{t:`你拉開引擎蓋，扯掉電瓶線。警報聲斷了。黑暗裡，很多東西停下了腳步，然後又慢慢散開。`,p:{alarm:1}},ng:{t:`你找不到電瓶線。警報一直響，柱子後面的影子越來越多。`,p:{alarm:3},fight:{n:1,mode:'normal',names:['被警報引來的感染者']}}},
  {t:'q',l:'趁亂往反方向走',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`所有的東西都朝警報聲走過去。你往另一個方向，一根柱子一根柱子地移動。`},ng:{t:`你跑得太急，撞上了一台車的後照鏡。`,p:{alarm:2,fear:4}}}]},
 {id:'p_crawl',at:['P'],t:`你經過一台轎車的時候，車底下伸出一隻手，抓住了你的腳踝。`,c:[
  {t:'q',l:'踢開它',k:'STR',d:11,s:'力量檢定',ok:{t:`你用另一隻腳狠狠一踩。手鬆開了，縮回車底下。`,p:{fear:6}},ng:{t:`那隻手把你拖倒在地上。車底下的東西爬了出來。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['車底下的感染者']}}},
  {t:'q',l:'往前撲，掙脫它',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你往前一撲，鞋子留在了那隻手裡，人掙脫了。你沒有回去拿。`,p:{fear:6}},ng:{t:`你撲出去的時候，膝蓋重重撞在水泥地上。那隻手沒有放開。`,p:{hp:-2,fear:8},fight:{n:1,mode:'ambush',names:['車底下的感染者']}}}]},
 {id:'p_trunk',at:['P'],t:`一台休旅車的後車廂開著，裡面塞滿了露營用品。車門上用噴漆寫著：「去河對岸。不要等我們。」`,c:[
  {t:'sd',l:'翻後車廂',k:'PER',d:11,dark:1,s:'感知檢定',ok:{t:`你翻出一捲繩子、一包能量棒和兩顆電池。`,r:{items:{rope:1,bar:1,battery:2}}},ng:{t:`你拉動一個睡袋，一整堆露營鍋稀哩嘩啦地倒了出來。`,p:{alarm:2}}},
  {t:'q',l:'不碰',ok:{t:`你看了那行字很久，然後繼續往前走。`,p:{fear:3}}}]}
);
// 旅館事件牌：每階段一副，每次搜客房抽一張（不放回）
EVPOOL.push(
 {id:'yh1a',z:'Y',stg:[1],t:`二樓走廊最底的客房，門縫下透出一條細細的光。裡面有人在小聲說話，說得很快，像在背什麼。`,c:[
  {t:'q',l:'敲門',k:'CHA',d:11,s:'統帥檢定',ok:{t:`門開了一道縫。一個穿著睡衣的女人把行李箱推出來。「我走不動了，」她說，「這個給你，別讓人知道我在這裡。」箱子裡有幾瓶水和一包能量棒。`,r:{items:{water:2,bar:1}}},ng:{t:`裡面的聲音突然停了。門板後面傳來椅子被拖動的聲音，然後什麼也沒有了。你站了一會兒，只能走開。`,p:{fear:3}}},
  {t:'q',l:'貼著門聽',k:'PER',d:12,s:'感知檢定',ok:{t:`她在背一串電話號碼，一遍又一遍。你沒有再打擾她，只是靜靜地走開。`,p:{fear:2}},ng:{t:`你的腳碰到了牆角的垃圾桶。說話聲立刻停了。`,p:{alarm:1}}}]},
 {id:'yh1b',z:'Y',stg:[1],t:`轉角的飲料販賣機被人撬開過，玻璃碎了一地，裡面還卡著幾罐沒掉下來的飲料。`,c:[
  {t:'q',l:'伸手進去拿',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你的手指勾住鋁罐的邊緣，一罐一罐慢慢拉出來。`,r:{items:{cola:2}}},ng:{t:`你的手臂被玻璃劃了一道。`,p:{hp:-1},r:{items:{glass:1}}}},
  {t:'q',l:'用腳踢機身',ok:{t:`整台機器晃了一下，兩罐可樂和一包餅乾滾了出來。聲音在走廊裡傳得很遠。`,r:{items:{cola:2,cookie:1}},p:{alarm:1}}}]},
 {id:'yh1c',z:'Y',stg:[1],t:`樓梯間的燈閃了一下。一個穿旅館制服的人坐在階梯中間，背對著你，肩膀一抽一抽的。`,c:[
  {t:'q',l:'悄悄繞過去',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你貼著欄杆，一階一階跨過去。他的頭偏了一下，又低下去。`},ng:{t:`你的衣角勾到了欄杆。他整個人轉了過來。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['穿旅館制服的感染者']}}},
  {t:'q',l:'從背後動手',ok:{t:`你沒有給他回頭的機會。`,fight:{n:1,mode:'first',names:['穿旅館制服的感染者']}}}]},
 {id:'yh1d',z:'Y',stg:[1],t:`一間客房的門沒關。床鋪整齊得不像有人住過，只有浴室的燈還亮著，洗手台上排著三排瓶瓶罐罐。`,c:[
  {t:'sd',l:'翻找盥洗包',k:'PER',d:11,s:'感知檢定',ok:{t:`你在盥洗包的夾層裡摸到一小瓶酒精、一個針線包，還有一條乾淨的毛巾。`,r:{items:{alcohol:1,sewing:1,cloth:1}}},ng:{t:`全是乳液和面膜，都過期了。你把東西放回原位。`}},
  {t:'q',l:'關掉浴室的燈離開',ok:{t:`你把燈關了。黑暗裡，你聽見自己的呼吸比剛才大聲。`,p:{fear:1}}}]},
 {id:'yh1e',z:'Y',stg:[1],t:`走廊盡頭的窗戶沒關，窗簾一下一下往外飄。從這裡可以看到街區北邊：一台公車橫在路中央，車門開著。`,c:[
  {t:'q',l:'探出頭看',k:'PER',d:12,s:'感知檢定',ok:{t:`窗台外側卡著一個皮夾，裡面有幾張皺巴巴的美金。你把它勾了回來。`,r:{usd:3}},ng:{t:`公車的後座上，有東西在動。它抬起頭，好像看了你一眼。你縮了回來。`,p:{fear:4}}},
  {t:'q',l:'把窗戶拉上',ok:{t:`你把窗戶關緊，窗簾拉好。走廊安靜了一點。`}}]},
 {id:'yh2a',z:'Y',stg:[2],t:`走廊裡伸手不見五指。你只能靠牆慢慢摸，指尖碰到一扇一扇冰冷的門板。其中一扇沒有鎖。`,c:[
  {t:'q',l:'推開那扇門',k:'PER',d:12,dark:1,s:'感知檢定',ok:{t:`你在黑暗裡一寸一寸摸過去，摸到床頭櫃的抽屜，裡面有一捲膠帶和一把布料剪下來的碎布。`,r:{items:{tape:1,cloth:2}}},ng:{t:`你被床腳絆了一下，整個人摔在地上。`,p:{hp:-1}}},
  {t:'q',l:'不理它，繼續往前',ok:{t:`你把手縮回來，貼著另一側的牆走。有些門，還是別打開比較好。`}}]},
 {id:'yh2b',z:'Y',stg:[2],t:`一個男人舉著蠟燭從樓梯上摸下來。他看到你，停住了。「有沒有電池？」他說，「我的助聽器沒電了，我什麼都聽不見。」`,c:[
  {t:'q',l:'給他一顆電池',reqN:{battery:1},s:'需要電池 ×1',ok:{t:`他兩隻手握著那顆電池，像握著什麼貴重的東西。「謝謝你，」他說，從口袋裡摸出一包能量棒，硬塞進你手裡。`,r:{pay:{battery:1},karma:1,items:{bar:1}}}},
  {t:'q',l:'說自己沒有',ok:{t:`他點點頭，沒有再問，舉著蠟燭一階一階走回樓上。燭光越來越小。`,p:{fear:2}}}]},
 {id:'yh2c',z:'Y',stg:[2],t:`櫃台後面的員工休息室裡，冰箱還有一點涼氣。再不吃，裡面的東西撐不到天亮。`,c:[
  {t:'q',l:'把能吃的都帶走',ok:{t:`你把還沒壞的東西一樣一樣拿出來：泡麵、餅乾、幾罐可樂。冰箱門闔上的時候，裡面只剩下發酸的牛奶。`,r:{items:{noodle:1,cola:2,cookie:1}}}},
  {t:'q',l:'關上冰箱，留給別人',ok:{t:`你把冰箱門關好，在門上貼了一張紙條：「裡面還有吃的，一人一份。」不知道會不會有人看到。`,r:{karma:1}}}]},
 {id:'yh2d',z:'Y',stg:[2],t:`天花板上傳來腳步聲，很輕，一下一下，從走廊這頭走到那頭，停了很久。`,c:[
  {t:'q',l:'屏住呼吸等它過去',k:'CON',d:12,s:'體質檢定',ok:{t:`腳步聲停在你頭頂，過了很久很久，才又響起，往樓梯的方向遠去。`},ng:{t:`你的肚子在這時叫了一聲。上面的腳步聲立刻停了。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['天花板上的感染者']}}},
  {t:'q',l:'上樓去看',k:'AGI',d:12,dark:1,s:'敏捷檢定',ok:{t:`二樓的走廊上，一個住客趴在地上，已經不動了。他的口袋裡還有一卷繃帶。`,r:{items:{bandage:1}}},ng:{t:`你踩上最後一階，木板響了一聲。黑暗裡，有東西轉過頭來。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['天花板上的感染者']}}}]},
 {id:'yh2e',z:'Y',stg:[2],t:`從窗戶看出去，遠處有一個街區在燒。火光把整面玻璃映成橘紅色，沒有警笛，沒有人在滅火。`,c:[
  {t:'q',l:'看久一點',k:'PER',d:11,s:'感知檢定',ok:{t:`你注意到旅館後巷有一台車，有人正在撬它的油箱蓋。那個人抬頭看了一眼這棟樓，又低下頭繼續撬。`,p:{fear:2}},ng:{t:`火光晃得你眼睛發痛。你什麼都沒看清楚，只覺得心裡越來越沉。`,p:{fear:3}}},
  {t:'q',l:'拉上窗簾',ok:{t:`房間暗了下來。你靠在牆邊，等心跳慢下來。`,r:{rest:{hp:1,san:1}}}}]},
 {id:'yh3a',z:'Y',stg:[3],t:`這一層的客房門全被踹開了。地毯上有拖行的痕跡，床墊被翻到牆邊，衣櫃整個倒了。`,c:[
  {t:'sd',l:'在翻亂的東西裡找',k:'PER',d:12,s:'感知檢定',ok:{t:`衣櫃底下壓著一個小藥包，他們翻過一次，沒有翻到最底下。`,r:{items:{alcohol:1,painkiller:1}}},ng:{t:`你的手按到了一根外露的釘子。`,p:{hp:-1}}},
  {t:'q',l:'不浪費時間，走開',ok:{t:`你看了一眼那些被撕開的行李，轉身離開。`}}]},
 {id:'yh3b',z:'Y',stg:[3],t:`浴室的簾子後面有人在發抖。是個穿旅館制服的年輕人，手裡抓著一把拆信刀。「我不是他們的人，」他說。`,c:[
  {t:'q',l:'把水遞給他，勸他跟你說話',k:'CHA',d:12,s:'統帥檢定',ok:{t:`他喝了一大口水，手慢慢不抖了。「樓梯後面的儲藏室，他們沒找到，」他說，帶你過去，從貨架後面拿出一包能量棒。`,r:{items:{bar:1},karma:1}},ng:{t:`你一靠近，他就尖叫起來。聲音在空樓裡迴盪。`,p:{alarm:2}}},
  {t:'q',l:'不理他，退出去',ok:{t:`你慢慢退到走廊上，拉上門。裡面的哭聲被擋在門後。`,p:{fear:2}}}]},
 {id:'yh3c',z:'Y',stg:[3],t:`樓梯轉角有人用噴漆寫了一串數字和箭頭，箭頭指向這棟樓的另一側。`,c:[
  {t:'q',l:'順著箭頭走',k:'PER',d:12,s:'感知檢定',ok:{t:`箭頭的盡頭是一間被撬開的客房，床底下藏著一個彈藥盒，他們還沒回來拿。`,r:{items:{ammo9:3}}},ng:{t:`轉角後面有人守著，手上拿著球棒。「這是我們的。」他說。`,fight:{n:1,mode:'ambush',names:['拿球棒的劫匪']}}},
  {t:'q',l:'用腳把字抹掉',ok:{t:`你把那串數字擦得模模糊糊。不知道這有沒有用。`}}]},
 {id:'yh3d',z:'Y',stg:[3],t:`樓梯中間有一個被丟下的背包，拉鍊開著，露出一角急救包。背包旁邊的牆上，有一道新的血手印。`,c:[
  {t:'q',l:'拿走急救包',ok:{t:`你把背包裡還能用的東西倒出來：一個急救敷料包，一捲繃帶。血手印在你背後，一直沒有乾。`,r:{items:{med:1,bandage:1}},p:{fear:2}}},
  {t:'q',l:'檢查血手印',k:'PER',d:12,s:'感知檢定',ok:{t:`血還沒乾。你順著痕跡找到二樓盡頭，有人躲在那裡，等你走開才敢出來。你什麼都沒說，轉身走了。`},ng:{t:`痕跡的盡頭，有人在等著你。`,p:{fear:4},fight:{n:1,mode:'ambush',names:['劫匪']}}}]},
 {id:'yh3e',z:'Y',stg:[3],t:`樓下的收音機被人調到最大聲，是撤離廣播的重播，一遍又一遍。聲音把整棟樓的人都引了過來。`,c:[
  {t:'q',l:'把收音機關掉',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你衝下去按掉了開關。整層樓一下子安靜下來，你在櫃台後面蹲了很久，才聽見外面的腳步聲慢慢散去。`},ng:{t:`你還沒摸到開關，有人已經先進了大廳。`,p:{alarm:2}}},
  {t:'sd',l:'趁聲音掩護搜東西',dl:'繼續仔細翻客房',ok:{t:`廣播的聲音蓋過了你的腳步。你在一間又一間客房裡，匆匆抓走了繩子和幾盒釘子。`,r:{items:{rope:1,nails:1}},p:{alarm:1}}}]},
 {id:'yh4a',z:'Y',stg:[4],t:`走廊上的地毯被人用水沖過。客房的門一間一間貼上了白色的封條，封條上只有一串編號。`,c:[
  {t:'q',l:'撕開封條',k:'PER',d:12,s:'感知檢定',ok:{t:`房間裡的東西被清得乾乾淨淨，只有浴室的排水孔旁邊，掉了一小瓶消毒用的酒精。`,r:{items:{alcohol:1}}},ng:{t:`封條撕開的瞬間，走廊盡頭的對講機響了一聲。`,p:{alarm:2}}},
  {t:'q',l:'不碰，繼續往前',ok:{t:`你把手縮回來。有些東西，一旦動了就再也瞞不住。`}}]},
 {id:'yh4b',z:'Y',stg:[4],t:`樓梯間的垃圾袋堆在轉角，袋口露出一角黑色的布料，和幾個空的針劑盒。`,c:[
  {t:'q',l:'翻垃圾袋',k:'INT',d:12,s:'智力檢定',ok:{t:`針劑盒上的標籤都被刮掉了。袋子底下有一捲膠帶、兩顆電池，和一條沒用過的布。`,r:{items:{tape:1,battery:2,cloth:1}}},ng:{t:`袋子被你扯倒了，滿地的空盒子嘩啦響了一聲。`,p:{alarm:1}}},
  {t:'q',l:'繞過去',ok:{t:`你貼著牆邊走過，沒有回頭。`}}]},
 {id:'yh4c',z:'Y',stg:[4],t:`走廊另一頭的對講機在說話：「……三樓清完了。換班前再看一遍。」腳步聲往這邊走來。`,c:[
  {t:'q',l:'躲進旁邊的客房',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你從門縫看著兩雙靴子走過去，停在電梯前面。他們把一個袋子放進電梯，按了往下的鈕。`},ng:{t:`門板在你身後輕輕響了一聲。腳步聲停了。`,p:{fear:4},fight:{n:2,mode:'ambush',names:['A.C.R.U. 隊員','A.C.R.U. 隊員']}}},
  {t:'q',l:'先下手為強',ok:{t:`你沒有等他們走近。`,fight:{n:2,mode:'first',names:['A.C.R.U. 隊員','A.C.R.U. 隊員']}}}]}
);
// 旅館大廳：知道入口之後可以下到地下室那扇門
{const y=N.Y0;const o=y.onEnter;y.onEnter=function(){if(o)o.call(this);const F=G.flags;F.knowlab=F.opslog||F.labhint||F.fzhint?1:0};
 y.c.splice(y.c.findIndex(c=>c.l==='回街區'),0,{t:'q',l:'下到地下室那扇鐵門',need:'knowlab',ok:{t:`你們穿過廚房後面的員工樓梯，一路往下。空氣越來越悶，越來越甜。`,go:'Y2'}})}
Object.assign(N,{
Y2:{L:'Y',n:'旅館・地下室鐵門',
 onEnter(){const F=G.flags;F.labguard=F.acru&&!F.ylabclr?1:0;F.labopen=F.labcard&&F.citypower&&F.citywater&&!F.labguard?1:0},
 tx:()=>{const F=G.flags;if(F.labguard)return '兩個穿黑色制服的人守在鐵門前，槍口朝下，一直沒有離開。';
  if(!F.citypower)return '讀卡機的小螢幕一閃一閃：「維生系統供電不足　請洽設施管理」。地下室發電機的電，撐不起門後面的東西。';
  if(!F.citywater)return '讀卡機的小螢幕亮著：「維生系統供水壓力不足　閘門鎖定」。';
  if(!F.labcard)return '讀卡機的小螢幕亮著：「S 區　請感應授權卡」。';
  return '讀卡機的小螢幕亮著綠色的字：「S 區　維生系統正常　請感應授權卡」。'},
 t:`地下設備層的盡頭，那扇厚重的鐵門還在。門框上的標記沒有被刮掉：一根杖，杖上纏著一條蛇，杖頭被畫成了針頭的形狀。\n\n強化玻璃窗後面，是一道往下的白色樓梯。`,
 c:[
  {t:'q',l:'對付守在門口的人',need:'labguard',ok:{t:`你們從管線後面衝出去。`,fight:{n:2,mode:'first',names:['A.C.R.U. 隊員','A.C.R.U. 隊員']},win:{r:{flag:'ylabclr'}},go:'Y2'}},
  {l:'感應 S 區門禁卡',need:'labopen',t:'q',ok:{t:`讀卡機「嗶」了一聲。鐵門裡傳來一連串沉重的機械聲，像是好幾道鎖同時退開。門往內滑開，一股冰冷、乾淨、帶著消毒水味道的空氣湧了出來。\n\n樓梯底下，一盞一盞白色的燈依序亮起來。\n\n你突然想到：這些燈、這些空氣、門後面維生系統裡的每一滴水，都是你們親手讓它重新運轉的。`,go:'SA0'}},
  {t:'q',l:'回大廳',ok:{t:`你們順著員工樓梯往上爬。`,go:'Y0'}}]},
/* ---------- S1 除汙閘門 ---------- */
SA0:{L:'SA',n:'S1・除汙閘門',
 t:`樓梯底下是一道氣閘。兩扇玻璃門之間的小空間裡，天花板和牆上全是噴頭。牆上的螢幕亮著：「進入 S 區前，請完成除汙程序」。\n\n喇叭裡傳來一個很平靜的女聲，像是錄音：「第二期受試者，請在房內等候。第二期受試者，請在房內等候。」`,
 c:[
  {l:'照指示除汙',t:'m',ok:{t:`你們站進氣閘。噴頭先是噴出霧狀的藥水，接著是熱水，最後是一陣很強的風。皮膚刺刺的，喉嚨裡一直黏著的那股甜味，好像淡了一點。`,go:'SA0d'}},
  {t:'q',l:'不除汙，直接推開另一扇門',ok:{t:`你們用力推開內側的玻璃門。整條走廊的燈變成紅色，警報響了三聲，又停了。`,p:{alarm:3},go:'SA1'}},
  {t:'mv',l:'回旅館地下室',ok:{t:`你們爬上白色的樓梯。`,go:'Y2'}}]},
SA0d:{L:'SA',n:'S1・除汙閘門',
 onEnter(){for(const p of able()){const b=p.inf;addInf(p,-10);if(p.inf<b)out(`${MP()?nm(p)+'：':''}感染 −${b-p.inf}。`,'good',true)}},
 t:`內側的玻璃門滑開了。`,
 c:[{t:'q',l:'走進去',ok:{t:`你們踩著白色的地板往前走。`,go:'SA1'}}]},
SA1:{L:'SA',n:'S1・警衛室',
 tx:()=>G.flags.trRoster?'':'警衛室的監視螢幕還亮著，一格一格切換著下面幾層的畫面。收容層的某一格裡，有東西一直在撞玻璃。',
 t:`走廊旁邊是一間玻璃隔間的警衛室。桌上攤著一本登記簿，牆上貼著排班表，一張椅子倒在地上，椅背上掛著一件保全的外套。\n\n走廊的另一頭是貨梯，按鈕旁邊寫著「S2　研究層」「S3　收容層」「S4　核心（需二級授權）」。`,
 c:[
  {l:'看受試者名冊',hide:'trRoster',t:'m',ok:{t:`登記簿的第一頁寫著「第二期　持續共生計畫　受試者名冊」。\n\nB-117、B-118、B-121……每一個編號旁邊都有一個名字、一個「安置地點」，和一個「轉出日期」。安置地點全是同一個地址：那間旅館，303、305、306。B-118 的轉出日期是三天前。\n\n名冊的最後一頁只有一行，用紅筆框起來：\n\n「Z-0　雷摩斯・凱德中士　陸軍　第二期首例　狀態：核心收容　（禁止接觸）」\n\n<b>你又拼上了一塊真相。</b>`,r:{flag:'trRoster'},p:{fear:6},stay:1}},
  {t:'q',l:'看名冊最後一頁',job:'liao',need:'trRoster',once:1,stay:1,ok:{t:`雷摩斯・凱德中士。\n\n你在部隊裡叫了他三年的「中士」。那次在海外，直升機把他抬走的時候，他的一條手臂已經不見了，臉上全是燒傷。後來部隊說他轉到國內的醫院，再後來，所有紀錄上都沒有這個人了。\n\n你一個人查了這麼久，最後查到的是這一行紅字。\n\n「核心收容。」`,p:{fear:10}}},
  {t:'q',l:'看安置紀錄',job:'maggie',once:1,stay:1,ok:{t:`安置紀錄上，每一位受試者轉出旅館的那一天，都登記成「回診」，旁邊附著一張受試者簽過名的同意書影本。\n\n你看得出問題在哪裡。同意書上寫的是「定期回診追蹤」，可是紀錄上的目的地欄寫的是「S3」。那不是回診，那是收容。\n\n這不是醫療疏失。這是有人明知道，還一路簽了下去。你把紀錄摺好，收進外套內側。`,r:{flag:'mgDoc'}}},
  {l:'翻警衛的置物櫃',once:1,stay:1,t:'m',ok:{t:`置物櫃裡有一盒子彈、一包急救敷料包，還有一張全家福，背面寫著「下班記得買牛奶」。`,r:{items:{ammo9:8,med:1,sbandage:1}}}},
  {t:'mv',l:'搭貨梯下研究層',ok:{t:`貨梯的門關上，往下降了很久。`,go:'SB0'}},
  {t:'q',l:'回除汙閘門',ok:{t:`你們往回走。`,go:'SA0'}}]},
/* ---------- S2 研究層 ---------- */
SB0:{L:'SB',n:'S2・研究層走廊',
 onEnter(){const F=G.flags;F.sbok=F.sbclr?1:0},
 tx:()=>G.flags.sbclr?'':'走廊中段有兩個穿白袍的人背對著你們，一個在用頭撞一扇門，一個蹲在地上，手裡抓著一疊紙在撕。',
 t:`研究層的走廊很長，兩邊是一間一間的玻璃實驗室。有些玻璃上濺著東西，乾掉了，變成褐色。\n\n指標牌寫著：實驗室、主任辦公室、會議室，以及往下的「S3　收容層」。`,
 c:[
  {t:'q',l:'處理那兩個穿白袍的',hide:'sbok',ok:{t:`你們貼著牆過去。`,fight:{n:2,mode:'first',names:['穿白袍的感染者','穿白袍的感染者']},win:{r:{flag:'sbclr'}},go:'SB0'}},
  {t:'q',l:'從另一側的實驗室穿過去',hide:'sbok',k:'AGI',d:13,s:'敏捷檢定',ok:{t:`你們從一間沒鎖的實驗室穿過去，再從另一扇門出來，已經在他們身後了。`,r:{flag:['sbclr','sbok']},stay:1},ng:{t:`你的手肘碰倒了一個玻璃瓶。兩個白袍同時轉過頭來。`,fight:{n:2,mode:'ambush',names:['穿白袍的感染者','穿白袍的感染者']},win:{r:{flag:'sbclr'}},go:'SB0'}},
  {t:'q',l:'進實驗室',need:'sbok',ok:{t:`你們推開實驗室的玻璃門。`,go:'SB1'}},
  {t:'q',l:'進主任辦公室',need:'sbok',ok:{t:`主任辦公室在走廊盡頭，門上的名牌被人撬走了。`,go:'SB2'}},
  {t:'q',l:'進會議室',need:'sbok',ok:{t:`你們推開會議室的門。`,go:'SB3'}},
  {t:'mv',l:'下到收容層',need:'sbok',ok:{t:`樓梯間的燈是紅色的。越往下，牆後面的聲音越多。`,go:'SC0'}},
  {t:'mv',l:'搭貨梯回 S1',ok:{t:`貨梯慢慢往上升。`,go:'SA1'}}]},
SB1:{L:'SB',n:'S2・實驗室',
 t:`實驗室中間有一個玻璃罩，罩子裡是一株植物：灰綠色的葉子，莖上長著一圈一圈的節，切口的地方像是在癒合。牌子上寫著「原始宿主　EDEN 共生株」。\n\n牆邊排著一列培養槽，大部分是空的。最後一個裡面泡著一團東西，形狀像人的手臂，表面爬滿細細的紅色組織，像一層血管，泡在液體裡還在一下一下地鼓。`,
 c:[
  {t:'q',l:'看那些培養槽',once:1,stay:1,k:'PER',d:12,s:'感知檢定',ok:{t:`最後一個培養槽的標籤寫著「Z-0　左上肢　組織再生觀察　第 214 日」。手臂的手指還在慢慢地一張一合。\n\n培養槽底下的冷藏櫃裡有幾盒藥，標籤是英文縮寫，其中兩盒你認得：抗生素。`,r:{items:{antibiotic:2,sedative:1}},p:{fear:8}},ng:{t:`你湊近玻璃的時候，培養槽裡的東西撞了上來。玻璃裂了。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['培養槽裡的東西']}}},
  {t:'q',l:'看那株植物',once:1,stay:1,ok:{t:`你看了很久。它看起來就只是一株植物。安靜、普通，在恆溫的玻璃罩裡慢慢地長。\n\n整座城市的事，都是從這裡開始的。`,p:{fear:4}}},
  {t:'q',l:'回走廊',ok:{t:`你們退回走廊。`,go:'SB0'}}]},
SB2:{L:'SB',n:'S2・主任辦公室',
 t:`主任辦公室很整齊，整齊到不像是出事的地方。書架上的資料夾一本本排好，桌上有一台還亮著的電腦，螢幕停在一個影像紀錄的播放視窗。牆上掛著一張照片：一排穿軍服的人，站在一架直升機前面。`,
 c:[
  {l:'讀第二期報告',hide:'trReport',t:'m',ok:{t:`報告的標題是「持續共生計畫　第二期總結（內部）」。\n\n第一期的療法是真的：重度燒傷、肌肉缺損、原本要截肢的人，都被救回來了。第二期想做的是讓 EDEN 留在人體裡，受傷的時候自己修。最大的問題是人體會把它清掉，所以他們一次一次修改它，讓免疫系統認不出它。\n\n他們成功了。Z-0 的傷，在三個月內幾乎全部長了回來。\n\n報告的最後一頁，有人用原子筆在空白處寫了一行字，筆跡很用力：\n\n「它不知道什麼時候該停。」\n\n<b>你又拼上了一塊真相。</b>`,r:{flag:'trReport'},p:{fear:8},stay:1}},
  {t:'q',l:'看電腦上的影像紀錄',once:1,stay:1,ok:{t:`影片裡是一個穿白袍的中年女人，坐在這張桌子前面，看起來很累。\n\n「第 214 日。Z-0 的組織重塑沒有停止的跡象。他昨天問我，什麼時候可以回家。」她停了很久，「我不知道該怎麼回答他。」\n\n影片跳到下一段。日期是封城前一週。她的眼睛紅紅的。\n\n「水平傳播已經確認。我們把他接上了全套維生，降溫、斷食、讓他睡著。只要電和水不停，他就會一直睡。」她看著鏡頭，「如果你看到這段影片，代表電和水停過了。」`,p:{fear:10}}},
  {t:'q',l:'看牆上的照片',job:'liao',once:1,stay:1,ok:{t:`是你們的小隊。\n\n直升機前面站著九個人，你站在最左邊，那時候還很年輕。中間那個咧著嘴笑、手臂搭在別人肩上的，是中士。\n\n照片的右下角，有人用麥克筆寫了一個編號：Z-0。`,p:{fear:8}}},
  {t:'q',l:'翻抽屜裡的文件',job:'maggie',once:1,stay:1,ok:{t:`抽屜裡是一疊公文，往來的單位是 ARC、國防部，還有一個你沒聽過的「生物安全應變單位」。\n\n你一份一份看下去。風險評估報告上寫得清清楚楚：「水平傳播可能性：不可排除」。簽核欄上，每一個名字都簽了。\n\n這些人全都知道。你把最上面那幾份抽出來，和那張排班表收在一起。`,r:{flag:'mgDoc2'}}},
  {t:'q',l:'回走廊',ok:{t:`你們退回走廊。`,go:'SB0'}}]},
SB3:{L:'SB',n:'S2・會議室',
 t:`會議室的投影幕上還停著一張簡報：「EDEN 第一期　臨床成果」。一張張病人的照片，治療前和治療後。燒傷的皮膚長回來了，斷掉的神經接上了。最後一張是一群病人和醫生的合照，每個人都在笑。\n\n長桌上散著幾杯冷掉的咖啡。`,
 c:[
  {l:'翻桌上的資料',once:1,stay:1,t:'m',ok:{t:`一份會議紀錄：「第二期擴大執行案　出席：ARC、國防部、市衛生局　決議：通過。附帶決議：設立應變單位（A.C.R.U.），處理最壞情況。」\n\n最壞情況這幾個字底下，有人畫了兩條線。\n\n桌子底下有兩罐沒開過的咖啡。`,r:{items:{coffee:2}},p:{fear:4}}},
  {t:'q',l:'回走廊',ok:{t:`你們退回走廊。`,go:'SB0'}}]},
/* ---------- S3 收容層 ---------- */
SC0:{L:'SC',n:'S3・收容層',
 t:`收容層是一條環形的走廊，內側是一間一間的收容室，每一扇門上都有一扇觀察窗和一個編號。大部分的窗後面是暗的。有幾扇窗後面有東西在動。\n\n走廊的最裡面，是一扇比所有門都厚的門，門上寫著「S4　核心」。`,
 c:[
  {t:'q',l:'B-118：有人在敲窗戶的那間',ok:{t:`觀察窗後面，一個穿病號服的男人看著你們，用指節輕輕敲著玻璃。他的眼睛是清楚的。`,go:'SC1'}},
  {t:'q',l:'B-121：一直在撞門的那間',ok:{t:`那扇門每隔幾秒就震一下。門上的觀察窗已經裂成蜘蛛網了。`,go:'SC2'}},
  {t:'q',l:'走到核心的門前',ok:{t:`你們沿著環形走廊走到最裡面。越靠近，空氣越暖，像是門後面有什麼東西在呼吸。`,go:'SC3'}},
  {t:'mv',l:'回研究層',ok:{t:`你們爬上紅色的樓梯間。`,go:'SB0'}}]},
SC1:{L:'SC',n:'S3・B-118',
 tx:()=>G.flags.b118?(G.flags.b118===1?'B-118 的門開著，裡面沒有人了。':'B-118 的收容室裡很安靜。'):'',
 t:`「你們不是他們的人。」男人隔著對講機說，聲音很沙啞，「他們的人不會這樣看我。」\n\n「我住過那間旅館的 305。每天晚上都有穿看護制服的人來幫我量體溫。三天前，他們說要帶我去回診。後來就不讓我回去了。」他捲起袖子。手臂上的皮膚底下，有一束一束灰白色的東西在慢慢地動。\n\n「我還是我。暫時。」他看著你們，「隔壁那個中士，他們說他是第一個。晚上安靜的時候，我聽得到他在牆後面呼吸。電停的那幾天，他沒有聲音。電回來之後……他醒了。」`,
 c:[
  {t:'q',l:'打開門，放他出去',hide:'b118',ok:{t:`你找到控制面板，打開了 B-118。他走出來，在走廊上站了很久，像是不記得要怎麼走路。\n\n「謝謝。」他說，「我會往上走。走到我走不動為止。」他沒有回頭。`,r:{karma:1,flag:'b118'},stay:1}},
  {t:'q',l:'他求你們：「在我變成那樣之前」',hide:'b118',ok:{t:`他把手貼在玻璃上，你們隔著玻璃看著他。過了很久，你打開了給藥口，把鎮定劑放進去。\n\n他點點頭，坐回床上，捲起袖子。\n\n你們沒有留下來看。`,r:{flag:'b118'},p:{fear:10},stay:1}},
  {t:'q',l:'離開',ok:{t:`他看著你們走開，手一直貼在玻璃上。`,go:'SC0'}}]},
SC2:{L:'SC',n:'S3・B-121',
 tx:()=>G.flags.b121?'B-121 的門破了，裡面只剩一攤紅色的組織和血。':'',
 t:`B-121 的觀察窗後面，是一個比門還寬的身影。牠每撞一次，門框就往外凸一點。門旁的面板上寫著：「B-121　組織重塑第三期　禁止開啟」。`,
 c:[
  {t:'q',l:'趁門還撐著，先動手',hide:'b121',ok:{t:`門在你們面前炸開了。`,fight:{n:2,mode:'normal',names:['收容室裡的大個子','穿病號服的感染者']},win:{r:{flag:'b121'},t:'牠倒下去的時候，你看到牠的手腕上還戴著旅館的住客手環。306。'},go:'SC2'}},
  {t:'q',l:'離開這扇門',ok:{t:`撞門聲一直跟著你們走回環形走廊。`,go:'SC0'}}]},
SC3:{L:'SC',n:'S3・核心之門',
 t:`「S4　核心」的門有兩個人那麼高，門縫裡長出了鮮紅色的東西，一條一條像血管，把門框撐死了。它們在一下一下地搏動，跟著門後某個很慢、很深的呼吸。\n\n門旁的面板亮著：「Z-0　維生系統：運轉中　供電：正常　供水：正常　鎮靜劑注入：中斷」。\n\n<b>門後面的路，這一版還沒有開放。</b>`,
 c:[
  {t:'q',l:'把手貼在門上',once:1,stay:1,ok:{t:`門是溫的。手掌底下，那個呼吸停了一下。\n\n然後，從門的另一邊，傳來一聲很輕的敲擊。`,p:{fear:12}}},
  {t:'q',l:'回環形走廊',ok:{t:`你們離開那扇門。身後那些紅色的東西又開始搏動了。`,go:'SC0'}}]}
});
/* ================= v0.24.0 地圖重構：區域＋點位（zerocase/PROPOSAL_MAP.md） =================
   一個 LV（樓層、區塊）＝一個區域。第一次走進區域時照原本的劇情一路走（被撞門、走廊遇敵都照留），
   走到 join 節點（原本的「房間清單」「出口」節點）就換成區域畫面 hub：之後所有點位都能自己選，每個動作花時間、會出聲。
   d：深度 0 外圍／1 內部／2 深處／3 最深處（深度 2 以上，會出聲的動作警戒多 1）。
   rooms：可以重回的房間（選過的選項標成「已搜過」，不會消失）。join 節點的選項自動變成點位：去房間、就地搜尋、出口。
   ex：其他節點裡要放到 hub 的出口。bk：回到已經去過的區域（還沒去過的不顯示）。
   opens：用工具打通的出口（成功後立旗標，之後直接走）；each：靠檢定硬過的出口（每次都要檢定，工具打通後收起來）。
   lock：條件不夠時不藏起來，變灰、點了播鎖門聲並寫明缺什麼（nomemo：已有備忘錄的就不重複記）。door：點了播鎖門聲。 */
N.A2.pace='sudden';N.F2.pace='sudden';
// v0.39.0 旅館改成單向路線（下面的 ROUTE），區域畫面停用；ZONES 留空，舊的區域程式碼都不會動作

   每個地點是一串卡：seq 是卡的先後，走完一張自動接下一張；最後一張是分岔（出口），已經走過的地點不會再出現在出口。
   search：搜索點 {節點:[房間]}。房間看完回到搜索點；次數＝max(2,人數)，選過的整個消失，用完或選「不再找了」就往前。
   lock：條件不夠時不藏起來，變灰、點了說明缺什麼。節點的 cond：旗標條件，不符合就跳過這張卡（例：凱文死了才會在坡道遇到他）。
   d：深度（警戒用，同原本的區域）。其他地圖之後照這個格式加。 */

裡面的架子上堆滿了雨傘、背包和安全帽，每一件都綁著一張寫了日期的標籤。最新的那張，日期是前天。`,
 c:[
  {t:'sd',l:'翻架子上的背包',ok:{t:`大部分背包裡只有衣服和課本。有一個背包的側袋裡塞著一瓶水和兩卷繃帶。`,r:{items:{water:1,bandage:2}}}},
  {t:'sd',l:'搜站務員的置物櫃',k:'PER',d:11,dark:1,ok:{t:`置物櫃裡掛著一件反光背心，下面放著一支手電筒和一包電池。`,r:{items:{flashlight:1,battery:2}}},ng:{t:`太暗了。你的手摸到置物櫃最下層的時候，有東西咬住了你的手指。是一隻老鼠，眼睛是白的。`,p:{inf:3,fear:4}}},
  {t:'sd',l:'翻失物招領的抽屜',ok:{t:`抽屜裡是一堆鑰匙、耳機和錢包。有幾個錢包裡的現金還在。`,r:{items:{coin:1},usd:8}}}]},
V1s:{L:'V',n:'熱狗餐車',
 t:`路口的轉角停著一台熱狗餐車，遮陽傘倒在地上，餐車的門開著。

餐車旁邊有一排報紙販賣箱，其中一個的玻璃門被砸破了。`,
 c:[
  {t:'sd',l:'翻餐車的小冰箱',ok:{t:`香腸都壞了。冰箱最裡面還有兩瓶可樂和一瓶礦泉水。`,r:{items:{cola:2,water:1}}}},
  {t:'sd',l:'搜餐車的工具抽屜',ok:{t:`抽屜裡有一個打火機、一捲膠帶，還有老闆拿來修遮陽傘的一截鐵衣架。`,r:{items:{lighter:1,tape:1,hanger:1}}}},
  {t:'sd',l:'翻報紙販賣箱',ok:{t:`被砸破的那個箱子裡，零錢盒還在。箱子裡的報紙頭版寫著：「市府：封鎖只是暫時的」。`,r:{items:{coin:1,magazine:1},usd:3}}}]}
});

/* ================= v0.57.0 旅館四層（PROPOSAL_HOTEL，主人 2026-11-23 定案；文本由 Claude 寫） =================
   照醫院的深地圖標準整理成四層，每層一條符合現實的規則、照一般路線至少 15 次選擇：
   第一層 三樓客房「門」（A）→ 第二層 二樓宴會廳「窗」（B）→ 第三層 一樓後場「瓦斯」（E，舊的廚房 F、洗衣房 H 併進來）
   → 大廳（I）出去；或往下走第四層 地下「車」（G，舊的停車場 P 併進來，整層是污染區）。
   捷徑：電梯井 C（三樓直接到地下）、消防梯 D（三樓窗戶→二樓或後巷）、頂樓 R。捷徑短、危險，會跳過中間的樓層。
   門：房卡鎖靠電池，停電照樣鎖；感染者不會轉門把，只會撞。窗：街上的警察對窗戶裡會動、會發光的東西開槍（QTE）。
   瓦斯：第三層開槍、點火會引爆（gasZone，engine_c）；扳掉總閥（gasoff）就解除。
   車：碰車、照車窗會讓警報響；整層是污染區（fx.toxic），發電機開了、再打開排風機（fanon）才散得掉。
   前面的選擇改變後面：看過窗外（sawwin）二樓有提示；310 的老夫妻（elders／elderstay／elderleft）；
   二樓窗邊的伴郎（winsaved／winbait，不扣善惡值：叫他關燈是他自己不聽）；善惡值（主人 18:23）：帶走 310 +1、不理 −1；
   窗的邏輯（主人 18:09）：感染者大部分還是人的樣子，封鎖線分不出誰是活人，被看見的人影就挨子彈；窗戶和手電筒只是讓你被看見；一樓炸過（hboom）、窗戶被打破（winbait）、發電機的燈（power）都會讓大廳多一隻。
   新選項一律加在最後（選項的「做過了」紀錄是用索引記的）。 */
Object.assign(LV.A,{sub:'客房',rule:'走廊上每一扇門都是關著的。旅館的門會自己關上、自己鎖好——停電了也一樣。'});
Object.assign(LV.B,{sub:'宴會廳',rule:'宴會廳和走廊有一整排落地窗對著大街。街上的探照燈一下一下掃進來，窗外不時有槍聲。封鎖線上的人分不出誰是活人，被他們看見的人影，就會挨子彈。'});
Object.assign(LV.E,{sub:'後場',rule:'一樓聞得到很重的瓦斯味，越往廚房那頭越重。這種地方，一點火星就夠了。整層一片漆黑：沒有裝手電筒且沒有夜貓子天賦時，有效感知 −2；離開黑暗或取得照明後恢復。'});
Object.assign(LV.G,{n:'地下',sub:'設備層・停車場',rule:'地下沒有風。通風扇停了，空氣是悶的，帶著一股甜味。停車場的車一台挨著一台，有一台的方向燈還在一閃一閃。停車場一片漆黑：沒有裝手電筒且沒有夜貓子天賦時，有效感知 −2。',

/* ---------- 第一層 三樓客房「門」 ---------- */
A3c:{L:'A',n:'三樓走廊・房務推車',
 t:`走廊中段停著一台房務推車，車上疊著毛巾和一小瓶一小瓶的洗髮精，最上層夾著一本房務單。推車的把手上掛著一張識別證，房務員的名字是伊蓮娜。

推車旁邊那扇門是 307，門把上掛著「請打掃」的牌子。你推了一下，門紋風不動。

每一扇門都一樣。門把轉不動，門鎖上的小燈是紅色的。停電了，鎖還在。`,
 c:[
  {t:'q',l:'拿推車把手上的萬用房卡',once:1,stay:1,ok:{t:`識別證後面套著一張白色的房卡，背面印著「HOUSEKEEPING　ALL」。你拿它去碰 307 的門鎖，小燈從紅色跳成綠色，喀的一聲。

門鎖靠電池，停電照樣會開、照樣會鎖。你把房卡收進口袋。`,r:{flag:'mkey'}}},
  {t:'sd',l:'翻推車上的備品',stay:1,ok:{t:`你抽了兩條乾淨的毛巾、一小瓶礦泉水，還有伊蓮娜放在推車最底層的一卷膠帶。`,r:{items:{cloth:2,water:1,tape:1}}}},
  {t:'q',l:'看房務單',once:1,stay:1,ok:{t:`房務單是今天的。每一間房後面都打了勾，只有幾間另外寫了字：

303、305、306：「門診包房，不打掃，不要敲門」。
309：「續住」。
310：「續住，哈蒙先生、太太，加床欄。太太說晚上會自己鎖門」。

最底下一行是伊蓮娜的字，寫得很急：「303 一直在撞門，我不進去了。」`,r:{flag:'hkroster'}}},
  {t:'mv',l:'往前走',ok:{t:`你離開推車，沿著牆往前走。`}}]},
A4d:{L:'A',n:'三樓走廊・303',
 t:`303 的門把上掛著「請勿打擾」的牌子。

門從裡面被撞了一下。停一下，又一下。力氣不大，很固定，像有人一直用肩膀去頂一扇推不開的門。門鎖上的小燈是紅色的。

門底下有一道縫，透出一點手機螢幕的白光。`,
 c:[
  {t:'q',l:'用萬用房卡開門',need:'mkey',ok:{t:`你把房卡貼上門鎖。綠燈一亮，裡面的撞擊聲就停了。

你推開門。一個穿著住客浴袍的男人站在門後，手腕上戴著一圈白色的塑膠手環。他的額頭在門板上撞破了，血順著鼻樑流下來。他看著你，慢慢張開嘴。`,fight:{n:1,mode:'first',names:['303 的住客']},win:{t:`房間裡很整齊。床頭櫃上排著一排藥瓶，每一瓶都貼著同樣的標籤：「ARC 合作門診　追蹤觀察用藥　每日兩次」。手機還亮著，停在一則簡訊：「發燒是正常反應，請在房內等候，看護會去找您。」

他手腕上的手環印著「ARC-303」和一串條碼。床頭櫃的抽屜裡有一板止痛藥，和一小瓶貼著同一個門診標籤的鎮定劑。`,r:{flag:'arc303',items:{painkiller:1,sedative:1}}}}},
  {t:'q',l:'趴下來，從門縫底下看',k:'PER',d:12,s:'感知檢定',ok:{t:`你趴在地毯上，從門縫往裡看。手機掉在地上，螢幕朝上，光照著一雙光腳，腳踝上有一圈抓破的傷口。床頭櫃上排著一排一模一樣的藥瓶。

那雙腳往後退了一步，又往前一撞。門震了一下。它不會開門，只會撞。`,r:{flag:'arc303look'},p:{fear:4}},ng:{t:`你剛把臉貼近門縫，撞擊聲就停了。門縫裡的光被什麼東西擋住，一根手指從門底下伸出來，指甲在地毯上刮了一下。

你往後彈開。撞擊聲又開始了，比剛才更急。`,p:{fear:8,alarm:1}}},
  {t:'q',l:'不理它，繼續走',ok:{t:`你從 303 門口走過去。撞擊聲跟著你，一下，一下。整條走廊都聽得到。`,p:{alarm:1}}}]},
A4e:{L:'A',n:'三樓走廊・307～310',
 t:`走廊這一段更暗，緊急照明壞了一盞。307 到 310 四扇門排成一排，都關著。

308 的門後面有聲音，像有人在吃東西，嚼得很慢。309 的門牌底下貼著一張「續住」的小卡。310 的門縫底下塞了一條毛巾，是從裡面塞的。`,
 c:[
  {t:'q',l:'貼著門一扇一扇聽',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`307 沒有聲音。308 裡面的東西在地上拖著什麼，嚼一下，停一下。309 沒有聲音。

310 的門後面有兩個人在小聲說話，一男一女，年紀都不小了。女的一直在說：「不要出聲，華特，不要出聲。」`,r:{flag:'h310'}},ng:{t:`你貼上 308 的門，裡面的聲音突然停了。你退開，等了很久，它才又開始嚼。`,p:{fear:4}}},
  {t:'qh',kind:'躲藏',l:'用萬用房卡進 309，關上門等一陣子',need:'mkey',quiet:1,stay:1,ok:{t:`309 沒有人。行李箱攤在床上，衣服摺到一半。你把門帶上，門鎖喀一聲鎖好。

走廊上有東西拖著腳經過，在門外停了一下，撞了一下門，又走了。門擋住了。`}},
  {t:'mv',l:'往前走',ok:{t:`你離開那一排門，往走廊盡頭走。`}}]},
A4f:{L:'A',n:'三樓走廊・310',
 t:`310 的門後面有人在敲，很輕，兩下。一個老太太的聲音隔著門板傳出來：「外面的……是人嗎？」

「我先生的腿不好，走不快。」她說，「我們聽到槍聲就把門鎖上了。櫃台的電話一直沒人接。外面……外面是不是很糟？」

門縫底下的毛巾動了一下。`,
 c:[
  {t:'m',l:'叫他們開門，帶他們一起走',ok:{t:`門開了。瓊・哈蒙穿好了外套，已經把兩個人的護照和藥袋都裝進手提包。她先生華特拄著一根拐杖，臉色發灰，可是自己站得起來。

「謝謝你。」他說，「我年輕的時候也在旅館做過，在芝加哥。」他走得很慢，拐杖每點一下地毯，就悶悶地響一聲。`,r:{flag:'elders',karma:1},p:{alarm:1}}},
  {t:'q',l:'叫他們把門鎖好，不要出來',ok:{t:`「不管聽到什麼都不要開門。」你說，「那些東西不會轉門把。等天亮，等有人來。」

門後面安靜了一下。「好。」瓊說，「你也小心。」毛巾被塞得更緊了。`,r:{flag:'elderstay'}}},
  {t:'q',l:'不出聲，從門口走過去',ok:{t:`你沒有回答。門後面又敲了兩下，比剛才更輕。

「……有人嗎？」

你走過去了。`,r:{flag:'elderleft',karma:-1},p:{fear:6}}}]},
A6b:{L:'A',n:'三樓走廊・盡頭的窗戶',
 t:`走廊盡頭有一扇窗，窗簾拉著一半。探照燈的白光每隔一陣子就從窗簾縫掃進來，在天花板上畫過一條線。

窗台下面的牆上有一個緊急手電筒的充電座，手電筒不見了，座子上的燈還亮著一點點綠色。`,
 c:[
  {t:'q',l:'從窗簾縫看街上',once:1,stay:1,ok:{get t(){return (G.flags.sawstreet?'警車還在街口，':'街口停著幾台警車，')+`警察躲在車門後面。對面那棟辦公大樓的五樓有一扇窗亮著手電筒的光，有人在窗邊揮手。

街上有人喊了一聲。槍響了兩下，那扇窗的玻璃整片碎掉，光不見了。

警車的無線電開得很大聲，斷斷續續傳上來：「……剛才那個揮手的也是，走到封鎖線前面才撲上來……麥克的手被咬了……上面說了，封鎖區裡看到人影就打，不要再讓任何人靠近……」

探照燈慢慢轉過來，從這一排窗戶上掃過去。你把窗簾放下。在那些人眼裡，分不出誰是活人。只要被看見，就是要攔下來的東西。`},r:{flag:'sawwin'},p:{fear:6}}},
  {t:'sd',l:'拆開充電座的蓋子',stay:1,ok:{t:`蓋子用指甲就扳得開。裡面是兩顆備用的三號電池，還有電。`,r:{items:{battery:2}}}},
  {t:'q',l:'把通風窗推開一條縫，聽外面',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`冷風灌進來。底下的擴音器在重複同一段話，聲音被風吹得一截一截的：「……所有住戶……留在室內……熄燈……不要讓人看見你……不要對外發出信號……」

然後是另一個沒拿擴音器的聲音：「二樓那幾扇也盯著，有東西在裡面爬。」`,r:{flag:'sawwin'}},ng:{t:`風太大，擴音器的聲音被吹散了。你只聽得出那是在重複同一段話。`}},
  {t:'mv',l:'往前走',ok:{t:`你放下窗簾，往樓梯那邊走。`}}]},
/* ---------- 第二層 二樓宴會廳「窗」 ---------- */
B1w:{L:'B',n:'二樓走廊・窗邊',
 t:`這一段走廊的外牆是一整排落地窗，對著大街，窗簾大多沒拉。探照燈從街上掃進來，白光一格一格爬過地毯，爬過那具保全的腳，再爬上對面的牆。

窗玻璃上有三個彈孔，裂紋像蜘蛛網一樣散開。地上的彈殼不全是保全的，有些是從外面打進來的。

要往前走，得從這排窗戶前面過去。`,
 c:[
  {t:'q',l:'趴低，從窗台底下爬過去',k:'AGI',d:11,bonusFlag:'sawwin',s:'敏捷檢定',ok:{t:`你趴下來，手肘貼著地毯，一格一格往前爬。探照燈的光從你頭頂上掃過去兩次，你一直等光走了才動。`},ng:{t:`爬到一半，你的背包撞到了窗框。探照燈停在這一格。`,qte:{t:'白光停在你身上，街上有人喊了一聲——',w:['趴下','翻滾','護頭','爬開'],ok:{t:'你整個人貼平，滾到窗台底下。子彈打在你頭頂的窗框上，碎玻璃落了你一背。光慢慢移開了。',p:{fear:8}},ng:{t:'子彈打碎了你頭頂那片玻璃。碎片整片砸下來，你用手臂擋住臉，手臂上全是割傷。',p:{hp:-4,bleed:1,fear:10}}}}},
  {t:'m',l:'一扇一扇把窗簾拉上',ok:{t:`你貼著牆，等探照燈轉開，伸手把窗簾一扇一扇拉上。軌道很久沒上油，每拉一扇就嘎一聲。

整條走廊暗了下來。外面的人看不到裡面了，裡面的東西倒是都聽到了。`,p:{alarm:2}}},
  {t:'q',l:'看準探照燈轉開的空檔，直接走過去',sign:{t:'探照燈每轉一圈，會在這一排窗戶折回來一次。',dc:12},ok:{t:`你數著燈轉一圈要多久，等它掃過去，站起來就走。`,qte:{t:'走到一半，探照燈突然折回來——',w:['趴下','衝刺','閃避','翻滾'],ok:{t:'你往前一撲，滾進兩扇窗戶中間那段牆的陰影裡。街上沒有開槍。',p:{fear:5}},ng:{t:'槍響了。子彈從你身邊的玻璃穿進來，打在對面的牆上，石膏粉噴了你一臉。你摔倒在地上，膝蓋撞上一顆彈殼。',p:{hp:-3,fear:10}}}}}]},
B2p:{L:'B',n:'二樓・保全室',
 t:`走廊轉角有一扇沒有門牌的門，門開著。裡面是保全室：一張桌子、一張轉椅、一排監視器。

大部分的螢幕是黑的，只有最左邊那台還亮著。桌子底下的不斷電系統一直在嗶嗶叫，電量燈閃著紅色。`,
 c:[
  {t:'q',l:'看還亮著的那台監視器',once:1,stay:1,ok:{t:`畫面切成四格，一格一格輪流換。

大廳：落地窗破了一個大洞，櫃台前面跪著一個人，沙發那邊還有一個在打轉。
B2 停車場：太暗了，只看得到出口的綠色標示燈，和燈底下擠成一團的影子。
地下設備層：鏡頭上糊了一層東西，紅色的，一條一條，像血管貼在鏡頭上，還在一下一下地鼓。
一樓員工通道：畫面上有一層霧，角落跳著一行字「瓦斯偵測：警報」。

不斷電系統叫了最後一聲，螢幕黑了。`,r:{flag:'camseen'},p:{fear:5}}},
  {t:'sd',l:'翻保全的置物櫃',stay:1,ok:{t:`置物櫃裡掛著一件備用的制服外套，口袋裡有一包止痛藥和一卷膠帶。櫃子底下有半盒能量棒。`,r:{items:{painkiller:1,tape:1,bar:1}}}},
  {t:'q',l:'看桌上的交班簿',once:1,stay:1,k:'INT',d:10,s:'智力檢定',ok:{t:`最後一頁是今天晚上寫的：

「19:40　大廳有住客跟街上的人起衝突，報警。」
「19:55　警察到了，封路。」
「20:00　停電。發電機沒有自己啟動，通知工程部。」
「20:05　房務說 303 一直在撞門，門診的人說不用管。」

最後一行寫到一半就停了。`,r:{flag:'secbook'}},ng:{t:`字寫得太潦草，你只看得懂最後一行的時間：20:05。`}},
  {t:'mv',l:'往前走',ok:{t:`你離開保全室，把門帶上。門鎖喀一聲鎖好了。`}}]},
B2m:{L:'B',n:'二樓・楓葉廳',
 t:`宴會廳旁邊是一間小會議室，門口的立牌還立著，上面印著今天下午的活動。

會議室裡的椅子排得整整齊齊，前面有一張講桌和一台投影機。每張椅子上都放著一個藍色的資料夾。有幾張椅子上還掛著外套，主人沒有回來拿。`,
 c:[
  {t:'q',l:'看門口的立牌',once:1,stay:1,ok:{t:`「ARC 合作門診　第二期追蹤觀察　家屬說明會　14:00～16:00」

立牌底下貼著一張手寫的紙：「受試者本人請勿出席，請在房內休息。」`,r:{flag:'arcbrief0'}}},
  {t:'q',l:'翻講桌上的資料夾',once:1,stay:1,k:'INT',d:11,s:'智力檢定',ok:{t:`資料夾裡是一份給家屬的問答。

「問：受試者發燒正常嗎？　答：第二期回診後一到三天內出現發燒、食慾增加、睡眠減少，屬於預期中的反應。」
「問：可以帶受試者回家嗎？　答：追蹤觀察期間，請受試者留在指定房間，由隨行看護每日兩次巡房。」
「問：如果受試者出現攻擊行為？　答：請勿自行處理，請撥打門診專線。」

專線號碼後面，有人用原子筆寫了一行：「打了三次，沒人接。」`,r:{flag:'arcbrief'},p:{fear:4}},ng:{t:`資料夾裡的字很多，都是醫學名詞。你只看懂「追蹤觀察」和「隨行看護」幾個字。`}},
  {t:'sd',l:'翻椅子上的外套和包包',stay:1,ok:{t:`大多是錢包和鑰匙。一件外套口袋裡有一瓶喝了一半的水，一個手提袋裡有一盒蘇打餅乾和一小包止痛藥。`,r:{items:{water:1,cookie:1,painkiller:1}}}},
  {t:'mv',l:'往前走',ok:{t:`你離開會議室。`}}]},
B2w:{L:'B',n:'二樓・宴會廳的落地窗',
 t:`宴會廳最裡面那一整面落地窗前，站著一個穿西裝的年輕人，胸口別著一朵白色的胸花。他把手機的手電筒舉得高高的，對著街上一直揮。

「這裡！」他壓著聲音喊，「二樓！這裡還有人！」

街上的探照燈轉過來了，停在他身上。他整個人被照得發白，笑了一下，揮得更用力。`,
 c:[
  {t:'q',l:'衝過去把他拉下來',k:'STR',d:12,s:'力量檢定',ok:{t:`你衝過去抓住他的領子，把他整個人往下一扯，兩個人一起摔在地毯上。下一秒，槍響了，他剛才站的那片玻璃整片碎掉。

他趴在碎玻璃裡，嘴巴張著，說不出話。過了很久，他才小聲說：「他們……他們是警察啊。」

他叫奈特，是今晚婚禮的伴郎。他把手機關掉，又把外套口袋裡的手電筒掏給你：「你拿去，我不敢再開燈了。」`,r:{flag:'winsaved',items:{flashlight:1}},p:{fear:6}},ng:{t:`你抓住他的手臂，他嚇了一跳，往後一甩。探照燈的光一直停在你們兩個身上。`,qte:{t:'街上有人喊了一聲，槍口的火光一閃——',w:['撲倒','拉下','護頭','趴下'],ok:{t:'你把他一起撲倒在地上。整面玻璃在你們頭頂上碎掉，碎片像下雨一樣落下來。他還活著。他把手機關了，塞了一支手電筒給你，說不出一句話。',r:{flag:['winsaved','winbait'],items:{flashlight:1}},p:{fear:8}},ng:{t:'你撲倒的時候慢了半拍，玻璃碎片劃開了你的臉頰和肩膀。奈特倒在你旁邊一直發抖，手機摔碎了。整面窗都沒了，冷風灌進宴會廳。',r:{flag:['winsaved','winbait']},p:{hp:-4,bleed:1,fear:10}}}}},
  {t:'q',l:'叫他把燈關掉，自己從另一邊走',ok:{t:`「把燈關掉！」你壓低聲音說。他回頭看了你一眼，搖搖頭：「他們會來救我們的。」

你沿著舞台另一邊的牆走出宴會廳。走到門口的時候，身後響起兩聲槍響，然後是整片玻璃落地的聲音。

手電筒的光沒有了。`,r:{flag:'winbait'},p:{fear:8}}},
  {t:'q',l:'從後面一把搶走他的手機',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你從他背後伸手，一把搶下手機，把手電筒關掉。宴會廳一下子暗了。

「你幹什麼！」他轉過來，聲音大得整層都聽得到。探照燈在窗戶上停了很久，才慢慢移開。他瞪著你，最後還是蹲了下來。`,r:{flag:'winphone'},p:{alarm:2,fear:3}},ng:{t:`你的手剛碰到手機，他就轉過身來推你。兩個人在窗前拉扯，手機的光亂晃。`,qte:{t:'街上的槍響了——',w:['撲倒','護頭','趴下','翻滾'],ok:{t:'你拖著他一起趴下。玻璃在頭頂碎掉，手機飛出去，摔在地上滅了。',r:{flag:'winbait'},p:{fear:8}},ng:{t:'碎玻璃砸在你們兩個身上，你的手臂被劃開一道口子。手機摔在地上滅了，整面窗都沒了。',r:{flag:'winbait'},p:{hp:-4,bleed:1,fear:10}}}}}]},
B2b:{L:'B',n:'二樓・宴會廳吧台',
 tx:()=>G.flags.elders?'瓊扶著華特在一張高腳椅上坐下來。華特喘了好一陣子，拐杖一直靠在膝蓋上。':'',
 t:`宴會廳後面有一個小吧台，酒櫃的玻璃門開著，酒少了一半。冰桶裡的冰全化了，泡著幾瓶沒開的礦泉水。

吧台後面有一扇小門，通往備餐的儲藏間。門是可以從裡面鎖的那種。`,
 c:[
  {t:'sd',l:'翻吧台後面',stay:1,ok:{t:`吧台底下有一疊乾淨的吧巾、兩個空酒瓶，還有一瓶開過的威士忌。`,r:{items:{cloth:2,bottle:2,whiskey:1}}}},
  {t:'q',l:'拿冰桶裡的水',once:1,stay:1,ok:{t:`你從冰水裡撈出兩瓶礦泉水，水冰得手指發麻。`,r:{items:{water:2}}}},
  {t:'q',l:'打開酒櫃下面的櫃子',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`櫃子裡塞著吧台用的急救盒：一卷繃帶、一瓶優碘。`,r:{items:{bandage:1,iodine:1}}},ng:{t:`櫃子裡只有吸管和杯墊。`}},
  {t:'m',l:'讓瓊幫你處理傷口',need:'elders',once:1,stay:1,ok:{t:`瓊讓你坐在吧台的高腳椅上，從手提包裡拿出老花眼鏡。「我在醫院做了三十年。」她說，手很穩，「急診，夜班。」

她把你身上的傷口一處一處清乾淨、包好。華特坐在旁邊，喘得很厲害。

「我們走不動了。」瓊說，「這間儲藏間的門可以鎖。我們在這裡等天亮。你走吧。」`,r:{flag:'elderbar'},p:{hp:6,fear:-8}}},
  {t:'mv',l:'往前走',ok:{get t(){return G.flags.elders?'瓊扶著華特走進儲藏間。「我們在這裡等，」她說，「你走吧。」門在你身後鎖上了。':'你離開吧台。'}}}]},
/* ---------- 第三層 一樓後場「瓦斯」 ---------- */
E1s:{L:'E',n:'一樓・員工樓梯底',cond:'hstaff',
 t:`員工樓梯的盡頭是一扇防火門，門上的小窗結了一層霧。推開門，瓦斯味一下子重了好幾倍，嗆得你眼睛發酸。

門外是一條窄窄的員工通道，牆上貼著衛生檢查表。通道對面，一個穿廚房制服的人靠牆坐著，頭垂在膝蓋上，手裡還抓著一支湯勺。`,
 c:[
  {t:'q',l:'從他面前慢慢走過去',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你貼著另一邊的牆，一步一步走過去。湯勺在他手裡輕輕敲了一下地板，又停了。他沒有抬頭。`},ng:{t:`你的鞋底在地上的油漬滑了一下。他的頭猛地抬起來。`,p:{fear:5},fight:{n:1,mode:'ambush',names:['靠牆坐著的廚工']}}},
  {t:'q',l:'趁他沒抬頭，先動手',ok:{t:`你不想從他面前走過去，再賭他不會抬頭。`,fight:{n:1,mode:'first',names:['靠牆坐著的廚工']}}}]},
E1g:{L:'E',n:'一樓・員工通道',
 t:`員工通道沿著一樓的背面走，一邊是辦公室和備品間，另一邊是往廚房和洗衣房的門。天花板很低，管線一條一條排著。

瓦斯味在這裡最清楚。不是爐子忘了關的那種淡淡的味道，是一整片的，吸一口就頭暈。天花板上有一段管線，外面包的保溫棉裂開了。

整條通道一點光都沒有。`,
 c:[
  {t:'q',l:'循著味道找漏氣的地方',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`你一路聞過去。味道最重的地方在廚房那扇門的門縫，門底下吹出來的風是暖的，還聽得到很細的嘶嘶聲。

是廚房裡面在漏。`,r:{flag:'gassrc'}},ng:{t:`味道到處都是，你分不出是從哪裡來的，只覺得頭越來越重。`}},
  {t:'q',l:'看牆上的逃生路線圖',once:1,stay:1,ok:{t:`一樓的逃生路線圖是用螢光漆畫的，在黑暗裡還看得見一點點。員工通道往東接廚房，廚房後門旁邊有一道樓梯通到地下設備層；往西接洗衣房和員工宿舍，再過去是往 B2 停車場的樓梯。接待大廳在最南邊。

圖的角落用紅筆圈了一個小方格，旁邊寫著：「瓦斯總閥（紅色）・廚房後門」。`,r:{flag:'emap'}}},
  {t:'mv',l:'往前走',ok:{t:`你摀著口鼻，沿著通道往前走。`}}]},
E5:{L:'E',n:'一樓・員工更衣室',
 t:`員工更衣室裡一排一排都是鐵製的置物櫃，大部分鎖著，有幾個的門被撬開了。長椅上丟著一件沾了血的廚師服。

牆上的白板寫著今天的排班。`,
 c:[
  {t:'sd',l:'翻被撬開的置物櫃',stay:1,ok:{t:`撬開的櫃子被翻過了，可是翻的人很急。你在最上層摸到一包香菸，最裡面還有一條能量棒和一卷膠帶。`,r:{items:{cigarette:1,bar:1,tape:1}}}},
  {t:'q',l:'看白板上的排班',once:1,stay:1,ok:{t:`「晚班 15:00～23:00」底下列了幾個名字。廚房：阿傑、小麥。房務：伊蓮娜。工程部：路易斯（加班）。代客泊車：凱文（23:00 接班）。

白板角落貼著一張便利貼：「冷藏室的門鎖壞了，只能從外面開，進去的人記得卡門擋。」`,r:{flag:'shiftboard'}}},
  {t:'mv',l:'往前走',ok:{t:`你離開更衣室。`}}]},
E6:{L:'E',n:'一樓・總機室',
 t:`櫃台後面有一間小小的總機室。總機台靠電池撐著，一整排分機燈大部分是暗的，只有一顆在閃，一直閃。

閃的是三樓的分機。`,
 c:[
  {t:'q',l:'接起閃燈的那一線',once:1,stay:1,ok:{get t(){const F=G.flags;
    if(F.elderstay)return `你按下那顆燈，拿起話筒。是 310。

「……櫃台嗎？」是瓊的聲音，很小，「我們還在房間裡。門鎖著。外面有東西在撞，撞了很久了，可是門沒有開。」她停了一下，「年輕人，是你嗎？是你叫我們鎖門的。我們有照做。」

你告訴她，天亮之前都不要開門。她說好。`;
    if(F.elderleft)return `你按下那顆燈，拿起話筒。是 310。

話筒那頭先是很大的撞門聲，一下，一下，接著是一個老太太在喊：「華特！不要開！不要——」

然後是很長的雜音。你一直拿著話筒，直到它斷掉。`;
    return `你按下那顆燈，拿起話筒。是 303。

話筒那頭沒有人說話，只有很慢、很重的呼吸，還有指甲在塑膠上刮來刮去的聲音，像有人拿著話筒，卻不知道它是做什麼用的。

你把話筒放回去。燈還在閃。`},get p(){return G.flags.elderstay?{fear:-4}:{fear:8}}}},
  {t:'q',l:'看總機旁邊的住房表',once:1,stay:1,ok:{t:`住房表夾在板子上，三樓那一欄有三間用螢光筆塗成黃色：303、305、306，備註寫著「ARC 門診　長期包房」。305 那一格三天前改過，寫著「轉出」。

板子背面貼著一張經理的字條：「門診的人來，直接讓他們下地下室，不用登記。」`,r:{flag:'roomboard'}}},
  {t:'mv',l:'往前走',ok:{t:`你離開總機室。那顆燈還在閃。`}}]},
E7:{L:'E',n:'一樓・員工通道的岔路',
 t:`員工通道在這裡分成兩頭。

往東是廚房。瓦斯味從那扇雙開的不鏽鋼門後面一陣一陣湧出來，門裡有東西在撞，很規律。

往西是洗衣房和員工宿舍。那邊地上有水，從門底下一直流出來，空氣又悶又濕，聞得到洗衣粉的味道。`,
 c:[
  {t:'mv',l:'穿過廚房',sign:{t:'瓦斯總閥應該在廚房後門那邊。',dc:12},ok:{t:`你推開不鏽鋼門。`,go:'F1'}},
  {t:'mv',l:'穿過洗衣房',ok:{t:`你往西走，踩進積水裡。`,go:'H1'}}]},
F2y:{L:'E',n:'員工廚房・乾貨倉',
 t:`廚房後面是乾貨倉，鐵架上排滿了罐頭、米和一箱一箱的瓶裝水。後門就在倉庫另一頭，門邊的牆上有一根漆成紅色的管子，上面有一個把手。

倉庫的地上有一排腳印，是踩過麵粉留下的，從後門進來，往廚房去，沒有出去。`,
 c:[
  {t:'sd',l:'翻乾貨架',stay:1,ok:{t:`你挑了容易帶的：兩包泡麵、一盒蘇打餅乾、兩瓶水。`,r:{items:{noodle:2,cookie:1,water:2}}}},
  {t:'q',l:'扳紅色管子上的把手',once:1,stay:1,hide:'gasoff',ok:{t:`把手很緊，你用兩隻手才扳得動。轉了九十度，喀一聲卡住。

廚房那頭的嘶嘶聲停了。瓦斯味還在，可是不會再變濃了。`,r:{flag:'gasoff'}}},
  {t:'q',l:'看那排麵粉腳印',once:1,stay:1,k:'PER',d:11,s:'感知檢定',ok:{t:`腳印是光腳的，腳趾的地方特別深，像是踮著腳走。一路走到廚房的雙開門前面，門上有一個沾著麵粉的手印。

不管那是什麼，它是從後巷進來的。`,p:{fear:4}},ng:{t:`麵粉被踩得亂七八糟，你看不出什麼。`}},
  {t:'mv',l:'往前走',ok:{t:`你走到後門前面。`}}]},
H5:{L:'E',n:'員工宿舍・交誼室',
 t:`宿舍走廊的盡頭是一間小小的交誼室：一台微波爐、一張沙發、一面公告欄。沙發上有一條摺好的毯子。

公告欄上釘滿了紙：排班表、員工旅遊的照片、一張寫著「私人食物請勿放公用冰箱」的告示。`,
 c:[
  {t:'sd',l:'翻交誼室的櫃子',stay:1,ok:{t:`櫃子裡是員工自己帶的東西：一罐咖啡、半包綜合堅果，還有一卷沒拆的繃帶。`,r:{items:{coffee:1,nuts:1,bandage:1}}}},
  {t:'q',l:'看公告欄',once:1,stay:1,ok:{t:`最上面一張是工程部貼的：「B2 停車場排風機接在備用發電機的迴路上。停電時請先到地下設備層啟動發電機，再到配電室打開排風機的開關。」

底下一張比較新，是經理的字：「地下設備層管線間發現不明附著物，已通報門診，勿自行清除。」

照片牆上，凱文站在最旁邊，比了一個讚。`,r:{flag:'fanote'}}},

/* ---- 12. 東側樓梯 ---- */
{const c=N.A6e.c;
 c[0].ok=c[0].ng=undefined;c[0].tb=[
  {g:'good',w:1,t:`你慢慢把滅火器從掛勾上取下。很重，壓力錶還在綠色區。你貼著牆一階一階往下，經過他身後的時候，聽清楚了他在唸什麼：「……請在房內等候……請在房內等候……」

他沒有回頭。`,r:{items:{extinguisher:2}}},
  {g:'bad',w:1,t:`掛勾發出一聲金屬摩擦。他猛地轉過身，整張臉在紅光下發黑，嘴裡還在唸：「請在房內等候——」然後他撲了過來。`,r:{items:{extinguisher:2}},fight:{n:1,mode:'ambush',names:['樓梯間的感染者']}}];
 c[2].ok=c[2].ng=undefined;c[2].tb=[
  {g:'good',w:1,t:`你貼著牆往下走，每一階都停一下。他一直面對著牆唸那句話。你走過去了。`},
  {g:'bad',w:1,t:`你的鞋跟在水泥階梯上滑了一下。他轉過身來。`,p:{fear:5},fight:{n:1,mode:'ambush',names:['樓梯間的感染者']}}];
 c.push({t:'mv',l:'在紅光裡看清楚他的腳',blu:{tr:'nightowl'},ok:{t:`紅光對你來說夠亮了。他光著腳，兩隻腳跟都對著牆，腳尖朝外：他是面壁站著的，不是在看樓梯。

你算準他唸到「等候」的那一下，把滅火器從掛勾上取下來，沒有發出一點聲音，貼著另一邊的扶手走了下去。`,r:{items:{extinguisher:2}}}});
}

/* ---- 三樓牌庫：一般牌 9 張（製冰機間＋8 張） ---- */
{const n=N.A3x;n.deck='A';const c=n.c;
 c[0].ok=c[0].ng=undefined;c[0].tb=[
  {g:'good',w:2,t:`他已經死了，喉嚨被咬開，大概是想躲進縫裡的時候被追上的。手腕上還戴著旅館的住客手環，房號 309。

他的手裡死死攥著一串鑰匙，上面掛著一張小卡片：「布巾室」。你把鑰匙撥了出來，順手拿走他口袋裡的手帕。`,r:{items:{cloth:2},flag:'linenkey'},p:{fear:8}},
  {g:'mid',w:2,t:`你才把他拉出來一半，他的頭就往你這邊歪過來，喉嚨的傷口整個翻開。你的胃翻了過來，跪在那灘粉紅色的水裡吐了好久。

你只扯下他口袋裡露出來的一條手帕。`,r:{items:{cloth:1}},p:{fear:12,hun:-1}},
  {g:'bad',w:1,t:`你抓住他的手臂往外拉。那隻手突然反過來，扣住了你的手腕。

他的喉嚨是開的，可是他還在呼吸。`,p:{fear:10},fight:{n:1,mode:'ambush',names:['卡在縫裡的住客']}}];
 c[1].ok=c[1].ng=undefined;c[1].tb=[
  {g:'good',w:2,t:`你用手肘撞破販賣機的玻璃角落，玻璃只裂開一塊。你伸手進去，掏出兩瓶飲料。`,r:{items:{water:1,cola:1}}},
  {g:'bad',w:1,t:`卡住的玻璃整片碎掉，嘩啦一聲倒在那灘水裡。你縮在牆角等了很久，走廊另一頭有東西拖著腳往這邊走了幾步。`,r:{items:{chips:1}},p:{alarm:2}}];
}
Object.assign(N,{
AD1:{L:'A',n:'三樓走廊・滴水的天花板',deck:'A',
 t:`這一段走廊的地毯是濕的，踩下去會冒水。天花板的輕鋼架板往下垂成一個肚子，水從板子的縫裡一直滴下來，滴答，滴答。

要往前走，得從那塊板子底下過去。`,
 c:[
  {t:'q',l:'快步從底下過去',sign:{t:'那塊板子往下垂得很厲害，邊上的鐵架已經彎了。',dc:12},tb:[
   {g:'mid',w:2,t:`你壓低頭，快步從底下穿過去。一滴水落在你的後頸，冰得你縮了一下。板子沒有掉下來。`},
   {g:'bad',w:1,t:`你走到正下方的時候，頭頂傳來一聲很輕的「啪」。`,qte:{t:'整片天花板連著積水往下砸——',w:['往前撲','護頭','翻滾','衝刺'],ok:{t:'你往前一撲，板子和水在你身後砸成一灘。你渾身濕透，可是沒被砸到。',p:{fear:6,alarm:1}},ng:{t:'板子砸在你的肩膀上，鐵架的邊角在你手臂上劃開一道口子。',p:{hp:-3,fear:8,alarm:2}}}}]},
  {t:'m',l:'貼著牆，從旁邊繞過去',ok:{t:`你貼著牆，一步一步從濕掉的地毯邊上繞過去，避開那塊板子正下方。走得很慢，可是一滴水都沒有落在你身上。`}},
  {t:'q',l:'用東西把那塊板子頂起來看看',tb:[
   {g:'good',w:1,t:`你把板子往上一頂，上面的積水嘩地倒了下來，跟著掉下來的還有一個背包。

背包是濕的，裡面有一瓶礦泉水、一包能量棒，和一卷繃帶。大概是有人想從天花板裡逃走，背包卡在管線上掉了。`,r:{items:{water:1,bar:1,bandage:1}},p:{alarm:1}},
   {g:'bad',w:1,t:`你把板子往上一頂，積水倒了下來，跟著掉下來的是一條手臂，再來是一整個人。

他卡在天花板的管線裡不知道多久了。他摔在地毯上，慢慢抬起頭。`,p:{fear:10},fight:{n:1,mode:'ambush',names:['從天花板掉下來的感染者']}}]}]},
AD2:{L:'A',n:'三樓走廊・停電',deck:'A',w:()=>hourN()>=21.5||hourN()<5?2:1,
 t:`緊急照明一盞接一盞熄掉，最後整條走廊一片漆黑。

黑暗裡，有東西在地上拖行。很慢，越來越近。`,
 c:[
  {t:'q',l:'貼著牆不動',k:'CON',d:11,tb:[
   {g:'mid',w:2,t:`你屏住呼吸數到二十。拖行聲經過你面前，近得聞得到那股甜膩的味道，然後遠去。緊急照明重新亮了起來。`,p:{fear:6}},
   {g:'bad',w:1,t:`你忍不住往後退，腳跟撞到了牆邊的垃圾桶。拖行聲停了。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['黑暗裡的感染者']}}]},
  {t:'q',l:'摸黑往前走',k:'AGI',d:12,dark:1,tb:[
   {g:'mid',w:2,t:`你摸著牆往前走，鞋尖踢到一個翻倒的托盤，鏗的一聲。你停下來等了很久，什麼都沒有過來。`,p:{alarm:1}},
   {g:'bad',w:1,t:`你摸著牆往前走，手掌按到的不是牆，是一隻冰冷的手。`,p:{fear:10},fight:{n:1,mode:'ambush',names:['黑暗裡的感染者']}}]},
  {t:'q',l:'看清楚那個東西在哪裡',blu:[{item:'flashlight'},{tr:'nightowl'}],ok:{t:`黑暗裡你看得出輪廓。拖行聲的主人趴在走廊另一邊，正背對著你，往反方向爬。

你等它爬遠了，才沿著另一邊的牆走過去。`}}]},
AD3:{L:'A',n:'三樓走廊・煙霧偵測器',deck:'A',
 t:`頭頂的煙霧偵測器突然尖叫起來。走廊上沒有煙，也沒有火，只有那個聲音，刺耳得讓人頭痛。

兩邊的房門後面，同時傳來了動靜。`,
 c:[
  {t:'q',l:'把偵測器拆下來',k:'AGI',d:11,tb:[
   {g:'good',w:1,t:`你踩著門框跳起來，一把扯下偵測器，連電池一起拔掉。安靜了。門後的動靜也慢慢停了。`,r:{items:{battery:1}},audioStop:'firealarm'},
   {g:'bad',w:1,t:`偵測器的底座鎖得很緊，你扳了兩次都扳不下來。它一直叫，叫了很久才停。`,p:{alarm:3,fear:4},audioStop:'firealarm'}]},
  {t:'q',l:'趁亂快跑',k:'AGI',d:12,tb:[
   {g:'mid',w:2,t:`你趁著噪音跑過這一段走廊，沒有東西注意到你。`},
   {g:'bad',w:1,t:`你跑到一半，一扇門在你面前打開了。`,fight:{n:1,mode:'ambush',names:['被吵醒的房客']}}]},
  {t:'q',l:'低著頭走過去',ok:{t:`你低著頭，用正常的速度走過去。偵測器在你背後又叫了很久。`,p:{alarm:1}}}]},
AD4:{L:'A',n:'三樓走廊・客房服務推車',deck:'A',
 t:`一台客房服務推車停在走廊中間。銀色的餐蓋掉在地毯上，盤子裡的牛排早就冷了，醬汁凝成一層白油。推車把手上夾著一張點餐單：「303　牛排　五分熟　19:30 送達　※門診交代：放門口，不要敲門，不要跟房客說話」。`,
 c:[
  {t:'q',l:'翻推車下層',k:'PER',d:12,tb:[
   {g:'good',w:1,t:`推車下層有一支送餐員的手機，螢幕還亮著，停在客房服務的訂單紀錄。303 那一欄每天都點兩份，備註都是同一句：「門診交代，放門口，不要敲門。」最早的一筆，是十二天前。`,r:{flag:'rs303'},p:{fear:4}},
   {g:'mid',w:2,t:`下層只有另外半盤冷掉的牛排，用保鮮膜包著。你站在推車旁邊把它吃掉了。`,p:{hun:2}},
   {g:'mid',w:2,t:`下層有一把牛排刀和一疊乾淨的餐巾。你把刀和餐巾都收了起來。`,r:{gear:'knife',items:{cloth:1}}}]},
  {t:'q',l:'不要碰',ok:{t:`你繞過推車。最近那間半開的房門裡，傳來很輕、很慢的咀嚼聲。`,p:{fear:4}}}]},
AD5:{L:'A',n:'三樓走廊・門後的人',deck:'A',
 t:`一扇門後面傳來壓低的聲音：「外面……還有人嗎？」

是一個活人。聲音在發抖。`,
 c:[
  {t:'q',l:'「有。你還好嗎？」',tb:[
   {g:'mid',w:2,t:`門開了一條縫，一個穿睡衣的中年女人看著你，眼睛紅腫。她說她先生聽到槍聲就下樓去看，一直沒有回來。她塞給你一瓶水和一包餅乾，然後又把門關上了。

「我要等他，」她隔著門說，「他說會回來的。」`,r:{items:{water:1,cookie:1}}},
   {g:'bad',w:1,t:`門開了一條縫，她看到你身上的血，整張臉都變了。「走開！」她尖叫著甩上門，「走開！」

整條走廊都聽得到。`,p:{fear:4,alarm:2}}]},
  {t:'q',l:'說服她開門跟你走',s:'統帥檢定',k:'CHA',d:13,tb:[
   {g:'good',w:1,t:`你隔著門跟她說了很久：外面還有路、你知道出口、一個人等下去只會餓死。門鎖喀的一聲打開了。她不肯跟你走，但把房裡剩下的東西都塞給了你，還有一盒她先生的香菸。

「如果你出去了，」她說，「幫我跟外面的人說，這裡還有人。」`,r:{items:{water:1,cookie:1,cigarette:2,sedative:1}},p:{fear:-8}},
   {g:'bad',w:1,t:`你講得太急了。門後安靜了一下，然後她開始尖叫，叫你走開，叫得整條走廊都聽得到。`,p:{fear:4,alarm:3}}]},
  {t:'q',l:'不出聲，繼續走',ok:{t:`你沒有回答。門後的聲音問了好幾次，最後變成啜泣。你走了。`,p:{fear:4}}}]},
AD6:{L:'A',n:'三樓走廊・倒在路中間的人',deck:'A',
 t:`一個人倒在走廊正中間，臉朝下，背包還背在身上。地毯上沒有血。`,
 c:[
  {t:'sq',l:'快速翻他的背包',tb:[
   {g:'good',w:1,t:`你只拉開背包最外面的口袋。裡面有一卷繃帶和一瓶礦泉水。`,r:{items:{bandage:1,water:1}}},
   {g:'mid',w:2,t:`你只拉開背包最外面的口袋。裡面只有一把硬幣和一隻長襪。`,r:{items:{coin:1,sock:1}}}]},
  {t:'sd',l:'把他翻過來，仔細翻背包',k:'INT',d:11,tb:[
   {g:'good',w:2,t:`背包裡有一卷繃帶、一瓶礦泉水，還有一張全家福和一個皮夾。你把照片留下了。`,r:{items:{bandage:1,water:1,sock:1,coin:1},usd:4},p:{alarm:1}},
   {g:'mid',w:2,t:`背包已經被人翻過了，只剩一卷壓扁的繃帶。`,r:{items:{bandage:1}},p:{alarm:1}},
   {g:'bad',w:1,t:`你把他翻過來的時候，他的眼睛是睜開的。他還沒死透。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['還有呼吸的人']}}]},
  {t:'sd',l:'用長柄的東西把他撥開再翻',blu:{item:['tableleg','mop'],any:1},tb:[
   {g:'good',w:1,t:`你站在一臂之外，用長柄把他的肩膀撥過來。他沒有動。你這才蹲下去，背包裡有一卷繃帶、一瓶礦泉水和一個皮夾。`,r:{items:{bandage:1,water:1},usd:4}},
   {g:'mid',w:1,t:`你站在一臂之外，用長柄把他撥過來。他的手指抽了一下，又不動了。背包已經被人翻過，只剩一卷繃帶。`,r:{items:{bandage:1}}}]},
  {t:'mv',l:'繞過去',ok:{t:`你貼著牆繞過他，盡量不看他的臉。`}}]},
AD7:{L:'A',n:'三樓走廊・落地鏡',deck:'A',
 t:`走廊盡頭有一整面落地鏡，映出你身後的整條走廊。緊急照明一閃，鏡子裡的走廊深處，有一團影子動了一下。`,
 c:[
  {t:'q',l:'停下來看清楚',k:'PER',d:13,tb:[
   {g:'mid',w:2,t:`你站著不動，等緊急照明再閃一次。那團影子跟著閃了一下：是你自己的影子，被紅光拉得很長，貼在後面的牆上。

你吐了一口氣，才發現自己的手一直握著拳。`,p:{fear:2}},
   {g:'bad',w:1,t:`你看得太久了。鏡子裡那團影子站了起來，從一扇開著的房門裡爬出來，轉過頭，朝你走過來。`,p:{fear:8},fight:{n:1,mode:'normal',names:['從房間爬出來的感染者']}}]},
  {t:'q',l:'低著頭走過去',tb:[
   {g:'mid',w:2,t:`你沒有回頭，加快腳步走過鏡子。身後什麼聲音都沒有。`,p:{fear:4}},
   {g:'bad',w:1,t:`你沒有回頭，加快腳步走過鏡子。身後傳來行李推車被撞倒的聲音，然後是拖著腳走路的聲音，跟在你後面。`,p:{fear:6,alarm:1}}]}]},
AD8:{L:'A',n:'三樓走廊・318',deck:'A',
 t:`整條走廊只有一支電話在響。是 318 的客房電話，門開著一條縫，鈴聲從裡面傳出來，一聲接一聲，響了很久。`,
 c:[
  {t:'q',l:'進去接起來',tb:[
   {g:'good',w:1,t:`你閃進 318，拿起話筒。是一段錄音，一個男人的聲音，很冷靜：「這裡是櫃台。三樓的住客請走東側樓梯下樓，不要搭電梯，不要開窗。重複一次……」

錄音一直重複。你把話筒放下。`,r:{flag:'ph318'}},
   {g:'bad',w:1,t:`你閃進 318，拿起話筒。另一頭沒有人說話，只有喘氣聲，濕的，一口接著一口。

你把話筒摔回去。鈴聲停了，可是走廊上已經有東西被引過來了。`,p:{fear:6,alarm:2}}]},
  {t:'m',l:'進去把電話線拔掉',ok:{t:`你摸進 318，順著電話線找到牆上的插座，把線拔掉。鈴聲斷了。你在黑暗裡蹲了很久，確定沒有東西過來，才出去。`}},
  {t:'q',l:'不理它',ok:{t:`你從 318 門口走過去。鈴聲一直響，一直響，在你背後響了很久。`,p:{alarm:1}}}]},

/* ---- 三樓牌庫：條件牌 5 張（成立才插進來，一層最多 2 張，不算進 9 張） ---- */
AE1:{L:'A',n:'三樓・布巾室',deck:'A',cc:1,dcond:{hide:'mkey'},
 t:`走廊轉角有一扇窄門，門牌寫著「布巾室　員工專用」。門底下透出一點手電筒的光。

門後有人在哭，壓得很低。`,
 c:[
  {t:'q',l:'敲門，跟她說話',s:'統帥檢定',k:'CHA',d:12,tb:[
   {g:'good',w:2,t:`哭聲停了。過了很久，門後的人說她叫伊蓮娜，是三樓的房務員。她不肯開門，可是門底下塞出來一張白色的房卡，背面印著「HOUSEKEEPING　ALL」。

「303 不要開，」她說，「拜託不要開。」`,r:{flag:'mkey'}},
   {g:'mid',w:2,t:`門後的人說她叫伊蓮娜，是三樓的房務員。她說她一整晚沒喝水了。

你把一瓶水從門縫底下推進去。過了一會兒，門底下塞出來一張白色的房卡。`,r:{flag:'mkey',pay:{water:1}}},
   {g:'bad',w:1,t:`你一開口，她就尖叫起來：「走開！你們都走開！」一邊叫一邊用東西砸門。整條走廊都聽得到。`,p:{alarm:2,fear:4}}]},
  {t:'q',l:'把門撬開',tb:[

  {t:'q',l:'拿走餐盤上的東西',tb:[
   {g:'mid',w:2,t:`你撕開保鮮膜。三明治有點乾了，你站在門口把它吃掉，柳橙汁一口喝光。`,p:{hun:2}},
   {g:'bad',w:1,t:`你剛把餐盤端起來，305 的門後面就有人倒抽了一口氣，門鎖從裡面又多扣了一道。

你端著餐盤退開，躲到轉角把三明治吃了。`,p:{hun:2,fear:2}}]},
  {t:'q',l:'敲 305 的門',tb:[
   {g:'mid',w:2,t:`你輕輕敲了兩下。門後安靜了很久，然後有人壓低聲音說：「走開。拜託，走開。」是個年輕男人的聲音。`,r:{flag:'m305'}},
   {g:'bad',w:1,t:`你敲了兩下。門後的人沒有回答，走廊另一頭倒是有東西停下了腳步，往這邊轉了過來。`,p:{alarm:2}}]},
  {t:'mv',l:'走過去',ok:{t:`你從 305 門口走過去，沒有碰那個餐盤。`}}]},
AW2:{L:'A',n:'三樓走廊・輪椅',deck:'A',seg:'w',peek:'一台印著旅館名字的輪椅翻倒在走廊上。',peek2:{t:'扶手上有抓過的血痕，一道拖痕往 303 那邊去。',dc:12},
 t:`一台輪椅翻倒在走廊上，椅背印著旅館的名字。是櫃台借給住客的那種，平常收在大廳的柱子後面。

扶手上有幾道抓過的血痕。椅背後面掛著一個帆布置物袋，鼓鼓的。`,
 c:[
  {t:'sq',l:'快速翻椅背的置物袋',tb:[
   {g:'good',w:1,t:`你只拉開置物袋最上面的拉鍊。裡面有一瓶礦泉水和一條摺好的薄毯。`,r:{items:{water:1,cloth:1}}},
   {g:'mid',w:2,t:`你只拉開最上面的拉鍊。裡面是一本旅館的雜誌和一包面紙。`,r:{items:{magazine:1}}}]},
  {t:'sd',l:'把置物袋整個倒出來翻',k:'PER',d:11,tb:[
   {g:'good',w:2,t:`水、薄毯、一盒止痛藥，最底下壓著一張剪斷的住客手環，房號 303。

這台輪椅，是推去 303 的。`,r:{items:{water:1,cloth:1,painkiller:1},flag:'wc303'},p:{alarm:1}},
   {g:'mid',w:2,t:`袋子裡只剩一本雜誌和一個空掉的止痛藥盒。`,r:{items:{magazine:1}},p:{alarm:1}},
   {g:'bad',w:1,t:`你把手伸進袋子最底下，摸到一團濕濕的東西。是一把頭髮，連著一小塊頭皮，黏在拉鍊上。

你把手抽出來，在地毯上擦了很久。`,p:{fear:8,alarm:1}}]},
  {t:'sd',l:'用手電筒照著翻',blu:{item:'flashlight'},tb:[
   {g:'good',w:1,t:`你用手掌遮住燈頭照著翻，繞開黏在拉鍊上的那團頭髮。水、薄毯、一盒止痛藥，你都拿了。`,r:{items:{water:1,cloth:1,painkiller:1}}},
   {g:'mid',w:1,t:`你照著翻了一遍，袋子裡只剩一條薄毯。`,r:{items:{cloth:1}}}]},
  {t:'mv',l:'不碰',ok:{t:`你從輪椅旁邊繞過去。扶手上那幾道抓痕，你沒有多看。`}}]},
AW3:{L:'A',n:'三樓・電梯廳',deck:'A',seg:'w',peek:'電梯廳的按鈕還亮著一盞小燈，樓層燈停在 3。',peek2:{t:'電梯門的縫裡夾著一隻高跟鞋。',dc:13},
 t:`電梯廳的燈全熄了，只有按鈕面板上還亮著一盞小小的綠燈，樓層燈停在「3」。停電的時候，電梯剛好停在這一層，緊急電源還撐著面板。

兩扇電梯門關得緊緊的，左邊那扇的門縫裡夾著一隻高跟鞋。`,
 c:[
  {t:'q',l:'按下按鈕',tb:[
   {g:'mid',w:2,t:`你按下按鈕。面板嗶了一聲，綠燈閃了兩下，熄了。電梯門一動也不動。

那一聲嗶在安靜的走廊裡傳得很遠。`,p:{alarm:1}},
   {g:'bad',w:1,t:`你按下按鈕。左邊的電梯門往兩邊滑開了一半就卡住，高跟鞋掉了出來。車廂裡的燈管閃了一下：裡面擠著兩個人，都面對著門。`,p:{fear:8},fight:{n:2,mode:'normal',names:['電梯裡的感染者','電梯裡的感染者']}}]},
  {t:'q',l:'貼著電梯門聽',k:'PER',d:12,tb:[
   {g:'good',w:1,t:`你把耳朵貼在冰冷的門上。門後有兩個人的呼吸聲，很慢，一進一出，像在睡覺。

電梯車廂就停在門後面，裡面不是空的。你退開了。`,p:{fear:3}},
   {g:'mid',w:2,t:`你只聽得到自己的心跳。過了很久，車廂輕輕晃了一下，鋼纜嘎的一聲。`,p:{fear:4}}]},
  {t:'q',l:'把門撬開一條縫看',blu:{item:['g:crowbar','g:fireaxe'],any:1},ok:{t:`你把工具卡進門縫，只撬開一指寬。車廂裡還亮著一根燈管：兩個穿西裝的人面對面站著，額頭頂著額頭，一動也不動。地上是另一隻高跟鞋。

你慢慢把工具抽出來，門縫闔上了。它們沒有轉頭。`,p:{fear:4}}},
  {t:'mv',l:'走過去',ok:{t:`你從電梯廳前面走過去，沒有碰那個按鈕。`}}]},
AW4:{L:'A',n:'三樓走廊・布巾滑槽',deck:'A',seg:'w',peek:'布巾滑槽的鐵蓋開著一條縫，樓下有人在喊：「上面有人嗎？」',peek2:{t:'聲音是從很下面傳上來的，帶著回音。',dc:12},
 t:`牆上有一個布巾滑槽，鐵蓋開著一條縫。房務員大概是丟到一半就跑了，一條床單還卡在口子上。

滑槽裡傳上來一個男人的聲音，帶著回音：「上面有人嗎？有人嗎？」`,
 c:[
  {t:'q',l:'打開鐵蓋往下看',tb:[
   {g:'mid',w:2,t:`你掀開鐵蓋。滑槽又窄又深，最底下透著一點日光燈的白光，床單堆得很高，一個穿員工制服的人站在床單堆旁邊，抬頭往上看。

「上面有人！」他喊，「下面的門被堵住了，我出不去！」`},
   {g:'bad',w:1,t:`你掀開鐵蓋，一股悶熱的臭味衝上來。底下的喊聲停了，換成另一種聲音：有東西貼著鐵皮往上爬，鞋子在滑槽壁上一下一下地打滑。

你把鐵蓋甩上，用背頂著。`,p:{fear:8,alarm:1}}]},
  {t:'q',l:'對著滑槽回話',k:'CHA',d:12,tb:[
   {g:'good',w:1,t:`你壓低聲音說你在三樓。他說他在洗衣房，門被什麼東西堵著，出不去，也不敢出去。

「別下來找我，」他說，「下面不只我一個。」`,r:{flag:'chute'}},
   {g:'mid',w:2,t:`你回了一聲。下面的人沉默了一下，然後哭了起來，一直說謝謝、謝謝，說他會等。

你不知道他在等什麼。`,p:{fear:2}}]},
  {t:'q',l:'用膠帶把鐵蓋封死',blu:{item:'tape'},ok:{t:`你把鐵蓋壓緊，用膠帶一圈一圈纏死。下面的喊聲被悶住了。

至少從這裡，什麼東西都爬不上來。`,r:{use:'tape'}}},
  {t:'mv',l:'走開',ok:{t:`你從滑槽前面走過去。喊聲在你背後又響了幾次，就停了。`,p:{fear:3}}}]},

AM1:{L:'A',n:'三樓走廊・308',deck:'A',seg:'m',peek:'308 的門被撞開一條縫，門鏈還掛著，繃得筆直。',peek2:{t:'門鏈的螺絲已經被扯鬆了一半。',dc:13},
 t:`308 的門被撞開了一條縫，門鏈還掛著，繃得筆直。門縫裡很暗，看得到地毯上一隻翻倒的拖鞋。

門縫裡傳出很慢的咀嚼聲，嚼一下，停一下。你一走近，聲音就停了。`,
 c:[
  {t:'q',l:'把門拉上',k:'AGI',d:12,tb:[
   {g:'good',w:1,t:`你抓住門把，一口氣把門拉上。門鎖喀的一聲扣住，門後的東西撞了一下，撞不開。`,r:{flag:'shut308'}},
   {g:'mid',w:2,t:`你把門拉上的那一刻，門後的東西撞了過來，門鏈的螺絲崩掉一顆，彈到你腳邊。門還是關上了。`,r:{flag:'shut308'},p:{alarm:1}},
   {g:'bad',w:1,t:`你剛碰到門把，門鏈就整條被扯斷，門往你這邊撞開。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['308 的房客']},win:K308}]},
  {t:'q',l:'用繩子把門把綁在對面的門上',blu:{item:'rope'},ok:{t:`你把尼龍繩繞過 308 的門把，拉過走廊，綁死在對面 307 的門把上，再把繩子扯緊。308 的門被拉回去，只剩一指寬的縫。

門後的東西撞了一下，繩子繃了一下，沒斷。`,r:{use:'rope',flag:'tie308'}}},
  {t:'q',l:'從門縫看清楚',k:'PER',d:12,tb:[
   {g:'good',w:1,t:`你蹲低，從門縫往裡看。一個穿著旅館浴袍的女人坐在地上，背對著門，懷裡抱著什麼在啃。床頭櫃上的皮夾開著，駕照上的照片在對你笑。

她沒有回頭。`,r:{flag:'saw308'},p:{fear:4}},
   {g:'mid',w:1,t:`門縫裡太暗了，你只看得到一隻光腳，腳底沾滿了地毯的纖維。它一動也不動。`,p:{fear:3}},
   {g:'bad',w:1,t:`你剛蹲下，門縫裡就伸出一隻手，抓住你的衣領往裡拖，你的臉撞在門框上。`,p:{hp:-1,fear:6},fight:{n:1,mode:'ambush',names:['308 的房客']},win:K308}]},
  {t:'mv',l:'快步走過去',ok:{t:`你加快腳步走過 308。背後的門鏈嘩啦響了一下。`,p:{alarm:1}}}]},
AM2:{L:'A',n:'三樓・清潔間',deck:'A',seg:'m',peek:'一扇沒有門牌的窄門開著，飄出漂白水的味道。',peek2:{t:'水桶旁邊有一雙脫下來的工作鞋。',dc:12},
 t:`一扇沒有門牌的窄門開著，門後是清潔間。架子上排著清潔劑和捲筒衛生紙，地上一個拖把水桶，漂白水的味道嗆得眼睛發酸。

水桶旁邊有一雙脫下來的工作鞋，擺得整整齊齊。`,
 c:[
  {t:'sq',l:'快速翻架子',tb:[
   {g:'good',w:1,t:`你只看架子最外面那一排：一卷膠帶、一包抹布。`,r:{items:{tape:1,cloth:1}}},
   {g:'mid',w:2,t:`最外面那一排只有清潔劑和衛生紙。你抽了一包抹布。`,r:{items:{cloth:1}}}]},
  {t:'sd',l:'把架子一層一層翻過',k:'PER',d:11,tb:[
   {g:'good',w:2,t:`抹布、一卷膠帶、一瓶外用酒精。牆角還靠著一支拆下來的拖把柄。`,r:{items:{cloth:2,tape:1,alcohol:1,mop:1}},p:{alarm:1}},
   {g:'mid',w:2,t:`架子上的東西大多被拿走了，只剩一瓶外用酒精和牆角那支拖把柄。`,r:{items:{alcohol:1,mop:1}},p:{alarm:1}},
   {g:'bad',w:1,t:`你踮腳去搆最上層的時候，整排清潔劑倒了下來，砸進水桶裡，漂白水濺了你一臉。你咳得眼淚直流，只抓到一支拖把柄。`,r:{items:{mop:1}},p:{hp:-1,alarm:2}}]},
  {t:'sd',l:'用手電筒照著翻',blu:{item:'flashlight'},tb:[
   {g:'good',w:1,t:`你照著架子一層一層看，連最裡面的角落都照到了：抹布、膠帶、外用酒精、拖把柄，還有一捲塞在架子後面的尼龍繩。`,r:{items:{cloth:2,tape:1,alcohol:1,mop:1,rope:1}}},
   {g:'mid',w:1,t:`照了一圈，架子上只剩抹布和一支拖把柄。`,r:{items:{cloth:2,mop:1}}}]},
  {t:'mv',l:'不碰',ok:{t:`你把清潔間的門帶上。那雙工作鞋的主人去了哪裡，你不想知道。`}}]},
AM3:{L:'A',n:'三樓走廊・對講機',deck:'A',seg:'m',peek:'地毯上有一支保全對講機，一直沙沙響，偶爾有人說話。',peek2:{t:'旁邊有一隻鞋，鞋帶還綁著。',dc:12},
 t:`地毯上躺著一支保全對講機，天線斷了一截，紅燈還亮著。喇叭一直沙沙作響，偶爾有人說話，斷斷續續的。

旁邊有一隻黑色的皮鞋，鞋帶還綁著。`,
 c:[
  {t:'q',l:'撿起來聽',k:'INT',d:11,tb:[
   {g:'good',w:1,t:`你把音量轉小，貼在耳邊。是大廳的保全，在跟另一個人說話：「……大廳守不住了，前門那片玻璃全破了……不要搭電梯……東梯還走得通，二樓那排窗戶別靠近，外面那些警察看到人影就開槍……」

然後是一聲尖叫，訊號斷了。`,r:{flag:'radiotip'},p:{fear:4}},
   {g:'mid',w:2,t:`你只聽出幾個字：「大廳」「不要」「東梯」。然後是很長一段沙沙聲。`}]},
  {t:'q',l:'按下通話鍵回話',k:'CHA',d:12,tb:[
   {g:'good',w:1,t:`你按下通話鍵，說你在三樓。很久之後，有人回話：「三樓……還有人？聽好，東側樓梯還能走，下到二樓不要靠窗，警察看到人影就開槍。」

他還想說什麼，訊號斷了。`,r:{flag:'radiotip'}},
   {g:'mid',w:1,t:`你按下通話鍵說話。另一頭沒有回答，只有喘氣聲，很重，一口接著一口。你鬆開了按鍵。`,p:{fear:6}},
   {g:'bad',w:1,t:`你按下通話鍵，喇叭突然爆出一陣尖銳的回授聲，整條走廊都聽得到。`,p:{alarm:3}}]},
  {t:'q',l:'用保全的呼號回話',blu:{job:'guard'},ok:{t:`你按下通話鍵，報出自己的呼號，就像值夜班時那樣。

對講機那頭停了一下，然後是同事沙啞的聲音：「……你還活著。聽著，大廳沒了，我們退到警衛室。東梯能走，電梯不要碰，二樓別靠窗，外面的警察看到人影就開槍。保重。」`,r:{flag:'radiotip'}}},
  {t:'q',l:'把它關掉',ok:{t:`你把對講機的電源轉掉。走廊一下子安靜了很多。`}}]},
AM4:{L:'A',n:'三樓走廊・口紅箭頭',deck:'A',seg:'m',peek:'牆紙上有人用口紅畫了一排箭頭，一路指向走廊另一頭。',peek2:{t:'箭頭旁邊寫著很小的字。',dc:13},
 t:`牆紙上有人用口紅畫了一排箭頭，一個接一個，畫得很用力，有幾個地方口紅斷了，留下一小截黏在牆上。

箭頭一路指向走廊另一頭。`,
 c:[
  {t:'q',l:'照著箭頭走',tb:[
   {g:'good',w:1,t:`你跟著箭頭走。箭頭停在一扇開著的房門前，門口放著一個塑膠袋，裡面有兩瓶水和一包餅乾。袋子上用口紅寫著：「給下一個人」。`,r:{items:{water:2,cookie:1}}},
   {g:'mid',w:2,t:`你跟著箭頭走。箭頭在轉角往上指，畫到往頂樓的樓梯門旁邊就斷了。門是關著的。你退了回來。`}]},
  {t:'q',l:'湊近看箭頭旁邊的字',k:'PER',d:12,tb:[
   {g:'good',w:1,t:`字寫得很小，一行一行擠在箭頭底下：「304 的人往頂樓去了。直升機沒有來。不要上去。」

最後一句被劃掉了，又重寫了一次。`,r:{flag:'roofno'},p:{fear:3}},
   {g:'mid',w:2,t:`字被人用手抹過，糊成一片，只剩「頂樓」兩個字還看得出來。`}]},
  {t:'mv',l:'不理它',ok:{t:`你從那排箭頭旁邊走過去。`}}]},
AM5:{L:'A',n:'三樓走廊・冰桶',deck:'A',seg:'m',peek:'冰桶倒在地上，冰水裡有一串光腳踩過的濕腳印，還沒乾。',peek2:{t:'腳印的腳尖是往外歪的。',dc:12},
 t:`一個旅館的冰桶倒在地上，冰塊早就融光了，水在地毯上積成一灘。

水裡有一串光腳踩過的濕腳印，還沒乾，往 309 那邊去。`,
 c:[
  {t:'q',l:'跟著腳印走',k:'PER',d:12,tb:[
   {g:'good',w:1,t:`你跟著腳印走，一步一步數。腳印在 309 前面轉了個彎，停在一扇開著的房門口。門裡有一個人背對著你，面對著窗戶站著，一動也不動。

你貼著另一邊的牆繞了過去。`,p:{fear:3}},
   {g:'mid',w:1,t:`腳印在地毯上越來越淡，走到 309 附近就看不見了。`},
   {g:'bad',w:1,t:`你低著頭看腳印，沒注意到前面那扇開著的門。腳印的主人就站在門後。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['光著腳的感染者']}}]},
  {t:'q',l:'看清楚腳印',blu:[{item:'flashlight'},{tr:'nightowl'}],ok:{t:`腳印的腳尖往外歪，腳跟踩得很深，走路的人身體往後仰，每一步都拖著腳尖。

腳印走進 309 隔壁那扇開著的門，就沒有出來。你貼著另一邊的牆走過去。`}},
  {t:'mv',l:'繞開濕的地方走',ok:{t:`你踩著牆邊的地毯繞過去，沒有讓鞋子沾到那灘水。`}}]},
AM6:{L:'A',n:'三樓走廊・分藥盒',deck:'A',seg:'m',peek:'一個塑膠分藥盒掉在地毯上，盒蓋彈開，藥丸滾了一地。',peek2:{t:'盒蓋上用奇異筆寫著「303」。',dc:12},
 t:`一個塑膠分藥盒掉在地毯上，盒蓋全彈開了，藥丸滾了一地，白的、黃的、粉紅色的。

是藥房就買得到的那種七格分藥盒。可是盒蓋上用奇異筆寫的不是星期幾，是房號：303、305、306。303 那一格裝得最滿。`,
 c:[
  {t:'q',l:'把藥丸撿起來',k:'INT',d:12,tb:[
   {g:'good',w:1,t:`你認得出其中兩種：白色的是止痛藥，上面印著藥廠的字；黃色的小圓片是鎮定劑。你把它們分開包好。`,r:{items:{painkiller:1,sedative:1}}},
   {g:'mid',w:2,t:`你分不出哪一種是什麼，只撿了印著字的白色藥丸，應該是止痛藥。`,r:{items:{painkiller:1}}},
   {g:'bad',w:1,t:`你蹲下去撿的時候，手指壓碎了一顆粉紅色的藥丸，粉末沾了滿手。指尖開始發麻，麻到手腕。`,p:{hp:-1,fear:3}}]},
  {t:'q',l:'認出是什麼藥',blu:{job:'nurse'},ok:{t:`白色的是止痛藥，黃色的是鎮定劑，這兩種你每天都在發。粉紅色那種你沒見過，藥丸上沒有刻字，不是藥廠出的。

你把止痛藥和鎮定劑收好，粉紅色的那幾顆包進一張紙巾裡。`,r:{items:{painkiller:1,sedative:1},flag:'pinkpill'}}},
  {t:'mv',l:'不碰',ok:{t:`你跨過那一地藥丸走過去。`}}]},

AT1:{L:'A',n:'三樓走廊・路障',deck:'A',seg:'e',peek:'防火門前堆著沙發和床墊，堆到快碰到天花板。',peek2:{t:'床墊底下露出一隻手，戴著住客手環。',dc:12},
 t:`走廊中間的防火門前堆滿了東西：兩張沙發、三張床墊、幾張翻倒的椅子，一路堆到快碰到天花板。有人想把東邊這一段封起來，封到一半就走了，最上面還留著一條縫。

床墊底下露出一隻手，手腕上戴著住客手環。`,
 c:[
  {t:'q',l:'從上面的縫鑽過去',k:'AGI',d:12,tb:[
   {g:'good',w:1,t:`你從縫裡鑽過去的時候，看到沙發墊底下塞著一個背包。你順手把它拖了過來：一瓶水、一卷繃帶。`,r:{items:{water:1,bandage:1}}},
   {g:'mid',w:2,t:`你踩著沙發扶手往上爬，從床墊和天花板之間的縫擠過去，跳到另一邊。`},
   {g:'bad',w:1,t:`你爬到一半，最上面那張床墊往下滑，連你一起摔下去，整堆東西晃了好幾下。`,p:{hp:-1,alarm:2}}]},
  {t:'q',l:'搬開一張沙發',k:'STR',d:13,tb:[
   {g:'good',w:1,t:`你咬著牙把最下面那張沙發拖開，露出一條剛好過得了一個人的通道。床墊底下壓著的那個人已經死了很久，口袋裡有一支手電筒。`,r:{items:{flashlight:1}},p:{alarm:1}},
   {g:'mid',w:2,t:`你把沙發拖開一半，擠了過去。沙發腳在地板上刮出很長一聲。`,p:{alarm:2}},
   {g:'bad',w:1,t:`你一拖，整堆東西就塌了下來。床墊底下的那隻手動了一下。`,p:{fear:6,alarm:2},fight:{n:1,mode:'ambush',names:['床墊底下的人']}}]},
  {t:'q',l:'把床墊劈開',blu:{item:'g:fireaxe'},ok:{t:`你掄起消防斧，從床墊中間劈下去，一下，兩下，彈簧和棉絮噴了一地。床墊裂成兩半，你從中間跨了過去。`,p:{alarm:1}}},
  {t:'mv',l:'繞另一邊',ok:{t:`你推開旁邊 314 的門。兩間房之間的連通門開著，你從房間裡繞過了路障。`}}]},
AT2:{L:'A',n:'三樓・316',deck:'A',seg:'e',peek:'316 的門開著，窗外的消防梯上有人一直在敲玻璃。',peek2:{t:'玻璃上是一個一個血手印。',dc:13},
 t:`316 的門開著。房間裡沒有人，窗簾拉開了一半。

窗外的消防梯上站著一個男人，穿著西裝外套，一隻手抓著欄杆，另一隻手一直在敲玻璃。他看見你了，敲得更用力。`,
 c:[
  {t:'q',l:'開窗讓他進來',tb:[
   {g:'good',w:1,t:`你把窗戶往上推。他翻進來，跌坐在地毯上大口喘氣。他說他從五樓的消防梯一路爬下來，每一層的窗戶都鎖著。

他的手掌全是割傷，是敲玻璃敲的。你幫他用毛巾纏好，他把口袋裡的一包菸和打火機塞給你，說要在這裡休息一下再走。`,r:{items:{cigarette:1,lighter:1}}},
   {g:'mid',w:1,t:`他翻進來的時候，你看到他的西裝褲管整條是濕的，小腿上一圈深深的齒痕。他看你在看，把褲管拉了下來。

「沒事，」他說，「我沒事。」然後他坐在床邊，不再說話了。`,p:{fear:6}},
   {g:'bad',w:1,t:`你把窗戶推上去的那一刻，他整個人撲了進來，壓在你身上。他的眼睛是混濁的，剛才敲玻璃的那隻手，現在抓著你的喉嚨。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['從窗外爬進來的人']}}]},
  {t:'q',l:'隔著玻璃問他',k:'CHA',d:12,tb:[
   {g:'good',w:1,t:`你比手勢叫他看你的嘴。他停下來，貼著玻璃大喊：他從五樓爬下來，樓上的窗戶全鎖著，沒有人開。他問你樓下怎麼樣。

你搖頭。他看了你很久，順著消防梯往下爬走了。`},
   {g:'mid',w:2,t:`隔著玻璃，你聽不清他在喊什麼。他敲了一會兒，看你沒有要開窗，就順著消防梯往下爬走了。`,p:{fear:3}}]},
  {t:'mv',l:'拉上窗簾離開',ok:{t:`你把窗簾拉上。敲玻璃的聲音又響了很久。`,p:{fear:4}}}]},
AT3:{L:'A',n:'三樓・往頂樓的門',deck:'A',seg:'e',peek:'往頂樓的樓梯門被門鏈從另一邊鎖住，上面有人在喊。',peek2:{t:'門縫飄下來菸味，上面不只一個人。',dc:12},
 t:`往頂樓的樓梯門關著，門上的小窗貼著一張紙：「頂樓　閒人勿入」。門把被一條門鏈從另一邊鎖住了，鏈子繞了好幾圈。

樓梯上面有人在喊：「下面的！不要上來！聽到沒有，不要上來！」`,
 c:[
  {t:'q',l:'隔著門跟上面的人說話',k:'CHA',d:12,tb:[
   {g:'good',w:1,t:`你說你不上去，只想知道上面怎麼了。喊話的人沉默了一下，聲音放低了：他們七個人躲在頂樓的機房裡，原本在等直升機。直升機來過一次，在對面的大樓頂上停了一下，又飛走了，沒有過來。

「304 的那個女的也在，」他說，「她一直在哭。你別上來，上面沒有路。」`,r:{flag:'roofno'}},
   {g:'mid',w:2,t:`「我說了不要上來！」他吼，「再敲我就把你推下去！」上面有好幾個人在吵，吵到有人叫他小聲一點。`,p:{alarm:1}},
   {g:'bad',w:1,t:`你一開口，上面的人就開始用東西砸門，一邊砸一邊吼，整個樓梯間都在響。`,p:{alarm:3}}]},
  {t:'q',l:'從門縫遞一瓶水上去',blu:{item:'water'},ok:{t:`你把一瓶水從門縫底下推過去。上面安靜了很久，然後有腳步聲走下來，水被拿走了。

過了一會兒，門縫底下塞回來一支手電筒。「我們有兩支，」那個人隔著門說，「你們比我們更需要。不要上來，上面沒有路。」`,r:{pay:{water:1},items:{flashlight:1},flag:'roofno'}}},
  {t:'mv',l:'安靜離開',ok:{t:`你沒有出聲，從樓梯門前退開。上面的人還在喊，喊了很久才停。`}}]},
AT4:{L:'A',n:'三樓・員工通道',deck:'A',seg:'e',peek:'一扇沒有把手的灰門，讀卡器閃著紅燈，門上寫「STAFF ONLY」。',peek2:{t:'讀卡器上有一個血指印。',dc:12},
 t:`走廊盡頭旁邊有一扇沒有把手的灰色鐵門，門上貼著「STAFF ONLY」。門邊的讀卡器亮著紅燈，緊急電源還撐著它。

門後是員工走的通道，房務、送餐都從這裡進出。`,
 c:[
  {t:'q',l:'用萬用房卡刷開',need:'mkey',tb:[
   {g:'good',w:2,t:`讀卡器嗶一聲轉成綠燈，門開了。員工通道很窄，牆邊一排置物櫃，有一格沒鎖：一瓶水、一包能量棒，還有一卷膠帶。`,r:{items:{water:1,bar:1,tape:1}}},
   {g:'mid',w:1,t:`門開了。通道裡的置物櫃全被撬開過，只剩一卷膠帶掉在地上。`,r:{items:{tape:1}}}]},
  {t:'q',l:'把門撬開',blu:{item:['g:crowbar','g:fireaxe'],any:1},tb:[
   {g:'good',w:1,t:`鎖舌比你想像的鬆。你只撬了兩下，門就開了。置物櫃裡有一瓶水和一包能量棒。`,r:{items:{water:1,bar:1}},p:{alarm:1}},
   {g:'mid',w:2,t:`你把工具卡進門縫，一點一點撬。門鎖撐了很久，最後啪的一聲彈開，整條走廊都聽得到。置物櫃有一格沒鎖，裡面有一瓶水。`,r:{items:{water:1}},p:{alarm:2}}]},
  {t:'mv',l:'走過去',ok:{t:`你從那扇灰門前走過去。`}}]},
AT5:{L:'A',n:'三樓走廊・行李推車',deck:'A',seg:'e',peek:'一台金色行李推車整台翻倒，行李箱散了一地，塞住半條走廊。',peek2:{t:'推車底下壓著一個人，一隻手一直在扒地毯。',dc:12},
 t:`一台金色的行李推車整台翻倒在走廊上，行李箱散了一地，有幾只摔開了，衣服、鞋子、盥洗包滾得到處都是，塞住了半條走廊。

推車底下壓著一個人，鐵架卡住了他的腰。他只露出上半身，一隻手一直在扒地毯，想把自己拖出來。他抬起頭，看到你了。`,
 c:[
  {t:'q',l:'從上面爬過去',k:'AGI',d:11,tb:[
   {g:'good',w:1,t:`你踩著行李箱從推車另一頭跨過去，順手撈起一個摔開的盥洗包，裡面有一個針線包。`,r:{items:{sewing:1}}},
   {g:'mid',w:2,t:`你踩著行李箱，從推車另一頭跨過去。壓在底下的那個伸手抓了一下，只抓到空氣。`},
   {g:'bad',w:1,t:`你踩到一只滑掉的行李箱，整個人往下一歪，腳踝正好落在那隻手旁邊。它抓住了你。`,p:{fear:6},fight:{n:1,mode:'normal',prone0:1,names:['被推車壓住的人']}}]},
  {t:'q',l:'把推車推開',k:'STR',d:12,tb:[
   {g:'good',w:1,t:`你抓住推車另一頭往旁邊一推，連著壓在底下的那個一起推到牆邊卡住。它的腰被鐵架夾得死死的，動不了了。`},
   {g:'mid',w:1,t:`推車只推開一半，剛好夠你側身擠過去。它的手碰到了你的褲管。`,p:{fear:3}},
   {g:'bad',w:1,t:`推車推開了，它也跟著被放了出來，拖著下半身朝你爬過來。`,fight:{n:1,mode:'first',prone0:1,names:['被推車壓住的人']}}]},
  {t:'sq',l:'快速翻散落的行李',tb:[
   {g:'good',w:1,t:`你只撿離你最近的那個盥洗包：裡面有一個針線包和一小瓶外用酒精。`,r:{items:{sewing:1,alcohol:1}}},
   {g:'mid',w:2,t:`你撿起最近的那只行李箱翻了一下，只有衣服。你抽了一件乾淨的 T 恤。`,r:{items:{cloth:1}}}]},
  {t:'sd',l:'仔細翻散落的行李',k:'PER',d:11,tb:[
   {g:'good',w:2,t:`你一只一只翻，離推車底下那隻手遠遠的。盥洗包裡有針線包和外用酒精，一只登機箱的夾層裡有一包能量棒和一瓶水。`,r:{items:{sewing:1,alcohol:1,bar:1,water:1}},p:{alarm:1}},
   {g:'mid',w:2,t:`大部分的行李箱都被翻過了，你只找到一件乾淨的 T 恤和一包能量棒。`,r:{items:{cloth:1,bar:1}},p:{alarm:1}},
   {g:'bad',w:1,t:`你翻得太靠近推車了。底下那隻手一把抓住你的手腕，指甲陷進肉裡。你拚命甩開，手腕上多了三道抓痕。`,p:{hp:-1,inf:2,alarm:1}}]}]}
});

/* ---- 301 房間：最多 3 張，每張列出還沒做的動作；開門出去從第 2 張起才有 ---- */
{const c=N.A1.c;N.A1.op=1;
 ['win','bar','map','ear'].forEach((k,i)=>{c[i].opk=k;c[i].hide='op_'+k});
 c.push(
  {t:'q',l:'把書桌拖過去頂住門',opk:'desk',hide:'op_desk',ok:{t:`你把書桌拖過地毯，斜卡在門後，再把行李箱壓在桌腳上。桌腳在地毯上刮出長長的一道印子。

門外還沒有東西過來。至少現在，這扇門不會被一下撞開。`,r:{flag:'barred'},p:{alarm:1}}},
  {t:'q',l:'從貓眼看外面',k:'PER',d:11,opk:'eye',hide:'op_eye',ok:{t:`你把眼睛湊上貓眼。走廊被魚眼鏡片拉得彎彎的，緊急照明一閃一閃。

303 門口站著一個人，背對著這邊，穿著旅館的制服，頭歪向一邊。走廊上只有他一個。`,r:{flag:'saw'}},ng:{t:`走廊太暗了。緊急照明一閃，你只看到一片紅，什麼都看不清楚。`,p:{fear:3}}},
  {t:'mv',kind:'移動',l:'開門出去',opout:1,vis:'op_any',ok:{t:`你深吸一口氣，握住門把。`}});
}
N.A1r={L:'A',n:'301 號房',op:1,c:N.A1.c,
 get t(){const g=GG(),n=(g&&g.op&&g.op.n)||0;return n>=2?`門縫底下的紅光一閃一閃。走廊上安靜得讓人發毛，外面的東西隨時會走到這一扇門前。

再待下去，就出不去了。`:`你站在房間中間，聽著自己的心跳。窗外又是一串槍響，比剛才遠了一點。

還有時間，可是不多。`}};

/* ---- 開場事件 5 張（撞門沿用 A2）：先做的事會多出不一樣的選項 ---- */
{const n=N.A2,c=n.c;Object.assign(n,{op:1,opev:1});c[1].hide='barred';c[2].hide='saw';
 c.push(
  {t:'q',l:'等它撞完退開的那一下，開門先動手',need:'heard',ok:{t:`你剛才貼著門聽過走廊：303 門口那個沒有跟過來，撞你門的是另一個，只有一個。它每撞一下，就往後退兩步。

你握住門把，數著它的撞擊聲。第三下撞完，你拉開門。它正往後退，重心還在腳跟上。`,fight:{n:1,mode:'first',prone0:1,names:['撞門的感染者']}}},
  {t:'q',l:'書桌頂著，等它撞累',need:'barred',ok:{t:`門板每被撞一下就往內彈一下，可是書桌卡得很死，行李箱壓著桌腳，一動也不動。

你背靠著牆坐在地上，一下一下地數。撞到第二十幾下，外面的東西喘著氣停了，拖著腳走開了。`,p:{fear:4}}},
  {t:'q',l:'它只有一個，退到門邊的牆後面等它',need:'saw',ok:{t:`你剛才從貓眼看過，走廊上只有一個。你退到門邊的牆後，握緊手上的東西，等它下一次撞進來。`,fight:{n:1,mode:'first',names:['撞門的感染者']}}});
}
const KNOCK_OK={t:`你剛才看過走廊，跟在他後面的只有一個。你拉開門，一把將他拽進來，自己跨出去，正好迎上後面那個拖著腳追過來的東西。`,fight:{n:1,mode:'first',names:['追著人的感染者']},win:{t:`它倒在你的門口。拍門的男人縮在你房間的牆角發抖，過了很久才站起來。他說他是來開會的，房號自己都記不清了。

他從公事包裡拿出一卷繃帶和一瓶水塞給你。「我在這裡等，」他說，「等天亮。你走吧。」`,r:{items:{bandage:1,water:1}}}};
Object.assign(N,{
AO2:{L:'A',n:'301 號房',op:1,opev:1,onEnter(){snd('woodknock',1,2400)},
 t:`砰砰砰。有人在拍你的門，拍得很急。

「拜託開門！拜託！」是個男人的聲音，喘得很厲害，「裡面有人嗎？我聽到你在裡面！」

他身後的走廊上，有拖著腳走路的聲音，越來越近。`,
 c:[

BD5:{L:'B',n:'二樓・新娘休息室',deck:'B',seg:'m',
 t:`宴會廳旁邊有一扇掛著「新娘休息室」牌子的門，門關著。門縫底下透出一點很穩的光，是插在牆上的小夜燈，靠電池撐著。

裡面有人在小聲講話，講一句停一下，像在哄小孩睡覺。`,
 c:[
  {t:'q',l:'輕輕敲門，說你是活人',k:'CHA',d:12,s:'統帥檢定',tb:[
   {g:'good',w:2,t:`門開了一條縫。是一個穿伴娘禮服的女人，懷裡抱著一個睡著的小女孩，小女孩頭上還戴著花童的花圈。

她叫你小聲一點，從桌上拿了一瓶水塞給你：「要下樓的話，走吧台後面那扇員工門。前面的西側樓梯有人開過槍。」`,r:{items:{water:1},flag:'bmaid'},p:{fear:-4}},
   {g:'mid',w:1,t:`門後安靜了很久，才傳出一句很小的聲音：「我們不開門。對不起。」`,p:{fear:2}},
   {g:'bad',w:1,t:`門後的人嚇得叫了一聲，小孩跟著哭起來，哭聲在宴會廳裡傳得很遠。`,p:{alarm:2}}]},
  {t:'q',l:'從門縫底下塞一條能量棒進去',req:'bar',s:'需要能量棒',ok:{t:`你把能量棒從門縫底下推進去。過了一會兒，一個小小的聲音說：「謝謝。」接著是大人摀住她嘴巴的聲音。`,r:{use:'bar'},p:{fear:-6}}},
  {t:'mv',kind:'移動',l:'不打擾她們，走過去',ok:{t:`你從門前走過去。門後的聲音停了一下，又小聲地繼續。`}}]},
BD6:{L:'B',n:'二樓走廊・直升機',deck:'B',seg:['x','m'],
 t:`天花板的吊燈忽然叮叮地震了起來。一架直升機從旅館上空低低地飛過去，螺旋槳的聲音整片壓下來，機腹下的探照燈從落地窗外一路掃過走廊。`,
 c:[
  {t:'q',l:'立刻趴下，等它過去',ok:{t:`你趴在地毯上，臉貼著地。白光從你背上滑過去，又滑回來，最後往大街那頭去了。`,p:{fear:4}}},
  {t:'q',l:'趁螺旋槳的聲音蓋住一切，快步往前走',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`噪音蓋過了你的腳步聲。你趁光轉開的空檔，一口氣走過了這一段。`},
   ng:{t:`光掃回來的時候，你還站在兩扇窗中間。`,qte:QTEWIN('白光停在你身上——','你往牆邊的陰影一撲。光在你剛才站的地方停了兩秒，移開了。','你撲倒的時候撞上了窗框，玻璃裂開，碎片劃過你的手背。',{hp:-3,bleed:1,fear:10})}}]}
});

/* ---------------- 一樓 E（前場、員工通道、廚房、洗衣房） ---------------- */

  '@f2':`員工通道的一側有一扇門，門上的小窗透著一點橘光。你推開門，外面是櫃台後面的前場走廊。`,
  '@c':`員工通道再往裡走，牆上掛著一台停掉的打卡鐘，旁邊是更衣室和總機室的門。`}[t]||null}};
ROUTE.E.seq=['E1','EXN','F4'];delete ROUTE.E.search;ROUTE.E.v2=1;

{const c=N.F1.c[1];c.ok=XPMRG(c.ok,{t:`你從刀架上取下一把菜刀，刀刃很利，刀架底下還壓著一塊磨刀石。料理台的櫃子裡有一包泡麵、一條能量棒和一雙沒拆的免洗竹筷。`})}

Object.assign(N,{
ED1:{L:'E',n:'一樓・員工餐廳',deck:'E',seg:['s','c'],
 t:`員工通道旁邊有一間小小的員工餐廳：三張長桌、一台冰箱、一台販賣機。冰箱門開著，裡面的燈是暗的，飄出一股酸掉的牛奶味。

長桌上還擺著吃到一半的外帶餐盒，叉子插在飯上。最裡面那張桌子上，有一盒還沒拆封的員工餐。`,
 c:[
  {t:'sq',kind:'搜尋',l:'快速翻一下冰箱',tb:[{g:'good',w:1,t:`冰箱門邊的格子裡還有一罐沒開的可樂。`,r:{items:{cola:1}}},{g:'mid',w:1,t:`冰箱裡只剩幾罐開過的醬料，和一盒已經發酸的牛奶。`}]},
  {t:'sd',kind:'搜尋',l:'把冰箱、櫃子和販賣機都翻一遍',k:'PER',d:11,s:'感知檢定',tb:[
   {g:'good',w:2,t:`冰箱裡有一罐可樂，櫃子裡有一包泡麵，販賣機的取物口卡著一盒沒掉下來的蘇打餅乾，你伸手進去掏了出來。`,r:{items:{cola:1,noodle:1,cookie:1}},p:{alarm:1}},
   {g:'mid',w:1,t:`大部分都被拿走了。你只在櫃子最裡面找到一盒蘇打餅乾。`,r:{items:{cookie:1}},p:{alarm:1}},
   {g:'bad',w:1,t:`販賣機的玻璃門鬆了，你一拉就整片脫落，砸在地上碎成一地。`,p:{alarm:3}}]},
  {t:'m',l:'坐下來，把那盒員工餐吃掉',ok:{t:`你把餐盒的蓋子打開。是冷掉的炒飯，你用手抓著吃，吃到一半才發現自己餓壞了。`,p:{hun:3}}},
  {t:'mv',kind:'移動',l:'不碰，走過去',ok:{t:`你從餐廳門口走過去。`}}]},
ED2:{L:'E',n:'員工通道・叼著菸的人',deck:'E',seg:['s','c'],dcond:{hide:'gasoff'},w:.6,
 t:`通道轉角有一個穿行李員制服的年輕人背靠著牆坐在地上，嘴裡叼著一支菸，手上拿著打火機，拇指已經搭在滾輪上。

他還沒看到你。空氣裡的瓦斯味重得讓人頭暈，他大概已經聞不出來了。`,
 c:[
  {t:'q',l:'衝過去握住他拿打火機的手',k:'AGI',d:12,s:'敏捷檢定',ok:{t:`你衝過去一把握住他的手，打火機掉在地上。他嚇得差點叫出來，你摀住他的嘴，指了指天花板的管線，又指了指自己的鼻子。

他吸了一口氣，臉一下子白了。他把打火機和那包菸都塞給你，扶著牆往大廳那頭走了。`,r:{items:{lighter:1,cigarette:1}}},
   ng:{t:`你衝到一半，鞋底在地上的油漬滑了一下。他抬起頭的時候，拇指往下一撥，火星亮了一下。`,r:{gasboom:1}}},
  {t:'q',l:'壓低聲音叫他別點',k:'CHA',d:11,s:'統帥檢定',ok:{t:`「瓦斯，」你壓著聲音說，「別點。」

他愣了一下，抽了抽鼻子，慢慢把菸從嘴上拿下來。「難怪我頭這麼暈……」他把打火機收回口袋，扶著牆站了起來。`},
   ng:{t:`他被突然出現的聲音嚇了一跳，手一抖，打火機的滾輪擦了一下。`,r:{gasboom:1}}},
  {t:'mv',kind:'移動',l:'退回去，等他走開',tb:[
   {g:'mid',w:3,t:`你退回轉角後面。過了一會兒，你聽到他咳了幾聲，罵了一句，把菸收回去走了。他大概也聞到了。`},
   {g:'bad',w:1,t:`你退到轉角後面，背後傳來打火機喀的一聲。`,r:{gasboom:1}}]}]},
ED3:{L:'E',n:'一樓・失物招領櫃',deck:'E',seg:['f','f2'],
 t:`櫃台後面靠牆有一整排失物招領的架子，每一格都貼著日期：雨傘、充電線、一隻孤零零的嬰兒鞋。最上面一格放著一個紙箱，寫著「待寄回」。`,
 c:[
  {t:'sq',kind:'搜尋',l:'快速翻最下面那幾格',tb:[{g:'good',w:1,t:`一個遺失的旅行用收納袋裡，有一顆三號電池。`,r:{items:{battery:1}}},{g:'mid',w:1,t:`都是充電線和雨傘。`}]},
  {t:'sd',kind:'搜尋',l:'把那個紙箱搬下來翻',k:'PER',d:11,s:'感知檢定',tb:[
   {g:'good',w:2,t:`紙箱裡是一個房客寄回的包裹：一支沒裝電池的手電筒、一盒兩顆裝的三號電池。`,r:{items:{deadlight:1,battery:2}},p:{alarm:1}},
   {g:'mid',w:1,t:`紙箱裡是幾本書和一顆三號電池。`,r:{items:{battery:1}},p:{alarm:1}},
   {g:'bad',w:1,t:`紙箱的底一下子破了，裡面的東西全砸在地上。`,p:{alarm:2}}]},
  {t:'mv',kind:'移動',l:'不碰，走過去',ok:{t:`你從架子前面走過去。`}}]},
ED4:{L:'E',n:'一樓・卸貨口',deck:'E',seg:'c',
 t:`員工通道的盡頭有一道卸貨口的鐵捲門，關得死死的，門縫底下透進一線街燈的光。門邊停著一台送貨的手推車，上面還綁著兩箱瓶裝水。

鐵捲門外有東西在撞。撞一下，停很久，又一下。`,
 c:[
  {t:'q',l:'從手推車上抽兩瓶水',ok:{t:`你割開箱子外面的膠膜，抽了兩瓶出來。塑膠膜嘶的一聲，你停下來聽，門外的撞擊聲沒有變。`,r:{items:{water:2}}}},
  {t:'q',l:'貼著鐵捲門聽外面',k:'PER',d:11,s:'感知檢定',ok:{t:`門外是後巷。撞門的不只一個，每撞一下，鐵捲門就往內鼓一點。這道門不能開。`,p:{fear:4}},ng:{t:`你剛貼上去，鐵捲門就被撞了一下，正好撞在你臉頰旁邊，震得你耳朵嗡嗡響。`,p:{fear:6,alarm:1}}},
  {t:'mv',kind:'移動',l:'離開卸貨口',ok:{t:`你退回員工通道。`}}]},
ED5:{L:'E',n:'員工廚房・食材儲藏櫃',deck:'E',seg:'k',
 t:`食材儲藏櫃的門開著一半，裡面的紙箱倒了一地。最裡面的架子上還有東西，架子後面很暗。`,
 c:[
  {t:'sq',kind:'搜尋',l:'只撿門口散在地上的',tb:[{g:'good',w:1,t:`地上有一包沒被踩破的泡麵。`,r:{items:{noodle:1}}},{g:'mid',w:1,t:`散在地上的都被踩爛了。`}]},
  {t:'sd',kind:'搜尋',l:'進去把架子翻一遍',k:'PER',d:11,s:'感知檢定',tb:[
   {g:'good',w:2,t:`你摸到兩包泡麵和一瓶礦泉水。`,r:{items:{noodle:2,water:1}}},
   {g:'mid',w:1,t:`架子上大多是麵粉和糖。你只拿到一包泡麵。`,r:{items:{noodle:1}}},
   {g:'bad',w:1,t:`你伸手往架子後面摸，摸到一隻手。冰的，可是在動。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['躲在儲藏櫃裡的感染者']}}]},
  {t:'mv',kind:'移動',l:'把門關上',ok:{t:`你把儲藏櫃的門推上，沒有再開。`}}]},
ED6:{L:'E',n:'員工廚房・出菜口',deck:'E',seg:'k',
 t:`出菜口的服務鈴叮地響了一聲。

出菜口另一頭是備餐間，有一個人靠在出菜台上，身體一歪一歪的。他的手肘每晃一下，就壓到一次服務鈴。`,
 c:[
  {t:'q',l:'走近，從出菜口看清楚',k:'PER',d:12,s:'感知檢定',ok:{t:`是一個穿服務生背心的人，頭垂著，手肘撐在台子上。出菜台上壓著一張客房服務單：「303 客房服務　照門診交代，放門口就好」，背面沾著一個血手印。

你把單子抽走，退回來。他沒有抬頭。`,p:{fear:4}},ng:{t:`你走到出菜口前面，他的頭抬了起來。`,p:{fear:6},fight:{n:1,mode:'ambush',names:['出菜口後面的服務生']}}},
  {t:'q',l:'伸手把服務鈴拿走',k:'AGI',d:11,s:'敏捷檢定',ok:{t:`你伸長手，把服務鈴從台子上拿下來，塞進一條毛巾裡。鈴聲沒有再響。`},ng:{t:`你的手碰到鈴，叮的一聲，比剛才都響。`,p:{alarm:2}}},
  {t:'mv',kind:'移動',l:'不理它',ok:{get t(){const g=GG();return g&&g.flags&&g.flags.gasoff?`你沒有回頭。鈴又響了兩聲，在安靜的廚房裡傳得很清楚。`:`你沒有回頭。鈴又響了兩聲，被廚房的嘶嘶聲蓋過去了。`},p:{alarm:1}}}]},/* v0.64.1 瓦斯關掉之後就沒有嘶嘶聲 */
ED7:{L:'E',n:'員工廚房・洗碗區',deck:'E',seg:'k',
 t:`洗碗區的水槽滿到溢出來，水面上浮著一層油，碗盤堆在裡面。水龍頭沒關緊，一直在滴。

水槽下面的櫃門關著，門把上掛著一條抹布。`,
 c:[
  {t:'sq',kind:'搜尋',l:'從水槽裡撈一把刀',tb:[{g:'good',w:1,t:`你把手伸進油水裡摸，摸到一把牛排刀，刀刃朝下。你小心地握著刀柄拿了出來。`,r:{gear:'knife'}},{g:'mid',w:1,t:`你只撈到湯匙和叉子。`}]},
  {t:'sd',kind:'搜尋',l:'打開水槽下面的櫃子',k:'PER',d:11,s:'感知檢定',tb:[
   {g:'good',w:2,t:`櫃子裡是清潔用品：兩條乾淨的抹布和一瓶外用酒精。`,r:{items:{cloth:2,alcohol:1}}},
   {g:'mid',w:1,t:`櫃子裡只有洗碗精，和一條還算乾的抹布。`,r:{items:{cloth:1}}},
   {g:'bad',w:1,t:`櫃門一拉開，裡面縮著一個穿洗碗工圍裙的人，膝蓋抵著下巴。他的眼睛是白的。`,p:{fear:8},fight:{n:1,mode:'ambush',names:['水槽下面的洗碗工']}}]},
  {t:'mv',kind:'移動',l:'繞過水槽',ok:{t:`你繞過那一灘油水，沒有碰任何東西。`}}]},
ED8:{L:'E',n:'洗衣房・燙衣間',deck:'E',seg:'l',
 t:`洗衣房旁邊隔出一間燙衣間，燙衣板一張一張排開，牆上掛滿了燙好的制服，每件都套著透明塑膠袋。角落的工作台上放著針線盒和一大卷布膠帶。`,
 c:[
  {t:'sq',kind:'搜尋',l:'拿工作台上的東西',tb:[{g:'good',w:1,t:`你拿了針線盒，順手把那卷布膠帶也帶走。`,r:{items:{sewing:1,tape:1}}},{g:'mid',w:1,t:`針線盒是空的，只剩那卷布膠帶。`,r:{items:{tape:1}}}]},
  {t:'sd',kind:'搜尋',l:'翻掛著的制服口袋',k:'PER',d:11,s:'感知檢定',tb:[
   {g:'good',w:2,t:`員工常把東西忘在制服口袋裡：一盒止痛藥、一把硬幣，還有折得很小的幾張美金。`,r:{items:{painkiller:1,coin:1},usd:3},p:{alarm:1}},
   {g:'mid',w:1,t:`大部分口袋都是空的。你只摸到一把硬幣。`,r:{items:{coin:1}},p:{alarm:1}},
   {g:'bad',w:1,t:`你一拉，整排塑膠袋嘩啦嘩啦地響，在安靜的洗衣房裡傳得很遠。`,p:{alarm:2}}]},
  {t:'mv',kind:'移動',l:'不碰，走過去',ok:{t:`你從燙衣間門口走過去。`}}]},
ED9:{L:'E',n:'洗衣房・晾床單的架子',deck:'E',seg:'l',
 t:`曬衣架上掛著一整排床單，從天花板一路垂到地上。其中一條床單後面，有一個人的輪廓。`,
 c:[

function giveUsd(p,to,n){const t=P(to);n=Math.floor(+n||0);if(!teamHere(p)||!t||!teamHere(t)||t.dead||t===p||n<=0||(p.usd||0)<n)return false;p.usd-=n;t.usd=(t.usd||0)+n;out(`${nm(p)}給了${nm(t)} $${n}。`,'sys',true);return true}

// 每 +1 的花費：0～4 是 1 點、5～9 是 2 點、10～14 是 3 點，依此類推；沒有上限（只算自己配的點數，職業加成另計）
function levelUp(p,st){if(!STN[st])return false;if(stBase(p,st)>=stCap(p,st)){msgTo(p,`${STN[st]}自己配的點數最多 ${stCap(p,st)}。`);return false}const c=lvCost(p,st);if((p.pts||0)<c)return false;p.pts-=c;p.st[st]++;if(st==='CON'){p.max=maxHp(p);p.hp+=3}out(`${MP()?nm(p)+'的':'你的'}${STN[st]}提升到 ${p.st[st]}${c>1?`（花了 ${c} 點）`:''}。`,'good',true);return true}
/* ================= 合成 ================= */
function matchRecipe(keys){
  keys=[...keys].sort();
  for(const r of RECIPES){
    if(r.special==='repair'){if(keys.length===2&&keys.includes('tape')){const gk=keys.find(x=>x.startsWith('g:'));if(gk&&WEAP[gk.slice(2)].kind!=='gun')return r}continue}
    if(r.special==='gunclean'){if(keys.length===3&&keys.includes('cloth')&&keys.includes('g:screwdriver')){const gk=keys.find(x=>x.startsWith('g:')&&x!=='g:screwdriver');if(gk&&WEAP[gk.slice(2)].kind==='gun')return r}continue}
    const need=[...r.in,...(r.tools||[])].sort();
    if(need.length===keys.length&&need.every((x,i)=>x===keys[i]))return r;
  }
  return null}
function partial(keys){if(keys.length<2)return false;return RECIPES.some(r=>{if(r.special)return false;const pool=[...r.in,...(r.tools||[])];return keys.every(k=>{const i=pool.indexOf(k);if(i<0)return false;pool.splice(i,1);return true})})}
// slots：[{k}|{u}]
async function craft(p,slots){
  const keys=[];const cnt={};
  for(const s of slots.slice(0,CRAFT_SLOTS)){if(s.u!=null){const g=gearOf(p,s.u);if(!g)return msgTo(p,'材料不見了。');keys.push('g:'+g.id)}else{cnt[s.k]=(cnt[s.k]||0)+1;if((p.items[s.k]||0)<cnt[s.k])return msgTo(p,'材料不夠。');keys.push(s.k)}}

    const got=[];for(const [k,q] of Object.entries(r.out)){if(k==='gear'){addGear(p,q);got.push(WEAP[q].n)}else{addI(p,k,q);got.push(ITEMS[k].n+(q>1?' ×'+q:''))}}
    m=`做出了 ${got.join('、')}。${r.why}`}
  if(!G.known.includes(r.id))G.known.push(r.id);
  snd('rummage',.7,1500);snd('craft');out(`${MP()?nm(p):''}${m}`,'good');
  msgTo(p,m,1);
}
function msgTo(p,t,ok){if(p.pid===MYPID)craftMsg(t,ok);else E('m',{to:p.pid,t,ok:ok?1:0})}
function msgTo(p,t,ok){if(p.pid===MYPID)craftMsg(t,ok);else E('m',{to:p.pid,t,ok:ok?1:0})}
function recipeOut(r){return Object.entries(r.out).map(([k,q])=>k==='gear'?WEAP[q].n:ITEMS[k].n+(q>1?' ×'+q:'')).join('、')}

/* ================= 房主處理所有人的指令 ================= */
function handle(pid,a){
  if(!G||!a)return;const p=P(pid);if(p&&!teamHere(p))return;
  if(a.a==='qte')return qteAns(pid,a);
  if(stgOn())return;/* v0.65.0 演出期間：會改變遊戲的指令一律作廢、不排隊 */
  if(a.a==='vote'){if(a.s!=null&&G.stp!=null&&a.s!==G.stp)return;/* v0.63.0 舊畫面的按鈕（上一張卡）不算 */return vote(pid,a.i)}
  if(a.a==='rv')return rvote(pid,a.t);
  if(a.a==='cdgo'){if(pid===G.host&&G.opts.cd==='host'&&(G.phase==='node'||G.phase==='roller')&&!G.cd){startCd(true);push();draw()}return}
  if(!p||p.dead)return;
  if(G.over)return;
  if(a.a==='lvl')return run(async()=>{levelUp(p,a.st)});
  if(a.a==='tell')return run(async()=>{tell(p,a.i)});
  if(a.a==='lock')return run(async()=>{zLockNote(a.i)});
  if(G.phase==='shop'&&G.shop&&!p.down&&!p.mad){if(a.a==='buy')return run(async()=>{shopBuy(p,a.i)});if(a.a==='sell')return run(async()=>{shopSell(p,a.k)});if(a.a==='sellg')return run(async()=>{shopSellG(p,a.u)});if(a.a==='shopdone')return run(()=>shopReady(p))}
  if(G.phase==='gw'&&a.a==='gwgo'&&!p.down&&!p.mad)return run(()=>groundGo(p));
  if(G.fight&&['atk','tact','reload','unjam','cock','pickup','kick','counter','brace','molotov','ext','flash','flee','use','revive','equip','guard','free','block','cover','dual','calm','subdue','csk','spot','pat','tool'].includes(a.a))return run(()=>fightAct(pid,a));
  if(G.fight)return;
  if(p.down)return;
  if(a.a==='use')return run(async()=>{await useItem(p,a.k,a.to,a.part)});
  if(a.a==='repair')return run(async()=>{await repair(p,a.k,a.u)});
  if(a.a==='brew')return run(async()=>{brew(p)});
  if(a.a==='bridge')return run(async()=>{await darBridge(p)});
  if(a.a==='soothe')return run(async()=>{await soothe(p,P(a.to))});
  if(a.a==='revive')return run(async()=>{await revive(p,a.to,a.k)});
  if(a.a==='equip')return run(async()=>{if(doEquip(p,a))snd('equip',.8)});
  if(a.a==='tool')return run(async()=>{if(toolSet(p,a))snd('equip',.8)});
  if(a.a==='unwear')return run(async()=>{unwear(p,a.s)});
  if(a.a==='giveusd')return run(async()=>{giveUsd(p,a.to,a.n)});
  if(a.a==='give')return run(async()=>{give(p,a.to,a.k,a.u)});
  if(a.a==='pick')return run(async()=>{pickGround(p,a.i)});
  if(a.a==='drop')return run(async()=>{dropItem(p,a)});
  if(a.a==='craft')return run(()=>craft(p,a.slots||[]));
}

/* ---- 遭遇：戰鬥開始時亮出敵人的立繪 ---- */
function encounterMarkup(d,mode){const title=mode==='first'?'我方先制':mode==='ambush'?'敵方突襲':'遭遇戰';const note=mode==='first'?'偷襲完成後再擲先攻':mode==='ambush'?'反應成功可解除敵方先攻加成':'行動順序由先攻決定';
  return `<div class="enc-state">${title}<small>${note}</small></div><div class="row">${d.map(x=>`<figure>${x.img?`<img src="img/${esc(x.img)}.webp" alt="${esc(x.n)}">`:'<i></i>'}<figcaption>${esc(x.n)}</figcaption></figure>`).join('')}</div>`}
function battleState(){const F=G&&G.fight;if(!F)return '';if(F.sneak)return '我方先制';if(F.round>1)return '戰鬥中';if(F.order&&F.order.length)return F.order[0].k==='f'?'敵人先制':'我方先制';return F.opening==='first'?'我方先制':F.opening==='ambush'?'敵方突襲':'遭遇戰'}
async function encounter(foes,mode){if(G&&G.stg&&G.stg.k!=='end'){await stgWait(G.stg.id);return}const d=foes.filter(f=>!lurkHid(f)).map(f=>({n:f.n,img:f.img||'',mode:mode||'normal'}));if(!d.some(x=>x.img))return;await flush();E('enc',d);await showEnc(d)}
async function showEnc(data){const c=$('#enc');if(!c)return;const d=Array.isArray(data)?data:data.foes,mode=Array.isArray(data)?(data[0]&&data[0].mode||'normal'):data.mode;
  c.innerHTML=encounterMarkup(d,mode);c.hidden=false;c.classList.remove('go');void c.offsetWidth;c.classList.add('go');
  await Promise.race([wait((FAST?700:1700)*Math.max(.5,UI.spd)),new Promise(r=>{c.onclick=r})]);c.hidden=true}

/* ================= v0.65.0 戰鬥演出（主人 2026-11-24 定案：ZEROCASE_QTE_BGM_REWORK_SPEC 第 7、8 節） =================
   一般遭遇（enc）、警戒亂入（raid）、戰鬥結束（end）三種演出：時間不長，但不能點掉、不能用任何操作提前略過。
   時間點來自實際分析現有音檔（docs/BGM_STAGE_v0.65.0.md）：一般段、激戰段開頭的重拍出立繪、名字、展開戰鬥介面；
   結束接原本 900ms 淡回探索曲（戰鬥曲可能停在任何一個循環位置，不假設固定的曲尾）。

function onPeers(ch){
  const peers=ch.peers;
  if(ROLE==='host'){
    NET.lobby=peers.filter(x=>!x.sameTab&&x.presence&&x.presence.pid&&!x.presence.host);
    for(const x of peers){if(x.sameTab||!x.presence||!x.presence.pid)continue;const pr=x.presence,pid=pr.pid;
      if(Array.isArray(pr.acts)&&G&&NET.started){const last=NET.seen[pid]||0;for(const a of pr.acts){if(typeof a.n==='number'&&a.n>last){NET.seen[pid]=a.n;if(G.players.some(p=>p.pid===pid))handle(pid,a)}}}
      else if(Array.isArray(pr.acts)){for(const a of pr.acts)if(a.n>(NET.seen[pid]||0))NET.seen[pid]=a.n}
      if((pr.need||0)>(NET.need[pid]||0)){NET.need[pid]=pr.need;if(NET.started)setTimeout(fullSync,150)}
      if(G&&NET.started&&!G.over&&pr.ready&&pr.build&&pr.build.kind!=='saved'&&!G.players.some(p=>p.pid===pid)&&!NET.late[pid]){NET.late[pid]=pr.build;out(`【連線通知】${esc(bName(pr.build))}已連上房間，等待隊伍下次切換區域後加入。`,'sys',true);push();draw()}}
    if(G&&NET.started&&!G.over){let ch2=false;
      const here=new Set(peers.filter(x=>x.presence&&x.presence.pid).map(x=>x.presence.pid));here.add(MYPID);
      for(const p of G.players){if(p.dead)continue;
        if(p.away&&here.has(p.pid)){p.away=0;ch2=true;out(`【連線通知】${nm(p)}已重新連線，恢復參與行動。`,'good',true)}
        else if(!p.away&&!here.has(p.pid)){p.away=1;ch2=true;out(`【連線通知】${nm(p)}連線中斷，暫停參與行動。`,'sys',true)}}
      if(ch2){push();draw();setTimeout(fullSync,300);
        if(!busy&&G.phase==='node'&&voters().length&&voters().every(p=>G.votes[p.pid]!=null))resolveVote();
        if(!busy&&G.phase==='roller'&&voters().length&&voters().every(p=>G.rv[p.pid]!=null))resolveRoller();
        if(G.fight&&G.fight.group&&!G.fight.resolving&&G.fight.group.every(x=>G.fight.pend[x]||!able().some(q=>q.pid===x)))run(resolveGroup)}}
    if(ch.joined.some(x=>!x.sameTab)&&NET.started)setTimeout(fullSync,600);
    if(typeof drawLobby==='function')drawLobby();

    const h=peers.find(x=>x.presence&&x.presence.host&&x.presence.code===NET.code);
    const was=NET.hostPeer;NET.hostPeer=h?h.peer:null;NET.hostPres=h?h.presence:null;
    NET.lobby=peers.filter(x=>x.presence&&x.presence.pid);
    if(was&&!h)hostLost(peers);else if(h)clearTimeout(NET.hgT);
    if(typeof drawLobby==='function')drawLobby();
  }
}
function onEv(msg){
  const d=msg.data;if(!d||typeof d.s!=='string')return;
  // 房主：只收隊友送來的頭像
  if(ROLE==='host'){if(msg.sameTab||msg.isMe)return;const key=msg.peer+':'+d.m;let b=NET.buf[key];if(!b){if(d.n>30)return;b=NET.buf[key]={n:d.n,p:[],c:0};const ks=Object.keys(NET.buf);if(ks.length>40)delete NET.buf[ks[0]]}
    if(b.p[d.i]==null){b.p[d.i]=d.s;b.c++}
    if(b.c===b.n){delete NET.buf[key];let o;try{o=JSON.parse(b.p.join(''))}catch(e){return}
      if(o&&o.t==='av'&&o.d&&typeof o.d.pid==='string'&&(avOk(o.d.d)||o.d.d===null)){if(o.d.d)AVS[o.d.pid]=o.d.d;else delete AVS[o.d.pid];if(NET.r)send({t:'av',d:o.d});if(G)draw();if(typeof drawLobby==='function')drawLobby()}}
    return}
  if(ROLE!=='client'||!NET.hostPeer||msg.peer!==NET.hostPeer)return;
  let b=NET.buf[d.m];if(!b){b=NET.buf[d.m]={n:d.n,p:[],c:0};const ks=Object.keys(NET.buf);if(ks.length>40)delete NET.buf[ks[0]]}
  if(b.p[d.i]==null){b.p[d.i]=d.s;b.c++}
  if(b.c===b.n){delete NET.buf[d.m];let o;try{o=JSON.parse(b.p.join(''))}catch(e){return}
    o.seq=d.m;o.peer=msg.peer;enqueue(o)}
}

async function pump(){qRun=true;
  while(Q.length){const o=Q.shift();FAST=Q.length>5?1:0;
    if(o.peer&&SLASH_VFX.peer!==o.peer){SLASH_VFX.peer=o.peer;SLASH_VFX.stateSeq=0}
    try{
      if(o.t==='o'){L_out(o.d[0],o.d[1],o.d[2]);if(!FAST)await typing}
      else if(o.t==='bgm'){if(G&&G.fight&&o.d.rid===G.rid&&o.d.id===G.fight.musicId){if(G.fight.musicIntense==null&&typeof o.d.intense==='boolean')G.fight.musicIntense=o.d.intense;G.fight.musicStarted=true;syncBgmState()}}
      else if(o.t==='d'){await showDice(o.d)}
      else if(o.t==='s'){if(o.d[3]&&o.d[3].arrow)await playArrowShot(o.d[3],true,o.seq);else{const ms=sfx(o.d[0],o.d[1],o.d[2]||undefined);if(['bowhit','bowmiss','arrowhit','arrowmiss','xbowhit','xbowmiss'].includes(o.d[0]))await wait(ms||1500)}}
      else if(o.t==='slash'){await playSlashHit(o.d,true,o.seq)}
      else if(o.t==='blunt'){await playBluntHit(o.d,true,o.seq)}
      else if(o.t==='pierce'){await playPierceHit(o.d,true,o.seq)}
      else if(o.t==='gun'){await playGunShot(o.d,true,o.seq)}
      else if(o.t==='c'){await flush();await levelCard(o.d)}
      else if(o.t==='enc'){await flush();await showEnc(o.d)}
      else if(o.t==='cc'){await flush();await showChapter(o.d)}
      else if(o.t==='tc'){/* 相容舊房主：忽略舊版時間過場，時間依 full 狀態重繪。 */}
      else if(o.t==='st'){SLASH_VFX.stateSeq=Math.max(SLASH_VFX.stateSeq,o.seq||0);setG(o.d)}
      else if(o.t==='full'){SLASH_VFX.stateSeq=Math.max(SLASH_VFX.stateSeq,o.seq||0);LOG=o.d.log||[];setG(o.d.G);renderLog();if(typeof showGame==='function')showGame();if(!NET.avSent){NET.avSent=1;sendAv()}}
      else if(o.t==='q'){if(o.d.to===MYPID)(o.d.kind==='code'?codeLocal(o.d):qteLocal(o.d)).then(r=>act({a:'qte',id:o.d.id,r}))}
      else if(o.t==='m'){if(o.d.to===MYPID)craftMsg(o.d.t,o.d.ok)}
      else if(o.t==='pv'){if(o.d.to===MYPID){L_out(o.d.h,o.d.c);LOG.pop()}}
      else if(o.t==='av'){if(o.d&&typeof o.d.pid==='string'&&o.d.pid!==MYPID){if(avOk(o.d.d))AVS[o.d.pid]=o.d.d;else if(o.d.d===null)delete AVS[o.d.pid]}if(G)draw();if(typeof drawLobby==='function')drawLobby()}
    }catch(e){console.error(e)}
  }
  FAST=0;qRun=false}

function loadAvatar(file){if(!/^image\//.test(file.type||'')){toast('請選擇圖片檔。');return}const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{

  let q=.8,u=c.toDataURL('image/jpeg',q);while(u.length>9000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}

/* ================= 橫向、全螢幕與啟動 ================= */
function layout(){
  const st=$('#stage'),W=window.innerWidth,H=window.innerHeight;
  // 輸入文字時暫時不轉向，讓手機鍵盤和輸入框方向一致
  const typing=document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)&&document.activeElement.type!=='file';
  // v0.55.1（主人 2026-11-23）：這是橫向遊戲，從開頭的「進入遊戲」畫面起，手機直拿一律轉成橫向，拿掉畫面方向設定
  // （能真的全螢幕時手機自己會轉，就不用再轉）；只有打字時暫時不轉，讓鍵盤方向一致
  const rot=H>W&&!typing;
  st.classList.remove('r90');
  if(rot){st.classList.add('r90');st.style.width=H+'px';st.style.height=W+'px'}else{st.style.width=W+'px';st.style.height=H+'px'}
  const sw=rot?H:W,sh=rot?W:H;
  st.classList.toggle('compact-tools',sw<=1100);st.classList.toggle('short',sh<=480);st.classList.toggle('narrow',sw<=700);st.classList.toggle('tall',!rot&&sh>sw);
  st.style.setProperty('--fs',(sh<=480?14:16)+'px');
  // v0.21.0 朋友回饋：大螢幕（含電腦全螢幕）整個畫面等比放大，不再擠在中間一小塊
  const Z=!rot&&sw>=1280&&sh>=720?Math.min(sw/1280,sh/720):1;
  if(Z>1.04){st.style.zoom=Z;st.style.width=(W/Z)+'px';st.style.height=(H/Z)+'px'}else st.style.zoom='';
}
let rzT=null;function onResize(){clearTimeout(rzT);rzT=setTimeout(layout,120)}
window.addEventListener('resize',onResize);document.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))layout()});document.addEventListener('focusout',e=>{if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))setTimeout(layout,60)});window.addEventListener('orientationchange',onResize);
document.addEventListener('fullscreenchange',onResize);document.addEventListener('webkitfullscreenchange',onResize);
// 全螢幕並鎖定橫向；quiet＝開始遊戲時自動呼叫（已經是全螢幕就跳過，失敗只提示一次）
let FULL_WARNED=false;
async function enterFull(quiet){
  const el=document.documentElement;let ok=!!(document.fullscreenElement||document.webkitFullscreenElement);
  if(!ok){try{if(el.requestFullscreen){await el.requestFullscreen({navigationUI:'hide'});ok=true}else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();ok=true}}catch(e){}}
  let locked=false;try{if(ok&&screen.orientation&&screen.orientation.lock){await screen.orientation.lock('landscape');locked=true}}catch(e){}
  if(!ok&&(!quiet||!FULL_WARNED)){FULL_WARNED=true;toast('這個畫面不允許全螢幕，只能用轉向的畫面；鍵盤會維持直的。用 Chrome 開啟遊戲連結就能真的橫向全螢幕。')}
  layout();
}
let BOOTED=false;
function boot(full){BOOTED=true;$('#gate').hidden=true;audio();startBgm();if(full)enterFull();else layout();loadSounds();showMenu()}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAmbience();stopSfx();stopBgm()}else{if(UI.snd){audio();syncAmbience()}if(UI.bgm)startBgm()}});

$('#gateGo').addEventListener('click',()=>boot(true));
